name: Docker

# The stable lane for the operator base image. It publishes `:<version>`,
# `:sha-<short>` and `:latest` — the tags DEPLOY.md and deploy/README.md hand to
# operators.
#
# `workflow_dispatch` exists because `release: published` fires once per named
# cut and never again. A red run therefore strands `:latest` for a whole release
# cycle with no way to retry: one Dockerfile defect (#2809) kept this lane red
# from 2026-06-09 to 2026-08-18, and `:latest` stayed a 404 for months after the
# fix merged because nothing could re-run the lane (#2811). A manual run
# republishes the stable tags from `main`, `next`, or a release tag, and passes
# the same `operator/package.json` version guard a release run passes.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish. Must equal operator/package.json at the selected ref.'
        required: true
        type: string

permissions:
  contents: read
  packages: write

defaults:
  run:
    working-directory: operator

jobs:
  build-and-push:
    name: Build & Push OCI Image
    if: >-
      github.event_name == 'workflow_dispatch'
      || startsWith(github.event.release.tag_name, 'client-v')
      || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve release metadata
        id: meta
        shell: bash
        # Both the dispatch input and the release tag reach the script through
        # the environment, never through `${{ }}` interpolation, so neither can
        # be shell-injected — a git ref name may legally contain `$`, backticks
        # and `;`.
        env:
          VERSION_INPUT: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            # A manual run publishes `:latest`, so it refuses any ref a release
            # could not have been cut from. This is an accident guard, not an
            # authorization boundary: `workflow_dispatch` runs the workflow file
            # as it exists on the dispatched ref, so anyone who can push a branch
            # can push one without this check. The boundary is repository write
            # access, exactly as it is for cutting a release.
            #
            # GITHUB_REF/GITHUB_EVENT_NAME are read from the environment, not
            # interpolated: a ref name may legally contain `$` and backticks.
            case "${GITHUB_REF}" in
              refs/heads/main|refs/heads/next|refs/tags/v*|refs/tags/client-v*) ;;
              *)
                echo "::error::A manual publish must run from main, next, or a release tag; got: ${GITHUB_REF}"
                exit 1
                ;;
            esac

            VERSION="${VERSION_INPUT#v}"
            if ! [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::version input must be <semver>; got: ${VERSION}"
              exit 1
            fi
          else
            case "${RELEASE_TAG}" in
              client-v*)
                VERSION="${RELEASE_TAG#client-v}"
                ;;
              v*)
                VERSION="${RELEASE_TAG#v}"
                ;;
              *)
                echo "::error::Stable client releases must use tags shaped like vX.Y.Z or client-vX.Y.Z"
                exit 1
                ;;
            esac

            # Both tag shapes are validated: VERSION reaches `$GITHUB_OUTPUT`
            # below, where a newline would inject further outputs — including
            # `image_repo`, which selects the registry this job pushes to.
            if ! [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Release tag ${RELEASE_TAG} does not carry a <semver> version; got: ${VERSION}"
              exit 1
            fi
          fi

          # working-directory default is `operator/`, no extra cd.
          PACKAGE_VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('package.json','utf8')).version)")
          if [ "${VERSION}" != "${PACKAGE_VERSION}" ]; then
            echo "::error::Requested version ${VERSION} does not match operator/package.json version ${PACKAGE_VERSION}"
            exit 1
          fi

          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-8)
          IMAGE_REPO="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/operator"

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "sha=${SHORT_SHA}" >> "${GITHUB_OUTPUT}"
          echo "image_repo=${IMAGE_REPO}" >> "${GITHUB_OUTPUT}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build smoke-test image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: operator/Dockerfile
          load: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.image_repo }}:smoke-${{ steps.meta.outputs.sha }}
          build-args: |
            JINN_BUILD_COMMIT=${{ github.sha }}
          cache-from: type=gha

      - name: Smoke test image
        shell: bash
        run: |
          IMAGE="${{ steps.meta.outputs.image_repo }}:smoke-${{ steps.meta.outputs.sha }}"

          VERSION_OUTPUT=$(docker run --rm "${IMAGE}" version --json)
          echo "${VERSION_OUTPUT}" | node -e "
            const payload = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            if (payload.schemaVersion !== 1) process.exit(1);
            if (payload.client?.version !== '${{ steps.meta.outputs.version }}') process.exit(1);
          "

          EXIT=0
          docker run --rm "${IMAGE}" doctor --json >/tmp/jinn-docker-doctor.json 2>/tmp/jinn-docker-doctor.err || EXIT=$?
          if [ "${EXIT}" -eq 50 ]; then
            echo 'doctor fatal-crashed inside the published image'
            cat /tmp/jinn-docker-doctor.err
            exit 1
          fi

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: operator/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image_repo }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image_repo }}:sha-${{ steps.meta.outputs.sha }}
            ${{ steps.meta.outputs.image_repo }}:latest
          build-args: |
            JINN_BUILD_COMMIT=${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
