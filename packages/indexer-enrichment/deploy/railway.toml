# Railway production config-as-code for the jinn-enrichment-worker service (#779).
#
# This service off-loads IPFS-bound verdict-envelope enrichment off the indexer's
# `ponder serve` event loop, so an enrichment backlog can't starve `/graphql`.
# It runs on the SAME DATABASE_URL + DATABASE_SCHEMA as the indexer and writes
# ONLY verdict_envelope_meta (the sanctioned-replica pattern — the indexer already
# runs `ponder serve` replicas on the same schema).
#
# !! #846 guardrail: this file MUST stay under packages/indexer-enrichment/deploy/
# and the service's "Config as code" path MUST point at
# packages/indexer-enrichment/deploy/railway.toml. A railway.toml at the REPO ROOT
# is applied by Railway to EVERY monorepo service (jinn-indexer, jinn-worker,
# jinn-operator-*, claim-relayer, …), overriding their build configs — that is
# exactly what broke the indexer for hours in #846. Never add a repo-root
# railway.toml.
#
# Two one-time service settings are NOT expressible in this file (set once in the
# Railway dashboard / API):
#   - Root Directory = /packages  (the Dockerfile's build context: it COPYs the
#     indexer tree, its portal siblings, and indexer-enrichment/, matching the CI
#     build `docker build -f indexer-enrichment/deploy/Dockerfile .` run from packages/).
#   - Config as code  = packages/indexer-enrichment/deploy/railway.toml

[build]
builder = "DOCKERFILE"
# Relative to the service Root Directory (/packages).
dockerfilePath = "indexer-enrichment/deploy/Dockerfile"
# Redeploy only when the worker or its portal dependency closure changes — not
# on every push to next. Gitignore-style, anchored at the REPO ROOT (per Railway's
# monorepo docs).
watchPatterns = [
  "packages/indexer-enrichment/**",
  "packages/indexer/**",
  "packages/task-execution/protocol/**",
  "packages/trust/core/**",
  "packages/benchmarking/records/**",
]

[deploy]
# /ready (not /health) so a redeploy doesn't cut traffic over until the new
# container has connected to Postgres and the DATABASE_SCHEMA resolves. The
# worker is eventually-consistent and the launcher tolerates un-enriched rows,
# so a slow first poll never needs to block — the healthcheck just keeps the old
# container serving until the new one is /ready.
healthcheckPath = "/ready"
healthcheckTimeout = 600
# Fail-loud boot (the #1068 lesson): index.ts exits non-zero on a DB-connect
# failure so ON_FAILURE restarts it through the same idempotent boot path,
# rather than silently wedging an unobservable worker.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
