name: native-restart-drill

# Scheduled/manual wiring for `yarn drill:native-restart:verify` (#4194).
#
# WHY SCHEDULED + manual, NOT a PR-blocking gate: the drill boots twelve Anvil
# nodes and eighteen role-host processes and needs Foundry. Putting that on the
# merge path would trade a real regression signal for a flake. The operator
# unit suite (`yarn test` in ci.yml) still covers the driver, report schema,
# and journal against stubs; this lane is the scenario coverage those stubs
# cannot provide.
#
# WHY a red job is a real regression, unlike native-e2e-rig.yml: the default
# drill is hermetic local Anvil pinned to chain id 84532 — no public RPC, no
# live fork, no skip-if-unreachable. A failure here is a coordinator or
# harness regression, so the job fails closed rather than exiting 0.
#
# WHY the build step: the drill's role-host processes import several
# @jinn-network/* portal packages (task-execution-protocol, trust-core, and
# the rest of the chain `yarn typecheck` walks) by their built dist/index.js
# entry point. dist/ is gitignored and nothing builds it at install time, so
# without this step the drill fails ERR_MODULE_NOT_FOUND before it runs a
# single scenario — the same failure native-e2e-rig.yml has hit on every
# recent scheduled run. `build:stack` alone is not enough: `build:core`
# depends on the plugin package.

on:
  workflow_dispatch: {}
  schedule:
    # Nightly, 04:00 UTC — before native-e2e-rig's Monday 06:00 run.
    - cron: '0 4 * * *'

concurrency:
  group: native-restart-drill-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native-restart-drill:
    name: Phase B restart drill (hermetic Anvil)
    runs-on: ubuntu-latest
    # 60 minutes covered only install + verify. The drill's own cases allow up
    # to 900s + 1800s, and the dependency-stack build below adds real time on
    # top of that.
    timeout-minutes: 120
    env:
      # CPU-only runner: keep both onnxruntime installers from pulling CUDA assets.
      ONNXRUNTIME_NODE_INSTALL: skip
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Enable Corepack before the Yarn cache lookup
        # setup-node resolves the Yarn cache folder by shelling out to `yarn`.
        # Without Corepack that is the runner image's global Yarn 1, which
        # refuses every project pinned to `packageManager: yarn@4.13.0`.
        run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: operator/yarn.lock
      - run: corepack enable

      # Foundry provides `anvil`. The drill's default is hermetic local Anvil
      # pinned to 84532, not a live fork, so no version pin is required here.
      - uses: foundry-rs/foundry-toolchain@v1

      - name: Install client deps
        working-directory: operator
        run: yarn install --immutable

      - name: Build the operator dependency stack
        working-directory: operator
        run: yarn build:sdk && yarn build:stack && yarn build:plugin && yarn build:core

      - name: Phase B restart-drill verification
        working-directory: operator
        run: yarn drill:native-restart:verify
