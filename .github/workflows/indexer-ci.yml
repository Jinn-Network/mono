name: Indexer CI

on:
  pull_request:
    branches: [main, next]
    paths:
      - '.github/workflows/indexer-ci.yml'
      - '.github/scripts/indexer-boundaries.test.mjs'
      - 'packages/indexer/**'
      - 'packages/benchmarking/records/**'
      - 'packages/task-execution/protocol/**'
      # Transitive `portal:` closure of the workspaces above (#3573). Each is built
      # from source into this lane, so a change confined to one of them changes what
      # this lane verifies. Enforced by .github/scripts/portal-path-filters.test.mjs.
      - 'packages/trust/core/**'
  push:
    branches: [main, next]
    paths:
      - '.github/workflows/indexer-ci.yml'
      - '.github/scripts/indexer-boundaries.test.mjs'
      - 'packages/indexer/**'
      - 'packages/benchmarking/records/**'
      - 'packages/task-execution/protocol/**'
      # Transitive `portal:` closure of the workspaces above (#3573). Each is built
      # from source into this lane, so a change confined to one of them changes what
      # this lane verifies. Enforced by .github/scripts/portal-path-filters.test.mjs.
      - 'packages/trust/core/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  indexer:
    name: Indexer Package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/indexer
    steps:
      - uses: actions/checkout@v7

      - name: Enable Corepack before the Yarn cache lookup
        # setup-node resolves the Yarn cache folder by shelling out to `yarn`.
        # Without Corepack that is the runner image's global Yarn 1, which
        # refuses every project pinned to `packageManager: yarn@4.13.0`.
        run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: |
            packages/task-execution/protocol/yarn.lock
            packages/trust/core/yarn.lock
            packages/benchmarking/records/yarn.lock
            packages/indexer/yarn.lock
      - run: corepack enable

      - name: Indexer boundary guard
        working-directory: ${{ github.workspace }}
        run: node --test .github/scripts/indexer-boundaries.test.mjs

      # The indexer depends on @jinn-network/benchmarking-records via
      # `portal:../benchmarking/records`, whose exports map points at
      # compiled dist/*.js. dist/ is gitignored, so benchmarking-records
      # must be built before any indexer step resolves it. records itself
      # depends on task-execution-protocol via portal, so that cross-tree
      # dependencies must be built first too (§7.8 precedent, see
      # benchmarking-ci.yml's `records` job).
      - name: Build cross-tree portal dependencies from source (§7.8)
        working-directory: ${{ github.workspace }}
        run: |
          (cd packages/task-execution/protocol && yarn install --immutable && yarn build)
          (cd packages/trust/core && yarn install --immutable && yarn build)

      - name: Build @jinn-network/benchmarking-records
        working-directory: packages/benchmarking/records
        run: |
          yarn install --immutable
          yarn build

      - run: yarn install --immutable
      - run: yarn codegen
      - run: yarn typecheck
      - run: yarn test
      - run: yarn build

  explorer:
    name: Explorer
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/indexer/explorer
    steps:
      - uses: actions/checkout@v7

      - name: Enable Corepack before the Yarn cache lookup
        # setup-node resolves the Yarn cache folder by shelling out to `yarn`.
        # Without Corepack that is the runner image's global Yarn 1, which
        # refuses every project pinned to `packageManager: yarn@4.13.0`.
        run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: packages/indexer/explorer/yarn.lock
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn typecheck
      - run: yarn test
      - run: yarn build

  docker:
    name: Indexer Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Build context is packages/ (not packages/indexer/) so the Dockerfile can
      # COPY and build the portal targets task-execution/protocol, trust/core, and
      # benchmarking/records (the indexer's `portal:../benchmarking/records`
      # sibling, which itself depends on task-execution/protocol via
      # `portal:../../task-execution/protocol`).
      - name: Build indexer image
        working-directory: packages
        run: |
          docker build \
            --build-arg JINN_INDEXER_COMMIT=${{ github.sha }} \
            -f indexer/deploy/Dockerfile \
            -t jinn-indexer:ci \
            .
