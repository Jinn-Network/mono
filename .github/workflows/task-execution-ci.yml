name: Task Execution CI

on:
  pull_request:
  push:
    branches: [next]
    paths:
      - "packages/task-execution/**"
      - ".github/scripts/task-execution-*.test.mjs"
      - ".github/workflows/task-execution-ci.yml"
      - "docs/superpowers/specs/2026-07-27-task-execution-protocol-and-stack-design.md"
  workflow_dispatch:
    inputs:
      scope:
        description: "Which Task Execution slice to run"
        required: true
        default: evaluation-harness
        type: choice
        options:
          - evaluation-harness
          - full

permissions:
  contents: read

env:
  TASK_EXECUTION_ROOT: packages/task-execution

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify package inventory and dependency graph
        run: node --test .github/scripts/task-execution-package-inventory.test.mjs
      - name: Verify source boundaries and canaries
        run: node --test .github/scripts/task-execution-source-boundaries.test.mjs

  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Yarn 4.13.0
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate
      - name: Verify Task Execution Protocol
        working-directory: packages/task-execution/protocol
        run: |
          yarn install --immutable
          yarn check:schemas
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Upload Task Execution Protocol distribution
        uses: actions/upload-artifact@v4
        with:
          name: task-execution-protocol-dist
          path: packages/task-execution/protocol/dist
          if-no-files-found: error
          retention-days: 1

  backend:
    needs: foundation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Yarn 4.13.0
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate
      - name: Restore Task Execution Protocol distribution
        uses: actions/download-artifact@v4
        with:
          name: task-execution-protocol-dist
          path: packages/task-execution/protocol/dist
      - name: Install packed-smoke dependency toolchain
        working-directory: packages/task-execution/protocol
        run: yarn install --immutable
      - name: Verify Task Execution Backend
        working-directory: packages/task-execution/backend
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Upload Task Execution Backend distribution
        uses: actions/upload-artifact@v4
        with:
          name: task-execution-backend-dist
          path: packages/task-execution/backend/dist
          if-no-files-found: error
          retention-days: 1

  profiles:
    needs: foundation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Yarn 4.13.0
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate
      - name: Restore Task Execution Protocol distribution
        uses: actions/download-artifact@v4
        with:
          name: task-execution-protocol-dist
          path: packages/task-execution/protocol/dist
      - name: Install packed-smoke dependency toolchain
        working-directory: packages/task-execution/protocol
        run: yarn install --immutable
      - name: Verify Task Execution Profiles
        working-directory: packages/task-execution/profiles
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn check:documents
          yarn pack:smoke
      - name: Upload Task Execution Profiles distribution
        uses: actions/upload-artifact@v4
        with:
          name: task-execution-profiles-dist
          path: packages/task-execution/profiles/dist
          if-no-files-found: error
          retention-days: 1

  supervisor:
    needs: [foundation, backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Yarn 4.13.0
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate
      - name: Restore Task Execution Protocol distribution
        uses: actions/download-artifact@v4
        with:
          name: task-execution-protocol-dist
          path: packages/task-execution/protocol/dist
      - name: Restore Task Execution Backend distribution
        uses: actions/download-artifact@v4
        with:
          name: task-execution-backend-dist
          path: packages/task-execution/backend/dist
      - name: Install packed-smoke dependency toolchains
        run: |
          (cd packages/task-execution/protocol && yarn install --immutable)
          (cd packages/task-execution/backend && yarn install --immutable)
      - name: Verify Task Execution Supervisor
        working-directory: packages/task-execution/backend-local/supervisor
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Upload Task Execution Supervisor distribution
        uses: actions/upload-artifact@v4
        with:
          name: task-execution-supervisor-dist
          path: packages/task-execution/backend-local/supervisor/dist
          if-no-files-found: error
          retention-days: 1

  workspace:
    needs: [foundation, profiles]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Yarn 4.13.0
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate
      - name: Restore Task Execution Protocol distribution
        uses: actions/download-artifact@v4
        with:
          name: task-execution-protocol-dist
          path: packages/task-execution/protocol/dist
      - name: Restore Task Execution Profiles distribution
        uses: actions/download-artifact@v4
        with:
          name: task-execution-profiles-dist
          path: packages/task-execution/profiles/dist
      - name: Install packed-smoke dependency toolchains
        run: |
          (cd packages/task-execution/protocol && yarn install --immutable)
          (cd packages/task-execution/profiles && yarn install --immutable)
      - name: Verify Task Execution Workspace
        working-directory: packages/task-execution/backend-local/workspace
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Upload Task Execution Workspace distribution
        uses: actions/upload-artifact@v4
        with:
          name: task-execution-workspace-dist
          path: packages/task-execution/backend-local/workspace/dist
          if-no-files-found: error
          retention-days: 1

  launchers:
    needs: [foundation, backend, profiles, supervisor, workspace]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Yarn 4.13.0
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate
      - name: Restore Task Execution Protocol distribution
        uses: actions/download-artifact@v4
        with:
          name: task-execution-protocol-dist
          path: packages/task-execution/protocol/dist
      - name: Restore Task Execution Backend distribution
        uses: actions/download-artifact@v4
        with:
          name: task-execution-backend-dist
          path: packages/task-execution/backend/dist
      - name: Restore Task Execution Profiles distribution
        uses: actions/download-artifact@v4
        with:
          name: task-execution-profiles-dist
          path: packages/task-execution/profiles/dist
      - name: Restore Task Execution Supervisor distribution
        uses: actions/download-artifact@v4
        with:
          name: task-execution-supervisor-dist
          path: packages/task-execution/backend-local/supervisor/dist
      - name: Restore executable bit on native custody binaries
        run: chmod +x packages/task-execution/backend-local/supervisor/dist/native/jinn-attempt-shim*
      - name: Restore Task Execution Workspace distribution
        uses: actions/download-artifact@v4
        with:
          name: task-execution-workspace-dist
          path: packages/task-execution/backend-local/workspace/dist
      - name: Install packed-smoke dependency toolchains
        run: |
          (cd packages/task-execution/protocol && yarn install --immutable)
          (cd packages/task-execution/backend && yarn install --immutable)
          (cd packages/task-execution/profiles && yarn install --immutable)
          (cd packages/task-execution/backend-local/supervisor && yarn install --immutable)
          (cd packages/task-execution/backend-local/workspace && yarn install --immutable)
      - name: Verify Task Execution Launchers
        working-directory: packages/task-execution/backend-local/launchers
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Upload Task Execution Launchers distribution
        uses: actions/upload-artifact@v4
        with:
          name: task-execution-launchers-dist
          path: packages/task-execution/backend-local/launchers/dist
          if-no-files-found: error
          retention-days: 1

  testing:
    needs: [foundation, backend, supervisor, workspace, launchers]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Yarn 4.13.0
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate
      - name: Restore Task Execution Protocol distribution
        uses: actions/download-artifact@v4
        with:
          name: task-execution-protocol-dist
          path: packages/task-execution/protocol/dist
      - name: Restore Task Execution Backend distribution
        uses: actions/download-artifact@v4
        with:
          name: task-execution-backend-dist
          path: packages/task-execution/backend/dist
      - name: Restore Task Execution Supervisor distribution
        uses: actions/download-artifact@v4
        with:
          name: task-execution-supervisor-dist
          path: packages/task-execution/backend-local/supervisor/dist
      - name: Restore executable bit on native custody binaries
        run: chmod +x packages/task-execution/backend-local/supervisor/dist/native/jinn-attempt-shim*
      - name: Restore Task Execution Workspace distribution
        uses: actions/download-artifact@v4
        with:
          name: task-execution-workspace-dist
          path: packages/task-execution/backend-local/workspace/dist
      - name: Restore Task Execution Launchers distribution
        uses: actions/download-artifact@v4
        with:
          name: task-execution-launchers-dist
          path: packages/task-execution/backend-local/launchers/dist
      - name: Restore Task Execution Profiles distribution
        uses: actions/download-artifact@v4
        with:
          name: task-execution-profiles-dist
          path: packages/task-execution/profiles/dist
      - name: Install packed-smoke dependency toolchains
        run: |
          (cd packages/task-execution/protocol && yarn install --immutable)
          (cd packages/task-execution/backend && yarn install --immutable)
          (cd packages/task-execution/profiles && yarn install --immutable)
          (cd packages/task-execution/backend-local/supervisor && yarn install --immutable)
          (cd packages/task-execution/backend-local/workspace && yarn install --immutable)
          (cd packages/task-execution/backend-local/launchers && yarn install --immutable)
      - name: Build evidence contract packages from source (cross-tree CI convention, program §7.8)
        run: |
          (cd packages/evidence/protocol && yarn install --immutable && yarn build)
          (cd packages/evidence/repository && yarn install --immutable && yarn build)
          (cd packages/evidence/discovery && yarn install --immutable && yarn build)
          (cd packages/evidence/execution-recorder && yarn install --immutable && yarn build)
      - name: Build Task Execution Backend Local assembly from source (testing imports it at typecheck)
        working-directory: packages/task-execution/backend-local/assembly
        run: |
          yarn install --immutable
          yarn build
      - name: Verify Task Execution Testing kit (including the ./backend-local conformance kit slice)
        working-directory: packages/task-execution/testing
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
      - name: Run Task Execution Testing kit pack:smoke
        working-directory: packages/task-execution/testing
        run: yarn pack:smoke
      - name: Upload Task Execution Testing distribution
        uses: actions/upload-artifact@v4
        with:
          name: task-execution-testing-dist
          path: packages/task-execution/testing/dist
          if-no-files-found: error
          retention-days: 1

  backend-local:
    needs: [foundation, backend, profiles, supervisor, workspace, launchers, testing]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Yarn 4.13.0
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate
      - name: Restore Task Execution Protocol distribution
        uses: actions/download-artifact@v4
        with:
          name: task-execution-protocol-dist
          path: packages/task-execution/protocol/dist
      - name: Restore Task Execution Backend distribution
        uses: actions/download-artifact@v4
        with:
          name: task-execution-backend-dist
          path: packages/task-execution/backend/dist
      - name: Restore Task Execution Profiles distribution
        uses: actions/download-artifact@v4
        with:
          name: task-execution-profiles-dist
          path: packages/task-execution/profiles/dist
      - name: Restore Task Execution Supervisor distribution
        uses: actions/download-artifact@v4
        with:
          name: task-execution-supervisor-dist
          path: packages/task-execution/backend-local/supervisor/dist
      - name: Restore executable bit on native custody binaries
        run: |
          chmod +x packages/task-execution/backend-local/supervisor/dist/native/jinn-attempt-shim*
          # Rebuild on this runner so artifact bit-loss cannot leave a non-exec probe/spawn path.
          (cd packages/task-execution/backend-local/supervisor && node scripts/build-native.mjs)
      - name: Restore Task Execution Workspace distribution
        uses: actions/download-artifact@v4
        with:
          name: task-execution-workspace-dist
          path: packages/task-execution/backend-local/workspace/dist
      - name: Restore Task Execution Launchers distribution
        uses: actions/download-artifact@v4
        with:
          name: task-execution-launchers-dist
          path: packages/task-execution/backend-local/launchers/dist
      - name: Install packed-smoke dependency toolchains
        run: |
          (cd packages/task-execution/protocol && yarn install --immutable)
          (cd packages/task-execution/backend && yarn install --immutable)
          (cd packages/task-execution/profiles && yarn install --immutable)
          (cd packages/task-execution/backend-local/supervisor && yarn install --immutable)
          (cd packages/task-execution/backend-local/workspace && yarn install --immutable)
          (cd packages/task-execution/backend-local/launchers && yarn install --immutable)
      - name: Build evidence contract packages from source (cross-tree CI convention, program §7.8)
        run: |
          (cd packages/evidence/protocol && yarn install --immutable && yarn build)
          (cd packages/evidence/repository && yarn install --immutable && yarn build)
          (cd packages/evidence/discovery && yarn install --immutable && yarn build)
          (cd packages/evidence/execution-recorder && yarn install --immutable && yarn build)
      - name: Verify Task Execution Backend Local (assembly)
        working-directory: packages/task-execution/backend-local/assembly
        env:
          # Pin the production binary so Vitest dependency optimization cannot lose dist/native.
          JINN_NATIVE_CUSTODY_BINARY: ${{ github.workspace }}/packages/task-execution/backend-local/supervisor/dist/native/jinn-attempt-shim
        run: |
          (cd ../supervisor && node scripts/build-native.mjs)
          test -x "$JINN_NATIVE_CUSTODY_BINARY"
          "$JINN_NATIVE_CUSTODY_BINARY" --probe
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Upload Task Execution Backend Local distribution
        uses: actions/upload-artifact@v4
        with:
          name: task-execution-backend-local-dist
          path: packages/task-execution/backend-local/assembly/dist
          if-no-files-found: error
          retention-days: 1

  evaluation-harness:
    needs: [foundation, backend, profiles, supervisor, workspace, launchers, backend-local]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Yarn 4.13.0
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate
      - name: Restore all Task Execution distributions
        uses: actions/download-artifact@v4
        with:
          pattern: task-execution-*-dist
          path: .task-execution-dist
      - name: Place Task Execution distributions
        run: |
          for package in protocol backend profiles; do
            mkdir -p "packages/task-execution/${package}/dist"
            cp -R ".task-execution-dist/task-execution-${package}-dist/." "packages/task-execution/${package}/dist/"
          done
          for package in supervisor workspace launchers; do
            mkdir -p "packages/task-execution/backend-local/${package}/dist"
            cp -R ".task-execution-dist/task-execution-${package}-dist/." "packages/task-execution/backend-local/${package}/dist/"
          done
          mkdir -p packages/task-execution/backend-local/assembly/dist
          cp -R ".task-execution-dist/task-execution-backend-local-dist/." packages/task-execution/backend-local/assembly/dist/
      - name: Install packed-smoke dependency toolchains
        run: |
          (cd packages/task-execution/protocol && yarn install --immutable)
          (cd packages/task-execution/backend && yarn install --immutable)
          (cd packages/task-execution/profiles && yarn install --immutable)
          (cd packages/task-execution/backend-local/supervisor && yarn install --immutable)
          (cd packages/task-execution/backend-local/workspace && yarn install --immutable)
          (cd packages/task-execution/backend-local/launchers && yarn install --immutable)
      - name: Build evidence contract packages from source
        run: |
          (cd packages/evidence/protocol && yarn install --immutable && yarn build)
          (cd packages/evidence/repository && yarn install --immutable && yarn build)
          (cd packages/evidence/discovery && yarn install --immutable && yarn build)
          (cd packages/evidence/execution-recorder && yarn install --immutable && yarn build)
          (cd packages/evidence/attestation-issuer && yarn install --immutable && yarn build)
      - name: Verify Task Execution Evaluation Harness
        working-directory: packages/task-execution/evaluation-harness
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Upload Task Execution Evaluation Harness distribution
        uses: actions/upload-artifact@v4
        with:
          name: task-execution-evaluation-harness-dist
          path: packages/task-execution/evaluation-harness/dist
          if-no-files-found: error
          retention-days: 1

  evaluator-adapters:
    needs: [foundation, backend, profiles, supervisor, workspace, launchers, backend-local, evaluation-harness]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Yarn 4.13.0
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate
      - name: Restore all Task Execution distributions
        uses: actions/download-artifact@v4
        with:
          pattern: task-execution-*-dist
          path: .task-execution-dist
      - name: Place Task Execution distributions
        run: |
          for package in protocol backend profiles evaluation-harness; do
            mkdir -p "packages/task-execution/${package}/dist"
            cp -R ".task-execution-dist/task-execution-${package}-dist/." "packages/task-execution/${package}/dist/"
          done
          for package in supervisor workspace launchers; do
            mkdir -p "packages/task-execution/backend-local/${package}/dist"
            cp -R ".task-execution-dist/task-execution-${package}-dist/." "packages/task-execution/backend-local/${package}/dist/"
          done
          mkdir -p packages/task-execution/backend-local/assembly/dist
          cp -R ".task-execution-dist/task-execution-backend-local-dist/." packages/task-execution/backend-local/assembly/dist/
      - name: Restore executable bit on native custody binaries
        run: chmod +x packages/task-execution/backend-local/supervisor/dist/native/jinn-attempt-shim*
      - name: Install packed-smoke dependency toolchains
        run: |
          (cd packages/task-execution/protocol && yarn install --immutable)
          (cd packages/task-execution/backend && yarn install --immutable)
          (cd packages/task-execution/profiles && yarn install --immutable)
          (cd packages/task-execution/backend-local/supervisor && yarn install --immutable)
          (cd packages/task-execution/backend-local/workspace && yarn install --immutable)
          (cd packages/task-execution/backend-local/launchers && yarn install --immutable)
          (cd packages/task-execution/evaluation-harness && yarn install --immutable)
      - name: Build evidence contract packages from source
        run: |
          (cd packages/evidence/protocol && yarn install --immutable && yarn build)
          (cd packages/evidence/repository && yarn install --immutable && yarn build)
          (cd packages/evidence/discovery && yarn install --immutable && yarn build)
          (cd packages/evidence/execution-recorder && yarn install --immutable && yarn build)
          (cd packages/evidence/attestation-issuer && yarn install --immutable && yarn build)
      - name: Verify Task Execution Evaluator Adapters
        working-directory: packages/task-execution/evaluator-adapters
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Upload Task Execution Evaluator Adapters distribution
        uses: actions/upload-artifact@v4
        with:
          name: task-execution-evaluator-adapters-dist
          path: packages/task-execution/evaluator-adapters/dist
          if-no-files-found: error
          retention-days: 1

  verify:
    needs: [architecture, foundation, backend, testing, profiles, supervisor, workspace, launchers, backend-local, evaluation-harness, evaluator-adapters]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every Task Execution CI stage to succeed
        env:
          ARCHITECTURE_RESULT: ${{ needs.architecture.result }}
          FOUNDATION_RESULT: ${{ needs.foundation.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          TESTING_RESULT: ${{ needs.testing.result }}
          PROFILES_RESULT: ${{ needs.profiles.result }}
          SUPERVISOR_RESULT: ${{ needs.supervisor.result }}
          WORKSPACE_RESULT: ${{ needs.workspace.result }}
          LAUNCHERS_RESULT: ${{ needs.launchers.result }}
          BACKEND_LOCAL_RESULT: ${{ needs.backend-local.result }}
          EVALUATION_HARNESS_RESULT: ${{ needs.evaluation-harness.result }}
          EVALUATOR_ADAPTERS_RESULT: ${{ needs.evaluator-adapters.result }}
        run: |
          for result in \
            "$ARCHITECTURE_RESULT" \
            "$FOUNDATION_RESULT" \
            "$BACKEND_RESULT" \
            "$TESTING_RESULT" \
            "$PROFILES_RESULT" \
            "$SUPERVISOR_RESULT" \
            "$WORKSPACE_RESULT" \
            "$LAUNCHERS_RESULT" \
            "$BACKEND_LOCAL_RESULT" \
            "$EVALUATION_HARNESS_RESULT" \
            "$EVALUATOR_ADAPTERS_RESULT"; do
            test "$result" = "success"
          done
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Yarn 4.13.0
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate
      - name: Restore all package distributions
        uses: actions/download-artifact@v4
        with:
          pattern: task-execution-*-dist
          path: .task-execution-dist
      - name: Place package distributions
        run: |
          for package in protocol backend testing profiles evaluation-harness evaluator-adapters; do
            mkdir -p "packages/task-execution/${package}/dist"
            cp -R ".task-execution-dist/task-execution-${package}-dist/." "packages/task-execution/${package}/dist/"
          done
          for package in supervisor workspace launchers; do
            mkdir -p "packages/task-execution/backend-local/${package}/dist"
            cp -R ".task-execution-dist/task-execution-${package}-dist/." "packages/task-execution/backend-local/${package}/dist/"
          done
          mkdir -p "packages/task-execution/backend-local/assembly/dist"
          cp -R ".task-execution-dist/task-execution-backend-local-dist/." "packages/task-execution/backend-local/assembly/dist/"
          mkdir -p packages/task-execution/evaluation-harness/dist
          cp -R ".task-execution-dist/task-execution-evaluation-harness-dist/." packages/task-execution/evaluation-harness/dist/
      - name: Build evidence contract packages from source (cross-tree CI convention, program §7.8)
        run: |
          (cd packages/evidence/protocol && yarn install --immutable && yarn build)
          (cd packages/evidence/repository && yarn install --immutable && yarn build)
          (cd packages/evidence/discovery && yarn install --immutable && yarn build)
          (cd packages/evidence/execution-recorder && yarn install --immutable && yarn build)
          (cd packages/evidence/attestation-issuer && yarn install --immutable && yarn build)
      - name: Compile packed public entrypoint consumers
        run: node .github/scripts/task-execution-packed-types.test.mjs
