name: Indexer Enrichment CI

on:
  pull_request:
    branches: [main, next]
    paths:
      - '.github/workflows/indexer-enrichment-ci.yml'
      - 'packages/indexer-enrichment/**'
      - 'packages/indexer/**'
      - 'packages/sdk/**'
  push:
    branches: [main, next]
    paths:
      - '.github/workflows/indexer-enrichment-ci.yml'
      - 'packages/indexer-enrichment/**'
      - 'packages/indexer/**'
      - 'packages/sdk/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  worker:
    name: Enrichment Worker Package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/indexer-enrichment
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: corepack enable

      - name: Build indexer record dependencies
        working-directory: ${{ github.workspace }}
        run: |
          (cd packages/task-execution/protocol && yarn install --immutable && yarn build)
          (cd packages/trust/core && yarn install --immutable && yarn build)
          (cd packages/benchmarking/records && yarn install --immutable && yarn build)

      # The worker portal-links @jinn-network/indexer, which portal-links the
      # SDK and benchmarking records. Their exports maps point at compiled
      # dist/*.js, so the complete portal closure is built before worker install.
      - name: Build @jinn-network/sdk
        working-directory: packages/sdk
        run: |
          yarn install --immutable
          yarn build

      # The indexer install resolves its own `portal:../sdk`; the worker imports
      # the indexer's TS source via its exports map (no indexer build needed).
      - name: Install @jinn-network/indexer (portal target)
        working-directory: packages/indexer
        run: yarn install --immutable

      - run: yarn install --immutable
      - run: yarn typecheck
      - run: yarn test
      - run: yarn build

  docker:
    name: Enrichment Worker Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Build context is packages/ (not packages/indexer-enrichment/) so the
      # Dockerfile can COPY + build the @jinn-network/sdk and @jinn-network/indexer
      # portal siblings.
      - name: Build enrichment worker image
        working-directory: packages
        run: |
          docker build \
            --build-arg JINN_ENRICHMENT_COMMIT=${{ github.sha }} \
            -f indexer-enrichment/deploy/Dockerfile \
            -t jinn-enrichment-worker:ci \
            .

      # Boot smoke test (#779 FIX 2): docker BUILD alone never proved the image
      # actually RUNS — a broken import chain (e.g. if the bundle ever regressed
      # to verbatim `.ts` imports + a base image without type-stripping) would
      # ship undetected. Run the image against an unreachable DB and assert it
      # exits NON-ZERO with the fail-loud FATAL DB log (#1068 boot guarantee).
      # The bundle is self-contained, so reaching the DB probe also proves the
      # whole import/portal chain resolved at runtime.
      - name: Boot smoke test (fail-loud on unreachable DB)
        run: |
          set -euo pipefail
          # 127.0.0.1:1 is closed → pool.connect() throws at boot.
          OUT="$(timeout 30s docker run --rm \
            -e DATABASE_URL=postgres://nope:nope@127.0.0.1:1/none \
            -e DATABASE_SCHEMA=none \
            jinn-enrichment-worker:ci 2>&1)" && CODE=0 || CODE=$?
          echo "--- container output ---"
          echo "$OUT"
          echo "--- exit code: $CODE ---"
          if [ "$CODE" -eq 0 ]; then
            echo "FAIL: worker exited 0 against an unreachable DB (expected non-zero fail-loud)"
            exit 1
          fi
          if [ "$CODE" -eq 124 ]; then
            echo "FAIL: worker hung (timeout) instead of failing loud at boot"
            exit 1
          fi
          # File read, not a pipe: under pipefail, `grep -q` exiting on its first
          # match SIGPIPEs the producer once the output exceeds the pipe buffer,
          # turning a present log line into a spurious red (same defect class as
          # the selection pipes fixed on #2821, fail-closed variant).
          printf '%s\n' "$OUT" > "${RUNNER_TEMP}/worker-output.txt"
          if ! grep -q "FATAL: cannot connect to Postgres at boot" "${RUNNER_TEMP}/worker-output.txt"; then
            echo "FAIL: missing the fail-loud FATAL DB boot log"
            exit 1
          fi
          echo "PASS: image boots and fails loud on unreachable DB (exit $CODE)"
