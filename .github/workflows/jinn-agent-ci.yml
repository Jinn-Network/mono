name: jinn-agent CI

on:
  pull_request:
    paths:
      - 'apps/jinn-agent/**'
      - 'packages/plugin/**'
      - 'client/packages/harness-layer/**'
      - 'client/src/solver-types/_swe-rebench-v2-*.ts'
      - 'client/src/adapters/mech/ipfs.ts'
      - 'client/src/harnesses/impls/swe-rebench-v2-evaluator/**'
      - 'client/scripts/bundle-jinn-layer.mjs'
      - 'client/scripts/stage1-task-creator-acceptance.mjs'
      - 'client/package.json'
      - 'client/yarn.lock'
      - '.github/workflows/jinn-agent-ci.yml'
  push:
    branches: [next, main]
    paths:
      - 'apps/jinn-agent/**'
      - 'packages/plugin/**'
      - 'client/packages/harness-layer/**'
      - 'client/src/solver-types/_swe-rebench-v2-*.ts'
      - 'client/src/adapters/mech/ipfs.ts'
      - 'client/src/harnesses/impls/swe-rebench-v2-evaluator/**'
      - 'client/scripts/bundle-jinn-layer.mjs'
      - 'client/scripts/stage1-task-creator-acceptance.mjs'
      - 'client/package.json'
      - 'client/yarn.lock'
      - '.github/workflows/jinn-agent-ci.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'

permissions:
  contents: read

concurrency:
  group: jinn-agent-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/jinn-agent

jobs:
  test:
    name: Test
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m venv venv && ./venv/bin/pip install -e ".[dev]"

      # Per-file isolation via scripts/run_tests.sh: each test file runs in its
      # own freshly-spawned `python -m pytest <file>` subprocess (clean, hermetic
      # env). Running the whole tree in one pytest process leaked module-level
      # state across files and produced ~239 spurious failures in tests that pass
      # individually — this runner is the project's canonical fix for that (also
      # used by apps/jinn-agent's own tests.yml). The old `--deselect` for the
      # migration-prompt test is no longer needed: it fails only with live network
      # access, which the hermetic env (env -i) + conftest live-system guard now
      # preclude. tests/dehermes/ is the de-hermes acceptance gate (Task 10).
      #
      # Two steps because tests/dehermes/test_main_path_acceptance.py is a heavy
      # outlier (~13 min: it cold-spawns every subcommand's `--help`, and now runs
      # to completion because the de-hermes gate passes instead of bailing on the
      # first brand leak). Sharing the parallel pool, its own subprocess fan-out
      # oversubscribes CPU and it blows any per-file timeout; run it ALONE first so
      # it is uncontended, then run everything else in parallel, excluding it.
      - name: Acceptance gate (heavy, run alone)
        run: ./scripts/run_tests.sh --file-timeout 1200 tests/dehermes/test_main_path_acceptance.py -q

      - name: Unit + dehermes + jinn-plugin suite (per-file isolated, parallel)
        run: |
          FILES=$( { find tests/hermes_cli tests/dehermes -name 'test_*.py' \
            ! -name 'test_main_path_acceptance.py'; \
            find tests/plugins -maxdepth 1 -name 'test_jinn_*.py'; } | sort | paste -sd: )
          ./scripts/run_tests.sh --files "$FILES" -j 4 --file-timeout 1200 -q

  cold-stock-e2e:
    name: Cold-stock Stage 1 product gate
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Enable Corepack
        working-directory: client
        run: corepack enable
      - name: Install client dependencies
        working-directory: client
        run: yarn install --immutable
      - name: Build the real jinn-layer and daemon
        working-directory: client
        run: yarn build
      - name: Plugin package boundary, schema, type, test, and build gates
        working-directory: client
        run: yarn --cwd ../packages/plugin typecheck && yarn --cwd ../packages/plugin test && yarn --cwd ../packages/plugin build
      - name: Harness store, process contract, and task-creator privacy gates
        working-directory: client
        run: >-
          yarn vitest run
          packages/harness-layer/test/contribution-store.test.ts
          packages/harness-layer/test/process-contract.test.ts
          packages/harness-layer/test/contract-parity.test.ts
          test/solver-types/task-creator-session-echo.test.ts
      - name: Pinned stock-Hermes Stage 1 product journey
        env:
          JINN_STAGE1_SKIP_CLIENT_BUILD: '1'
        run: bash scripts/cold-stock-e2e.sh
