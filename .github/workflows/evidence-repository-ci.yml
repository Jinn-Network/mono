name: Evidence Repository CI

on:
  pull_request:
    branches: [next]
    paths:
      - "packages/evidence-protocol/**"
      - "packages/evidence-repository/**"
      - "packages/evidence-repository-fs/**"
      - "packages/evidence-repository-oci/**"
      - ".github/workflows/evidence-repository-ci.yml"
  push:
    branches: [next]
    paths:
      - "packages/evidence-protocol/**"
      - "packages/evidence-repository/**"
      - "packages/evidence-repository-fs/**"
      - "packages/evidence-repository-oci/**"
      - ".github/workflows/evidence-repository-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      registry:
        image: registry:3.0.0
        ports:
          - 5000:5000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Yarn 4.13.0
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate

      - name: Install ORAS 1.3.2
        uses: oras-project/setup-oras@v1
        with:
          version: 1.3.2

      - name: Verify Evidence Protocol dependency
        working-directory: packages/evidence-protocol
        run: |
          yarn install --immutable
          yarn check:profile
          yarn typecheck
          yarn test
          yarn build

      - name: Verify repository contracts
        working-directory: packages/evidence-repository
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke

      - name: Verify filesystem binding
        working-directory: packages/evidence-repository-fs
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke

      - name: Verify OCI binding
        working-directory: packages/evidence-repository-oci
        run: |
          yarn install --immutable
          yarn check:profile
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke

      - name: Wait for Distribution registry
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:5000/v2/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Distribution registry was not ready after ${attempt} attempts."
          exit 1

      - name: Test ORAS registry round trip
        working-directory: packages/evidence-repository-oci
        env:
          JINN_OCI_REGISTRY_TEST: "1"
          JINN_OCI_TEST_REPOSITORY: localhost:5000/jinn/evidence
          ORAS_PATH: oras
        run: yarn test:registry
