name: hermetic-gate

# The deterministic, zero-external-dependency release gate (spec §3.1).
#
# docs/superpowers/specs/2026-05-31-release-pipeline-two-gate-redesign.md:
#   "CI proves the code is correct. ... Deterministic, zero external
#    dependencies → it *cannot* flake for infra reasons → a red is always a
#    real code regression."
#
# It runs the real daemon code against REAL contracts (JinnRouterV3 +
# TaskCoordinator + activity checker + the real OLAS Mech Marketplace) on a
# pinned Anvil `--dump-state` snapshot (spec §4 — snapshot, not fork: a fork
# reintroduces the network flakiness we are removing, needs a secret in PR CI,
# and rots silently). The snapshot is a committed fixture; the only network
# access in the whole pipeline lives in the offline builder
# `contracts/scripts/build-anvil-snapshot.ts`.
#
# This gate needs NO secrets, so it is safe to run on PRs from forks. The
# required context is the native terminal job `hermetic-gate` (display name
# equals the ruleset string), the same producer shape as the other nine
# required checks. GitHub binds that job's check-run to github.sha — on
# merge_group, the speculative merge the queue evaluates; on push to next,
# the SHA the publish guard queries. Fork PRs report it without a Checks API
# POST (fork GITHUB_TOKEN is read-only).
#
# The `hermetic-gate` context is a REQUIRED check on `next` from the merge-queue
# flip onward (DR-2026-08-18-b D3), which fulfills the two-gate redesign's own
# migration intent. The context is registered by
# .github/scripts/enable-next-merge-queue.sh and asserted by
# .github/scripts/branch-protection-audit.mjs.
#
# A required merge-queue context must not sit behind a workflow-level `paths:`
# filter: a filtered-out workflow never reports on the merge group at all, and
# the entry hangs until the check-response timeout ejects it. Selection lives in
# the `changes` job (DR-2026-08-18-b D3/D6). pull_request and merge_group skip
# the suite when every changed path is on the cannot-affect list in
# hermetic-selection.mjs. push to next/release always runs the suite: that SHA
# is the evidence the publish guard queries.

on:
  pull_request:
  merge_group:
  push:
    branches:
      - next
      - 'release/*'

# Serialize per-ref so a force-push supersedes an in-flight run rather than
# racing two gates onto overlapping SHAs — but only on the PR lane, matching
# the other required-context producers (repository-structure.yml,
# stack-fixture-immutability.yml). Off the PR lane every run's verdict is wanted:
# a merge-group entry that loses its gate to a cancellation gets a red context
# and is ejected, and a superseded push to `next` still leaves the SHA-bound
# job check the publish guard reads. Since #2996 the publish-guard evidence on
# a queue-landed SHA is usually the merge_group run's worker check (the push
# arm dedups behind it); the push lane remains the evidence source whenever no
# merge-group verdict covers the SHA (break-glass pushes, release/*).
concurrency:
  group: hermetic-gate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    # Four other required workflows already report a job named `changes`. The
    # job *id* stays `changes` so the gate reaches it through `needs`.
    name: hermetic-gate-changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # checks: read feeds the push-lane dedup probe below (#2996). Job-level
    # permissions replace the workflow grant, so contents: read is restated.
    permissions:
      contents: read
      checks: read
    outputs:
      run: ${{ steps.select.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          # The merge-base walk and the name-only diff below read the commit and
          # tree graph and never a blob. Omitting blobs keeps `fetch-depth: 0`
          # from cloning the full pack on every PR and every queue entry.
          filter: blob:none
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Select the hermetic suite from the diff
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MG_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MG_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          case "${EVENT_NAME}" in
            pull_request)
              diff_base="${PR_BASE_SHA}"
              diff_head="${PR_HEAD_SHA}"
              ;;
            merge_group)
              diff_base="${MG_BASE_SHA}"
              diff_head="${MG_HEAD_SHA}"
              ;;
            push)
              # A queue landing is the byte-identical commit its merge_group run
              # verified (DR-2026-08-18-b D4: MERGE, one entry per landing), so a
              # completed successful WORKER check-run on this exact SHA proves the
              # suite already executed against this tree. The probe names the
              # worker, never the `hermetic-gate` gate context: the gate is green
              # even when selection skipped the suite, and a vacuous verdict must
              # never be laundered onto the SHA the publish guard reads (#2996).
              # Only run attempt 1 may dedup - a manual re-run executes for real.
              # Any probe failure falls OPEN to the full run, as do release/* and
              # break-glass pushes (no merge-group evidence exists there).
              if [ "${GITHUB_REF:-}" = 'refs/heads/next' ] && [ "${GITHUB_RUN_ATTEMPT:-1}" = '1' ]; then
                verified="$(gh api -X GET "repos/${GITHUB_REPOSITORY:-}/commits/${GITHUB_SHA:-}/check-runs" \
                  -f check_name='Hermetic gate (deterministic, snapshot)' \
                  -f status=completed -f per_page=100 \
                  --jq '[.check_runs[] | select(.conclusion == "success")] | length' \
                  2>/dev/null || echo 0)"
                case "${verified}" in
                  *[!0-9]*|'') verified=0 ;;
                esac
                if [ "${verified}" -gt 0 ]; then
                  echo "::notice::hermetic suite already ran and passed on this SHA in its merge_group build; deduplicating the push-lane run (#2996)"
                  echo 'run=false' >> "${GITHUB_OUTPUT}"
                  exit 0
                fi
                echo "::notice::no completed successful worker check-run found on this SHA; running the full suite"
              fi
              echo 'push to next/release runs the suite when no merge-group verdict covers this SHA (publish-guard SHA)'
              echo 'run=true' >> "${GITHUB_OUTPUT}"
              exit 0
              ;;
            *)
              echo "${EVENT_NAME} carries no diff; selecting the hermetic suite"
              echo 'run=true' >> "${GITHUB_OUTPUT}"
              exit 0
              ;;
          esac
          # A branch creation sends all-zeros, and a force-push can send a base that
          # is no longer reachable. Neither can be diffed, so select conservatively
          # rather than failing a required context.
          if [ -z "${diff_base}" ] \
            || [ "${diff_base}" = '0000000000000000000000000000000000000000' ] \
            || ! git cat-file -e "${diff_base}^{commit}" 2>/dev/null; then
            echo "no usable diff base (${diff_base:-empty}); selecting the hermetic suite"
            echo 'run=true' >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          # The changed list goes to a file. Piping it into a short-circuiting
          # consumer is a trap: the producer takes SIGPIPE once the list outruns
          # the 64KiB pipe buffer, and under pipefail that can unselect a matching
          # diff. `core.quotePath=false` keeps a non-ASCII path unquoted.
          # `--no-renames` keeps a rename from printing only its new path.
          git -c core.quotePath=false diff --no-renames --name-only "${diff_base}...${diff_head}" \
            > "${RUNNER_TEMP}/changed.txt"
          echo "changed files: $(wc -l < "${RUNNER_TEMP}/changed.txt")"
          head -200 "${RUNNER_TEMP}/changed.txt"
          selection="$(node .github/scripts/hermetic-selection.mjs < "${RUNNER_TEMP}/changed.txt")"
          echo "${selection}"
          run="$(jq -r '.run' <<<"${selection}")"
          case "${run}" in
            true|false)
              echo "run=${run}" >> "${GITHUB_OUTPUT}"
              ;;
            *)
              echo "::error::unparseable selection output: '${run}'"
              exit 1
              ;;
          esac

  cache-warm:
    # Push-to-next is the ONLY writer of the shared operator/node_modules cache:
    # `next` is the default branch, and cache scoping makes merge_group
    # (gh-readonly-queue/**) and PR-merge-ref saves unreadable from other refs.
    # When the probe above dedups the suite, this job still restores the
    # exact-key cache and repopulates it on a miss, so a landing that bumps
    # operator/yarn.lock cannot staleify the cache the PR and merge-group
    # hermetic runs restore from (#2996).
    name: hermetic-cache-warm
    if: github.event_name == 'push' && github.ref == 'refs/heads/next'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ONNXRUNTIME_NODE_INSTALL: skip
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
      - name: Cache client node_modules
        id: cache
        uses: actions/cache@v6
        with:
          path: operator/node_modules
          key: ${{ runner.os }}-client-nodemodules-${{ hashFiles('operator/yarn.lock') }}
      - name: Populate the cache on a miss
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: operator
        run: yarn install --immutable

  hermetic:
    name: Hermetic gate (deterministic, snapshot)
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    # A hung step must not burn the merge queue's check-response budget, and must
    # not hold a runner for the 360-minute default against the plan's concurrent-job
    # ceiling. Observed green runs land around 12 minutes; the ceiling is generous
    # enough that a slow-but-real run is never truncated. A timeout is a job
    # `failure`, so the `hermetic-gate` terminal job still reports the red context.
    timeout-minutes: 60
    env:
      # The deterministic loop tests the *loop*, not the *agent* (spec §3.1):
      # the prediction-v1-baseline harness needs no API key, so this gate has
      # zero credential dependencies.
      JINN_E2E_HARNESS: prediction-v1-baseline
      # This gate is CPU-only. Both onnxruntime-node versions in the dependency
      # graph otherwise auto-download optional Linux CUDA libraries during
      # postinstall. The current installer reads ONNXRUNTIME_NODE_INSTALL;
      # the nested legacy installer reads ONNXRUNTIME_NODE_INSTALL_CUDA.
      # Their CPU binaries remain bundled in the npm packages.
      ONNXRUNTIME_NODE_INSTALL: skip
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      # This job's outcome is the suite signal. The required context is the
      # terminal job `hermetic-gate` below.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: corepack enable

      # Foundry provides `anvil` — the snapshot is loaded via `anvil --load-state`
      # (deterministic, local disk I/O, no live RPC on the gate path).
      #
      # PIN the anvil version: anvil's `--dump-state` JSON schema is NOT stable
      # across releases. The committed fixture was authored with this nightly;
      # newer anvil rejects it at load (`missing field 'address'`) and current
      # stable rejects it too (`SerializableTransactionType`), so an unpinned
      # toolchain exits code 2 before becoming ready and reddens the whole gate.
      # This tag must move IN LOCKSTEP with the fixture: to bump anvil, rebuild
      # the snapshot (docs/snapshots/base-v3-snapshot.md) under the new version
      # and update this pin in the same PR.
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly-1c7c4bebce1e075989780fd401bf6bffcb424746

      # Keep the client dependency tree cached for speed only. Hermeticity does
      # not depend on a warm cache: the job-level ONNX flags above prevent both
      # direct and packages/core installs from downloading optional CUDA assets.
      - name: Cache client node_modules
        uses: actions/cache@v6
        with:
          path: operator/node_modules
          key: ${{ runner.os }}-client-nodemodules-${{ hashFiles('operator/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-client-nodemodules-

      - name: Install client deps
        working-directory: operator
        run: yarn install --immutable

      - name: Smoke snapshot builder entrypoint
        working-directory: operator
        run: yarn smoke:build-anvil-snapshot

      # Build the indexer (Ponder codegen) so the hermetic snapshot indexer
      # round-trip (test/hermetic/indexer-roundtrip.test.ts, run via
      # `yarn test:hermetic`) can spawn a real indexer against the snapshot chain.
      - name: Build indexer local package dependencies
        run: |
          (cd packages/contract-abis && yarn install --immutable && yarn build:dist)
          (cd packages/task-execution/protocol && yarn install --immutable && yarn build)
          (cd packages/trust/core && yarn install --immutable && yarn build)
          (cd packages/benchmarking/records && yarn install --immutable && yarn build)

      - name: Install indexer deps
        working-directory: packages/indexer
        run: yarn install --immutable

      - name: Indexer codegen
        working-directory: packages/indexer
        run: yarn codegen

      # FAIL LOUD if the committed snapshot fixture is absent. It is large and
      # human/heavy-step generated (spec §4) — never fabricated by CI. Without it
      # the whole gate is meaningless, so this is a hard stop with a precise
      # remediation pointer, NOT a skip.
      - name: Assert snapshot fixture present
        run: |
          STATE_DIR="operator/test/_support/fixtures/anvil-base-v3-state"
          # Hard fail if the dir is absent OR state.json is missing/empty. One OR
          # covers both "directory never created" and "directory exists but the
          # dumped state.json is missing or zero-length" (-s is false for both).
          if [ ! -d "$STATE_DIR" ] || [ ! -s "$STATE_DIR/state.json" ]; then
            echo "::error::Hermetic snapshot fixture missing/empty at $STATE_DIR/state.json"
            echo "Run \`cd operator && BASE_RPC_URL=... yarn tsx ../contracts/scripts/build-anvil-snapshot.ts\` and commit the fixture."
            echo "See docs/snapshots/base-v3-snapshot.md for the rollout order."
            exit 1
          fi
          echo "✓ snapshot fixture present at $STATE_DIR/state.json"

      # Compile the V3 contracts so the hermetic adversarial test can load the
      # full artifact ABIs (including the Router* error fragments) that drive the
      # snapshot's real bytecode into each adversarial state (spec §5).
      - name: Compile contracts
        working-directory: contracts
        run: |
          yarn install --immutable
          yarn compile

      # Run the hermetic suite. The test/hermetic/** tests load the snapshot
      # via spawnAnvilFromState (adversarial claim/delivery on real bytecode) and
      # exercise the deterministic RPC fallback chain (#592) with a mock
      # transport. The positional path scopes vitest to just this home (the same
      # filename-filter form `release:tier-1:T1.1` uses) so the gate's verdict
      # maps 1:1 to the hermetic surface. The daemon full-loop fixture owns the
      # solution leg through SolutionDeliveryClaimed; native evaluator verdict
      # settlement/activity coverage is tracked separately in issue #2666.
      # The dedicated hermetic config runs the suite SEQUENTIALLY
      # (fileParallelism:false) with a long timeout — its heavy files each spawn
      # Anvil (+ Ponder / a real daemon) and would contend/flake if run
      # concurrently. The snapshot/subprocess tests run ONLY here (excluded from
      # the default unit `yarn test`), so this is the one place they execute.
      - name: Run hermetic suite
        id: hermetic
        working-directory: operator
        run: yarn test:hermetic

      # App-flow determinism: mocked-daemon Playwright against the operator
      # console (Stage 6). Chromium only. The console imports the kit from
      # `dist/` (portal:), so build it before install — same as operator-console-ci.yml.
      - name: Build lifecycle-notifications
        working-directory: packages/lifecycle-notifications
        run: |
          yarn install --immutable
          yarn build
      # Do NOT pass `--with-deps`. That flag runs apt against the runner image's
      # Ubuntu mirrors. merge_group run 32272723606 hung 53 minutes on
      # azure.archive.ubuntu.com (Ign, then stall after mixing archive.ubuntu.com);
      # the 60-minute job timeout cancelled a still-running apt and ejected the
      # queue. GitHub-hosted ubuntu-24.04 already ships the Chromium system
      # libraries; this step only downloads the browser. A hung CDN download must
      # fail this step, not burn the job budget.
      - name: Install operator console
        timeout-minutes: 15
        working-directory: apps/operator-console
        run: |
          corepack prepare yarn@4.13.0 --activate
          yarn install --immutable
          yarn playwright install chromium

      - name: App-flow determinism (Playwright, mocked daemon)
        id: appflow
        working-directory: operator
        run: yarn e2e:app-flow

      - name: Operator console unit tests
        working-directory: apps/operator-console
        run: yarn test

      - name: Upload app-flow traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: app-flow-traces
          path: apps/operator-console/test-results/
          retention-days: 7

      # This job deliberately ends here: its outcome IS the suite signal. Reaching
      # the end means the hermetic suite (including the snapshot indexer round-trip),
      # the app-flow journeys and the console unit tests all passed; a failure of
      # any of them short-circuits the job. The `hermetic-gate` terminal job reads
      # `needs.hermetic.result` and is the required context.

  hermetic-gate:
    # The check-run name GitHub reports is this job's display `name:` below, and that
    # string is the required-status-check context registered on the `next` ruleset
    # (DR-2026-08-18-b D3) — keep them in sync. The job exists so the context is
    # reported even when the suite job is cancelled or its runner dies: an
    # unreported required context hangs a queue entry until the check-response
    # timeout ejects it (DR-2026-08-18-b D3/D6). Fork PRs run this job too.
    name: hermetic-gate
    needs: [changes, hermetic, cache-warm]
    if: always()
    runs-on: ubuntu-latest
    # One `test` against an upstream result. The bound keeps a wedged runner from
    # holding the required context open for the 360-minute default.
    timeout-minutes: 5
    steps:
      - name: Require exact success from the selected hermetic suite
        env:
          SELECTED: ${{ needs.changes.outputs.run }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          HERMETIC_RESULT: ${{ needs.hermetic.result }}
          CACHE_WARM_RESULT: ${{ needs.cache-warm.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          echo "selected=${SELECTED} changes=${CHANGES_RESULT} hermetic=${HERMETIC_RESULT}"
          test "${CHANGES_RESULT}" = success
          # The selection is read from a job output, which is the empty string when the
          # select step never wrote one. Empty must never be read as "unselected", or a
          # broken selection step turns into a green gate over a skipped suite.
          case "${SELECTED}" in
            true|false) ;;
            *)
              echo "::error::unparseable selection output: '${SELECTED}'"
              exit 1
              ;;
          esac
          # When the suite is selected the bar is unchanged: exact success. When it
          # is not, the suite job must be exactly `skipped` — a failed or cancelled
          # job still fails this gate, so unselection can never launder a red.
          expected=success
          if [ "${SELECTED}" != true ]; then
            expected=skipped
          fi
          test "${HERMETIC_RESULT}" = "${expected}"
          # The cache-warm job exists only on push-to-next; everywhere else its
          # `if:` skips it and the gate requires exactly that.
          warm_expected=skipped
          if [ "${EVENT_NAME}" = push ] && [ "${GITHUB_REF:-}" = 'refs/heads/next' ]; then
            warm_expected=success
          fi
          test "${CACHE_WARM_RESULT}" = "${warm_expected}"
