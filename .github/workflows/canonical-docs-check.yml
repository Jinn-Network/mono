name: Canonical docs check
on:
  pull_request:
    # Default types omit `edited`. Without it, adding a Discussion URL to the
    # body after the last push never re-runs this gate, and a workflow re-run
    # replays the stale event payload (#4181).
    types:
      - opened
      - synchronize
      - reopened
      - edited
  merge_group:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    # The subjects of this gate — the PR body and `github.base_ref` — do not exist on a
    # merge group, so the check runs on the PR lane only. `canonical-docs-gate` below
    # turns that skip into the required context's verdict (DR-2026-08-18-b D3).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify discussion link for canonical-doc changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          # Live body via the API: a re-run of a failed check still carries the
          # original event payload (#4181).
          PR_BODY="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .body)"
          CANON='^(PRINCIPLES|SPEC|THESIS|BRAND|GROWTH|GLOSSARY)\.md$'
          changed=$(git diff --name-only "origin/${BASE_REF}...HEAD")
          if echo "$changed" | grep -E "$CANON" > /dev/null; then
            if ! echo "$PR_BODY" | grep -E 'github\.com/Jinn-Network/mono/discussions/[0-9]+' > /dev/null; then
              echo "Canonical doc changed but no GitHub Discussion linked in PR body."
              echo "Link the upstream discussion (https://github.com/Jinn-Network/mono/discussions/<n>) that justifies the change."
              exit 1
            fi
          fi
  canonical-docs-gate:
    # The check-run name GitHub reports is this job's display `name:` below, and that
    # string is the required-status-check context registered on the `next` ruleset
    # (DR-2026-08-18-b D3) — keep them in sync.
    name: canonical-docs-gate
    needs: [check]
    if: always()
    runs-on: ubuntu-latest
    # One `test` against an upstream result. The bound keeps a wedged runner from
    # holding the required context open for the 360-minute default.
    timeout-minutes: 5
    steps:
      # Per DR-2026-08-18-b D3 this context is required, with an explicit merge-group
      # no-op: the subject is the PR body's Discussion link, which the PR-side run
      # already enforced at enqueue time and which no longer exists on a merge group.
      # The merge-group branch asserts `skipped` exactly, so a failed or cancelled
      # `check` can never be laundered into a green group.
      - name: Require the canonical-docs result for this event
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHECK_RESULT: ${{ needs.check.result }}
        run: |
          if [ "${EVENT_NAME}" = merge_group ]; then
            test "${CHECK_RESULT}" = skipped
            echo "::notice::canonical-docs is a PR-body gate; enforced at enqueue time"
            exit 0
          fi
          test "${CHECK_RESULT}" = success
