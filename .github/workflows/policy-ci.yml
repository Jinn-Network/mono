name: Policy CI

on:
  pull_request:
  push:
    branches: [next]
    paths:
      - "packages/policy/**"
      - ".github/scripts/policy-*.test.mjs"
      - ".github/workflows/policy-ci.yml"
      - "docs/superpowers/specs/2026-08-03-policy-identity-and-outcomes-design.md"
      - "docs/superpowers/plans/2026-08-03-policy-optimization-implementation-program.md"

permissions:
  contents: read

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify package inventory and dependency graph
        run: node --test .github/scripts/policy-package-inventory.test.mjs
      - name: Verify source boundaries and purity sweeps
        run: node --test .github/scripts/policy-source-boundaries.test.mjs
      - name: Verify policy-identity's purity and no-record contract
        run: node --test .github/scripts/policy-identity-guards.test.mjs

  identity:
    needs: [architecture]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Yarn 4.13.0
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate
      # Test-only portal: `merge-parity.test.ts` runs protocol's real `mergeRequirements` beside
      # this package's reproduction of it. There is no runtime edge (substrate §2) — production
      # source is banned from importing protocol by the source-boundary guard.
      - name: Build the test-only protocol portal from source
        run: (cd packages/task-execution/protocol && yarn install --immutable && yarn build)
      - name: Verify Policy Identity
        working-directory: packages/policy/identity
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      # Substrate §8 requires the derivation-equivalence fixture to be satisfied by two
      # structurally different implementations. The same suite runs again against the kit's naive
      # reference deriver; a byte-level disagreement fails here rather than being argued about.
      - name: Verify the same conformance suite against the reference implementation
        working-directory: packages/policy/identity
        run: yarn test:conformance:reference
      - name: Upload Policy Identity distribution
        uses: actions/upload-artifact@v4
        with:
          name: policy-identity-dist
          path: packages/policy/identity/dist
          if-no-files-found: error
          retention-days: 1

  verify:
    needs: [architecture, identity]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every Policy CI stage to succeed
        env:
          ARCHITECTURE_RESULT: ${{ needs.architecture.result }}
          IDENTITY_RESULT: ${{ needs.identity.result }}
        run: |
          for result in \
            "$ARCHITECTURE_RESULT" \
            "$IDENTITY_RESULT"; do
            test "$result" = "success"
          done
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Yarn 4.13.0
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate
      - name: Restore all package distributions
        uses: actions/download-artifact@v4
        with:
          pattern: policy-*-dist
          path: .policy-dist
      - name: Place package distributions
        run: |
          mkdir -p packages/policy/identity/dist
          cp -R .policy-dist/policy-identity-dist/. packages/policy/identity/dist/
      - name: Compile packed public entrypoint consumers
        run: node .github/scripts/policy-packed-types.test.mjs
