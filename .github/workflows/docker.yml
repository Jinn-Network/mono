name: Docker

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

defaults:
  run:
    working-directory: client

jobs:
  build-and-push:
    name: Build & Push OCI Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          RELEASE_TAG="${{ github.event.release.tag_name }}"
          case "${RELEASE_TAG}" in
            client-v*)
              VERSION="${RELEASE_TAG#client-v}"
              ;;
            *)
              echo "::error::Stable client releases must use tags shaped like client-vX.Y.Z"
              exit 1
              ;;
          esac

          PACKAGE_VERSION=$(cd client && node -e "console.log(JSON.parse(require('fs').readFileSync('package.json','utf8')).version)")
          if [ "${VERSION}" != "${PACKAGE_VERSION}" ]; then
            echo "::error::Release tag version ${VERSION} does not match client/package.json version ${PACKAGE_VERSION}"
            exit 1
          fi

          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-8)
          IMAGE_REPO="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/client"

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "sha=${SHORT_SHA}" >> "${GITHUB_OUTPUT}"
          echo "image_repo=${IMAGE_REPO}" >> "${GITHUB_OUTPUT}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build smoke-test image
        uses: docker/build-push-action@v6
        with:
          context: client
          file: client/Dockerfile
          load: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.image_repo }}:smoke-${{ steps.meta.outputs.sha }}
          build-args: |
            JINN_BUILD_COMMIT=${{ github.sha }}
          cache-from: type=gha

      - name: Smoke test image
        shell: bash
        run: |
          IMAGE="${{ steps.meta.outputs.image_repo }}:smoke-${{ steps.meta.outputs.sha }}"

          VERSION_OUTPUT=$(docker run --rm "${IMAGE}" version --json)
          echo "${VERSION_OUTPUT}" | node -e "
            const payload = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            if (payload.schemaVersion !== 1) process.exit(1);
            if (payload.client?.version !== '${{ steps.meta.outputs.version }}') process.exit(1);
          "

          EXIT=0
          docker run --rm "${IMAGE}" doctor --json >/tmp/jinn-docker-doctor.json 2>/tmp/jinn-docker-doctor.err || EXIT=$?
          if [ "${EXIT}" -eq 50 ]; then
            echo 'doctor fatal-crashed inside the published image'
            cat /tmp/jinn-docker-doctor.err
            exit 1
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: client
          file: client/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image_repo }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image_repo }}:sha-${{ steps.meta.outputs.sha }}
            ${{ steps.meta.outputs.image_repo }}:latest
          build-args: |
            JINN_BUILD_COMMIT=${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
