name: CI

on:
  pull_request:
    paths: ['client/**']
  push:
    branches: [main]
    paths: ['client/**']

defaults:
  run:
    working-directory: client

jobs:
  check:
    name: Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn typecheck
      - run: yarn test
      - run: yarn build

  pack-smoke:
    name: Pack & Smoke Test
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn build

      # Pack the artifact exactly as it would be published
      - run: yarn pack -o jinn-client.tgz

      # Install the packed tarball in a clean temp dir and run smoke tests
      # against the packaged artifact, NOT the source tree
      - name: Smoke test packed artifact
        working-directory: /tmp
        run: |
          mkdir smoke && cd smoke
          npm init -y
          npm install $GITHUB_WORKSPACE/client/jinn-client.tgz

          # version must emit valid JSON with schemaVersion
          OUTPUT=$(npm exec -- jinn version --json 2>/dev/null || true)
          echo "$OUTPUT" | node -e "
            const d = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            if (d.schemaVersion !== 1) { process.exit(1); }
            console.log('✓ jinn version: schema OK, v' + d.client.version);
          "

          # --help must exit 0
          npm exec -- jinn --help > /dev/null
          echo "✓ jinn --help: exit 0"

          # doctor may fail (no keystore) but must not crash with code 50
          EXIT=0
          npm exec -- jinn doctor --json 2>/dev/null || EXIT=$?
          if [ "$EXIT" -eq 50 ]; then
            echo "✗ jinn doctor crashed with fatal error (exit 50)"
            exit 1
          fi
          echo "✓ jinn doctor: no crash (exit $EXIT)"

      # Verify tarball contents — only expected files shipped
      - name: Verify tarball contents
        run: |
          tar tzf jinn-client.tgz | sort > /tmp/tarball-contents.txt
          echo "--- Tarball contents ---"
          cat /tmp/tarball-contents.txt

          # Must contain dist/ and deployments/, must NOT contain src/ or test/
          grep -q "package/dist/" /tmp/tarball-contents.txt || { echo "✗ Missing dist/"; exit 1; }
          grep -q "package/deployments/" /tmp/tarball-contents.txt || { echo "✗ Missing deployments/"; exit 1; }
          grep -q "package/LICENSE" /tmp/tarball-contents.txt || { echo "✗ Missing LICENSE"; exit 1; }

          if grep -q "package/src/" /tmp/tarball-contents.txt; then
            echo "✗ src/ leaked into tarball"
            exit 1
          fi
          if grep -q "package/test/" /tmp/tarball-contents.txt; then
            echo "✗ test/ leaked into tarball"
            exit 1
          fi
          echo "✓ Tarball contents verified"
