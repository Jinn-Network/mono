name: Task Supply CI

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
  pull_request:
    paths:
      - "packages/task-supply/**"
      - "packages/environments/**"
      - ".github/scripts/task-supply-*.test.mjs"
      - ".github/workflows/task-supply-ci.yml"
      - "docs/superpowers/specs/2026-07-31-verified-environment-supply-design.md"
      - "docs/superpowers/plans/2026-07-31-chain-environment-program.md"
      # Transitive `portal:` closure of the workspaces above (#3573). Each is built
      # from source into this lane, so a change confined to one of them changes what
      # this lane verifies. Enforced by .github/scripts/portal-path-filters.test.mjs.
      - "packages/discovery/protocol/**"
      - "packages/evidence/protocol/**"
      - "packages/marketplace/binding/**"
      - "packages/task-execution/backend/**"
      - "packages/task-execution/profiles/**"
      - "packages/task-execution/protocol/**"
      - "packages/trust/core/**"
      - "packages/trust/resolve/**"
      - "packages/trust/testing/**"
  push:
    branches: [next]
    paths:
      - "packages/task-supply/**"
      - "packages/environments/**"
      - ".github/scripts/task-supply-*.test.mjs"
      - ".github/workflows/task-supply-ci.yml"
      - "docs/superpowers/specs/2026-07-31-verified-environment-supply-design.md"
      - "docs/superpowers/plans/2026-07-31-chain-environment-program.md"
      # Transitive `portal:` closure of the workspaces above (#3573). Each is built
      # from source into this lane, so a change confined to one of them changes what
      # this lane verifies. Enforced by .github/scripts/portal-path-filters.test.mjs.
      - "packages/discovery/protocol/**"
      - "packages/evidence/protocol/**"
      - "packages/marketplace/binding/**"
      - "packages/task-execution/backend/**"
      - "packages/task-execution/profiles/**"
      - "packages/task-execution/protocol/**"
      - "packages/trust/core/**"
      - "packages/trust/resolve/**"
      - "packages/trust/testing/**"

permissions:
  contents: read

# Consolidated per #2997 (pattern proven by the trust-ci pilot, PR #3001): the
# previous shape ran one runner job per package chained through artifact dist
# round-trips, rebuilding the shared portal set (up to ten packages) in every
# job. The packages job below builds the same five packages with the same
# commands in dependency order in ONE workspace, every portal built once.
#
# The per-job isolation this retires was a de-facto undeclared-dependency
# guard; that invariant is owned by task-supply-source-boundaries.test.mjs in
# the architecture job (which also keeps the curation projection-never-record
# contract wired - see workflow-script-tests.test.mjs).
jobs:
  architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify package inventory and dependency graph
        run: node --test .github/scripts/task-supply-package-inventory.test.mjs
      - name: Verify source boundaries and canaries
        run: node --test .github/scripts/task-supply-source-boundaries.test.mjs
      - name: Verify curation's projection-never-record contract
        run: node --test .github/scripts/task-supply-curation-guards.test.mjs

  packages:
    name: Task Supply packages
    runs-on: ubuntu-latest
    # A hung step must not hold a runner slot for the 360-minute default nor
    # burn the queue's 180-minute check-response budget.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - name: Enable Corepack before the Yarn cache lookup
        # setup-node resolves the Yarn cache folder by shelling out to `yarn`.
        # Without Corepack that is the runner image's global Yarn 1, which
        # refuses every project pinned to `packageManager: yarn@4.13.0`.
        run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
          cache: yarn
          cache-dependency-path: |
            packages/trust/core/yarn.lock
            packages/trust/resolve/yarn.lock
            packages/evidence/protocol/yarn.lock
            packages/task-execution/protocol/yarn.lock
            packages/task-execution/profiles/yarn.lock
            packages/task-execution/backend/yarn.lock
            packages/environments/record/yarn.lock
            packages/environments/chain-record/yarn.lock
            packages/marketplace/binding/yarn.lock
            packages/task-supply/curation/yarn.lock
            packages/task-supply/admission/yarn.lock
            packages/task-supply/derivation/yarn.lock
            packages/task-supply/chain-scenarios/yarn.lock
            packages/task-supply/posting/yarn.lock
      # A freshly rolled runner image can regress the packed-consumer smoke:
      # node 22.23.2's bundled npm dies with "Cannot read properties of null
      # (reading 'edgesOut')" on yarn-packed tarballs (first seen on the
      # task-execution lane, PR #3010). evidence-ci and the old task-execution
      # foundation job always pinned both for exactly this reason.
      - name: Pin npm for packed-consumer smoke coverage
        run: npm install --global npm@11.19.0 --no-audit --no-fund
      - name: Enable Yarn 4.13.0
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate
      - name: Build cross-tree portal dependency from source (trust-core, §7.8)
        working-directory: packages/trust/core
        run: |
          yarn install --immutable
          yarn build
      - name: Build cross-tree portal dependency from source (trust-resolve, §7.8)
        working-directory: packages/trust/resolve
        run: |
          yarn install --immutable
          yarn build
      - name: Build cross-tree portal dependency from source (evidence-protocol, §7.8)
        working-directory: packages/evidence/protocol
        run: |
          yarn install --immutable
          yarn build
      - name: Build cross-tree portal dependency from source (task-execution-protocol, §7.8)
        working-directory: packages/task-execution/protocol
        run: |
          yarn install --immutable
          yarn build
      - name: Build cross-tree portal dependency from source (task-execution-profiles, §7.8)
        working-directory: packages/task-execution/profiles
        run: |
          yarn install --immutable
          yarn build
      - name: Build cross-tree portal dependency from source (task-execution-backend, §7.8)
        working-directory: packages/task-execution/backend
        run: |
          yarn install --immutable
          yarn build
      - name: Build cross-tree portal dependency from source (environment-record, §7.8)
        working-directory: packages/environments/record
        run: |
          yarn install --immutable
          yarn build
      - name: Build cross-tree portal dependency from source (chain-environment-record, §7.8)
        working-directory: packages/environments/chain-record
        run: |
          yarn install --immutable
          yarn build
      - name: Build cross-tree portal dependency from source (marketplace-binding, §7.8)
        working-directory: packages/marketplace/binding
        run: |
          yarn install --immutable
          yarn build
      - name: Verify Task Curation
        working-directory: packages/task-supply/curation
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Verify Task Admission
        working-directory: packages/task-supply/admission
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Verify Task Derivation
        working-directory: packages/task-supply/derivation
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Verify Chain Scenarios
        working-directory: packages/task-supply/chain-scenarios
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Verify Task Posting
        working-directory: packages/task-supply/posting
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Compile packed public entrypoint consumers
        run: node .github/scripts/task-supply-packed-types.test.mjs
