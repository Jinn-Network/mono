name: Subgraph Build

# PR #37's per-CID ERC-8004 subgraph was deleted as a category error against
# the deployed contracts (DR
# docs/superpowers/specs/2026-04-27-erc-8004-entity-model-design.md). The
# rebuilt operator-rooted Jinn subgraph lands under bead jinn-mono-fud and
# will re-enable codegen + graph build at that point. Until then the
# placeholder manifest declares zero data sources, which graph-cli 0.80
# rejects, so this workflow no-ops to keep PR checks green.

on:
  pull_request:
    paths: ["subgraph/**"]
  push:
    branches: [main]
    paths: ["subgraph/**"]

defaults:
  run:
    working-directory: subgraph

jobs:
  build:
    name: graph build (placeholder — rebuild tracked in jinn-mono-fud)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Skip — placeholder subgraph
        run: |
          echo "Subgraph is a placeholder pending the operator-rooted rebuild."
          echo "See docs/superpowers/specs/2026-04-27-erc-8004-entity-model-design.md"
          echo "Re-enable codegen + graph build when jinn-mono-fud lands."
