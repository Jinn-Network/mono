<style>html,body{margin:0;background:var(--surface-page)}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.446.0/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<script>window.__C=window.ColophonDesignSystem_55942c;window.__K={};</script></head><body><div id="root"></div>
<script type="text/babel" src="kit-icons.jsx"></script>
<script type="text/babel" src="Shell.jsx"></script>
<script type="text/babel" src="Screens.jsx"></script>
<script type="text/babel">
const { Sidebar, Topbar, StepRail, ConfigureScreen, AssuranceScreen, LiveScreen, PublishScreen } = window.__K;
const { Button, Tag } = window.__C;
const STEPS=['Task set','Entrants','Assurance','Run','Publish'];
const BASE=[
 {id:'baseline',model:'claude-x',harness:'2.1',tools:'base',context:'200k',attempts:'1',runner:'network'},
 {id:'loadout-a',model:'claude-x',harness:'2.4',tools:'base',context:'200k',attempts:'1',runner:'network'},
 {id:'loadout-c',model:'claude-x',harness:'2.4',tools:'full + retrieval',context:'400k',attempts:'1',runner:'network'}];
function App(){
  const [step,setStep]=React.useState(1);
  const [entrants,setEntrants]=React.useState(BASE);
  const [assurance,setAssurance]=React.useState('majority');
  const [published,setPublished]=React.useState(false);
  const titles=['Task set','Entrant configurations','Evaluation assurance','Live run','Publish'];
  return <div style={{display:'flex',height:'100vh',overflow:'hidden'}}>
    <Sidebar active="Benchmarks" />
    <div style={{flex:1,display:'flex',flexDirection:'column',minWidth:0}}>
      <Topbar crumb="Benchmarks / hb-2026-08" title={titles[step]}
        actions={<><Tag mono>hb-2026-08</Tag><Tag tone={step>=3?'ink':'outline'}>{step>=3?'Method locked':'Draft'}</Tag><Button size="sm" variant="secondary">Agent access</Button></>}/>
      <StepRail steps={STEPS} current={step}/>
      <div style={{flex:1,overflow:'auto',padding:'var(--space-9)'}}>
        {step===1&&<ConfigureScreen entrants={entrants} onAdd={()=>setEntrants(e=>[...e,{...e[e.length-1],id:'loadout-'+String.fromCharCode(100+e.length)}])} onNext={()=>setStep(2)}/>}
        {step===2&&<AssuranceScreen value={assurance} onChange={setAssurance} onNext={()=>setStep(3)}/>}
        {step===3&&<LiveScreen onFinish={()=>setStep(4)}/>}
        {step===4&&<PublishScreen published={published} onPublish={()=>setPublished(true)}/>}
      </div>
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
