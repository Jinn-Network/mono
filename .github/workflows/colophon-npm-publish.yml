name: Colophon npm Publish

# Demand-gated publisher for @colophon-claims/{check,core,cli} and the permanent passthrough
# alias @colophon-claims/verify. Both reader names publish from this one workflow, checker first,
# because the alias pins an exact checker version and npm versions are immutable: an alias released
# against a checker that does not exist would permanently break `npx @colophon-claims/verify@0.2`.
# Configure both package names against this filename on npm. Do not rename the file.
# Setting the registry-wide `npm deprecate` flag on @colophon-claims/verify is deliberately not
# done here: it needs a credential this trusted-publishing job does not hold. The deprecation note
# ships in the alias's own `description` and README; the flag is a one-time operator action.
# So is the checker's platform receipt: the `--apply` step below refuses until
# product-release-platform-pins.json and PRODUCT_RELEASES in colophon-publish-manifest.mjs carry a
# receipt keyed `@colophon-claims/check@<version>`. A receipt attests one publish under one name,
# so the @colophon-claims/verify@0.2.1 receipt is not re-keyed onto the checker.
# Publish core before cli: cli depends on the published core version.
# The check dispatch's claim-pin guard admits the checker version that dispatch publishes. core and
# cli publish no reader, so their guard admits nothing npm does not already serve: the composed /10
# claim pins the first checker release, so dispatch check before core and cli.
# Do not run this on push. Do not add a registry token.

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish (check publishes the verify alias too; core before cli)'
        required: true
        type: choice
        options:
          - check
          - core
          - cli
      confirm:
        description: 'Type publish-<package> (publish-check, publish-core, or publish-cli)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: colophon-npm-publish
  cancel-in-progress: false

jobs:
  publish-colophon:
    name: publish-colophon
    runs-on: ubuntu-latest
    # Sized for the alias gate's 45 minute wait on the registry, plus install, build and both publishes.
    timeout-minutes: 90
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Require explicit confirmation
        if: ${{ github.event.inputs.confirm != format('publish-{0}', github.event.inputs.package) }}
        run: |
          echo "Refusing to publish. Type publish-${{ github.event.inputs.package }} to continue."
          exit 1

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      # cli only. The cli build compiles the private web application in packages/benchmark-product/web
      # and copies its standalone output into the tarball. web resolves core, the checker and the
      # platform packages through Yarn portals to this checkout, so that build needs the whole closure
      # built from source, and the cli dispatch used to die in its build on a missing node_modules
      # state file (#4933). These steps prepare that input with the commands the `product` job of
      # benchmark-product-ci.yml runs ahead of its own cli step: Corepack and Yarn 4.13.0, the portal
      # dependencies in dependency order, the checker and core, then the web install. They install and
      # build with Yarn in those directories only. None of them touches the cli package, so the
      # manifest the receipt step rewrites and the registry install of the pinned core and checker
      # are left to the cli step below, and the build needs no package npm does not serve.
      # They sit ahead of the shared Node setup because a setup-node step that precedes a Yarn install
      # must carry that install's cache mapping (workflow-yarn-cache.test.mjs). Giving the cli
      # dispatch its own cached setup leaves the check and core dispatches exactly as they were.
      - name: Enable Corepack before the Yarn cache lookup
        if: ${{ github.event.inputs.package == 'cli' }}
        run: corepack enable

      - name: Set up Node with the Yarn cache for the private web build input
        if: ${{ github.event.inputs.package == 'cli' }}
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: |
            packages/task-execution/protocol/yarn.lock
            packages/trust/core/yarn.lock
            packages/trust/testing/yarn.lock
            packages/discovery/protocol/yarn.lock
            packages/discovery/client/yarn.lock
            packages/discovery/serve/yarn.lock
            packages/discovery/transport-http/yarn.lock
            packages/discovery/publication/yarn.lock
            packages/environments/record/yarn.lock
            packages/task-execution/profiles/yarn.lock
            packages/benchmarking/records/yarn.lock
            packages/benchmarking/aggregate/yarn.lock
            packages/benchmarking/publication/yarn.lock
            packages/task-execution/backend/yarn.lock
            packages/task-execution/backend-local/supervisor/yarn.lock
            packages/task-execution/backend-local/workspace/yarn.lock
            packages/task-execution/backend-local/launchers/yarn.lock
            packages/task-supply/admission/yarn.lock
            packages/benchmarking/interop/yarn.lock
            packages/evidence/protocol/yarn.lock
            packages/evidence/repository/yarn.lock
            packages/evidence/discovery/yarn.lock
            packages/evidence/execution-evidence-builder/yarn.lock
            packages/evidence/execution-recorder/yarn.lock
            packages/evidence/attestation-issuer/yarn.lock
            packages/benchmarking/protocol/yarn.lock
            packages/benchmarking/evidence/yarn.lock
            packages/benchmarking/native-capture/yarn.lock
            packages/benchmarking/evaluation/yarn.lock
            packages/task-execution/evaluation-harness/yarn.lock
            packages/task-execution/evaluator-adapters/yarn.lock
            packages/task-execution/oci-grader/yarn.lock
            packages/task-execution/backend-local/assembly/yarn.lock
            packages/benchmarking/run/yarn.lock
            packages/benchmarking/local/yarn.lock
            packages/benchmark-product/check/yarn.lock
            packages/benchmark-product/core/yarn.lock
            packages/benchmark-product/web/yarn.lock

      - name: Enable Yarn 4.13.0
        if: ${{ github.event.inputs.package == 'cli' }}
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate

      # The same directories, in the same order, as the step of this name in benchmark-product-ci.yml.
      # Each one's `dist/` is what the next one's type resolution reads.
      - name: Build portal dependencies from source
        if: ${{ github.event.inputs.package == 'cli' }}
        run: |
          (cd packages/task-execution/protocol && yarn install --immutable && yarn build)
          (cd packages/trust/core && yarn install --immutable && yarn build)
          (cd packages/trust/testing && yarn install --immutable && yarn build)
          (cd packages/discovery/protocol && yarn install --immutable && yarn build)
          (cd packages/discovery/client && yarn install --immutable && yarn build)
          (cd packages/discovery/serve && yarn install --immutable && yarn build)
          (cd packages/discovery/transport-http && yarn install --immutable && yarn build)
          (cd packages/discovery/publication && yarn install --immutable && yarn build)
          (cd packages/environments/record && yarn install --immutable && yarn build)
          (cd packages/task-execution/profiles && yarn install --immutable && yarn build)
          (cd packages/benchmarking/records && yarn install --immutable && yarn build)
          (cd packages/benchmarking/aggregate && yarn install --immutable && yarn build)
          (cd packages/benchmarking/publication && yarn install --immutable && yarn build)
          (cd packages/task-execution/backend && yarn install --immutable && yarn build)
          (cd packages/task-execution/backend-local/supervisor && yarn install --immutable && yarn build)
          (cd packages/task-execution/backend-local/workspace && yarn install --immutable && yarn build)
          (cd packages/task-execution/backend-local/launchers && yarn install --immutable && yarn build)
          (cd packages/task-supply/admission && yarn install --immutable && yarn build)
          (cd packages/benchmarking/interop && yarn install --immutable && yarn build)
          (cd packages/evidence/protocol && yarn install --immutable && yarn build)
          (cd packages/evidence/repository && yarn install --immutable && yarn build)
          (cd packages/evidence/discovery && yarn install --immutable && yarn build)
          (cd packages/evidence/execution-evidence-builder && yarn install --immutable && yarn build)
          (cd packages/evidence/execution-recorder && yarn install --immutable && yarn build)
          (cd packages/evidence/attestation-issuer && yarn install --immutable && yarn build)
          (cd packages/benchmarking/protocol && yarn install --immutable && yarn build)
          (cd packages/benchmarking/evidence && yarn install --immutable && yarn build)
          (cd packages/benchmarking/native-capture && yarn install --immutable && yarn build)
          (cd packages/benchmarking/evaluation && yarn install --immutable && yarn build)
          (cd packages/task-execution/evaluation-harness && yarn install --immutable && yarn build)
          (cd packages/task-execution/evaluator-adapters && yarn install --immutable && yarn build)
          (cd packages/task-execution/oci-grader && yarn install --immutable && yarn build)
          (cd packages/task-execution/backend-local/assembly && yarn install --immutable && yarn build)
          (cd packages/benchmarking/run && yarn install --immutable && yarn build)
          (cd packages/benchmarking/local && yarn install --immutable && yarn build)

      - name: Build the checker and core from source
        if: ${{ github.event.inputs.package == 'cli' }}
        run: |
          (cd packages/benchmark-product/check && yarn install --immutable && yarn build)
          (cd packages/benchmark-product/core && yarn install --immutable && yarn build)

      - name: Prepare private Colophon web build input
        if: ${{ github.event.inputs.package == 'cli' }}
        working-directory: packages/benchmark-product/web
        run: yarn install --immutable

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install npm 11.19.0
        run: npm install -g npm@11.19.0

      - name: Refuse a publish the in-tree claim pins do not name
        if: ${{ github.event.inputs.package == 'check' }}
        run: node .github/scripts/colophon-publish-manifest.mjs --check-claim-pins packages/benchmark-product/check/package.json

      - name: Pin platform dependencies to the recorded product-release receipt
        if: ${{ github.event.inputs.package == 'check' }}
        run: node .github/scripts/colophon-publish-manifest.mjs --apply packages/benchmark-product/check/package.json

      # The alias's guard runs before the checker's publish, not after it: npm versions are immutable,
      # so a checker released with its alias then refused would leave `npx @colophon-claims/verify@0.2`
      # resolving to the pre-rename 0.2.1 until a further checker version ships. The alias itself is
      # source-only: no build, no install, no platform receipt to apply, because it declares no
      # @jinn-network dependency for --apply to rewrite.
      - name: Refuse an alias publish the in-tree claim pins do not name
        if: ${{ github.event.inputs.package == 'check' }}
        run: node .github/scripts/colophon-publish-manifest.mjs --check-claim-pins packages/benchmark-product/verify/package.json

      # Re-entrant on purpose. Everything after this step (the alias gate, the alias publish) can
      # fail for reasons that have nothing to do with the checker -- registry replication lag on
      # `npm view`, a trusted-publisher binding missing for the alias name -- and npm versions are
      # immutable, so a re-dispatch that unconditionally republished would die here with E403 and
      # leave the alias unshippable until a checker version bump. A version npm already serves is
      # skipped, not republished; the run then proceeds to the steps that actually failed.
      - name: Install, build, and publish from the public registry
        if: ${{ github.event.inputs.package == 'check' }}
        working-directory: packages/benchmark-product/check
        run: |
          unset NODE_AUTH_TOKEN
          npm install
          npm run build
          version="$(node -p 'require("./package.json").version')"
          if npm view "@colophon-claims/check@${version}" version >/dev/null 2>&1; then
            echo "@colophon-claims/check@${version} is already published; skipping the checker publish"
          else
            npm publish --access public
          fi

      # npm processes a publish asynchronously, so `npm publish` returns before `npm view` serves the
      # version. The other lanes measured 1 to 10 minutes and one version at about 29 minutes
      # (#4919), so ask every 15 seconds for 45 minutes, the stack lane's budget, instead of failing
      # a run whose checker publish has already succeeded. The gate is unchanged: the alias step is
      # reached only once npm serves the pinned version, and the last query shows npm's own error.
      - name: Require the pinned checker version to resolve before releasing the alias
        if: ${{ github.event.inputs.package == 'check' }}
        working-directory: packages/benchmark-product/verify
        run: |
          pinned="$(node -p 'require("./package.json").dependencies["@colophon-claims/check"]')"
          for query in $(seq 1 180); do
            if npm view "@colophon-claims/check@${pinned}" version 2>/dev/null; then
              exit 0
            fi
            if [ "$((query % 20))" -eq 1 ]; then
              echo "npm does not serve @colophon-claims/check@${pinned} yet (query ${query} of 181); asking again every 15s"
            fi
            sleep 15
          done
          if ! npm view "@colophon-claims/check@${pinned}" version; then
            echo "::error::npm did not serve @colophon-claims/check@${pinned} after 45 minutes of waiting; the alias was not published"
            exit 1
          fi

      - name: Publish the passthrough alias from the public registry
        if: ${{ github.event.inputs.package == 'check' }}
        working-directory: packages/benchmark-product/verify
        run: |
          unset NODE_AUTH_TOKEN
          npm publish --access public

      - name: Refuse a publish whose claim pins name a reader npm does not serve
        if: ${{ github.event.inputs.package == 'core' || github.event.inputs.package == 'cli' }}
        run: node .github/scripts/colophon-publish-manifest.mjs --check-claim-pins packages/benchmark-product/${{ github.event.inputs.package }}/package.json

      - name: Pin platform dependencies to the recorded product-release receipt
        if: ${{ github.event.inputs.package == 'core' || github.event.inputs.package == 'cli' }}
        run: node .github/scripts/colophon-publish-manifest.mjs --apply packages/benchmark-product/${{ github.event.inputs.package }}/package.json

      - name: Install, build, and publish from the public registry
        if: ${{ github.event.inputs.package == 'core' || github.event.inputs.package == 'cli' }}
        working-directory: packages/benchmark-product/${{ github.event.inputs.package }}
        run: |
          unset NODE_AUTH_TOKEN
          npm install
          npm run build
          npm publish --access public
