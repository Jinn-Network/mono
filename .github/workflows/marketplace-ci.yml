name: Marketplace CI

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
  pull_request:
    paths:
      - "packages/marketplace/**"
      - "contracts/**"
      - ".github/scripts/marketplace-*.test.mjs"
      - ".github/scripts/custody-boundaries.test.mjs"
      - ".github/workflows/marketplace-ci.yml"
      - "docs/superpowers/specs/2026-07-28-marketplace-binding-design.md"
  push:
    branches: [next]
    paths:
      - "packages/marketplace/**"
      - "contracts/**"
      - ".github/scripts/marketplace-*.test.mjs"
      - ".github/scripts/custody-boundaries.test.mjs"
      - ".github/workflows/marketplace-ci.yml"
      - "docs/superpowers/specs/2026-07-28-marketplace-binding-design.md"

permissions:
  contents: read

env:
  MARKETPLACE_ROOT: packages/marketplace

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify package inventory and dependency graph
        run: node --test .github/scripts/marketplace-package-inventory.test.mjs
      - name: Verify source boundaries and canaries
        run: node --test .github/scripts/marketplace-source-boundaries.test.mjs
      - name: Verify marketplace PR Anvil hermeticity
        run: node --test .github/scripts/marketplace-hermetic-anvil.test.mjs
      - name: Custody boundaries (tripwire, marketplace-surfaces design §4.1)
        run: node --test .github/scripts/custody-boundaries.test.mjs

  binding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
      - name: Pin npm for packed-consumer smoke coverage
        run: npm install --global npm@11.19.0 --no-audit --no-fund
      - name: Enable Yarn 4.13.0
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate
      - name: Generate TaskCoordinator artifact from tracked contracts source
        run: |
          (cd contracts && yarn install --immutable && yarn compile)
      - name: Build cross-tree portal dependencies from source (§7.8)
        run: |
          (cd packages/task-execution/protocol && yarn install --immutable && yarn build)
          (cd packages/task-execution/backend && yarn install --immutable && yarn build)
          (cd packages/task-execution/profiles && yarn install --immutable && yarn build)
          (cd packages/trust/core && yarn install --immutable && yarn build)
          (cd packages/trust/resolve && yarn install --immutable && yarn build)
      - name: Verify Marketplace Binding
        working-directory: packages/marketplace/binding
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Upload Marketplace Binding distribution
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-binding-dist
          path: packages/marketplace/binding/dist
          if-no-files-found: error
          retention-days: 1

  projector:
    needs: [binding]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Yarn 4.13.0
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate
      - name: Build cross-tree portal dependencies from source (§7.8)
        run: |
          (cd packages/task-execution/protocol && yarn install --immutable && yarn build)
          (cd packages/task-execution/backend && yarn install --immutable && yarn build)
          (cd packages/task-execution/profiles && yarn install --immutable && yarn build)
          (cd packages/trust/core && yarn install --immutable && yarn build)
          (cd packages/trust/resolve && yarn install --immutable && yarn build)
          (cd packages/discovery/protocol && yarn install --immutable && yarn build)
          (cd packages/discovery/serve && yarn install --immutable && yarn build)
          (cd packages/discovery/testing && yarn install --immutable && yarn build)
      - name: Generate local Anvil fixture artifacts from tracked contracts source (M3.5)
        run: |
          (cd contracts && yarn install --immutable && yarn compile)
      - name: Restore Marketplace Binding distribution
        uses: actions/download-artifact@v4
        with:
          name: marketplace-binding-dist
          path: packages/marketplace/binding/dist
      - name: Install Marketplace Binding toolchain (packed-smoke dependency)
        working-directory: packages/marketplace/binding
        run: yarn install --immutable
      - name: Verify Marketplace Projector
        working-directory: packages/marketplace/projector
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Upload Marketplace Projector distribution
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-projector-dist
          path: packages/marketplace/projector/dist
          if-no-files-found: error
          retention-days: 1

  pipeline:
    needs: [binding]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Yarn 4.13.0
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate
      - name: Build cross-tree portal dependencies from source (§7.8)
        run: |
          (cd packages/evidence/protocol && yarn install --immutable && yarn build)
          (cd packages/evidence/repository && yarn install --immutable && yarn build)
          (cd packages/evidence/discovery && yarn install --immutable && yarn build)
          (cd packages/evidence/execution-evidence-builder && yarn install --immutable && yarn build)
          (cd packages/evidence/execution-recorder && yarn install --immutable && yarn build)
          (cd packages/task-execution/protocol && yarn install --immutable && yarn build)
          (cd packages/task-execution/backend && yarn install --immutable && yarn build)
          (cd packages/task-execution/profiles && yarn install --immutable && yarn build)
          (cd packages/task-execution/backend-local/supervisor && yarn install --immutable && yarn build)
          (cd packages/task-execution/backend-local/workspace && yarn install --immutable && yarn build)
          (cd packages/task-execution/backend-local/launchers && yarn install --immutable && yarn build)
          (cd packages/task-execution/backend-local/assembly && yarn install --immutable && yarn build)
          (cd packages/task-execution/testing && yarn install --immutable && yarn build)
          (cd packages/trust/core && yarn install --immutable && yarn build)
          (cd packages/trust/resolve && yarn install --immutable && yarn build)
          (cd packages/discovery/protocol && yarn install --immutable && yarn build)
          (cd packages/trust/testing && yarn install --immutable && yarn build)
      - name: Restore Marketplace Binding distribution
        uses: actions/download-artifact@v4
        with:
          name: marketplace-binding-dist
          path: packages/marketplace/binding/dist
      - name: Install Marketplace Binding toolchain (packed-smoke dependency)
        working-directory: packages/marketplace/binding
        run: yarn install --immutable
      - name: Verify Marketplace Pipeline
        working-directory: packages/marketplace/pipeline
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Upload Marketplace Pipeline distribution
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-pipeline-dist
          path: packages/marketplace/pipeline/dist
          if-no-files-found: error
          retention-days: 1

  venue-base:
    needs: [binding, projector]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Yarn 4.13.0
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate
      - name: Build cross-tree portal dependencies from source (§7.8)
        run: |
          (cd packages/task-execution/protocol && yarn install --immutable && yarn build)
          (cd packages/task-execution/backend && yarn install --immutable && yarn build)
          (cd packages/task-execution/profiles && yarn install --immutable && yarn build)
          (cd packages/trust/core && yarn install --immutable && yarn build)
          (cd packages/trust/resolve && yarn install --immutable && yarn build)
          (cd packages/discovery/protocol && yarn install --immutable && yarn build)
          (cd packages/discovery/serve && yarn install --immutable && yarn build)
          (cd packages/discovery/testing && yarn install --immutable && yarn build)
      - name: Restore Marketplace Binding distribution
        uses: actions/download-artifact@v4
        with:
          name: marketplace-binding-dist
          path: packages/marketplace/binding/dist
      - name: Restore Marketplace Projector distribution
        uses: actions/download-artifact@v4
        with:
          name: marketplace-projector-dist
          path: packages/marketplace/projector/dist
      - name: Install cross-marketplace toolchains (packed-smoke dependencies)
        run: |
          (cd packages/marketplace/binding && yarn install --immutable)
          (cd packages/marketplace/projector && yarn install --immutable)
          (cd packages/marketplace/testing && yarn install --immutable)
      - name: Verify Marketplace Venue Base
        working-directory: packages/marketplace/venue-base
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Upload Marketplace Venue Base distribution
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-venue-base-dist
          path: packages/marketplace/venue-base/dist
          if-no-files-found: error
          retention-days: 1

  testing:
    needs: [binding, projector, venue-base]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Yarn 4.13.0
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate
      - name: Build cross-tree portal dependencies from source (§7.8)
        run: |
          (cd packages/evidence/protocol && yarn install --immutable && yarn build)
          (cd packages/evidence/repository && yarn install --immutable && yarn build)
          (cd packages/evidence/discovery && yarn install --immutable && yarn build)
          (cd packages/evidence/execution-evidence-builder && yarn install --immutable && yarn build)
          (cd packages/evidence/execution-recorder && yarn install --immutable && yarn build)
          (cd packages/task-execution/protocol && yarn install --immutable && yarn build)
          (cd packages/task-execution/backend && yarn install --immutable && yarn build)
          (cd packages/task-execution/profiles && yarn install --immutable && yarn build)
          (cd packages/task-execution/backend-local/supervisor && yarn install --immutable && yarn build)
          (cd packages/task-execution/backend-local/workspace && yarn install --immutable && yarn build)
          (cd packages/task-execution/backend-local/launchers && yarn install --immutable && yarn build)
          (cd packages/task-execution/backend-local/assembly && yarn install --immutable && yarn build)
          (cd packages/task-execution/testing && yarn install --immutable && yarn build)
          (cd packages/trust/core && yarn install --immutable && yarn build)
          (cd packages/trust/resolve && yarn install --immutable && yarn build)
          (cd packages/discovery/protocol && yarn install --immutable && yarn build)
          (cd packages/discovery/serve && yarn install --immutable && yarn build)
          (cd packages/discovery/testing && yarn install --immutable && yarn build)
          (cd packages/trust/testing && yarn install --immutable && yarn build)
      - name: Restore Marketplace Binding distribution
        uses: actions/download-artifact@v4
        with:
          name: marketplace-binding-dist
          path: packages/marketplace/binding/dist
      - name: Restore Marketplace Projector distribution
        uses: actions/download-artifact@v4
        with:
          name: marketplace-projector-dist
          path: packages/marketplace/projector/dist
      - name: Restore Marketplace Venue Base distribution
        uses: actions/download-artifact@v4
        with:
          name: marketplace-venue-base-dist
          path: packages/marketplace/venue-base/dist
      - name: Install cross-marketplace toolchains (packed-smoke dependencies)
        run: |
          (cd packages/marketplace/binding && yarn install --immutable)
          (cd packages/marketplace/projector && yarn install --immutable)
          (cd packages/marketplace/venue-base && yarn install --immutable)
      - name: Verify Marketplace Testing kit
        working-directory: packages/marketplace/testing
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Upload Marketplace Testing distribution
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-testing-dist
          path: packages/marketplace/testing/dist
          if-no-files-found: error
          retention-days: 1

  anvil-fork:
    # Keep this historical job id stable for required-check compatibility. The implementation
    # loads committed state and never forks a live chain.
    needs: [binding, projector, venue-base]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JINN_MARKETPLACE_ANVIL_STATE_PATH: ${{ github.workspace }}/operator/test/_support/fixtures/anvil-base-v3-state/state.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Yarn 4.13.0
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate
      - name: Install Foundry (Anvil)
        uses: foundry-rs/foundry-toolchain@v1
        with:
          # Anvil load-state behavior is not stable across Foundry releases. Keep this gate on
          # the same snapshot-compatible build used by the repository's hermetic gate.
          version: nightly-1c7c4bebce1e075989780fd401bf6bffcb424746
      - name: Build Hardhat contract artifacts used by the snapshot fixture
        working-directory: contracts
        run: |
          yarn install --immutable
          yarn compile
      - name: Build cross-tree portal dependencies from source (§7.8)
        run: |
          (cd packages/evidence/protocol && yarn install --immutable && yarn build)
          (cd packages/evidence/repository && yarn install --immutable && yarn build)
          (cd packages/evidence/discovery && yarn install --immutable && yarn build)
          (cd packages/evidence/execution-evidence-builder && yarn install --immutable && yarn build)
          (cd packages/evidence/execution-recorder && yarn install --immutable && yarn build)
          (cd packages/task-execution/protocol && yarn install --immutable && yarn build)
          (cd packages/task-execution/backend && yarn install --immutable && yarn build)
          (cd packages/task-execution/profiles && yarn install --immutable && yarn build)
          (cd packages/task-execution/backend-local/supervisor && yarn install --immutable && yarn build)
          (cd packages/task-execution/backend-local/workspace && yarn install --immutable && yarn build)
          (cd packages/task-execution/backend-local/launchers && yarn install --immutable && yarn build)
          (cd packages/task-execution/backend-local/assembly && yarn install --immutable && yarn build)
          (cd packages/task-execution/testing && yarn install --immutable && yarn build)
          (cd packages/trust/core && yarn install --immutable && yarn build)
          (cd packages/trust/resolve && yarn install --immutable && yarn build)
          (cd packages/discovery/protocol && yarn install --immutable && yarn build)
          (cd packages/discovery/serve && yarn install --immutable && yarn build)
          (cd packages/discovery/testing && yarn install --immutable && yarn build)
          (cd packages/trust/testing && yarn install --immutable && yarn build)
      - name: Restore Marketplace Binding distribution
        uses: actions/download-artifact@v4
        with:
          name: marketplace-binding-dist
          path: packages/marketplace/binding/dist
      - name: Restore Marketplace Projector distribution
        uses: actions/download-artifact@v4
        with:
          name: marketplace-projector-dist
          path: packages/marketplace/projector/dist
      - name: Restore Marketplace Venue Base distribution
        uses: actions/download-artifact@v4
        with:
          name: marketplace-venue-base-dist
          path: packages/marketplace/venue-base/dist
      - name: Install cross-marketplace toolchains (packed-smoke dependencies)
        run: |
          (cd packages/marketplace/binding && yarn install --immutable)
          (cd packages/marketplace/projector && yarn install --immutable)
          (cd packages/marketplace/venue-base && yarn install --immutable)
      - name: Install Marketplace Testing toolchain
        working-directory: packages/marketplace/testing
        run: yarn install --immutable
      - name: Run snapshot-backed marketplace conformance (§13 / M2.5)
        working-directory: packages/marketplace/testing
        run: yarn vitest run src/backend-conformance.test.ts src/escrow-lifecycle.test.ts
      - name: Run the snapshot-backed Anvil venue kit (§6.6)
        working-directory: packages/marketplace/testing
        run: yarn vitest run src/venue-conformance.test.ts src/venue-fork.test.ts

  verify:
    needs: [architecture, binding, projector, pipeline, venue-base, testing, anvil-fork]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every Marketplace CI stage to succeed
        env:
          ARCHITECTURE_RESULT: ${{ needs.architecture.result }}
          BINDING_RESULT: ${{ needs.binding.result }}
          PROJECTOR_RESULT: ${{ needs.projector.result }}
          PIPELINE_RESULT: ${{ needs.pipeline.result }}
          VENUE_BASE_RESULT: ${{ needs.venue-base.result }}
          TESTING_RESULT: ${{ needs.testing.result }}
          ANVIL_FORK_RESULT: ${{ needs.anvil-fork.result }}
        run: |
          for result in \
            "$ARCHITECTURE_RESULT" \
            "$BINDING_RESULT" \
            "$PROJECTOR_RESULT" \
            "$PIPELINE_RESULT" \
            "$VENUE_BASE_RESULT" \
            "$TESTING_RESULT" \
            "$ANVIL_FORK_RESULT"; do
            test "$result" = "success"
          done
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Yarn 4.13.0
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate
      - name: Restore all package distributions
        uses: actions/download-artifact@v4
        with:
          pattern: marketplace-*-dist
          path: .marketplace-dist
      - name: Place package distributions
        run: |
          for package in binding projector pipeline venue-base testing; do
            mkdir -p "packages/marketplace/${package}/dist"
            cp -R ".marketplace-dist/marketplace-${package}-dist/." "packages/marketplace/${package}/dist/"
          done
      - name: Build cross-tree portal dependencies from source (§7.8)
        run: |
          (cd packages/evidence/protocol && yarn install --immutable && yarn build)
          (cd packages/evidence/repository && yarn install --immutable && yarn build)
          (cd packages/evidence/discovery && yarn install --immutable && yarn build)
          (cd packages/evidence/execution-evidence-builder && yarn install --immutable && yarn build)
          (cd packages/evidence/execution-recorder && yarn install --immutable && yarn build)
          (cd packages/task-execution/protocol && yarn install --immutable && yarn build)
          (cd packages/task-execution/backend && yarn install --immutable && yarn build)
          (cd packages/task-execution/profiles && yarn install --immutable && yarn build)
          (cd packages/task-execution/backend-local/supervisor && yarn install --immutable && yarn build)
          (cd packages/task-execution/backend-local/workspace && yarn install --immutable && yarn build)
          (cd packages/task-execution/backend-local/launchers && yarn install --immutable && yarn build)
          (cd packages/task-execution/backend-local/assembly && yarn install --immutable && yarn build)
          (cd packages/task-execution/testing && yarn install --immutable && yarn build)
          (cd packages/trust/core && yarn install --immutable && yarn build)
          (cd packages/trust/resolve && yarn install --immutable && yarn build)
          (cd packages/discovery/protocol && yarn install --immutable && yarn build)
          (cd packages/discovery/serve && yarn install --immutable && yarn build)
          (cd packages/discovery/testing && yarn install --immutable && yarn build)
      - name: Compile packed public entrypoint consumers
        run: node .github/scripts/marketplace-packed-types.test.mjs
