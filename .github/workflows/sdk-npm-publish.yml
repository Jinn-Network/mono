name: SDK npm Publish

on:
  push:
    branches: [next]
    paths:
      - 'operator/**'
      - 'packages/core/**'
      - 'packages/plugin/**'
      - 'packages/sdk/**'
      - '.github/workflows/npm-publish.yml'
      - '.github/workflows/sdk-npm-publish.yml'
  release:
    types: [published]

# Trusted publishing (OIDC): keep this filename registered for
# @jinn-network/sdk.
permissions:
  contents: read
  id-token: write

defaults:
  run:
    working-directory: packages/sdk

jobs:
  publish:
    name: Publish SDK package
    if: github.event_name == 'push' || startsWith(github.event.release.tag_name, 'sdk-v')
    runs-on: ubuntu-latest
    environment: npm-publish
    env:
      JINN_BUILD_COMMIT: ${{ github.sha }}
      ONNXRUNTIME_NODE_INSTALL: skip
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - run: npm install -g npm@11.16.0
      - run: corepack enable
      - run: yarn install --immutable

      - name: Resolve publish metadata
        id: meta
        shell: bash
        run: |
          PACKAGE_VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('package.json','utf8')).version)")
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            PUBLISH_VERSION="${PACKAGE_VERSION}-canary.sha.${JINN_BUILD_COMMIT}"
            DIST_TAG="canary"
          else
            RELEASE_TAG="${{ github.event.release.tag_name }}"
            case "${RELEASE_TAG}" in
              sdk-v*) PUBLISH_VERSION="${RELEASE_TAG#sdk-v}" ;;
              *) echo "::error::Stable SDK releases must use sdk-v<semver>"; exit 1 ;;
            esac
            if [ "${PUBLISH_VERSION}" != "${PACKAGE_VERSION}" ]; then
              echo "::error::Release tag version ${PUBLISH_VERSION} does not match packages/sdk/package.json version ${PACKAGE_VERSION}"
              exit 1
            fi
            DIST_TAG="latest"
          fi
          {
            echo "package_version=${PACKAGE_VERSION}"
            echo "publish_version=${PUBLISH_VERSION}"
            echo "dist_tag=${DIST_TAG}"
          } >> "${GITHUB_OUTPUT}"

      - name: Check immutable canary
        id: existing
        if: steps.meta.outputs.dist_tag == 'canary'
        shell: bash
        env:
          PACKAGE_SPEC: '@jinn-network/sdk@${{ steps.meta.outputs.publish_version }}'
        run: |
          VIEW_ERROR="${RUNNER_TEMP}/sdk-canary-view.stderr"
          if npm view "${PACKAGE_SPEC}" version >/dev/null 2>"${VIEW_ERROR}"; then
            EXISTING_HEAD="$(npm view "${PACKAGE_SPEC}" gitHead)"
            if [ "${EXISTING_HEAD}" != "${JINN_BUILD_COMMIT}" ]; then
              echo "::error::${PACKAGE_SPEC} exists with gitHead ${EXISTING_HEAD}, expected ${JINN_BUILD_COMMIT}"
              exit 1
            fi
            echo "published=true" >> "${GITHUB_OUTPUT}"
            echo "::notice::${PACKAGE_SPEC} already exists at the expected immutable commit"
          elif grep -Eq 'E404|404 Not Found' "${VIEW_ERROR}"; then
            echo "published=false" >> "${GITHUB_OUTPUT}"
          else
            cat "${VIEW_ERROR}" >&2
            echo "::error::Could not determine whether ${PACKAGE_SPEC} already exists"
            exit 1
          fi

      - name: Patch package version for canary publish
        if: steps.meta.outputs.dist_tag == 'canary'
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '${{ steps.meta.outputs.publish_version }}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - run: yarn typecheck
      - run: yarn test
      - run: yarn build
      - run: yarn pack:smoke

      - name: Publish canary
        if: steps.meta.outputs.dist_tag == 'canary' && steps.existing.outputs.published != 'true'
        run: |
          unset NODE_AUTH_TOKEN
          npm publish --access public --tag canary

      - name: Validate canary gitHead
        if: steps.meta.outputs.dist_tag == 'canary'
        shell: bash
        env:
          PACKAGE_SPEC: '@jinn-network/sdk@${{ steps.meta.outputs.publish_version }}'
        run: |
          for _ in $(seq 1 30); do
            PUBLISHED_HEAD="$(npm view "${PACKAGE_SPEC}" gitHead 2>/dev/null || true)"
            if [ "${PUBLISHED_HEAD}" = "${JINN_BUILD_COMMIT}" ]; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::${PACKAGE_SPEC} gitHead did not resolve to ${JINN_BUILD_COMMIT}"
          exit 1

      - name: Publish stable
        if: steps.meta.outputs.dist_tag == 'latest'
        run: |
          unset NODE_AUTH_TOKEN
          npm publish --access public
