# Railway production config-as-code for the jinn-indexer service.
#
# Why this file exists (2026-06-03): the service's build config had drifted in
# the Railway dashboard to the RAILPACK auto-builder. RAILPACK builds from the
# service Root Directory and runs `yarn install`, which cannot resolve the
# RAILPACK auto-builder (which cannot resolve the indexer's portal siblings)
# failed every deploy at the install step, freezing the live indexer on stale
# code while build-failures kept the last-good container serving. Pinning the
# Dockerfile here makes the build reproducible and dashboard-drift-proof.
#
# !! #846 guardrail: this file MUST stay under packages/indexer/deploy/ and the
# service's "Config as code" path MUST point at packages/indexer/deploy/railway.toml.
# A railway.toml at the REPO ROOT is applied by Railway to EVERY monorepo service
# (jinn-worker, jinn-operator-*, claim-relayer, …), overriding their build
# configs — that is exactly what broke the indexer for hours in #846.
#
# Two one-time service settings are NOT expressible in this file (set once in
# the Railway dashboard / API):
#   - Root Directory = /packages  (the Dockerfile's build context: it COPYs the
#     indexer tree and its portal siblings, matching the CI build
#     `docker build -f indexer/deploy/Dockerfile .` run from packages/).
#   - Config as code  = packages/indexer/deploy/railway.toml

[build]
builder = "DOCKERFILE"
# Relative to the service Root Directory (/packages). Verified: a deploy with
# this path built green on 2026-06-03 (commit 71f5960d).
dockerfilePath = "indexer/deploy/Dockerfile"
# Only redeploy when the indexer or its portal SDK dependency changes — not on
# every push to next. Gitignore-style, anchored at the REPO ROOT (per Railway's
# monorepo docs, whose example uses /packages/backend). Base confirmed repo-root
# on 2026-06-03: non-indexer merge #952 was SKIPPED; indexer merge #998 deployed.
watchPatterns = [
  "packages/indexer/**",
  "packages/task-execution/protocol/**",
  "packages/trust/core/**",
  "packages/benchmarking/records/**",
]

[deploy]
# Gate traffic cutover on the new container being caught-up-to-realtime, so a
# redeploy never drops requests. /ready (not /health) because the daemon discovery
# layer probes /ready — gating here keeps the old container serving until the new
# one is /ready, so daemons never hit DiscoveryUnavailableError on a redeploy.
# Verified zero-downtime on 2026-06-03 (deploy b7f25e05: 0 non-200 across the full
# build + cutover). The prior null healthcheck cut over before the process was up —
# the "indexer goes down momentarily on merges" symptom. Timeout is generous so a
# slow resume/catch-up doesn't fail the deploy (raise toward 10800 for a full
# cold-sync; a deploy that never reaches /ready just fails and the old one keeps
# serving — see README §Zero-downtime rolling deploys).
healthcheckPath = "/ready"
healthcheckTimeout = 3600
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
# numReplicas omitted: Railway config-as-code expresses replicas under
# multiRegionConfig, not [deploy], and 1 is the default. True HA (multi-replica
# ponder serve) is follow-up #652.
