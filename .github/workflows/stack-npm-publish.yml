name: Stack npm Publish

# The 50 platform-v1 packages publish as one receipt-bound coherent set. Canary
# publication consumes only the exact tarballs and immutable receipt produced by
# the same run's reusable platform verification workflow.
on:
  push:
    branches: [integration/evidence-v1, next]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Published stack release tag to verify, for example stack-v0.1.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'push' && 'stack-npm-publish-canary' || format('stack-npm-publish-stable-{0}', github.event.release.tag_name || inputs.release_tag) }}
  cancel-in-progress: false

jobs:
  canary-verification:
    if: github.event_name == 'push'
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/platform-verification.yml
    with:
      source_sha: ${{ github.sha }}
      lane: canary
    secrets:
      JINN_MARKETPLACE_FORK_RPC_URL: ${{ secrets.JINN_MARKETPLACE_FORK_RPC_URL }}

  canary-publish:
    name: stack-canary
    needs: canary-verification
    if: github.event_name == 'push' && needs.canary-verification.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Verify exact publication checkout
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install npm 11.19.0
        run: npm install -g npm@11.19.0
      - name: Download same-run prepublication artifacts
        uses: actions/download-artifact@v4
        with:
          name: platform-verification-artifacts
          path: .platform-verification
      - name: Download same-run verification receipt
        uses: actions/download-artifact@v4
        with:
          name: platform-verification-receipt
          path: .platform-verification-receipt
      - name: Verify provenance and publish receipt-bound canary
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          node .github/scripts/publish-verified-platform.mjs \
            --verification-root .platform-verification \
            --verification-receipt .platform-verification-receipt/verification-receipt.json \
            --source-sha "${SOURCE_SHA}" \
            --release-group platform-v1 \
            --lane canary \
            --registry https://registry.npmjs.org/ \
            --repository "${GITHUB_REPOSITORY}" \
            --out .platform-publication/publication-receipt.json
      - name: Attest final publication receipt
        uses: actions/attest@v4
        with:
          subject-path: .platform-publication/publication-receipt.json
      - name: Upload final publication receipt
        uses: actions/upload-artifact@v4
        with:
          name: platform-publication-receipt
          path: .platform-publication/publication-receipt.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

  resolve-stable-source:
    if: >-
      (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'stack-v')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.event.release.tag_name }}
    steps:
      - name: Require a stack semantic-version tag
        run: |
          if ! [[ "${RELEASE_TAG}" =~ ^stack-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Stable verification requires stack-v<semver>, got ${RELEASE_TAG}"
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install npm 11.19.0 for the read-only fixture baseline
        run: npm install -g npm@11.19.0
      - name: Resolve immutable stable verification source
        id: source
        run: |
          set -euo pipefail
          TAG_SHA="$(git ls-remote origin "refs/tags/${RELEASE_TAG}" | awk '{print $1}' | head -n1)"
          if [ -z "${TAG_SHA}" ]; then
            echo "::error::Release tag ${RELEASE_TAG} does not exist on origin"
            exit 1
          fi
          PEELED="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          RESOLVED="$(git rev-parse "${TAG_SHA}^{commit}")"
          CHECKED_OUT="$(git rev-parse HEAD)"
          if [ "${PEELED}" != "${RESOLVED}" ] || [ "${CHECKED_OUT}" != "${RESOLVED}" ]; then
            echo "::error::Release tag ${RELEASE_TAG}, origin, and checked-out HEAD do not peel to one commit"
            exit 1
          fi
          TAG_VERSION="${RELEASE_TAG#stack-v}"
          PLATFORM_VERSION="$(node --input-type=module <<'NODE'
          import { loadCatalogPackages } from './.github/scripts/platform-catalog.mjs';
          const versions = new Set(loadCatalogPackages(process.cwd(), { releaseGroup: 'platform-v1' })
            .map(({ manifest }) => manifest.version));
          if (versions.size !== 1) throw new Error(`platform-v1 package versions disagree: ${[...versions].join(', ')}`);
          process.stdout.write([...versions][0]);
          NODE
          )"
          if [ "${PLATFORM_VERSION}" != "${TAG_VERSION}" ]; then
            echo "::error::Release tag ${RELEASE_TAG} names ${TAG_VERSION}, but platform-v1 is ${PLATFORM_VERSION}"
            exit 1
          fi
          echo "TAG_VERSION=${TAG_VERSION}" >> "${GITHUB_ENV}"
          echo "source_sha=${CHECKED_OUT}" >> "${GITHUB_OUTPUT}"
      - name: Verify stable fixture immutability baseline
        run: >-
          node .github/scripts/fixture-immutability.mjs
          --registry-baseline
          --version "${TAG_VERSION}"

  stable-verification:
    needs: resolve-stable-source
    if: needs.resolve-stable-source.result == 'success'
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/platform-verification.yml
    with:
      source_sha: ${{ needs.resolve-stable-source.outputs.source_sha }}
      lane: stable
    secrets:
      JINN_MARKETPLACE_FORK_RPC_URL: ${{ secrets.JINN_MARKETPLACE_FORK_RPC_URL }}

  stable-hosting-blocker:
    name: Stable publication disabled — live profile host verification blocker
    needs: stable-verification
    if: >-
      always() &&
      ((github.event_name == 'release' && startsWith(github.event.release.tag_name, 'stack-v')) ||
      github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Keep Phase A stable publication mechanically disabled
        run: |
          echo "::error::Stable package publication remains disabled in Phase A until live profile host verification is implemented."
          exit 1
