name: Evidence CI

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
  pull_request:
  push:
    branches: [next]
    paths:
      - "packages/evidence/**"
      - ".github/scripts/evidence-*.test.mjs"
      - ".github/workflows/evidence-ci.yml"
      - "docs/superpowers/specs/2026-07-23-jinn-execution-evidence-protocol-design.md"
      - "docs/superpowers/specs/2026-07-24-jinn-attestation-issuer-design.md"
      - "docs/superpowers/specs/2026-07-26-evidence-retrieval-design.md"
      - "docs/superpowers/plans/2026-07-27-evidence-retrieval.md"
      - "docs/superpowers/specs/2026-07-26-evidence-contribution-design.md"
      - "docs/superpowers/plans/2026-07-27-evidence-contribution.md"
      - "docs/superpowers/specs/2026-07-30-plugin-stack-reconciliation-design.md"
      - "docs/superpowers/plans/2026-07-30-plugin-c1-trajectory-record.md"
      - "docs/superpowers/plans/2026-07-30-plugin-c2-trace-decode.md"

permissions:
  contents: read

env:
  EVIDENCE_ROOT: packages/evidence

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
      - name: Verify Evidence CI toolchain pins
        run: node --test .github/scripts/evidence-ci-workflow.test.mjs
      - name: Verify package inventory and dependency graph
        run: node --test .github/scripts/evidence-package-inventory.test.mjs
      - name: Verify source boundaries and canaries
        run: node --test .github/scripts/evidence-source-boundaries.test.mjs

  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
      - name: Enable Yarn 4.13.0
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate
      - name: Install npm 11.19.0 for pack-smoke
        run: |
          npm install -g npm@11.19.0
          echo "$(npm prefix -g)/bin" >> "$GITHUB_PATH"
          hash -r || true
          test "$(npm --version)" = "11.19.0"
          command -v npm
          npm --version
      - name: Verify Evidence Protocol
        working-directory: packages/evidence/protocol
        run: |
          yarn install --immutable
          yarn check:profile
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Upload Evidence Protocol distribution
        uses: actions/upload-artifact@v4
        with:
          name: evidence-protocol-dist
          path: packages/evidence/protocol/dist
          if-no-files-found: error
          retention-days: 1
      - name: Verify Evidence Repository
        working-directory: packages/evidence/repository
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Upload Evidence Repository distribution
        uses: actions/upload-artifact@v4
        with:
          name: evidence-repository-dist
          path: packages/evidence/repository/dist
          if-no-files-found: error
          retention-days: 1

  components:
    name: component (${{ matrix.component }})
    needs: foundation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component:
          - repository-oci
          - repository-ipfs
          - discovery
          - execution-recorder
          - attestation-issuer
          - publication
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
      - name: Enable Yarn 4.13.0
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate
      - name: Install npm 11.19.0 for pack-smoke
        run: |
          npm install -g npm@11.19.0
          echo "$(npm prefix -g)/bin" >> "$GITHUB_PATH"
          hash -r || true
          test "$(npm --version)" = "11.19.0"
          command -v npm
          npm --version
      - name: Restore Evidence Protocol distribution
        uses: actions/download-artifact@v4
        with:
          name: evidence-protocol-dist
          path: packages/evidence/protocol/dist
      - name: Restore Evidence Repository distribution
        uses: actions/download-artifact@v4
        with:
          name: evidence-repository-dist
          path: packages/evidence/repository/dist
      - name: Install packed-smoke dependency toolchains
        run: |
          (cd packages/evidence/protocol && yarn install --immutable)
          (cd packages/evidence/repository && yarn install --immutable)
      - name: Install ORAS 1.3.2
        if: matrix.component == 'repository-oci'
        uses: oras-project/setup-oras@v2
        with:
          version: 1.3.2
      - name: Start Distribution registry
        if: matrix.component == 'repository-oci'
        run: |
          for attempt in $(seq 1 3); do
            if docker pull registry:3.0.0; then
              break
            fi
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            sleep "$((attempt * 5))"
          done
          docker run --detach --name jinn-evidence-registry \
            --publish 5000:5000 registry:3.0.0
      - name: Install immutable dependencies
        working-directory: packages/evidence/${{ matrix.component }}
        run: yarn install --immutable
      - name: Check profile and schema drift
        if: matrix.component == 'repository-oci' || matrix.component == 'repository-ipfs'
        working-directory: packages/evidence/${{ matrix.component }}
        run: yarn check:profile
      - name: Typecheck
        working-directory: packages/evidence/${{ matrix.component }}
        run: yarn typecheck
      - name: Test
        working-directory: packages/evidence/${{ matrix.component }}
        run: yarn test
      - name: Test Kubo compatibility and Repository contract
        if: matrix.component == 'repository-ipfs'
        working-directory: packages/evidence/repository-ipfs
        run: yarn test:kubo
      - name: Build
        working-directory: packages/evidence/${{ matrix.component }}
        run: yarn build
      - name: Smoke-test packed distribution
        working-directory: packages/evidence/${{ matrix.component }}
        run: yarn pack:smoke
      - name: Wait for Distribution registry
        if: matrix.component == 'repository-oci'
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:5000/v2/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Distribution registry was not ready after ${attempt} attempts."
          exit 1
      - name: Test ORAS registry round trip
        if: matrix.component == 'repository-oci'
        working-directory: packages/evidence/repository-oci
        env:
          JINN_OCI_REGISTRY_TEST: "1"
          JINN_OCI_TEST_REPOSITORY: localhost:5000/jinn/evidence
          ORAS_PATH: oras
        run: yarn test:registry
      - name: Upload component distribution
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.component }}-dist
          path: packages/evidence/${{ matrix.component }}/dist
          if-no-files-found: error
          retention-days: 1

  derivation:
    name: Derivation
    needs: foundation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
      - name: Enable Yarn 4.13.0
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate
      - name: Install npm 11.19.0 for pack-smoke
        run: |
          npm install -g npm@11.19.0
          echo "$(npm prefix -g)/bin" >> "$GITHUB_PATH"
          hash -r || true
          test "$(npm --version)" = "11.19.0"
          command -v npm
          npm --version
      - name: Restore Evidence Protocol distribution
        uses: actions/download-artifact@v4
        with:
          name: evidence-protocol-dist
          path: packages/evidence/protocol/dist
      - name: Install packed-smoke dependency toolchain
        working-directory: packages/evidence/protocol
        run: yarn install --immutable
      - name: Verify complete Derivation package
        working-directory: packages/evidence/derivation
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Upload Derivation distribution
        uses: actions/upload-artifact@v4
        with:
          name: evidence-derivation-dist
          path: packages/evidence/derivation/dist
          if-no-files-found: error
          retention-days: 1

  execution-recorder-bridge:
    needs: [foundation, components]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
      - name: Enable Yarn 4.13.0
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate
      - name: Install npm 11.19.0 for pack-smoke
        run: |
          npm install -g npm@11.19.0
          echo "$(npm prefix -g)/bin" >> "$GITHUB_PATH"
          hash -r || true
          test "$(npm --version)" = "11.19.0"
          command -v npm
          npm --version
      - name: Restore Evidence Protocol distribution
        uses: actions/download-artifact@v4
        with:
          name: evidence-protocol-dist
          path: packages/evidence/protocol/dist
      - name: Restore Evidence Repository distribution
        uses: actions/download-artifact@v4
        with:
          name: evidence-repository-dist
          path: packages/evidence/repository/dist
      - name: Restore Execution Recorder distribution
        uses: actions/download-artifact@v4
        with:
          name: evidence-execution-recorder-dist
          path: packages/evidence/execution-recorder/dist
      - name: Install packed-smoke dependency toolchains
        run: |
          (cd packages/evidence/protocol && yarn install --immutable)
          (cd packages/evidence/repository && yarn install --immutable)
          (cd packages/evidence/execution-recorder && yarn install --immutable)
      - name: Verify Execution Recorder Bridge
        working-directory: packages/evidence/execution-recorder-bridge
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Upload Execution Recorder Bridge distribution
        uses: actions/upload-artifact@v4
        with:
          name: evidence-execution-recorder-bridge-dist
          path: packages/evidence/execution-recorder-bridge/dist
          if-no-files-found: error
          retention-days: 1

  retrieval:
    name: Evidence Retrieval
    needs: [foundation, components]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
      - name: Enable Yarn 4.13.0
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate
      - name: Install npm 11.19.0 for pack-smoke
        run: |
          npm install -g npm@11.19.0
          echo "$(npm prefix -g)/bin" >> "$GITHUB_PATH"
          hash -r || true
          test "$(npm --version)" = "11.19.0"
          command -v npm
          npm --version
      - name: Restore Evidence Protocol distribution
        uses: actions/download-artifact@v4
        with:
          name: evidence-protocol-dist
          path: packages/evidence/protocol/dist
      - name: Restore Evidence Repository distribution
        uses: actions/download-artifact@v4
        with:
          name: evidence-repository-dist
          path: packages/evidence/repository/dist
      - name: Restore Evidence Discovery distribution
        uses: actions/download-artifact@v4
        with:
          name: evidence-discovery-dist
          path: packages/evidence/discovery/dist
      - name: Install packed-smoke dependency toolchains
        run: |
          (cd packages/evidence/protocol && yarn install --immutable)
          (cd packages/evidence/repository && yarn install --immutable)
          (cd packages/evidence/discovery && yarn install --immutable)
      - name: Verify Evidence Retrieval
        working-directory: packages/evidence/retrieval
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Upload Evidence Retrieval distribution
        uses: actions/upload-artifact@v4
        with:
          name: evidence-retrieval-dist
          path: packages/evidence/retrieval/dist
          if-no-files-found: error
          retention-days: 1

  trace:
    name: Evidence Trace
    needs: [foundation]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
      - name: Enable Yarn 4.13.0
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate
      - name: Install npm 11.19.0 for pack-smoke
        run: |
          npm install -g npm@11.19.0
          echo "$(npm prefix -g)/bin" >> "$GITHUB_PATH"
          hash -r || true
          test "$(npm --version)" = "11.19.0"
          command -v npm
          npm --version
      - name: Restore Evidence Protocol distribution
        uses: actions/download-artifact@v4
        with:
          name: evidence-protocol-dist
          path: packages/evidence/protocol/dist
      - name: Build Trust Core distribution
        working-directory: packages/trust/core
        run: |
          yarn install --immutable
          yarn build
      - name: Install packed-smoke dependency toolchains
        run: (cd packages/evidence/protocol && yarn install --immutable)
      - name: Verify Evidence Trace
        working-directory: packages/evidence/trace
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn check:fixtures
          yarn check:schemas
          yarn pack:smoke
      - name: Upload Evidence Trace distribution
        uses: actions/upload-artifact@v4
        with:
          name: evidence-trace-dist
          path: packages/evidence/trace/dist
          if-no-files-found: error
          retention-days: 1

  trace-decode:
    name: Evidence Trace Decode
    needs: [foundation, trace]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
      - name: Enable Yarn 4.13.0
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate
      - name: Install npm 11.19.0 for pack-smoke
        run: |
          npm install -g npm@11.19.0
          echo "$(npm prefix -g)/bin" >> "$GITHUB_PATH"
          hash -r || true
          test "$(npm --version)" = "11.19.0"
          command -v npm
          npm --version
      - name: Restore Evidence Protocol distribution
        uses: actions/download-artifact@v4
        with:
          name: evidence-protocol-dist
          path: packages/evidence/protocol/dist
      - name: Restore Evidence Trace distribution
        uses: actions/download-artifact@v4
        with:
          name: evidence-trace-dist
          path: packages/evidence/trace/dist
      - name: Build Trust Core distribution
        working-directory: packages/trust/core
        run: |
          yarn install --immutable
          yarn build
      - name: Install packed-smoke dependency toolchains
        run: |
          (cd packages/evidence/protocol && yarn install --immutable)
          (cd packages/evidence/trace && yarn install --immutable)
      - name: Verify Evidence Trace Decode
        working-directory: packages/evidence/trace-decode
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn check:fixtures
          yarn pack:smoke
      - name: Upload Evidence Trace Decode distribution
        uses: actions/upload-artifact@v4
        with:
          name: evidence-trace-decode-dist
          path: packages/evidence/trace-decode/dist
          if-no-files-found: error
          retention-days: 1

  contribution:
    name: Evidence Contribution
    needs: [foundation, components, derivation]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
      - name: Enable Yarn 4.13.0
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate
      - name: Install npm 11.19.0 for pack-smoke
        run: |
          npm install -g npm@11.19.0
          echo "$(npm prefix -g)/bin" >> "$GITHUB_PATH"
          hash -r || true
          test "$(npm --version)" = "11.19.0"
          command -v npm
          npm --version
      - name: Restore Evidence Protocol distribution
        uses: actions/download-artifact@v4
        with:
          name: evidence-protocol-dist
          path: packages/evidence/protocol/dist
      - name: Restore Evidence Repository distribution
        uses: actions/download-artifact@v4
        with:
          name: evidence-repository-dist
          path: packages/evidence/repository/dist
      - name: Restore Evidence Derivation distribution
        uses: actions/download-artifact@v4
        with:
          name: evidence-derivation-dist
          path: packages/evidence/derivation/dist
      - name: Restore Evidence Publication distribution
        uses: actions/download-artifact@v4
        with:
          name: evidence-publication-dist
          path: packages/evidence/publication/dist
      - name: Install packed-smoke dependency toolchains
        run: |
          (cd packages/evidence/protocol && yarn install --immutable)
          (cd packages/evidence/repository && yarn install --immutable)
          (cd packages/evidence/derivation && yarn install --immutable)
          (cd packages/evidence/publication && yarn install --immutable)
      - name: Verify Evidence Contribution
        working-directory: packages/evidence/contribution
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Upload Evidence Contribution distribution
        uses: actions/upload-artifact@v4
        with:
          name: evidence-contribution-dist
          path: packages/evidence/contribution/dist
          if-no-files-found: error
          retention-days: 1

  catalog-sqlite:
    needs: [foundation, components]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
      - name: Enable Yarn 4.13.0
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate
      - name: Install npm 11.19.0 for pack-smoke
        run: |
          npm install -g npm@11.19.0
          echo "$(npm prefix -g)/bin" >> "$GITHUB_PATH"
          hash -r || true
          test "$(npm --version)" = "11.19.0"
          command -v npm
          npm --version
      - name: Restore Evidence Protocol distribution
        uses: actions/download-artifact@v4
        with:
          name: evidence-protocol-dist
          path: packages/evidence/protocol/dist
      - name: Restore Evidence Repository distribution
        uses: actions/download-artifact@v4
        with:
          name: evidence-repository-dist
          path: packages/evidence/repository/dist
      - name: Restore Evidence Discovery distribution
        uses: actions/download-artifact@v4
        with:
          name: evidence-discovery-dist
          path: packages/evidence/discovery/dist
      - name: Install packed-smoke dependency toolchains
        run: |
          (cd packages/evidence/protocol && yarn install --immutable)
          (cd packages/evidence/repository && yarn install --immutable)
          (cd packages/evidence/discovery && yarn install --immutable)
      - name: Verify SQLite Evidence Catalog
        working-directory: packages/evidence/catalog-sqlite
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Upload SQLite Evidence Catalog distribution
        uses: actions/upload-artifact@v4
        with:
          name: evidence-catalog-sqlite-dist
          path: packages/evidence/catalog-sqlite/dist
          if-no-files-found: error
          retention-days: 1

  local-runtime:
    needs: [foundation, components, catalog-sqlite]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
      - name: Enable Yarn 4.13.0
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate
      - name: Install npm 11.19.0 for pack-smoke
        run: |
          npm install -g npm@11.19.0
          echo "$(npm prefix -g)/bin" >> "$GITHUB_PATH"
          hash -r || true
          test "$(npm --version)" = "11.19.0"
          command -v npm
          npm --version
      - name: Restore Evidence Protocol distribution
        uses: actions/download-artifact@v4
        with:
          name: evidence-protocol-dist
          path: packages/evidence/protocol/dist
      - name: Restore Evidence Repository distribution
        uses: actions/download-artifact@v4
        with:
          name: evidence-repository-dist
          path: packages/evidence/repository/dist
      - name: Restore Evidence Discovery distribution
        uses: actions/download-artifact@v4
        with:
          name: evidence-discovery-dist
          path: packages/evidence/discovery/dist
      - name: Restore Execution Recorder distribution
        uses: actions/download-artifact@v4
        with:
          name: evidence-execution-recorder-dist
          path: packages/evidence/execution-recorder/dist
      - name: Restore SQLite Evidence Catalog distribution
        uses: actions/download-artifact@v4
        with:
          name: evidence-catalog-sqlite-dist
          path: packages/evidence/catalog-sqlite/dist
      - name: Build Record Discovery bridge dependencies from source
        run: |
          (cd packages/trust/core && yarn install --immutable && yarn build)
          (cd packages/discovery/protocol && yarn install --immutable && yarn build)
          (cd packages/discovery/serve && yarn install --immutable && yarn build)
          (cd packages/discovery/sources/evidence-journal && yarn install --immutable && yarn build)
      - name: Install packed-smoke dependency toolchains
        run: |
          (cd packages/evidence/protocol && yarn install --immutable)
          (cd packages/evidence/repository && yarn install --immutable)
          (cd packages/evidence/discovery && yarn install --immutable)
          (cd packages/evidence/catalog-sqlite && yarn install --immutable)
          (cd packages/evidence/execution-recorder && yarn install --immutable)
      - name: Verify Local Evidence Runtime
        working-directory: packages/evidence/local-runtime
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Upload Local Evidence Runtime distribution
        uses: actions/upload-artifact@v4
        with:
          name: evidence-local-runtime-dist
          path: packages/evidence/local-runtime/dist
          if-no-files-found: error
          retention-days: 1

  verify:
    needs: [architecture, foundation, components, derivation, execution-recorder-bridge, retrieval, contribution, catalog-sqlite, local-runtime, trace, trace-decode]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every Evidence CI stage to succeed
        env:
          ARCHITECTURE_RESULT: ${{ needs.architecture.result }}
          FOUNDATION_RESULT: ${{ needs.foundation.result }}
          COMPONENTS_RESULT: ${{ needs.components.result }}
          DERIVATION_RESULT: ${{ needs.derivation.result }}
          EXECUTION_RECORDER_BRIDGE_RESULT: ${{ needs['execution-recorder-bridge'].result }}
          RETRIEVAL_RESULT: ${{ needs.retrieval.result }}
          CONTRIBUTION_RESULT: ${{ needs.contribution.result }}
          CATALOG_SQLITE_RESULT: ${{ needs['catalog-sqlite'].result }}
          LOCAL_RUNTIME_RESULT: ${{ needs['local-runtime'].result }}
          TRACE_RESULT: ${{ needs.trace.result }}
          TRACE_DECODE_RESULT: ${{ needs['trace-decode'].result }}
        run: |
          for result in \
            "$ARCHITECTURE_RESULT" \
            "$FOUNDATION_RESULT" \
            "$COMPONENTS_RESULT" \
            "$DERIVATION_RESULT" \
            "$EXECUTION_RECORDER_BRIDGE_RESULT" \
            "$RETRIEVAL_RESULT" \
            "$CONTRIBUTION_RESULT" \
            "$CATALOG_SQLITE_RESULT" \
            "$LOCAL_RUNTIME_RESULT" \
            "$TRACE_RESULT" \
            "$TRACE_DECODE_RESULT"; do
            test "$result" = "success"
          done
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
      - name: Enable Yarn 4.13.0
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate
      - name: Restore all package distributions
        uses: actions/download-artifact@v4
        with:
          pattern: evidence-*-dist
          path: .evidence-dist
      - name: Place package distributions
        run: |
          for package in protocol repository repository-oci repository-ipfs discovery catalog-sqlite execution-recorder attestation-issuer derivation publication local-runtime execution-recorder-bridge retrieval contribution trace trace-decode; do
            mkdir -p "packages/evidence/${package}/dist"
            cp -R ".evidence-dist/evidence-${package}-dist/." "packages/evidence/${package}/dist/"
          done
      - name: Compile packed public entrypoint consumers
        run: node .github/scripts/evidence-packed-types.test.mjs
