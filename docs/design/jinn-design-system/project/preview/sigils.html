<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../foundations.css">
<style>
  body { padding: 32px 24px; margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-mono); }
  .wrap { display: grid; grid-template-columns: repeat(5, 1fr); gap: 20px; }
  .cell {
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    padding: 24px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--bg-elevated);
  }
  .sigil { color: var(--fg); display: block; }
  .name { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg-muted); }
  .wordmark { grid-column: span 2; }
  .wordmark .sigil { width: 180px; height: auto; }
  .note { margin-top: 20px; font-size: 10px; letter-spacing: 0.08em; color: var(--fg-dim); text-transform: uppercase; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="cell">
      <svg class="sigil" width="64" height="64" viewBox="0 0 120 120" fill="none">
        <circle cx="60" cy="60" r="44" stroke="currentColor" stroke-width="2" fill="none"/>
        <path d="M60 22 L97 86 L23 86 Z" stroke="currentColor" stroke-width="2" fill="none"/>
        <line x1="16" y1="60" x2="104" y2="60" stroke="currentColor" stroke-width="2"/>
        <circle cx="60" cy="60" r="3" fill="currentColor"/>
      </svg>
      <div class="name">vessel</div>
    </div>
    <div class="cell">
      <svg class="sigil" width="64" height="64" viewBox="0 0 120 120" fill="none">
        <path d="M60 100 L60 60 Q60 45 50 35 M60 60 Q60 45 70 35 M60 60 Q60 50 60 30" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
        <line x1="30" y1="100" x2="90" y2="100" stroke="currentColor" stroke-width="2"/>
        <circle cx="60" cy="22" r="2.5" fill="currentColor"/>
      </svg>
      <div class="name">smoke</div>
    </div>
    <div class="cell">
      <svg class="sigil" width="64" height="64" viewBox="0 0 120 120" fill="none">
        <circle cx="38" cy="60" r="18" stroke="currentColor" stroke-width="2" fill="none"/>
        <circle cx="82" cy="60" r="18" stroke="currentColor" stroke-width="2" fill="none"/>
        <line x1="56" y1="60" x2="64" y2="60" stroke="currentColor" stroke-width="2"/>
      </svg>
      <div class="name">binding</div>
    </div>
    <div class="cell">
      <svg class="sigil" width="64" height="64" viewBox="0 0 120 120" fill="none">
        <rect x="28" y="28" width="64" height="64" stroke="currentColor" stroke-width="2" fill="none"/>
        <circle cx="60" cy="60" r="6" fill="currentColor"/>
      </svg>
      <div class="name">node</div>
    </div>
    <div class="cell wordmark">
      <svg class="sigil" viewBox="0 0 220 60" fill="none">
        <g transform="translate(0,6)">
          <circle cx="24" cy="24" r="22" stroke="currentColor" stroke-width="1.5" fill="none"/>
          <path d="M24 5 L42.5 37 L5.5 37 Z" stroke="currentColor" stroke-width="1.5" fill="none"/>
          <line x1="2" y1="24" x2="46" y2="24" stroke="currentColor" stroke-width="1.5"/>
          <circle cx="24" cy="24" r="1.6" fill="currentColor"/>
        </g>
        <text x="60" y="40" font-family="Instrument Serif, Times New Roman, serif" font-size="42" font-style="italic" fill="currentColor" letter-spacing="0.5">jinn</text>
      </svg>
      <div class="name">wordmark</div>
    </div>
  </div>
  <div class="note">Sigils inherit <code style="font-family:var(--font-mono)">currentColor</code> — drop them into any surface and they pick up the local foreground.</div>
</body>
</html>
