      # This package links packages/indexer by portal, so its lockfile holds
      # the indexer's declared drizzle-orm range next to this package's own
      # exact pin, and the two have to resolve to one version. A bump of the
      # pin alone leaves two versions and `yarn install --immutable` fails with
      # YN0071 (issue #5041). The pin moves by hand, in one change with this
      # lockfile (and with the indexer's range, when the new version falls
      # outside it). This holds every update type.
      # Lift: remove when this package no longer links packages/indexer by
      # portal.
      - dependency-name: "drizzle-orm"
        update-types: ["version-update:semver-patch", "version-update:semver-minor", "version-update:semver-major"]

