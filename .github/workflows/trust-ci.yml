name: Trust CI

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
  pull_request:
    paths:
      - "packages/trust/**"
      - ".github/scripts/trust-*.test.mjs"
      - ".github/workflows/trust-ci.yml"
      - "docs/superpowers/specs/2026-07-27-trust-and-identity-layer-design.md"
      - "docs/superpowers/specs/2026-08-17-pluggable-integrity-providers-design.md"
  push:
    branches: [next]
    paths:
      - "packages/trust/**"
      - ".github/scripts/trust-*.test.mjs"
      - ".github/workflows/trust-ci.yml"
      - "docs/superpowers/specs/2026-07-27-trust-and-identity-layer-design.md"
      - "docs/superpowers/specs/2026-08-17-pluggable-integrity-providers-design.md"

permissions:
  contents: read

env:
  TRUST_ROOT: packages/trust

# Consolidated per #2997: the previous shape ran one runner job per package
# (foundation/resolve/authoring/observation/testing) chained through
# upload-artifact/download-artifact dist round-trips, plus a verify collector.
# Under the merge queue's free-plan 20-slot runner pool that fan-out was almost
# entirely queue-wait (measured 2026-08-26: PAC battery 96 jobs, 96 run-min,
# 627 wait-min). The packages job below builds the same packages with the same
# five commands each, in dependency order in ONE workspace: same coverage, one
# slot, no artifact round-trips, cross-tree portals built once.
#
# The per-job isolation this retires (each job restored only its declared
# dists) was a de-facto undeclared-dependency guard. That invariant is owned
# by trust-source-boundaries.test.mjs in the architecture job, verified to
# reject an undeclared cross-tree import (#2997 pilot).
jobs:
  architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify package inventory and dependency graph
        run: node --test .github/scripts/trust-package-inventory.test.mjs
      - name: Verify source boundaries and canaries
        run: node --test .github/scripts/trust-source-boundaries.test.mjs

  packages:
    name: Trust packages
    runs-on: ubuntu-latest
    # A hung step must not hold a runner slot for the 360-minute default nor
    # burn the queue's 180-minute check-response budget. Serial green runs of
    # this job land well under 20 minutes; the bound is generous headroom.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
      - name: Pin npm for packed-consumer smoke coverage
        run: npm install --global npm@11.19.0 --no-audit --no-fund
      - name: Enable Yarn 4.13.0
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate
      - name: Verify Trust Core
        working-directory: packages/trust/core
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Build cross-tree portal dependency from source (evidence-protocol, §7.8)
        working-directory: packages/evidence/protocol
        run: |
          yarn install --immutable
          yarn build
      - name: Build cross-tree portal dependency from source (task-execution-protocol, §7.8, Task T17)
        working-directory: packages/task-execution/protocol
        run: |
          yarn install --immutable
          yarn build
      - name: Build cross-tree portal dependency from source (record-discovery-protocol, §7.8)
        working-directory: packages/discovery/protocol
        run: |
          yarn install --immutable
          yarn build
      - name: Build cross-tree portal dependency from source (task-execution-profiles, §7.8)
        working-directory: packages/task-execution/profiles
        run: |
          yarn install --immutable
          yarn build
      - name: Verify Trust Resolve
        working-directory: packages/trust/resolve
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Verify Trust Authoring
        working-directory: packages/trust/authoring
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Verify Trust Observation
        working-directory: packages/trust/observation
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Verify complete Trust Testing package
        working-directory: packages/trust/testing
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Compile packed public entrypoint consumers
        run: node .github/scripts/trust-packed-types.test.mjs
