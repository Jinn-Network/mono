name: Repository structure

on:
  pull_request:
  merge_group:
  push:
    branches: [main, next]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    # Push-lane dedup probe (#2996): a queue landing is the byte-identical
    # commit its merge_group build verified, so a completed successful
    # `repo-structure-gate` check-run on this exact SHA proves all five
    # structure jobs already executed against this tree. Probing the GATE name
    # is sound HERE because this workflow has no merge-group selection: the
    # gate only reports success after every worker ran (if selection is ever
    # added to the merge_group lane, switch this probe to the worker names -
    # see hermetic-gate.yml). This job is IDENTITY-ONLY: every event other
    # than a push to next selects the full run, and it must never grow a diff
    # arm - this required context carries no path filtering.
    name: repo-structure-changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
    outputs:
      run: ${{ steps.select.outputs.run }}
    steps:
      - name: Probe for a same-SHA merge-group verdict
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" != push ]; then
            echo 'run=true' >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [ "${GITHUB_REF:-}" = 'refs/heads/next' ] && [ "${GITHUB_RUN_ATTEMPT:-1}" = '1' ]; then
            verified="$(gh api -X GET "repos/${GITHUB_REPOSITORY:-}/commits/${GITHUB_SHA:-}/check-runs" \
              -f check_name='repo-structure-gate' -f status=completed -f per_page=100 \
              --jq '[.check_runs[] | select(.conclusion == "success")] | length' \
              2>/dev/null || echo 0)"
            case "${verified}" in
              *[!0-9]*|'') verified=0 ;;
            esac
            if [ "${verified}" -gt 0 ]; then
              echo "::notice::repo-structure-gate already passed on this SHA in its merge_group build; deduplicating the push-lane run (#2996)"
              echo 'run=false' >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            echo "::notice::no completed successful repo-structure-gate check-run found on this SHA; running in full"
          fi
          echo 'run=true' >> "${GITHUB_OUTPUT}"

  gitlinks:
    name: Gitlink metadata
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --test .github/scripts/repository-gitlinks.test.mjs
      - name: Docs key guard
        run: node --test .github/scripts/docs-key-guard.test.mjs
      - name: Demo-1 sealed pre-run artifacts
        run: node --test .github/scripts/demo1-historical-artifacts.test.mjs
      - name: Autopilot fail-closed resolution
        run: node --test .github/scripts/resolve-autopilot.test.mjs
      - name: Every script test is workflow-wired
        run: node --test .github/scripts/workflow-script-tests.test.mjs
      - name: Published-artifacts-smoke workflow shape
        run: node --test .github/scripts/published-artifacts-smoke-workflow.test.mjs
      - name: Vitest temp-directory sweep seam is wired everywhere
        run: node --test .github/scripts/vitest-tmp-isolation.test.mjs
      # Repository-wide, so it must not sit behind any one workflow's `paths:`
      # filter: the pull request that removes a cited workflow's restores has to
      # be the one that goes red (#3126).
      - name: Every by-name-restore precedent citation is still true
        run: node --test .github/scripts/workflow-precedent-citations.test.mjs
  identifier-origin:
    name: Identifier origin tripwire
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    # DR-2026-08-04 moved the protocol identifier origin to spec.jinn.network. The re-seal
    # was lawful only because nothing had ever been published; once a document is served the
    # apex spelling can never come back. This gate is what keeps it from creeping back in.
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --test .github/scripts/origin-tripwire.test.mjs
      - name: No retired identifier origin in enforced source scopes
        run: node .github/scripts/origin-tripwire.mjs
  evidence-architecture:
    name: Evidence package architecture
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: |
          node --test \
            .github/scripts/evidence-package-inventory.test.mjs \
            .github/scripts/evidence-source-boundaries.test.mjs
  workflow-selection:
    name: Workflow selection shell
    # This test executes the `changes` job scripts of other workflows
    # (DR-2026-08-18-b D3/D6), so it cannot sit behind any of their *diff-based*
    # selection gates: an edit to one lane's script would then go unexercised on
    # exactly the diffs that leave that lane unselected. It runs on every
    # pull_request and merge_group event. The one gate it does sit behind is
    # this workflow's own push-lane dedup probe (#2996), which is SHA-identity,
    # never path selection: it skips only when a completed successful
    # repo-structure-gate - which includes this job - already covers the
    # byte-identical landed commit.
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --test .github/scripts/workflow-selection-shell.test.mjs
  skills-mirror:
    name: Skills mirror
    # Behind the same push-lane dedup probe as every other worker: the gate
    # asserts `skipped` for all of them when the probe unselects, so an
    # ungated job here would fail the gate on every deduplicated push (#2996).
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Skill-mirror unit tests
        run: node --test scripts/sync-skills.test.mjs
      - name: Fail on generated skill-mirror drift
        run: ./scripts/sync-skills.sh --check
  repo-structure-gate:
    # The check-run name GitHub reports is this job's display `name:` below, and that
    # string is the required-status-check context registered on the `next` ruleset
    # (DR-2026-08-18-b D3) — keep them in sync.
    name: repo-structure-gate
    needs:
      [changes, gitlinks, identifier-origin, evidence-architecture, workflow-selection, skills-mirror]
    if: always()
    runs-on: ubuntu-latest
    # One `test` per upstream result. The bound keeps a wedged runner from
    # holding the required context open for the 360-minute default.
    timeout-minutes: 5
    steps:
      - name: Require exact success from every structure job unless dedup unselected them
        env:
          SELECTED: ${{ needs.changes.outputs.run }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          GITLINKS_RESULT: ${{ needs.gitlinks.result }}
          IDENTIFIER_ORIGIN_RESULT: ${{ needs.identifier-origin.result }}
          EVIDENCE_ARCHITECTURE_RESULT: ${{ needs.evidence-architecture.result }}
          WORKFLOW_SELECTION_RESULT: ${{ needs.workflow-selection.result }}
          SKILLS_MIRROR_RESULT: ${{ needs.skills-mirror.result }}
        run: |
          set -euo pipefail
          test "${CHANGES_RESULT}" = success
          # Empty must never be read as "unselected": a broken probe step would
          # otherwise turn into a green gate over five skipped workers.
          case "${SELECTED}" in
            true|false) ;;
            *)
              echo "::error::unparseable selection output: '${SELECTED}'"
              exit 1
              ;;
          esac
          expected=success
          if [ "${SELECTED}" != true ]; then
            expected=skipped
          fi
          test "${GITLINKS_RESULT}" = "${expected}"
          test "${IDENTIFIER_ORIGIN_RESULT}" = "${expected}"
          test "${EVIDENCE_ARCHITECTURE_RESULT}" = "${expected}"
          test "${WORKFLOW_SELECTION_RESULT}" = "${expected}"
          test "${SKILLS_MIRROR_RESULT}" = "${expected}"
