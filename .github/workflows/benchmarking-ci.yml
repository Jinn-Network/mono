name: Benchmarking CI

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
  pull_request:
    paths:
      - "packages/benchmarking/**"
      - ".github/scripts/benchmarking-*.test.mjs"
      - ".github/workflows/benchmarking-ci.yml"
      - "docs/superpowers/specs/2026-07-28-benchmarking-application-design.md"
      - "docs/superpowers/specs/2026-08-16-evidence-first-benchmarking-design-amendment.md"
      # Transitive `portal:` closure of the workspaces above (#3573). Each is built
      # from source into this lane, so a change confined to one of them changes what
      # this lane verifies. Enforced by .github/scripts/portal-path-filters.test.mjs.
      - "packages/discovery/protocol/**"
      - "packages/discovery/publication/**"
      - "packages/discovery/serve/**"
      - "packages/discovery/testing/**"
      - "packages/evidence/attestation-issuer/**"
      - "packages/evidence/discovery/**"
      - "packages/evidence/execution-evidence-builder/**"
      - "packages/evidence/execution-recorder/**"
      - "packages/evidence/protocol/**"
      - "packages/evidence/repository/**"
      - "packages/marketplace/binding/**"
      - "packages/marketplace/projector/**"
      - "packages/task-execution/backend/**"
      - "packages/task-execution/backend-local/assembly/**"
      - "packages/task-execution/backend-local/launchers/**"
      - "packages/task-execution/backend-local/supervisor/**"
      - "packages/task-execution/backend-local/workspace/**"
      - "packages/task-execution/profiles/**"
      - "packages/task-execution/protocol/**"
      - "packages/task-execution/testing/**"
      - "packages/trust/core/**"
      - "packages/trust/resolve/**"
  push:
    branches: [next]
    paths:
      - "packages/benchmarking/**"
      - ".github/scripts/benchmarking-*.test.mjs"
      - ".github/workflows/benchmarking-ci.yml"
      - "docs/superpowers/specs/2026-07-28-benchmarking-application-design.md"
      - "docs/superpowers/specs/2026-08-16-evidence-first-benchmarking-design-amendment.md"
      # Transitive `portal:` closure of the workspaces above (#3573). Each is built
      # from source into this lane, so a change confined to one of them changes what
      # this lane verifies. Enforced by .github/scripts/portal-path-filters.test.mjs.
      - "packages/discovery/protocol/**"
      - "packages/discovery/publication/**"
      - "packages/discovery/serve/**"
      - "packages/discovery/testing/**"
      - "packages/evidence/attestation-issuer/**"
      - "packages/evidence/discovery/**"
      - "packages/evidence/execution-evidence-builder/**"
      - "packages/evidence/execution-recorder/**"
      - "packages/evidence/protocol/**"
      - "packages/evidence/repository/**"
      - "packages/marketplace/binding/**"
      - "packages/marketplace/projector/**"
      - "packages/task-execution/backend/**"
      - "packages/task-execution/backend-local/assembly/**"
      - "packages/task-execution/backend-local/launchers/**"
      - "packages/task-execution/backend-local/supervisor/**"
      - "packages/task-execution/backend-local/workspace/**"
      - "packages/task-execution/profiles/**"
      - "packages/task-execution/protocol/**"
      - "packages/task-execution/testing/**"
      - "packages/trust/core/**"
      - "packages/trust/resolve/**"

permissions:
  contents: read

env:
  BENCHMARKING_ROOT: packages/benchmarking

# Consolidated per #2997 (pattern proven by the trust-ci pilot, PR #3001): the
# previous shape ran 11 runner jobs chained through artifact dist round-trips,
# rebuilding the shared §7.8 portal set (up to nineteen packages) per job. The
# packages job below builds the same twelve packages with the same commands in
# dependency order in ONE workspace, every portal built once.
#
# The per-job isolation this retires was a de-facto undeclared-dependency
# guard; that invariant is owned by benchmarking-source-boundaries.test.mjs in
# the architecture job.
jobs:
  architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify package inventory and dependency graph
        run: node --test .github/scripts/benchmarking-package-inventory.test.mjs
      - name: Verify source boundaries and canaries
        run: node --test .github/scripts/benchmarking-source-boundaries.test.mjs

  packages:
    name: Benchmarking packages
    runs-on: ubuntu-latest
    # A hung step must not hold a runner slot for the 360-minute default nor
    # burn the queue's 180-minute check-response budget.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - name: Enable Corepack before the Yarn cache lookup
        # setup-node resolves the Yarn cache folder by shelling out to `yarn`.
        # Without Corepack that is the runner image's global Yarn 1, which
        # refuses every project pinned to `packageManager: yarn@4.13.0`.
        run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
          cache: yarn
          cache-dependency-path: |
            packages/trust/core/yarn.lock
            packages/trust/resolve/yarn.lock
            packages/trust/testing/yarn.lock
            packages/evidence/protocol/yarn.lock
            packages/evidence/repository/yarn.lock
            packages/evidence/discovery/yarn.lock
            packages/evidence/execution-evidence-builder/yarn.lock
            packages/evidence/execution-recorder/yarn.lock
            packages/evidence/attestation-issuer/yarn.lock
            packages/task-execution/protocol/yarn.lock
            packages/task-execution/backend/yarn.lock
            packages/task-execution/profiles/yarn.lock
            packages/task-execution/backend-local/supervisor/yarn.lock
            packages/task-execution/backend-local/workspace/yarn.lock
            packages/task-execution/backend-local/launchers/yarn.lock
            packages/task-execution/backend-local/assembly/yarn.lock
            packages/task-execution/testing/yarn.lock
            packages/discovery/protocol/yarn.lock
            packages/discovery/serve/yarn.lock
            packages/discovery/publication/yarn.lock
            packages/marketplace/binding/yarn.lock
            packages/marketplace/projector/yarn.lock
            packages/benchmarking/protocol/yarn.lock
            packages/benchmarking/records/yarn.lock
            packages/benchmarking/aggregate/yarn.lock
            packages/benchmarking/testing/yarn.lock
            packages/benchmarking/evidence/yarn.lock
            packages/benchmarking/native-capture/yarn.lock
            packages/benchmarking/evaluation/yarn.lock
            packages/benchmarking/run/yarn.lock
            packages/benchmarking/interop/yarn.lock
            packages/benchmarking/marketplace/yarn.lock
            packages/benchmarking/local/yarn.lock
            packages/benchmarking/publication/yarn.lock
      # A freshly rolled runner image can regress the packed-consumer smoke:
      # node 22.23.2's bundled npm dies with "Cannot read properties of null
      # (reading 'edgesOut')" on yarn-packed tarballs (first seen on the
      # task-execution lane, PR #3010). evidence-ci and the old task-execution
      # foundation job always pinned both for exactly this reason.
      - name: Pin npm for packed-consumer smoke coverage
        run: npm install --global npm@11.19.0 --no-audit --no-fund
      - name: Enable Yarn 4.13.0
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate
      - name: Build cross-tree portal dependency from source (trust-core, §7.8)
        working-directory: packages/trust/core
        run: |
          yarn install --immutable
          yarn build
      - name: Build cross-tree portal dependency from source (trust-resolve, §7.8)
        working-directory: packages/trust/resolve
        run: |
          yarn install --immutable
          yarn build
      - name: Build cross-tree portal dependency from source (trust-testing, §7.8)
        working-directory: packages/trust/testing
        run: |
          yarn install --immutable
          yarn build
      - name: Build cross-tree portal dependency from source (evidence-protocol, §7.8)
        working-directory: packages/evidence/protocol
        run: |
          yarn install --immutable
          yarn build
      - name: Build cross-tree portal dependency from source (evidence-repository, §7.8)
        working-directory: packages/evidence/repository
        run: |
          yarn install --immutable
          yarn build
      - name: Build cross-tree portal dependency from source (evidence-discovery, §7.8)
        working-directory: packages/evidence/discovery
        run: |
          yarn install --immutable
          yarn build
      - name: Build cross-tree portal dependency from source (execution-evidence-builder, §7.8)
        working-directory: packages/evidence/execution-evidence-builder
        run: |
          yarn install --immutable
          yarn build
      - name: Build cross-tree portal dependency from source (execution-recorder, §7.8)
        working-directory: packages/evidence/execution-recorder
        run: |
          yarn install --immutable
          yarn build
      - name: Build cross-tree portal dependency from source (attestation-issuer, §7.8)
        working-directory: packages/evidence/attestation-issuer
        run: |
          yarn install --immutable
          yarn build
      - name: Build cross-tree portal dependency from source (task-execution-protocol, §7.8)
        working-directory: packages/task-execution/protocol
        run: |
          yarn install --immutable
          yarn build
      - name: Build cross-tree portal dependency from source (task-execution-backend, §7.8)
        working-directory: packages/task-execution/backend
        run: |
          yarn install --immutable
          yarn build
      - name: Build cross-tree portal dependency from source (task-execution-profiles, §7.8)
        working-directory: packages/task-execution/profiles
        run: |
          yarn install --immutable
          yarn build
      - name: Build cross-tree portal dependency from source (backend-local-supervisor, §7.8)
        working-directory: packages/task-execution/backend-local/supervisor
        run: |
          yarn install --immutable
          yarn build
      - name: Build cross-tree portal dependency from source (backend-local-workspace, §7.8)
        working-directory: packages/task-execution/backend-local/workspace
        run: |
          yarn install --immutable
          yarn build
      - name: Build cross-tree portal dependency from source (backend-local-launchers, §7.8)
        working-directory: packages/task-execution/backend-local/launchers
        run: |
          yarn install --immutable
          yarn build
      - name: Build cross-tree portal dependency from source (backend-local-assembly, §7.8)
        working-directory: packages/task-execution/backend-local/assembly
        run: |
          yarn install --immutable
          yarn build
      - name: Build cross-tree portal dependency from source (task-execution-testing, §7.8)
        working-directory: packages/task-execution/testing
        run: |
          yarn install --immutable
          yarn build
      - name: Build cross-tree portal dependency from source (record-discovery-protocol, §7.8)
        working-directory: packages/discovery/protocol
        run: |
          yarn install --immutable
          yarn build
      - name: Build cross-tree portal dependency from source (record-discovery-serve, §7.8)
        working-directory: packages/discovery/serve
        run: |
          yarn install --immutable
          yarn build
      - name: Build cross-tree portal dependency from source (record-discovery-publication, §7.8)
        working-directory: packages/discovery/publication
        run: |
          yarn install --immutable
          yarn build
      - name: Build cross-tree portal dependency from source (marketplace-binding, §7.8)
        working-directory: packages/marketplace/binding
        run: |
          yarn install --immutable
          yarn build
      - name: Build cross-tree portal dependency from source (marketplace-projector, §7.8)
        working-directory: packages/marketplace/projector
        run: |
          yarn install --immutable
          yarn build
      - name: Verify Evidence-Native Benchmarking Protocol
        working-directory: packages/benchmarking/protocol
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
      - name: Verify Benchmarking Records
        working-directory: packages/benchmarking/records
        run: |
          yarn install --immutable
          yarn check:schemas
          yarn check:schema-parity
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Verify Benchmarking Aggregate
        working-directory: packages/benchmarking/aggregate
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Verify Benchmarking Testing (mandatory M1-M3 conformance)
        working-directory: packages/benchmarking/testing
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Verify Evidence-Native Benchmarking Assembly
        working-directory: packages/benchmarking/evidence
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
      - name: Verify Native Capture Coordinator
        working-directory: packages/benchmarking/native-capture
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
      - name: Verify TEP-Free Evaluation Issuance
        working-directory: packages/benchmarking/evaluation
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
      - name: Verify Benchmarking Run
        working-directory: packages/benchmarking/run
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Verify Benchmarking Interop
        working-directory: packages/benchmarking/interop
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Verify Benchmarking Marketplace
        working-directory: packages/benchmarking/marketplace
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Verify Benchmarking Local
        working-directory: packages/benchmarking/local
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Verify Benchmarking Publication
        working-directory: packages/benchmarking/publication
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Compile packed public entrypoint consumers
        run: node .github/scripts/benchmarking-packed-types.test.mjs
