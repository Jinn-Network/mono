[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jinn-inspect-sandbox"
version = "0.1.0"
description = "Private Inspect sandbox bridge for the Jinn Benchmark Product"
requires-python = ">=3.11"
dependencies = []

[project.entry-points.inspect_ai]
jinn_inspect_sandbox = "jinn_inspect_sandbox"

[tool.setuptools.packages.find]
where = ["."]
include = ["jinn_inspect_sandbox*"]
