name: CI

# The workflow-level `paths:` filters this workflow used to carry moved into the
# `changes` job below. A required merge-queue context must not sit behind a
# workflow-level filter: a filtered-out workflow never reports on the merge group
# at all, and the entry hangs until the check-response timeout ejects it. A
# filtered-out *job* reports success, which is what the queue needs
# (DR-2026-08-18-b D3/D6).
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  # Manual trigger for the soft-gate e2e jobs (task-creator-marketplace-e2e).
  # Deliberately NOT wired to `schedule:` — a cron trigger on this workflow
  # would run every other job nightly too; dispatch keeps the soft gate
  # on-demand without changing the PR-blocking surface.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: operator

# Every job in this workflow is CPU-only. Both the current and nested legacy
# onnxruntime-node installers otherwise fetch optional CUDA binaries during a
# cold install, making release gates depend on GitHub/NuGet availability.
env:
  ONNXRUNTIME_NODE_INSTALL: skip
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

jobs:
  changes:
    # Four workflows run a `changes` job on every event. Without distinct display
    # names GitHub reports four check runs all called `changes`, and neither a
    # human nor the branch-protection audit can tell which lane a red one belongs
    # to. The job *id* stays `changes`: the gates reach it through `needs`.
    name: operator-ci-changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        # This job runs no operator command, and the workflow-level `operator`
        # default would send its `git` calls into a subdirectory of the checkout.
        working-directory: .
    outputs:
      run: ${{ steps.select.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # The merge-base walk and the name-only diff below read the commit and
          # tree graph and never a blob. Omitting blobs keeps `fetch-depth: 0`
          # from cloning the full 200MiB pack four times over on every PR and
          # every queue entry.
          filter: blob:none
      - name: Select the operator lane from the diff
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MG_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MG_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "${EVENT_NAME}" in
            pull_request)
              diff_base="${PR_BASE_SHA}"
              diff_head="${PR_HEAD_SHA}"
              ;;
            merge_group)
              diff_base="${MG_BASE_SHA}"
              diff_head="${MG_HEAD_SHA}"
              ;;
            push)
              diff_base="${PUSH_BEFORE_SHA}"
              diff_head="${PUSH_HEAD_SHA}"
              ;;
            *)
              echo "${EVENT_NAME} carries no diff; selecting the operator lane"
              echo 'run=true' >> "${GITHUB_OUTPUT}"
              exit 0
              ;;
          esac
          # A branch creation sends all-zeros, and a force-push can send a base that
          # is no longer reachable. Neither can be diffed, so select conservatively
          # rather than failing a required context.
          if [ -z "${diff_base}" ] \
            || [ "${diff_base}" = '0000000000000000000000000000000000000000' ] \
            || ! git cat-file -e "${diff_base}^{commit}" 2>/dev/null; then
            echo "no usable diff base (${diff_base:-empty}); selecting the operator lane"
            echo 'run=true' >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          # `diff_head` needs no matching guard: on `merge_group` and `push` it is
          # the commit this job checked out, and on `pull_request` it is a parent of
          # the merge commit checked out, which `fetch-depth: 0` fetches in full. Were
          # it ever unreachable the diff below fails the step under `set -e`, failing
          # this job and reddening the gate — never a silent unselect.
          # One extended regular expression per path this workflow used to filter on,
          # translated faithfully from the deleted globs: `**` is a prefix match, a
          # single `*` matches within one path segment, and a literal path is anchored
          # at both ends.
          patterns=(
            '^operator/'
            '^apps/operator-console/'
            '^packages/lifecycle-notifications/'
            '^packages/sdk/'
            '^packages/core/'
            '^packages/plugin/'
            '^\.github/workflows/ci\.yml$'
            '^\.github/workflows/npm-publish\.yml$'
            '^\.github/scripts/npm-publish-workflow\.test\.mjs$'
            '^\.github/scripts/operator-[^/]*\.test\.mjs$'
          )
          printf '%s\n' "${patterns[@]}" > "${RUNNER_TEMP}/selection.ere"
          # The changed list goes to a file and grep reads the file. Piping it into
          # `grep -q` is a trap: grep exits on its first match, and once the list
          # outruns the 64KiB pipe buffer the still-writing producer takes SIGPIPE.
          # Under `pipefail` that makes the pipeline non-zero, the `if` takes the else
          # branch, and a genuinely matching diff selects run=false — every job skips
          # and the gate reports green having run nothing.
          # `core.quotePath=false` keeps a non-ASCII path unquoted and unescaped, so
          # the `^`-anchored patterns see the real path.
          git -c core.quotePath=false diff --no-renames --name-only "${diff_base}...${diff_head}" \
            > "${RUNNER_TEMP}/changed.txt"
          echo "changed files: $(wc -l < "${RUNNER_TEMP}/changed.txt")"
          head -200 "${RUNNER_TEMP}/changed.txt"
          if grep -qE -f "${RUNNER_TEMP}/selection.ere" "${RUNNER_TEMP}/changed.txt"; then
            echo 'run=true' >> "${GITHUB_OUTPUT}"
          else
            echo 'run=false' >> "${GITHUB_OUTPUT}"
          fi

  architecture:
    name: Operator tree architecture
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
      - name: Verify package inventory and portal graph
        run: node --test .github/scripts/operator-package-inventory.test.mjs
      - name: Verify source boundaries
        run: node --test .github/scripts/operator-source-boundaries.test.mjs
      - name: Build the tree for the packed-types canary
        working-directory: operator
        run: |
          yarn install --immutable
          yarn build
      - name: Verify packed types
        run: node --test .github/scripts/operator-packed-types.test.mjs

  check:
    name: Typecheck & Test
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --immutable
      # Foundry provides `anvil`, required by the test/_support/chain/*.test.ts
      # helper unit tests (added in this refactor) — they spawn a real local
      # fork to verify the helpers work. The test/e2e/* scripts that also need
      # anvil are excluded by vitest config and don't run under `yarn test`.
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly-1c7c4bebce1e075989780fd401bf6bffcb424746
      - run: yarn typecheck
      # Late-mount lint: blocks app.METHOD(...) outside the startApiServer
      # call graph. Catches the Hono "matcher is already built" crash class
      # at code-review time. See jinn-mono-u34i.
      - run: yarn lint:no-late-mount
      # No-error-leak lint: blocks raw error.message stringification in any
      # operator/src/api/ file that talks to an RPC client. Catches the
      # credential-leak class where a viem HttpRequestError's message (which
      # embeds the full request URL) reaches an unauthenticated response
      # unmasked. See spec §14.2 item 2, issue #2402.
      - run: yarn lint:no-error-leak
      # No-fixed-test-port lint: blocks a hard-coded (or randomly guessed)
      # 127.0.0.1 port inside the OS ephemeral range 32768-60999 in a test
      # file, and blocks pinning suite parallelism in vitest.config.ts. This
      # runner is 4 vCPU, so `yarn test` below forks 3 workers that share one
      # kernel-global port space — a sibling's listen(0) can take a fixed port
      # between the moment a test picks it and the moment it binds, producing
      # an EADDRINUSE that only ever reproduces under parallel CI load. See
      # issue #1627.
      - run: yarn lint:no-fixed-test-port
      # SKIP_HL_TESTS gates test/venues/hyperliquid/client.test.ts, which hits
      # the live Hyperliquid testnet. Without it, transient 429/503/ECONNREFUSED
      # from that endpoint red-gate unrelated PRs (it flaked 4 PRs on 2026-06-03).
      # The test file documents this var as the offline-CI gate.
      # Unit tests must not inherit agent credentials. Remove them rather than
      # assigning empty values, which would override explicit test env files.
      - run: node --test ../.github/scripts/npm-publish-workflow.test.mjs
      - run: env -u CLAUDE_CODE_OAUTH_TOKEN -u ANTHROPIC_API_KEY yarn test
        env:
          SKIP_HL_TESTS: '1'
      # The in-process `test/e2e/*.test.ts` composition tests. They are named
      # *.test.ts but are tsx scripts, not vitest files, so
      # vitest.config.ts's `test/e2e/**` exclude hides them from `yarn test`
      # and nothing else ran them — they sat unexecuted behind a `yarn e2e:*`
      # script no workflow invoked. Both are "Option B lightweight
      # integration": mocked IPFS / HF fetcher / eval-runner, no Anvil, no
      # Docker, no network, ~50ms each. They belong in the same job as the
      # unit suite, right after it, on the workspace builds `yarn test`
      # already produced. `summarize()` throws on any failed phase, so a
      # regression exits non-zero and reddens the job.
      #
      # `yarn e2e:freeze-mode` was a third entry here until Wave-4 D1
      # (DR-2026-08-05) deleted its engine-driven spec. Freeze coverage is not
      # lost: `yarn e2e` still runs `runFreezeFenceForkE2E` (stable digest,
      # mutation detected, rollback) and `runTrainVsFrozenTrajectoryE2E` as
      # phases of `test/e2e/validate.ts`. Those need Anvil, so they stay in the
      # e2e entry point rather than moving into this job.
      - run: yarn e2e:checkpoint-flow
      - run: yarn e2e:swe-rebench-v2
      - run: yarn build

  pack-smoke:
    name: Pack & Smoke Test
    needs: [changes, check]
    # Fast PR lane (DR-2026-08-18-b D3): pack smokes and e2e move to the merge
    # group on the lane the queue backstops. The fast lane is scoped to pull
    # requests that do NOT target `main`: those land through the queue, which
    # runs the full battery before anything merges. A PR targeting `main` is the
    # hotfix lane — D2 puts no queue there, so nothing would run this at all if
    # the PR lane were thinned wholesale. Push, dispatch, and schedule lanes stay
    # heavy for the same reason. The PR lane keeps `architecture` and `check`.
    if: needs.changes.outputs.run == 'true' && (github.event_name != 'pull_request' || github.base_ref == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn build

      # Exercise the npm-shaped artifact and its vendored private runtime,
      # including client-only public imports and a native-SQLite reindex from
      # an isolated install, then retain that exact smoke-validated archive.
      - run: node scripts/smoke-test-pack.mjs --output jinn-client.tgz

      # Exercise the installed declaration graph and startup-reachable private
      # runtime seam independently.
      - run: yarn pack:smoke:private-runtime

      # Verify tarball contents — only expected files shipped
      - name: Verify tarball contents
        run: |
          tar tzf jinn-client.tgz | sort > /tmp/tarball-contents.txt
          echo "--- Tarball contents ---"
          cat /tmp/tarball-contents.txt

          # Must contain dist/ and deployments/, must NOT contain src/ or test/
          grep -q "package/dist/" /tmp/tarball-contents.txt || { echo "✗ Missing dist/"; exit 1; }
          grep -q "package/deployments/" /tmp/tarball-contents.txt || { echo "✗ Missing deployments/"; exit 1; }
          grep -q "package/LICENSE" /tmp/tarball-contents.txt || { echo "✗ Missing LICENSE"; exit 1; }

          if grep -q "package/src/" /tmp/tarball-contents.txt; then
            echo "✗ src/ leaked into tarball"
            exit 1
          fi
          if grep -q "package/test/" /tmp/tarball-contents.txt; then
            echo "✗ test/ leaked into tarball"
            exit 1
          fi
          echo "✓ Tarball contents verified"

  dashboard-e2e:
    # Playwright E2E for the operator console — claim-policy, posting-status,
    # and funding-sequence against a mocked daemon API. The daemon origin has
    # no human surface after Stage 6.
    name: Operator console E2E (Playwright)
    needs: [changes, check]
    # Queue-backstopped PR lane only — see pack-smoke above.
    if: needs.changes.outputs.run == 'true' && (github.event_name != 'pull_request' || github.base_ref == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/operator-console
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
        working-directory: .
      - name: Enable Yarn 4.13.0
        run: |
          corepack prepare yarn@4.13.0 --activate
      # The console portals @jinn-network/lifecycle-notifications, whose
      # exports point at dist/, so build that package before next build.
      - name: Build lifecycle-notifications
        working-directory: packages/lifecycle-notifications
        run: |
          yarn install --immutable
          yarn build
      - run: yarn install --immutable
      - run: yarn playwright install --with-deps chromium
      - run: yarn e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: apps/operator-console/test-results/
          retention-days: 7

  degraded-daemon-guard-e2e:
    # Issue #2407 B1/R2/R3 — spawns the REAL built binary against a loopback
    # RPC stub to prove: (B1) checkDaemonGuard reports blocked while a halted
    # daemon runs its degraded recovery loops; (R2) a SIGTERM delivered
    # during that window still removes the pidfile; (R3) JINN_NO_DAEMON=1
    # acquires and cleans up the pidfile on its own exit path too. Plain
    # node subprocess test, no browser — needs `yarn build` first (that's
    # why it's `test/main/*.e2e.test.ts`, auto-excluded from the `check`
    # job's `yarn test`, which runs before `yarn build`), so this job builds
    # via `yarn e2e:degraded-daemon-guard` itself, same pattern as
    # `funding-sequence-e2e` above.
    name: Degraded Daemon Guard E2E
    needs: [changes, check]
    # Queue-backstopped PR lane only — see pack-smoke above.
    if: needs.changes.outputs.run == 'true' && (github.event_name != 'pull_request' || github.base_ref == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn e2e:degraded-daemon-guard

  task-creator-marketplace-e2e:
    # Task Creator marketplace-leg e2e (WP6) — SOFT GATE, not PR-blocking.
    # Runs only on manual workflow_dispatch (see `on:` comment above). Anvil
    # fork of Base + two FleetBootstrapper cycles + full post → guarded claim
    # → deliver → grade → exemplar-pair loop; needs internet for the fork RPC.
    name: Task Creator marketplace e2e (soft gate)
    # Deliberately NOT gated on `changes`: a manual dispatch is the soft gate's only
    # lane, and it must run whatever the diff says (a dispatch may carry no diff at
    # all). `operator-ci-gate` asserts this job is exactly `skipped` on every other
    # event, which is the property that keeps it off the PR and merge-group paths.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --immutable
      # The e2e compiles the local V3 task stack via `yarn compile` in
      # contracts/ (task-first-helpers.compileContracts), so the contracts
      # workspace needs its own install.
      - run: yarn install --immutable
        working-directory: contracts
      # Foundry provides `anvil` for the Base-mainnet fork.
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly-1c7c4bebce1e075989780fd401bf6bffcb424746
      - run: yarn e2e:task-creator

  task-creator-amd64-gold-proof:
    # Task Creator v0 AC #1 — native amd64 Docker gold eval through RoutingTaskRowFetcher.
    # ubuntu-latest is linux/amd64; arm64 Mac dev cannot satisfy this gate.
    name: Task Creator AC1 (amd64 gold proof)
    needs: [changes, check]
    # Queue-backstopped PR lane only — see pack-smoke above. This is the
    # workflow's 90-minute tail, so it is the single biggest saving the fast PR
    # lane buys.
    if: needs.changes.outputs.run == 'true' && (github.event_name != 'pull_request' || github.base_ref == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      # ubuntu-latest free disk hovers right at the eval's 20 GB floor
      # (JINN_EVAL_DISK_FLOOR_GB); runs fail nondeterministically at
      # "insufficient disk: 17.0 GB free". Drop the big preinstalled
      # toolchains this job never uses to buy ~25 GB of headroom.
      - name: Free runner disk (headroom for the Docker gold eval)
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h / | tail -1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn build
      - name: Verify amd64 host
        run: |
          test "$(uname -m)" = "x86_64"
          docker info
          python3 --version
      - name: Run AC #1 gold proof
        run: yarn task-creator:amd64-gold-proof
        env:
          HOME: ${{ runner.temp }}

  operator-ci-gate:
    # The check-run name GitHub reports is this job's display `name:` below, and that
    # string is the required-status-check context registered on the `next` ruleset
    # (DR-2026-08-18-b D3) — keep them in sync.
    name: operator-ci-gate
    needs:
      - changes
      - architecture
      - check
      - pack-smoke
      - dashboard-e2e
      - degraded-daemon-guard-e2e
      - task-creator-marketplace-e2e
      - task-creator-amd64-gold-proof
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        # This job never checks out, so the workflow-level `operator` default would
        # point every `run:` step at a directory that does not exist.
        working-directory: .
    steps:
      - name: Require exact success from every selected operator-CI job
        env:
          EVENT_NAME: ${{ github.event_name }}
          # Set only on pull_request events, which is exactly where it is read.
          BASE_REF: ${{ github.base_ref }}
          SELECTED: ${{ needs.changes.outputs.run }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          ARCHITECTURE_RESULT: ${{ needs.architecture.result }}
          CHECK_RESULT: ${{ needs.check.result }}
          PACK_SMOKE_RESULT: ${{ needs.pack-smoke.result }}
          DASHBOARD_E2E_RESULT: ${{ needs.dashboard-e2e.result }}
          DEGRADED_DAEMON_GUARD_RESULT: ${{ needs.degraded-daemon-guard-e2e.result }}
          MARKETPLACE_E2E_RESULT: ${{ needs.task-creator-marketplace-e2e.result }}
          GOLD_PROOF_RESULT: ${{ needs.task-creator-amd64-gold-proof.result }}
        run: |
          set -euo pipefail
          echo "event=${EVENT_NAME} base_ref=${BASE_REF:-none} selected=${SELECTED} changes=${CHANGES_RESULT}"
          echo "architecture=${ARCHITECTURE_RESULT} check=${CHECK_RESULT}"
          echo "pack-smoke=${PACK_SMOKE_RESULT} dashboard-e2e=${DASHBOARD_E2E_RESULT}"
          echo "degraded-daemon-guard-e2e=${DEGRADED_DAEMON_GUARD_RESULT}"
          echo "task-creator-marketplace-e2e=${MARKETPLACE_E2E_RESULT}"
          echo "task-creator-amd64-gold-proof=${GOLD_PROOF_RESULT}"
          test "${CHANGES_RESULT}" = success
          # The selection is read from a job output, which is the empty string when the
          # select step never wrote one. Empty must never be read as "unselected", or a
          # broken selection step turns into a green gate over a whole skipped lane.
          case "${SELECTED}" in
            true|false) ;;
            *)
              echo "::error::unparseable selection output: '${SELECTED}'"
              exit 1
              ;;
          esac
          # When the operator lane is selected the bar is unchanged: exact success. When
          # it is not, each job must be exactly `skipped` — a failed or cancelled job
          # still fails this gate, so unselection can never launder a red.
          expected=success
          if [ "${SELECTED}" != true ]; then
            expected=skipped
          fi
          test "${ARCHITECTURE_RESULT}" = "${expected}"
          test "${CHECK_RESULT}" = "${expected}"
          # The four heavy jobs are thinned on the queue-backstopped PR lane only
          # (DR-2026-08-18-b D3): a pull request that does not target `main` gets
          # them on the merge group instead. Every other lane keeps them —
          # merge_group, push, workflow_dispatch, and PRs targeting `main`, which
          # is the hotfix lane no queue backstops. This mirrors their `if:`
          # exactly. A failed or cancelled job never reads as skipped, so the
          # fast lane cannot launder a red either.
          heavy_expected="${expected}"
          if [ "${EVENT_NAME}" = pull_request ] && [ "${BASE_REF}" != main ]; then
            heavy_expected=skipped
          fi
          test "${PACK_SMOKE_RESULT}" = "${heavy_expected}"
          test "${DASHBOARD_E2E_RESULT}" = "${heavy_expected}"
          test "${DEGRADED_DAEMON_GUARD_RESULT}" = "${heavy_expected}"
          test "${GOLD_PROOF_RESULT}" = "${heavy_expected}"
          # The marketplace e2e is dispatch-only. On every other event it must be
          # exactly `skipped`, which is what keeps a 45-minute soft gate off the PR and
          # merge-group paths. On a dispatch it may have run or been skipped; either is
          # accepted, since the dispatch lane gates nothing.
          if [ "${EVENT_NAME}" = workflow_dispatch ]; then
            case "${MARKETPLACE_E2E_RESULT}" in
              success|skipped) ;;
              *)
                echo "::error::task-creator-marketplace-e2e result was ${MARKETPLACE_E2E_RESULT}"
                exit 1
                ;;
            esac
          else
            test "${MARKETPLACE_E2E_RESULT}" = skipped
          fi
