name: Environments CI

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
  pull_request:
    paths:
      - "packages/environments/**"
      - ".github/scripts/environments-*.test.mjs"
      - ".github/workflows/environments-ci.yml"
      - "docs/superpowers/specs/2026-07-31-verified-environment-supply-design.md"
      - "docs/superpowers/plans/2026-07-31-supply-c1-environment-record.md"
      - "docs/superpowers/plans/2026-07-31-supply-c2-environment-verification.md"
      - "docs/superpowers/plans/2026-07-31-chain-ce1-chain-record.md"
      - "docs/superpowers/plans/2026-07-31-chain-ce3-chain-verification.md"
      - "docs/superpowers/plans/2026-07-31-chain-ce4-chain-extraction.md"
      - "docs/superpowers/plans/2026-07-31-chain-ce6-information-world.md"
      - "docs/superpowers/specs/2026-07-31-chain-environment-family-design.md"
  push:
    branches: [next]
    paths:
      - "packages/environments/**"
      - ".github/scripts/environments-*.test.mjs"
      - ".github/workflows/environments-ci.yml"
      - "docs/superpowers/specs/2026-07-31-verified-environment-supply-design.md"
      - "docs/superpowers/plans/2026-07-31-supply-c1-environment-record.md"
      - "docs/superpowers/plans/2026-07-31-supply-c2-environment-verification.md"
      - "docs/superpowers/plans/2026-07-31-chain-ce1-chain-record.md"
      - "docs/superpowers/plans/2026-07-31-chain-ce3-chain-verification.md"
      - "docs/superpowers/plans/2026-07-31-chain-ce4-chain-extraction.md"
      - "docs/superpowers/plans/2026-07-31-chain-ce6-information-world.md"
      - "docs/superpowers/specs/2026-07-31-chain-environment-family-design.md"

permissions:
  contents: read

env:
  ENVIRONMENTS_ROOT: packages/environments

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Enable Yarn 4.13.0
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate
      - name: Install the information-world AST policy compiler
        working-directory: packages/environments/information-world
        run: yarn install --immutable
      - name: Verify package inventory and dependency graph
        run: node --test .github/scripts/environments-package-inventory.test.mjs
      - name: Verify source boundaries and canaries
        run: node --test .github/scripts/environments-source-boundaries.test.mjs

  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Enable Yarn 4.13.0
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate
      - name: Build the seal-equivalence oracle from source (evidence-protocol, test-only)
        run: |
          (cd packages/evidence/protocol && yarn install --immutable && yarn build)
      - name: Verify Environment Record
        working-directory: packages/environments/record
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn check:fixtures
          yarn check:schemas
          yarn pack:smoke
      - name: Upload Environment Record distribution
        uses: actions/upload-artifact@v4
        with:
          name: environments-record-dist
          path: packages/environments/record/dist
          if-no-files-found: error
          retention-days: 1

  chain-record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Enable Yarn 4.13.0
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate
      - name: Build the seal-equivalence oracles from source (test-only)
        run: |
          (cd packages/evidence/protocol && yarn install --immutable && yarn build)
          (cd packages/environments/record && yarn install --immutable && yarn build)
      - name: Verify Chain Environment Record
        working-directory: packages/environments/chain-record
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn check:fixtures
          yarn check:schemas
          yarn pack:smoke
      - name: Upload Chain Environment Record distribution
        uses: actions/upload-artifact@v4
        with:
          name: environments-chain-record-dist
          path: packages/environments/chain-record/dist
          if-no-files-found: error
          retention-days: 1

  information-world:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Enable Yarn 4.13.0
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate
      - name: Build the test-only oracles (trust-core, evidence-protocol, chain-record, chain-verification)
        run: |
          (cd packages/trust/core && yarn install --immutable && yarn build)
          (cd packages/evidence/protocol && yarn install --immutable && yarn build)
          (cd packages/environments/chain-record && yarn install --immutable && yarn build)
          (cd packages/environments/chain-verification && yarn install --immutable && yarn build)
      - name: Verify Information World
        working-directory: packages/environments/information-world
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn check:fixtures
          yarn check:schemas
          yarn pack:smoke
      - name: Prove the closed execution profile under a network-denied runtime
        working-directory: packages/environments/information-world
        run: yarn check:network-denied
      - name: Upload Information World distribution
        uses: actions/upload-artifact@v4
        with:
          name: environments-information-world-dist
          path: packages/environments/information-world/dist
          if-no-files-found: error
          retention-days: 1

  verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Enable Yarn 4.13.0
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate
      - name: Build the packages this capability depends on
        run: |
          (cd packages/trust/core && yarn install --immutable && yarn build)
          (cd packages/trust/testing && yarn install --immutable && yarn build)
          (cd packages/environments/record && yarn install --immutable && yarn build)
      - name: Verify Environment Verification
        working-directory: packages/environments/verification
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Upload Environment Verification distribution
        uses: actions/upload-artifact@v4
        with:
          name: environments-verification-dist
          path: packages/environments/verification/dist
          if-no-files-found: error
          retention-days: 1

  chain-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Enable Yarn 4.13.0
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate
      - name: Build the packages this capability depends on
        run: |
          (cd packages/trust/core && yarn install --immutable && yarn build)
          (cd packages/trust/testing && yarn install --immutable && yarn build)
          (cd packages/environments/chain-record && yarn install --immutable && yarn build)
      - name: Verify Chain Environment Verification
        working-directory: packages/environments/chain-verification
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Upload Chain Environment Verification distribution
        uses: actions/upload-artifact@v4
        with:
          name: environments-chain-verification-dist
          path: packages/environments/chain-verification/dist
          if-no-files-found: error
          retention-days: 1

  chain-extraction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Enable Yarn 4.13.0
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate
      - name: Build the packages this capability depends on
        run: |
          (cd packages/trust/core && yarn install --immutable && yarn build)
          (cd packages/trust/testing && yarn install --immutable && yarn build)
          (cd packages/environments/chain-record && yarn install --immutable && yarn build)
          (cd packages/environments/chain-verification && yarn install --immutable && yarn build)
      - name: Verify Chain State Extraction
        working-directory: packages/environments/chain-extraction
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Upload Chain State Extraction distribution
        uses: actions/upload-artifact@v4
        with:
          name: environments-chain-extraction-dist
          path: packages/environments/chain-extraction/dist
          if-no-files-found: error
          retention-days: 1

  verify:
    needs: [architecture, record, verification, chain-record, information-world, chain-verification, chain-extraction]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every Environments CI stage to succeed
        env:
          ARCHITECTURE_RESULT: ${{ needs.architecture.result }}
          RECORD_RESULT: ${{ needs.record.result }}
          VERIFICATION_RESULT: ${{ needs.verification.result }}
          CHAIN_RECORD_RESULT: ${{ needs.chain-record.result }}
          INFORMATION_WORLD_RESULT: ${{ needs.information-world.result }}
          CHAIN_VERIFICATION_RESULT: ${{ needs.chain-verification.result }}
          CHAIN_EXTRACTION_RESULT: ${{ needs.chain-extraction.result }}
        run: |
          for result in \
            "$ARCHITECTURE_RESULT" \
            "$RECORD_RESULT" \
            "$VERIFICATION_RESULT" \
            "$CHAIN_RECORD_RESULT" \
            "$INFORMATION_WORLD_RESULT" \
            "$CHAIN_VERIFICATION_RESULT" \
            "$CHAIN_EXTRACTION_RESULT"; do
            test "$result" = "success"
          done
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Enable Yarn 4.13.0
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate
      - name: Restore all package distributions
        uses: actions/download-artifact@v8
        with:
          pattern: environments-*-dist
          path: .environments-dist
      - name: Place package distributions
        run: |
          mkdir -p packages/environments/record/dist
          cp -R .environments-dist/environments-record-dist/. packages/environments/record/dist/
          mkdir -p packages/environments/chain-record/dist
          cp -R .environments-dist/environments-chain-record-dist/. packages/environments/chain-record/dist/
          mkdir -p packages/environments/information-world/dist
          cp -R .environments-dist/environments-information-world-dist/. packages/environments/information-world/dist/
          mkdir -p packages/environments/verification/dist
          cp -R .environments-dist/environments-verification-dist/. packages/environments/verification/dist/
          mkdir -p packages/environments/chain-verification/dist
          cp -R .environments-dist/environments-chain-verification-dist/. packages/environments/chain-verification/dist/
          mkdir -p packages/environments/chain-extraction/dist
          cp -R .environments-dist/environments-chain-extraction-dist/. packages/environments/chain-extraction/dist/
      - name: Build the cross-tree dependency the packed consumer resolves
        run: |
          (cd packages/trust/core && yarn install --immutable && yarn build)
      - name: Compile packed public entrypoint consumers
        run: node .github/scripts/environments-packed-types.test.mjs
