# Monday release-notes scaffold cron.
#
# Creates a GitHub Release **draft** every Monday at 09:00 UTC with the mechanical inputs for the
# named Build Notes release (merged PRs since the previous stable client semver tag with authors,
# closed-Issue references, contributor list, line-change stats, suggested semver bump = patch).
# Captain edits the draft in the GitHub Release UI to fill in <build name>, ## Highlights, and
# ## Known issues, then clicks Publish. Publish triggers npm `latest` (already wired in
# `npm-publish.yml` on release: published) and the CHANGELOG auto-mirror (`changelog-mirror.yml`).
#
# v0 status: shipped with `workflow_dispatch` only — cron schedule below is commented out.
# Promote to scheduled cron after first manual run validates output.
#
# Reference:
# - docs/engineering/handbook.md §The shipping machine
# - DR-2026-05-18 — issue substrate retirement
# - Hermes v0.13.0 release notes for the shape reference
#
# Two-train cadence: this workflow targets `next` (integration branch). Captain's Publish
# action creates a v<semver> tag on next HEAD; the promote-main.yml workflow then
# fast-forwards main to that tag. main remains the "currently published to @latest" reference.

name: Monday release-notes scaffold

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 9 * * 1'  # Monday 09:00 UTC — enable once a manual run validates the workflow.

permissions:
  contents: write
  pull-requests: write  # open-or-update the standing release-review PR (issue #307)
  issues: read

jobs:
  scaffold:
    name: Build release-notes draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # need full history to walk tags + commits since last stable client release

      - name: Resolve window
        id: window
        shell: bash
        run: |
          # Find the most recent stable client semver tag. Ignore vYYYY.MM.DD date tags
          # created alongside releases; they are human build identifiers, not npm versions.
          PREV_TAG="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' 'client-v[0-9]*.[0-9]*.[0-9]*' --sort=-creatordate \
            | grep -Ev '^v20[0-9]{2}\.[0-9]{2}\.[0-9]{2}$' | head -1 || true)"
          if [ -z "$PREV_TAG" ]; then
            # Fall back to last legacy client tag if no stable semver tag exists yet.
            PREV_TAG="$(git tag --list 'client-v*' --sort=-creatordate | head -1 || echo '')"
          fi
          if [ -z "$PREV_TAG" ]; then
            # First release ever — use repo root commit.
            PREV_SHA="$(git rev-list --max-parents=0 HEAD | head -1)"
            PREV_TAG="(repo root)"
          else
            PREV_SHA="$(git rev-parse "$PREV_TAG")"
          fi
          # UTC ISO-8601 (Z-suffixed) commit date of the window start — used to query merged PRs
          # by date. Normalised to UTC because GitHub's PR-search `merged:>` qualifier accepts
          # `YYYY-MM-DDTHH:MM:SSZ` but silently date-truncates a `+HH:MM`-offset timestamp, which
          # would fuzzily widen the window. (ubuntu-latest = GNU date.)
          PREV_DATE="$(date -u -d "$(git log -1 --format=%cI "$PREV_SHA")" '+%Y-%m-%dT%H:%M:%SZ')"
          echo "prev_tag=$PREV_TAG" >> "$GITHUB_OUTPUT"
          echo "prev_sha=$PREV_SHA" >> "$GITHUB_OUTPUT"
          echo "prev_date=$PREV_DATE" >> "$GITHUB_OUTPUT"
          echo "today=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Compute current version + suggested bump
        id: version
        env:
          PREV_TAG: ${{ steps.window.outputs.prev_tag }}
        shell: bash
        run: |
          CURRENT_VERSION="$(node -e "console.log(JSON.parse(require('fs').readFileSync('operator/package.json','utf8')).version)")"
          # Suggested bump: patch by default (handbook §Cadence). Base the
          # suggestion on the previous stable tag so a prep PR that already
          # bumped package.json to the target version still drafts that target,
          # not target+1.
          BASE_VERSION=""
          if [[ "$PREV_TAG" =~ ^client-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            BASE_VERSION="${BASH_REMATCH[1]}"
          elif [[ "$PREV_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            BASE_VERSION="${BASH_REMATCH[1]}"
          fi
          if [ -n "$BASE_VERSION" ]; then
            MAJOR="$(echo "$BASE_VERSION" | cut -d. -f1)"
            MINOR="$(echo "$BASE_VERSION" | cut -d. -f2)"
            PATCH="$(echo "$BASE_VERSION" | cut -d. -f3)"
            NEXT_PATCH=$((PATCH + 1))
            SUGGESTED="$MAJOR.$MINOR.$NEXT_PATCH"
          else
            SUGGESTED="$CURRENT_VERSION"
          fi
          echo "current=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "base=$BASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "suggested=$SUGGESTED" >> "$GITHUB_OUTPUT"

      - name: Gather merged PRs + closed-Issue references since last tag
        id: prs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREV_DATE: ${{ steps.window.outputs.prev_date }}
        shell: bash
        run: |
          # Query GitHub directly for PRs merged to next since the window start. This is the
          # accurate path — walking commit subjects for `#N` over-counts (old issue/PR refs in
          # commit messages aren't PRs merged in this window). `merged:><date>` filters precisely.
          # --limit 200 covers a generous weekly window; bump if a week ever exceeds it.
          # Use a strict boundary: the previous release PR belongs to the previous release,
          # even when its merge timestamp exactly equals the previous tag's commit date.
          PRS_JSON="$(gh pr list --repo "${{ github.repository }}" \
            --search "is:merged base:next merged:>${PREV_DATE}" \
            --state merged --limit 200 \
            --json number,title,author,body 2>/dev/null || echo '[]')"

          # PR list: number<TAB>title<TAB>author, sorted by number ascending.
          echo "$PRS_JSON" | jq -r 'sort_by(.number) | .[] | "\(.number)\t\(.title)\t\(.author.login)"' > /tmp/prs.txt
          echo "$PRS_JSON" | jq -r '.[].author.login' | sort -u > /tmp/contributors.txt

          # Closed-Issue references: parse each PR body for close-keyword + Issue ref.
          # Per DR-2026-05-18 the canonical Issue substrate is GitHub Issues (`#N`); the legacy
          # `jinn-mono-<id>` form is recognised so historical PR bodies during the migration
          # window still aggregate cleanly. Both forms are emitted in a single unified list.
          # `\b` anchors prevent substring matches like `disclosed`.
          echo "$PRS_JSON" | jq -r '.[].body // ""' \
            | grep -oiE '\b(close[sd]?|fix(es|ed)?|resolve[sd]?)[[:space:]]+(jinn-mono-[a-z0-9]+(\.[a-z0-9]+)*|#[0-9]+)' \
            | grep -oiE '(jinn-mono-[a-z0-9]+(\.[a-z0-9]+)*|#[0-9]+)' | sort -u > /tmp/closed-refs-raw.txt || true

          # Filter `#<N>` refs: PRs and Issues share the same number space on GitHub, so the
          # regex can't tell them apart. Drop any `#<N>` that resolves to a PR rather than an
          # Issue (PRs already appear in the "Changes" section above; double-listing is noise).
          : > /tmp/closed-refs.txt.new
          while IFS= read -r ref; do
            case "$ref" in
              \#[0-9]*)
                N="${ref#\#}"
                if gh issue view "$N" --repo "${{ github.repository }}" --json number >/dev/null 2>&1; then
                  printf -- "- %s\n" "$ref" >> /tmp/closed-refs.txt.new
                fi
                ;;
              *)
                printf -- "- %s\n" "$ref" >> /tmp/closed-refs.txt.new
                ;;
            esac
          done < /tmp/closed-refs-raw.txt

          if [ -s /tmp/closed-refs.txt.new ]; then
            mv /tmp/closed-refs.txt.new /tmp/closed-refs.txt
          else
            echo "- (none referenced via \`Closes #<N>\` or legacy \`Closes jinn-mono-<id>\` in merged PRs this window — Captain may add manually)" > /tmp/closed-refs.txt
          fi

      - name: Compute stats
        id: stats
        env:
          PREV_SHA: ${{ steps.window.outputs.prev_sha }}
        shell: bash
        run: |
          COMMITS="$(git rev-list --count "$PREV_SHA..HEAD")"
          # `git diff --shortstat` already emits " N files changed, X insertions(+), Y deletions(-)"
          # (with a leading space). Don't separately count files — it'd render a redundant
          # "N files · N files changed, …". Trim the leading space so the stats line spaces cleanly.
          STATS="$(git diff --shortstat "$PREV_SHA..HEAD" | sed 's/^ *//' || echo '0 files changed, 0 insertions(+), 0 deletions(-)')"
          [ -n "$STATS" ] || STATS='0 files changed, 0 insertions(+), 0 deletions(-)'
          PRS_COUNT="$(wc -l < /tmp/prs.txt 2>/dev/null | tr -d ' ' || echo 0)"
          CONTRIBUTORS_COUNT="$(wc -l < /tmp/contributors.txt 2>/dev/null | tr -d ' ' || echo 0)"
          echo "commits=$COMMITS" >> "$GITHUB_OUTPUT"
          echo "prs_count=$PRS_COUNT" >> "$GITHUB_OUTPUT"
          echo "contributors_count=$CONTRIBUTORS_COUNT" >> "$GITHUB_OUTPUT"
          echo "stats=$STATS" >> "$GITHUB_OUTPUT"

      - name: Build draft body
        id: body
        env:
          TODAY: ${{ steps.window.outputs.today }}
          PREV_TAG: ${{ steps.window.outputs.prev_tag }}
          SUGGESTED: ${{ steps.version.outputs.suggested }}
          COMMITS: ${{ steps.stats.outputs.commits }}
          PRS_COUNT: ${{ steps.stats.outputs.prs_count }}
          CONTRIBUTORS_COUNT: ${{ steps.stats.outputs.contributors_count }}
          STATS: ${{ steps.stats.outputs.stats }}
        shell: bash
        run: |
          BODY_FILE="/tmp/release-body.md"
          {
            echo "# v$SUGGESTED — \"<build name placeholder>\""
            echo "$TODAY · Suggested bump: patch (Captain: override to vX.Y+1.0 if an epic closed in this window)"
            echo ""
            echo "## Highlights"
            echo "- <placeholder — Captain edits>"
            echo ""
            echo "## Changes"
            # Group by Conventional Commits shape prefix on the PR title.
            for shape in feat fix refactor spike chore docs test; do
              MATCHES="$(grep -E "	(${shape}[\(:])" /tmp/prs.txt || true)"
              if [ -n "$MATCHES" ]; then
                echo ""
                echo "### ${shape}"
                echo "$MATCHES" | awk -F'\t' '{printf "- (#%s) %s — @%s\n", $1, $2, $3}'
              fi
            done
            UNGROUPED="$(grep -vE "	(feat[\(:]|fix[\(:]|refactor[\(:]|spike[\(:]|chore[\(:]|docs[\(:]|test[\(:])" /tmp/prs.txt || true)"
            if [ -n "$UNGROUPED" ]; then
              echo ""
              echo "### other"
              echo "$UNGROUPED" | awk -F'\t' '{printf "- (#%s) %s — @%s\n", $1, $2, $3}'
            fi
            echo ""
            echo "## Closed this week"
            cat /tmp/closed-refs.txt
            echo ""
            echo "## Stats"
            echo "- Window: $PREV_TAG → HEAD ($TODAY)"
            echo "- $COMMITS commits · $STATS · $PRS_COUNT PRs · $CONTRIBUTORS_COUNT contributors"
            echo ""
            echo "## Known issues"
            echo "- <placeholder — Captain edits>"
          } > "$BODY_FILE"
          echo "body_file=$BODY_FILE" >> "$GITHUB_OUTPUT"

      - name: Create or update the Release draft
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUGGESTED: ${{ steps.version.outputs.suggested }}
          BODY_FILE: ${{ steps.body.outputs.body_file }}
        shell: bash
        run: |
          # The draft uses the eventual published tag directly. GitHub does not materialize the
          # git tag until the draft is published, so multiple unpublished drafts with different
          # tags (one per scheduled cut) coexist safely. When Captain clicks Publish, the tag
          # `v<SUGGESTED>` is created in git, which is what npm-publish.yml (release: published)
          # and the dual-tag policy (see handbook §Cadence) expect.
          TAG="v${SUGGESTED}"
          EXISTING="$(gh release view "$TAG" --json id,isDraft --jq '.id' 2>/dev/null || true)"
          if [ -n "$EXISTING" ]; then
            gh release edit "$TAG" \
              --title "v$SUGGESTED — Build Notes (draft)" \
              --notes-file "$BODY_FILE"
            echo "Updated existing draft: $TAG"
          else
            gh release create "$TAG" \
              --draft \
              --title "v$SUGGESTED — Build Notes (draft)" \
              --notes-file "$BODY_FILE" \
              --target next
            echo "Created new draft: $TAG"
          fi
          # `gh release view --json url` returns the canonical /releases/tag/<tag> URL.
          # While the release is still a draft this URL 404s for anyone but a repo
          # collaborator (the git tag does not exist yet) — it resolves publicly only
          # once Captain publishes. The release-review PR body links it as the eventual
          # destination. Fall back to the releases index if the lookup fails.
          RELEASE_URL="$(gh release view "$TAG" --json url --jq '.url' 2>/dev/null \
            || echo "https://github.com/${{ github.repository }}/releases")"
          {
            echo "tag=$TAG"
            echo "release_url=$RELEASE_URL"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::Release draft v$SUGGESTED ready for Captain review at https://github.com/${{ github.repository }}/releases"

      - name: Open or update the release-review PR (holistic-review gate — issue #307)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUGGESTED: ${{ steps.version.outputs.suggested }}
          PREV_TAG: ${{ steps.window.outputs.prev_tag }}
          RELEASE_URL: ${{ steps.draft.outputs.release_url }}
        shell: bash
        run: |
          # Holistic-review gate (issue #307): the per-PR review surface and the release-notes
          # title list both miss bugs that are only visible in the *cumulative* main...next diff
          # (v0.1.6 shipped #301 silently shadowed by hardcoded values in main.ts — invisible
          # per-PR, invisible in the title list, visible only in the whole-window diff).
          #
          # This step opens-or-updates a single standing PR with base:main head:next. GitHub
          # keeps exactly one open PR per base/head pair and auto-refreshes its diff as `next`
          # advances, so the idempotency contract is: create only if absent, otherwise
          # refresh the existing PR's title + body.
          #
          # Soft convention (DR-2026-05-20): nothing mechanically blocks publish. The value is
          # the whole-window diff existing and being looked at before Captain clicks Publish.
          # promote-main.yml's fast-forward of `main` to `next` auto-closes this PR as merged.
          TITLE="release-review: v${SUGGESTED} window (${PREV_TAG} → next)"
          BODY_FILE="/tmp/release-review-pr-body.md"
          {
            echo "## Holistic release-window review"
            echo ""
            echo "This PR is the **holistic-review surface** for the v${SUGGESTED} release window."
            echo "Its diff is the entire \`${PREV_TAG} → next\` window (\`main...next\`) in one"
            echo "reviewable view — the diff that per-PR review and the release-notes title list"
            echo "both miss."
            echo ""
            echo "- Release draft: ${RELEASE_URL}"
            echo "- Before publishing the release, review **this diff as a whole**, not just the"
            echo "  list of merged PR titles. Cross-PR interactions (a later PR silently shadowing"
            echo "  an earlier one) are only visible here."
            echo ""
            echo "### How this PR closes"
            echo ""
            echo "Do **not** merge this PR by hand. When Captain publishes the release,"
            echo "\`promote-main.yml\` fast-forwards \`main\` to \`next\`, which auto-closes this PR"
            echo "as merged. A new release-review PR is opened by the next Monday scaffold run."
            echo ""
            echo "### Pre-publish checklist"
            echo ""
            echo "- [ ] **Holistic diff** reviewed as a whole (the gate above)."
            echo "- [ ] **Paired flow (Mode 2)** run (DR-2026-06-08) —"
            echo "  \`.claude/skills/testing-jinn-app/references/scenario-multi-op-spa-flow.md\`."
            echo "  Record the verdict here and append one line to"
            echo "  \`log/decisions/release-readiness-runs.md\`:"
            echo "  ✅ pass / ⚠️ infra-blocked, proceeding / ❌ product-red, holding — <notes>"
            echo ""
            echo "### Soft gate"
            echo ""
            echo "Both checklist items are a **soft convention** (DR-2026-05-20, DR-2026-06-08):"
            echo "nothing mechanically blocks \`npm-publish.yml\` and the publish guard's two"
            echo "SHA-bound check-runs (\`hermetic-gate\` + \`environment-suite\`) are untouched."
            echo "The gate is the diff being looked at and the paired flow being run + recorded"
            echo "before Captain clicks Publish. The paired flow is human-run on purpose — an"
            echo "automated version can only flake against real testnet (why T2.3 was deleted)."
            echo ""
            echo "Hotfixes do not open a release-review PR — their diff review is the hotfix"
            echo "PR-to-\`main\` itself (see \`docs/runbooks/hotfix.md\`), and the paired-flow"
            echo "gate does not apply to them (the next Monday cut re-verifies the app surface)."
            echo ""
            echo "_Opened automatically by \`release-notes-scaffold.yml\` — issue #307._"
          } > "$BODY_FILE"

          # GitHub keeps at most one open PR per base/head pair. Query first; create only if
          # absent. If one already exists, refresh its title + body (the window version may
          # have advanced since it was opened) — the diff itself auto-tracks `next`.
          EXISTING_PR="$(gh pr list --repo "${{ github.repository }}" \
            --base main --head next --state open \
            --json number --jq '.[0].number // empty' 2>/dev/null || true)"
          if [ -n "$EXISTING_PR" ]; then
            gh pr edit "$EXISTING_PR" --repo "${{ github.repository }}" \
              --title "$TITLE" --body-file "$BODY_FILE"
            echo "::notice::Updated existing release-review PR #$EXISTING_PR (base:main head:next)"
          else
            # `gh pr create` errors if there are no commits between base and head. This
            # happens right after a promotion (main == next) before any new work merges.
            # Skip cleanly with a notice rather than failing the scaffold run. Fetch both
            # refs first — checkout only materialises the workflow's own branch.
            git fetch --quiet origin main next 2>/dev/null || true
            AHEAD="$(git rev-list --count origin/main..origin/next 2>/dev/null || echo 0)"
            if [ "${AHEAD:-0}" -eq 0 ]; then
              echo "::notice::next has no commits ahead of main — skipping release-review PR creation (nothing to review yet)"
            else
              gh pr create --repo "${{ github.repository }}" \
                --base main --head next \
                --title "$TITLE" --body-file "$BODY_FILE" \
                || echo "::notice::could not open release-review PR (base:main head:next) — non-fatal"
              echo "::notice::Opened release-review PR (base:main head:next) for v$SUGGESTED"
            fi
          fi
