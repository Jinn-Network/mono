# Scheduled board painter for the single-surface lifecycle (Stage 3).
#
# Paints Project Status from git/PR/label facts, archives stale Done items,
# and closes orphan children. No AI. Spec:
# docs/superpowers/specs/2026-07-21-single-surface-lifecycle.md §3 / §9.
#
# Runs the standalone Jinn-Network/autopilot pin — never the vendored
# packages/autopilot tree. Pin file: .github/autopilot-pin.json.
# Unpublished npm @jinn-network/autopilot is not a gate.
#
# Auth note: the default GITHUB_TOKEN cannot write org-level Projects v2.
# This workflow uses JINN_AUTOPILOT_PAINTER_TOKEN (preferred) or falls back
# to JINN_IMPL_GH_TOKEN — a PAT / App token with `project` + `repo` scope.

name: autopilot board painter

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read

concurrency:
  group: autopilot-board-painter
  cancel-in-progress: false

env:
  AUTOPILOT_PIN_SHA: 30b53ae99316e1a5256a57bab0ed88d62266e93f

jobs:
  paint-board:
    name: Paint board Status
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mono (pin file)
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Confirm pin file matches the workflow SHA
        run: |
          node -e '
            const pin = require("./.github/autopilot-pin.json");
            if (pin.sha !== process.env.AUTOPILOT_PIN_SHA) {
              console.error("pin file sha " + pin.sha + " != workflow " + process.env.AUTOPILOT_PIN_SHA);
              process.exit(1);
            }
          '

      - name: Checkout Autopilot pin
        uses: actions/checkout@v7
        with:
          repository: Jinn-Network/autopilot
          ref: ${{ env.AUTOPILOT_PIN_SHA }}
          persist-credentials: false
          path: .autopilot-pin

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable corepack
        run: corepack enable

      - name: Install Autopilot
        working-directory: .autopilot-pin
        run: yarn install --immutable

      - name: Paint board
        working-directory: .autopilot-pin
        env:
          # Org Projects v2 mutations require a PAT/App token; GITHUB_TOKEN
          # is insufficient for the Jinn-Network org project board.
          JINN_AUTOPILOT_PAINTER_TOKEN: ${{ secrets.JINN_AUTOPILOT_PAINTER_TOKEN }}
          JINN_IMPL_GH_TOKEN: ${{ secrets.JINN_IMPL_GH_TOKEN }}
          GH_TOKEN: ${{ secrets.JINN_AUTOPILOT_PAINTER_TOKEN || secrets.JINN_IMPL_GH_TOKEN }}
          # scripts/paint-board.ts calls runPaintBoard() with
          # legacyPaintBoardOptions(), which reads the standalone repo's
          # module-level ORG/REPO/PROJECT_NUMBER bindings
          # (src/dispatcher/constants.ts) — it never loads
          # .autopilot/config.json or calls configureRepositoryConstants()
          # the way scripts/run-autopilot-v2.ts does. Those bindings default
          # to '' / 0 unless these env vars are set, which is what produced
          # `-F owner= -F projectNumber=0` in run 32888901880.
          AUTOPILOT_PROJECT_OWNER: Jinn-Network
          AUTOPILOT_PROJECT_NUMBER: '1'
          AUTOPILOT_REPOSITORY_SLUG: Jinn-Network/mono
        run: yarn paint-board
