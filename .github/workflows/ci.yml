name: CI

on:
  pull_request:
    paths: ['client/**']
  push:
    branches: [main]
    paths: ['client/**']

defaults:
  run:
    working-directory: client

jobs:
  check:
    name: Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --immutable
      # Foundry provides `anvil`, required by the test/_support/chain/*.test.ts
      # helper unit tests (added in this refactor) — they spawn a real local
      # fork to verify the helpers work. The test/e2e/* scripts that also need
      # anvil are excluded by vitest config and don't run under `yarn test`.
      - uses: foundry-rs/foundry-toolchain@v1
      - run: yarn typecheck
      # Late-mount lint: blocks app.METHOD(...) outside the startApiServer
      # call graph. Catches the Hono "matcher is already built" crash class
      # at code-review time. See jinn-mono-u34i.
      - run: yarn lint:no-late-mount
      - run: yarn test
      - run: yarn build

  pack-smoke:
    name: Pack & Smoke Test
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn build

      # Pack the artifact exactly as it would be published
      - run: yarn pack -o jinn-client.tgz

      # Install the packed tarball in a clean temp dir and run smoke tests
      # against the packaged artifact, NOT the source tree
      - name: Smoke test packed artifact
        working-directory: /tmp
        run: |
          mkdir smoke && cd smoke
          npm init -y
          npm install $GITHUB_WORKSPACE/client/jinn-client.tgz

          # version must emit valid JSON with schemaVersion
          OUTPUT=$(npm exec -- jinn version --json 2>/dev/null || true)
          echo "$OUTPUT" | node -e "
            const d = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            if (d.schemaVersion !== 1) { process.exit(1); }
            console.log('✓ jinn version: schema OK, v' + d.client.version);
          "

          # --help must exit 0
          npm exec -- jinn --help > /dev/null
          echo "✓ jinn --help: exit 0"

          # doctor may fail (no keystore) but must not crash with code 50
          EXIT=0
          npm exec -- jinn doctor --json 2>/dev/null || EXIT=$?
          if [ "$EXIT" -eq 50 ]; then
            echo "✗ jinn doctor crashed with fatal error (exit 50)"
            exit 1
          fi
          echo "✓ jinn doctor: no crash (exit $EXIT)"

      # Verify tarball contents — only expected files shipped
      - name: Verify tarball contents
        run: |
          tar tzf jinn-client.tgz | sort > /tmp/tarball-contents.txt
          echo "--- Tarball contents ---"
          cat /tmp/tarball-contents.txt

          # Must contain dist/ and deployments/, must NOT contain src/ or test/
          grep -q "package/dist/" /tmp/tarball-contents.txt || { echo "✗ Missing dist/"; exit 1; }
          grep -q "package/deployments/" /tmp/tarball-contents.txt || { echo "✗ Missing deployments/"; exit 1; }
          grep -q "package/LICENSE" /tmp/tarball-contents.txt || { echo "✗ Missing LICENSE"; exit 1; }

          if grep -q "package/src/" /tmp/tarball-contents.txt; then
            echo "✗ src/ leaked into tarball"
            exit 1
          fi
          if grep -q "package/test/" /tmp/tarball-contents.txt; then
            echo "✗ test/ leaked into tarball"
            exit 1
          fi
          echo "✓ Tarball contents verified"

  funding-sequence-e2e:
    # Playwright E2E for the AwaitingFundingCard auto-continue sequence
    # (jinn-mono-u34i). Catches wiring/UX regressions that unit tests can't
    # see — specifically the Stage 1 → Stage 2 gate transition where the
    # funding card's local dripStatus.targetReached must reset when the
    # daemon's gate advances. Sequential /v1/bootstrap mocks reproduce the
    # exact scenario that broke the 2026-05-18 canary.
    #
    # Scoped to just the funding-sequence test for now — the other dashboard
    # E2Es (spa.e2e.test.ts, spa-config.e2e.test.ts, solvernet-flow.e2e.test.ts,
    # HarnessSection.e2e.test.ts) have stale failures unrelated to u34i; fixing
    # those is filed as a follow-up. When they're green, swap this run to
    # `yarn e2e:dashboard` to gate all of them.
    name: Funding Sequence E2E (Playwright)
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --immutable
      # Install only chromium — the playwright.config.ts targets chromium
      # exclusively, so this is the minimal browser surface.
      - run: npx playwright install --with-deps chromium
      - run: yarn e2e:funding-sequence
      # Upload traces on failure so a reviewer can step through the timeline.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: client/test-results/
          retention-days: 7
