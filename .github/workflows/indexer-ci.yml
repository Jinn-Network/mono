name: Indexer CI

on:
  pull_request:
    branches: [main, next]
    paths:
      - '.github/workflows/indexer-ci.yml'
      - 'packages/indexer/**'
  push:
    branches: [main, next]
    paths:
      - '.github/workflows/indexer-ci.yml'
      - 'packages/indexer/**'

permissions:
  contents: read

jobs:
  indexer:
    name: Indexer Package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/indexer
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: corepack enable

      - name: Indexer boundary guard
        working-directory: ${{ github.workspace }}
        run: node --test .github/scripts/indexer-boundaries.test.mjs

      # The indexer depends on @jinn-network/benchmarking-records via
      # `portal:../benchmarking/records`, whose exports map points at
      # compiled dist/*.js. dist/ is gitignored, so benchmarking-records
      # must be built before any indexer step resolves it. records itself
      # depends on task-execution-protocol via portal, so that cross-tree
      # dependency must be built first too (§7.8 precedent, see
      # benchmarking-ci.yml's `records` job).
      - name: Build cross-tree portal dependency from source (task-execution-protocol, §7.8)
        run: |
          (cd packages/task-execution/protocol && yarn install --immutable && yarn build)

      - name: Build @jinn-network/benchmarking-records
        working-directory: packages/benchmarking/records
        run: |
          yarn install --immutable
          yarn build

      - run: yarn install --immutable
      - run: yarn codegen
      - run: yarn typecheck
      - run: yarn test
      - run: yarn build

  explorer:
    name: Explorer
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/indexer/explorer
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn typecheck
      - run: yarn test
      - run: yarn build

  docker:
    name: Indexer Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Build context is packages/ (not packages/indexer/) so the Dockerfile can
      # COPY and build @jinn-network/sdk, the indexer's `portal:../sdk` sibling.
      - name: Build indexer image
        working-directory: packages
        run: |
          docker build \
            --build-arg JINN_INDEXER_COMMIT=${{ github.sha }} \
            -f indexer/deploy/Dockerfile \
            -t jinn-indexer:ci \
            .
