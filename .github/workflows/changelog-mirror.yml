# CHANGELOG auto-mirror on Release publish — implements jinn-mono-2cl.10.
#
# On a GitHub Release publish, upsert the Release body as a section under the Unreleased
# heading in cargo/client/CHANGELOG.md, then open or update a PR. Captain stops
# hand-editing CHANGELOG.md; the GitHub Release body is the single source of
# truth. npm consumers still get CHANGELOG.md in the package tarball.
#
# Reference:
# - cargo/docs/engineering/handbook.md §Building in public — substrate
# - cargo/docs/superpowers/specs/2026-05-11-engineering-handbook-codesign.md Thread 7
# - cargo/client/CHANGELOG.md (current hand-maintained state)

name: CHANGELOG mirror

on:
  release:
    types: [published]

permissions:
  contents: write
  pull-requests: write

jobs:
  mirror:
    name: Mirror Release body to client/CHANGELOG.md
    runs-on: ubuntu-latest
    # Only mirror Releases that look like a Monday named Build Notes cut (skip drafts and -canary tags).
    if: github.event.release.draft == false && !contains(github.event.release.tag_name, 'canary') && !contains(github.event.release.tag_name, '-draft')
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Upsert CHANGELOG section
        id: upsert
        env:
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASE_DATE: ${{ github.event.release.published_at }}
        run: node .github/scripts/upsert-changelog-section.mjs

      - name: Create or update mirror PR
        if: steps.upsert.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          SAFE_TAG="$(printf '%s' "$RELEASE_TAG" | tr -c 'A-Za-z0-9._-' '-')"
          BRANCH="changelog/mirror-${SAFE_TAG}"
          TITLE="docs(changelog): mirror release ${RELEASE_TAG}"
          BODY="$(printf 'Mirrors the published GitHub Release body into client/CHANGELOG.md.\n\nRelease: %s\nTag: %s\n\nGenerated by the CHANGELOG mirror workflow. Review and merge through the normal protected-branch path.\n' "${RELEASE_NAME:-$RELEASE_TAG}" "$RELEASE_TAG")"

          # Commit as github-actions[bot]. This branch is not main, so it will
          # not trigger npm canary; leaving CI enabled keeps the PR mergeable if
          # required checks are added later.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "+refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}" || true
          git checkout -B "$BRANCH"
          git add client/CHANGELOG.md

          if git diff --cached --quiet; then
            echo "::notice::CHANGELOG already matches release ${RELEASE_TAG}; no PR needed."
            exit 0
          fi

          git commit -m "$TITLE" -m "Co-Authored-By: GitHub Actions <41898282+github-actions[bot]@users.noreply.github.com>"
          git push --force-with-lease origin "HEAD:${BRANCH}"

          if gh pr view "$BRANCH" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh pr edit "$BRANCH" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" --title "$TITLE" --body "$BODY"
          fi
