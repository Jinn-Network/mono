name: jinn-agent CI

# The workflow-level `paths:` filters this workflow used to carry moved into the
# `changes` job below. A required merge-queue context must not sit behind a
# workflow-level filter: a filtered-out workflow never reports on the merge group
# at all, and the entry hangs until the check-response timeout ejects it. A
# filtered-out *job* reports success, which is what the queue needs
# (DR-2026-08-18-b D3/D6).
on:
  pull_request:
  merge_group:
  push:
    branches: [next, main]
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'

permissions:
  contents: read

concurrency:
  group: jinn-agent-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/jinn-agent

jobs:
  changes:
    runs-on: ubuntu-latest
    defaults:
      run:
        # This job runs no agent command, and the workflow-level `apps/jinn-agent`
        # default would send its `git` calls into a subdirectory of the checkout.
        working-directory: .
    outputs:
      run: ${{ steps.select.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Select the jinn-agent lane from the diff
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MG_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MG_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "${EVENT_NAME}" in
            pull_request)
              diff_base="${PR_BASE_SHA}"
              diff_head="${PR_HEAD_SHA}"
              ;;
            merge_group)
              diff_base="${MG_BASE_SHA}"
              diff_head="${MG_HEAD_SHA}"
              ;;
            push)
              diff_base="${PUSH_BEFORE_SHA}"
              diff_head="${PUSH_HEAD_SHA}"
              ;;
            *)
              echo "${EVENT_NAME} carries no diff; selecting the jinn-agent lane"
              echo 'run=true' >> "${GITHUB_OUTPUT}"
              exit 0
              ;;
          esac
          # A branch creation sends all-zeros, and a force-push can send a base that
          # is no longer reachable. Neither can be diffed, so select conservatively
          # rather than failing a required context.
          if [ -z "${diff_base}" ] \
            || [ "${diff_base}" = '0000000000000000000000000000000000000000' ] \
            || ! git cat-file -e "${diff_base}^{commit}" 2>/dev/null; then
            echo "no usable diff base (${diff_base:-empty}); selecting the jinn-agent lane"
            echo 'run=true' >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          # One extended regular expression per path this workflow used to filter on,
          # translated faithfully from the deleted globs: `**` is a prefix match, a
          # single `*` matches within one path segment, and a literal path is anchored
          # at both ends.
          patterns=(
            '^apps/jinn-agent/'
            '^plugin/frozen/'
            '^packages/plugin/'
            '^packages/core/'
            '^packages/layer/'
            '^operator/src/solver-types/_swe-rebench-v2-[^/]*\.ts$'
            '^operator/src/adapters/mech/ipfs\.ts$'
            '^operator/src/harnesses/impls/swe-rebench-v2-evaluator/'
            '^operator/scripts/stage1-task-creator-acceptance\.mjs$'
            '^operator/package\.json$'
            '^operator/yarn\.lock$'
            '^\.github/workflows/jinn-agent-ci\.yml$'
          )
          printf '%s\n' "${patterns[@]}" > "${RUNNER_TEMP}/selection.ere"
          changed="$(git diff --name-only "${diff_base}...${diff_head}")"
          echo "${changed}"
          if printf '%s\n' "${changed}" | grep -qE -f "${RUNNER_TEMP}/selection.ere"; then
            echo 'run=true' >> "${GITHUB_OUTPUT}"
          else
            echo 'run=false' >> "${GITHUB_OUTPUT}"
          fi

  generate:
    name: Generate test slices
    needs: changes
    if: >-
      needs.changes.outputs.run == 'true' &&
      (github.event_name == 'pull_request' ||
      github.event_name == 'push' ||
      github.event_name == 'merge_group')
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - name: Restore duration cache
        id: durations
        uses: actions/cache/restore@v6
        with:
          path: apps/jinn-agent/test_durations.json
          key: jinn-agent-test-durations-${{ github.run_id }}
          restore-keys: |
            jinn-agent-test-durations-

      - name: Seed cold durations if cache miss
        if: steps.durations.outputs.cache-hit != 'true'
        working-directory: apps/jinn-agent
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('test_durations.json')
          data = {}
          if path.is_file():
              try:
                  data = json.loads(path.read_text())
              except json.JSONDecodeError:
                  data = {}
          # Cold seed: isolate the heavy acceptance gate under LPT on first runs.
          data.setdefault(
              'tests/dehermes/test_main_path_acceptance.py',
              790.0,
          )
          path.write_text(json.dumps(data, indent=2, sort_keys=True) + '\n')
          print(f'seeded {path} entries={len(data)}')
          PY

      - name: Generate test slices
        id: matrix
        working-directory: apps/jinn-agent
        run: |
          set -euo pipefail
          # Same file set as the former two-step job, INCLUDING acceptance.
          # Ubuntu runners have GNU paste; keep paste -sd: for CI parity with
          # the previous workflow snippet.
          FILES=$( {
            find tests/hermes_cli tests/dehermes -name 'test_*.py'
            find tests/plugins -maxdepth 1 -name 'test_jinn_*.py'
            printf '%s\n' tests/scripts/test_clean_jinn_test_pollution.py
          } | sort | paste -sd: )
          MATRIX=$(python3 scripts/run_tests_parallel.py --files "$FILES" --generate-slices 4)
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  test:
    name: Test slice ${{ matrix.slice.index }}/4
    if: >-
      needs.changes.outputs.run == 'true' &&
      (github.event_name == 'pull_request' ||
      github.event_name == 'push' ||
      github.event_name == 'merge_group')
    needs: [changes, generate]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.generate.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # 9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            apps/jinn-agent/pyproject.toml
            apps/jinn-agent/uv.lock

      - name: Set up Python 3.11
        working-directory: apps/jinn-agent
        run: uv python install 3.11

      - name: Install dependencies
        uses: ./apps/jinn-agent/.github/actions/retry
        with:
          working-directory: apps/jinn-agent
          command: uv sync --locked --python 3.11 --extra all --extra dev

      - name: Minimize uv cache
        working-directory: apps/jinn-agent
        run: uv cache prune --ci

      - name: Run tests (slice ${{ matrix.slice.index }}/4)
        # Per-file isolation via scripts/run_tests.sh. File list comes from
        # generate (--generate-slices + --files); no solo acceptance step.
        run: |
          source .venv/bin/activate
          ./scripts/run_tests.sh --files '${{ matrix.slice.files }}' -j 4 --file-timeout 1200 -q
        env:
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""

      - name: Upload per-slice durations
        uses: actions/upload-artifact@v7
        with:
          name: test-durations-slice-${{ matrix.slice.index }}
          path: apps/jinn-agent/test_durations.json
          retention-days: 1
          if-no-files-found: warn

  save-durations:
    name: Save merged test durations
    needs: [changes, test]
    if: >-
      needs.changes.outputs.run == 'true' &&
      needs.test.result == 'success' &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/next' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .   # override workflow default (apps/jinn-agent)
    steps:
      - uses: actions/checkout@v7

      - name: Download all slice durations
        uses: actions/download-artifact@v8
        with:
          pattern: test-durations-slice-*
          path: durations

      - name: Merge into single durations file
        run: >-
          python3 apps/jinn-agent/scripts/merge_test_durations.py
          durations apps/jinn-agent/test_durations.json

      - name: Save merged duration cache
        uses: actions/cache/save@v6
        with:
          path: apps/jinn-agent/test_durations.json
          key: jinn-agent-test-durations-${{ github.run_id }}

  cold-stock-e2e:
    name: Cold-stock Stage 1 product gate
    needs: changes
    if: >-
      needs.changes.outputs.run == 'true' &&
      (github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'merge_group' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Enable Corepack
        working-directory: operator
        run: corepack enable
      - name: Install client dependencies
        working-directory: operator
        run: yarn install --immutable
      - name: Plugin package boundary, schema, type, test, and build gates
        working-directory: packages/plugin
        run: yarn install --immutable && yarn typecheck && yarn build && yarn test
      - name: Core package and contribution-store gates
        working-directory: packages/core
        run: >-
          yarn install --immutable &&
          yarn typecheck &&
          yarn build &&
          yarn vitest run test/contribution-store.test.ts
      - name: Layer package, process-contract, and build gates
        working-directory: packages/layer
        run: >-
          yarn install --immutable &&
          yarn typecheck &&
          yarn build &&
          yarn vitest run
          test/process-contract.test.ts
          test/contract-parity.test.ts
      - name: Build the daemon and run task-creator privacy gate
        working-directory: operator
        run: >-
          yarn build &&
          yarn vitest run
          test/solver-types/task-creator-session-echo.test.ts
      - name: Pinned stock-Hermes Stage 1 product journey
        env:
          JINN_STAGE1_SKIP_CLIENT_BUILD: '1'
        run: bash scripts/cold-stock-e2e.sh

  jinn-agent-gate:
    # The check-run name GitHub reports is this job's display `name:` below, and that
    # string is the required-status-check context registered on the `next` ruleset
    # (DR-2026-08-18-b D3) — keep them in sync.
    name: jinn-agent-gate
    needs: [changes, generate, test, save-durations, cold-stock-e2e]
    if: always()
    runs-on: ubuntu-latest
    defaults:
      run:
        # This job never checks out, so the workflow-level `apps/jinn-agent` default
        # would point every `run:` step at a directory that does not exist.
        working-directory: .
    steps:
      - name: Require exact success from every selected jinn-agent job
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SELECTED: ${{ needs.changes.outputs.run }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          GENERATE_RESULT: ${{ needs.generate.result }}
          # A matrix job's `result` is the aggregate over its slices: `success` only
          # when every slice passed. `save-durations` has always relied on that.
          TEST_RESULT: ${{ needs.test.result }}
          SAVE_DURATIONS_RESULT: ${{ needs.save-durations.result }}
          COLD_STOCK_RESULT: ${{ needs.cold-stock-e2e.result }}
        run: |
          set -euo pipefail
          echo "event=${EVENT_NAME} ref=${REF} selected=${SELECTED} changes=${CHANGES_RESULT}"
          echo "generate=${GENERATE_RESULT} test=${TEST_RESULT}"
          echo "save-durations=${SAVE_DURATIONS_RESULT} cold-stock-e2e=${COLD_STOCK_RESULT}"
          test "${CHANGES_RESULT}" = success
          # The slice jobs carry their own event gate: they run on pull_request, push,
          # and merge_group, and never on the nightly schedule or a manual dispatch.
          slice_expected=skipped
          case "${EVENT_NAME}" in
            pull_request|push|merge_group)
              if [ "${SELECTED}" = true ]; then
                slice_expected=success
              fi
              ;;
          esac
          test "${GENERATE_RESULT}" = "${slice_expected}"
          test "${TEST_RESULT}" = "${slice_expected}"
          # The cold-stock gate's event list admits every event this workflow accepts,
          # so selection alone decides it. On `schedule` and `workflow_dispatch` the
          # changes job has no diff to read and selects conservatively, which is what
          # keeps the nightly run running.
          cold_expected=skipped
          if [ "${SELECTED}" = true ]; then
            cold_expected=success
          fi
          test "${COLD_STOCK_RESULT}" = "${cold_expected}"
          # Duration-cache writes are push-only by design.
          durations_expected=skipped
          if [ "${SELECTED}" = true ] \
            && [ "${EVENT_NAME}" = push ] \
            && { [ "${REF}" = refs/heads/next ] || [ "${REF}" = refs/heads/main ]; }; then
            durations_expected=success
          fi
          test "${SAVE_DURATIONS_RESULT}" = "${durations_expected}"
