name: Layer Packages npm Publish

on:
  push:
    branches: [next]
    paths:
      - 'packages/plugin/**'
      - 'packages/core/**'
      - 'packages/layer/**'
      - '.github/workflows/layer-npm-publish.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Published layer release tag, for example layer-v0.1.0'
        required: true
        type: string
      release_sha:
        description: 'Exact commit SHA referenced by the published release tag'
        required: true
        type: string

# Trusted publishing (OIDC): automatic canaries use npm-publish. Stable
# publication uses the separately configured npm-stable-publish environment.
# No long-lived npm token is accepted by either path.
# Operator configuration and diagnosis: docs/runbooks/layer-npm-publishing.md
permissions:
  contents: read

concurrency:
  group: layer-packages-canary-${{ github.ref }}
  cancel-in-progress: false

env:
  ONNXRUNTIME_NODE_INSTALL: skip
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

jobs:
  plugin-canary:
    name: Publish plugin canary
    if: github.event_name == 'push'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    environment: npm-publish
    defaults:
      run:
        working-directory: packages/plugin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: npm install -g npm@11.5.1
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn typecheck
      - run: yarn build
      - run: yarn test
      - name: Patch canary version
        shell: bash
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-8)
          PUBLISH_VERSION="${PACKAGE_VERSION}-canary.${SHORT_SHA}"
          npm pkg set "version=${PUBLISH_VERSION}"
      - run: npm pack --dry-run
      - name: Publish plugin canary
        run: |
          unset NODE_AUTH_TOKEN
          npm publish --access public --tag canary

  core-canary:
    name: Publish core canary
    if: github.event_name == 'push'
    needs: plugin-canary
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    environment: npm-publish
    defaults:
      run:
        working-directory: packages/core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: npm install -g npm@11.5.1
      - run: corepack enable
      - run: yarn --cwd ../plugin install --immutable
      - run: yarn --cwd ../plugin build
      - run: yarn install --immutable
      - run: yarn typecheck
      - run: yarn build
      - run: yarn test
      - name: Patch canary version and dependency
        shell: bash
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          PLUGIN_VERSION=$(node -p "require('../plugin/package.json').version")
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-8)
          PUBLISH_VERSION="${PACKAGE_VERSION}-canary.${SHORT_SHA}"
          npm pkg set \
            "version=${PUBLISH_VERSION}" \
            "dependencies.@jinn-network/plugin=${PLUGIN_VERSION}-canary.${SHORT_SHA}"
      - run: npm pack --dry-run
      - name: Publish core canary
        run: |
          unset NODE_AUTH_TOKEN
          npm publish --access public --tag canary

  layer-canary:
    name: Publish layer canary
    if: github.event_name == 'push'
    needs: core-canary
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    environment: npm-publish
    defaults:
      run:
        working-directory: packages/layer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: npm install -g npm@11.5.1
      - run: corepack enable
      - run: yarn --cwd ../plugin install --immutable
      - run: yarn --cwd ../plugin build
      - run: yarn --cwd ../core install --immutable
      - run: yarn --cwd ../core build
      - run: yarn install --immutable
      - run: yarn typecheck
      - run: yarn build
      - run: yarn test
      - run: yarn pack:smoke
      - name: Patch canary version and dependencies
        shell: bash
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          PLUGIN_VERSION=$(node -p "require('../plugin/package.json').version")
          CORE_VERSION=$(node -p "require('../core/package.json').version")
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-8)
          PUBLISH_VERSION="${PACKAGE_VERSION}-canary.${SHORT_SHA}"
          npm pkg set \
            "version=${PUBLISH_VERSION}" \
            "dependencies.@jinn-network/plugin=${PLUGIN_VERSION}-canary.${SHORT_SHA}" \
            "dependencies.@jinn-network/core=${CORE_VERSION}-canary.${SHORT_SHA}"
      - run: npm pack --dry-run
      - name: Publish layer canary
        run: |
          unset NODE_AUTH_TOKEN
          npm publish --access public --tag canary

  stable-publish:
    name: Publish exact stable package set
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/next'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    environment: npm-stable-publish
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      RELEASE_SHA: ${{ inputs.release_sha }}
    steps:
      - name: Check out trusted next history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: next
          fetch-depth: 0
      - name: Validate release identity and next ancestry
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/next" ]; then
            echo "::error::Stable layer publication must be dispatched from refs/heads/next"
            exit 1
          fi
          if [[ ! "${RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Stable layer releases require an exact 40-character lowercase commit SHA"
            exit 1
          fi
          if [[ ! "${RELEASE_TAG}" =~ ^layer-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Stable layer releases require layer-v<semver>"
            exit 1
          fi
          PUBLISH_VERSION="${BASH_REMATCH[1]}"
          TAG_SHA="$(git ls-remote origin "refs/tags/${RELEASE_TAG}" "refs/tags/${RELEASE_TAG}^{}" | awk '$2 ~ /\^\{\}$/ { peeled=$1 } $2 !~ /\^\{\}$/ { direct=$1 } END { print peeled ? peeled : direct }')"
          if [ -z "${TAG_SHA}" ] || [ "${TAG_SHA}" != "${RELEASE_SHA}" ]; then
            echo "::error::Tag ${RELEASE_TAG} points at ${TAG_SHA:-<missing>}, expected ${RELEASE_SHA}"
            exit 1
          fi
          if ! git cat-file -e "${RELEASE_SHA}^{commit}" 2>/dev/null; then
            echo "::error::Release SHA ${RELEASE_SHA} is not available as a commit in the trusted checkout"
            exit 1
          fi
          if ! git merge-base --is-ancestor "${RELEASE_SHA}" origin/next; then
            echo "::error::Release SHA ${RELEASE_SHA} is not reachable from protected next"
            exit 1
          fi
          echo "PUBLISH_VERSION=${PUBLISH_VERSION}" >> "${GITHUB_ENV}"
      - name: Stage publisher from protected next
        shell: bash
        run: |
          git show origin/next:.github/scripts/publish-layer-stable.mjs > /tmp/publish-layer-stable.mjs
      - name: Check out validated release commit
        shell: bash
        run: |
          git checkout --detach "${RELEASE_SHA}"
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ "${ACTUAL_SHA}" != "${RELEASE_SHA}" ]; then
            echo "::error::Checked out ${ACTUAL_SHA}, expected ${RELEASE_SHA}"
            exit 1
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Verify exact stable pins
        run: |
          node .github/scripts/verify-layer-stable-version.mjs \
            --root . \
            --version "${PUBLISH_VERSION}"
      - run: npm install -g npm@11.16.0
      - run: corepack enable
      - run: yarn install --immutable
        working-directory: packages/plugin
      - run: yarn typecheck
        working-directory: packages/plugin
      - run: yarn build
        working-directory: packages/plugin
      - run: yarn test
        working-directory: packages/plugin
      - run: yarn install --immutable
        working-directory: packages/core
      - run: yarn typecheck
        working-directory: packages/core
      - run: yarn build
        working-directory: packages/core
      - run: yarn test
        working-directory: packages/core
      - run: yarn install --immutable
        working-directory: packages/layer
      - run: yarn typecheck
        working-directory: packages/layer
      - run: yarn build
        working-directory: packages/layer
      - run: yarn test
        working-directory: packages/layer
      - run: yarn pack:smoke
        working-directory: packages/layer
      # npm OIDC trusted publishing does not authenticate npm dist-tag, so a
      # cross-package atomic latest promotion is unavailable without adding a
      # long-lived token. The protected manual environment bounds the
      # transient partial-release window; the publisher resumes by exact SRI.
      - name: Publish coherent stable package set
        run: >-
          node /tmp/publish-layer-stable.mjs
          --root .
          --version "${PUBLISH_VERSION}"
