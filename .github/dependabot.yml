# .github/dependabot.yml
#
# Allowlist-only: Dependabot scans the directories listed below. Anything
# not listed (notably legacy/) is silently un-scanned. The 599 already-open
# alerts under legacy/jinn-cli-agents-reference/ are cleared in a sibling
# commit via .github/scripts/dismiss-legacy-dependabot-alerts.sh.
#
# Adding a new live npm manifest? Add an entry below.

version: 2
updates:
  # GitHub Actions workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      gha-minor-patch:
        update-types:
          - minor
          - patch

  # Live npm components — Jinn daemon + dashboard SPA
  - package-ecosystem: npm
    directory: "/client"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: npm
    directory: "/client/src/dashboard/spa"
    schedule:
      interval: weekly

  # Solidity tooling workspace (Hardhat + OZ contracts)
  - package-ecosystem: npm
    directory: "/contracts"
    schedule:
      interval: weekly

  # First-party packages
  - package-ecosystem: npm
    directory: "/packages/claim-relayer"
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: "/packages/indexer"
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: "/packages/indexer/explorer"
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: "/packages/sdk"
    schedule:
      interval: weekly

  # Apps
  - package-ecosystem: npm
    directory: "/apps/broadcast-bot"
    schedule:
      interval: weekly

  # External harness examples
  - package-ecosystem: npm
    directory: "/examples/external-harnesses/alternative-harness"
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: "/examples/external-harnesses/polymarket-forecaster"
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: "/examples/external-harnesses/prediction-evaluator"
    schedule:
      interval: weekly
