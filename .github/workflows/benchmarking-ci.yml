name: Benchmarking CI

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
  pull_request:
    paths:
      - "packages/benchmarking/**"
      - ".github/scripts/benchmarking-*.test.mjs"
      - ".github/workflows/benchmarking-ci.yml"
      - "docs/superpowers/specs/2026-07-28-benchmarking-application-design.md"
      - "docs/superpowers/specs/2026-08-16-evidence-first-benchmarking-design-amendment.md"
  push:
    branches: [next]
    paths:
      - "packages/benchmarking/**"
      - ".github/scripts/benchmarking-*.test.mjs"
      - ".github/workflows/benchmarking-ci.yml"
      - "docs/superpowers/specs/2026-07-28-benchmarking-application-design.md"
      - "docs/superpowers/specs/2026-08-16-evidence-first-benchmarking-design-amendment.md"

permissions:
  contents: read

env:
  BENCHMARKING_ROOT: packages/benchmarking

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify package inventory and dependency graph
        run: node --test .github/scripts/benchmarking-package-inventory.test.mjs
      - name: Verify source boundaries and canaries
        run: node --test .github/scripts/benchmarking-source-boundaries.test.mjs

  records:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Yarn 4.13.0
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate
      - name: Build cross-tree portal dependencies from source (§7.8)
        run: |
          (cd packages/evidence/protocol && yarn install --immutable && yarn build)
          (cd packages/task-execution/protocol && yarn install --immutable && yarn build)
          (cd packages/trust/core && yarn install --immutable && yarn build)
      - name: Verify Evidence-Native Benchmarking Protocol
        working-directory: packages/benchmarking/protocol
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
      - name: Upload Evidence-Native Benchmarking Protocol distribution
        uses: actions/upload-artifact@v4
        with:
          name: benchmarking-protocol-dist
          path: packages/benchmarking/protocol/dist
          if-no-files-found: error
          retention-days: 1
      - name: Verify Benchmarking Records
        working-directory: packages/benchmarking/records
        run: |
          yarn install --immutable
          yarn check:schemas
          yarn check:schema-parity
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Upload Benchmarking Records distribution
        uses: actions/upload-artifact@v4
        with:
          name: benchmarking-records-dist
          path: packages/benchmarking/records/dist
          if-no-files-found: error
          retention-days: 1

  evidence:
    needs: [records]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Yarn 4.13.0
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate
      - name: Build evidence-native dependencies from source
        run: |
          (cd packages/task-execution/protocol && yarn install --immutable && yarn build)
          (cd packages/trust/core && yarn install --immutable && yarn build)
          (cd packages/evidence/protocol && yarn install --immutable && yarn build)
          (cd packages/evidence/execution-evidence-builder && yarn install --immutable && yarn build)
          (cd packages/evidence/repository && yarn install --immutable && yarn build)
          (cd packages/evidence/attestation-issuer && yarn install --immutable && yarn build)
          (cd packages/benchmarking/protocol && yarn install --immutable && yarn build)
          (cd packages/benchmarking/records && yarn install --immutable && yarn build)
          (cd packages/benchmarking/aggregate && yarn install --immutable && yarn build)
      - name: Verify Evidence-Native Benchmarking Assembly
        working-directory: packages/benchmarking/evidence
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
      - name: Upload Evidence-Native Benchmarking Assembly distribution
        uses: actions/upload-artifact@v4
        with:
          name: benchmarking-evidence-dist
          path: packages/benchmarking/evidence/dist
          if-no-files-found: error
          retention-days: 1
      - name: Verify Native Capture Coordinator
        working-directory: packages/benchmarking/native-capture
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
      - name: Upload Native Capture Coordinator distribution
        uses: actions/upload-artifact@v4
        with:
          name: benchmarking-native-capture-dist
          path: packages/benchmarking/native-capture/dist
          if-no-files-found: error
          retention-days: 1
      - name: Verify TEP-Free Evaluation Issuance
        working-directory: packages/benchmarking/evaluation
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
      - name: Upload TEP-Free Evaluation Issuance distribution
        uses: actions/upload-artifact@v4
        with:
          name: benchmarking-evaluation-dist
          path: packages/benchmarking/evaluation/dist
          if-no-files-found: error
          retention-days: 1

  aggregate:
    needs: [records]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Yarn 4.13.0
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate
      - name: Build cross-tree portal dependencies from source (§7.8)
        run: |
          (cd packages/task-execution/protocol && yarn install --immutable && yarn build)
          (cd packages/trust/core && yarn install --immutable && yarn build)
          (cd packages/benchmarking/records && yarn install --immutable && yarn build)
      - name: Verify Benchmarking Aggregate
        working-directory: packages/benchmarking/aggregate
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Upload Benchmarking Aggregate distribution
        uses: actions/upload-artifact@v4
        with:
          name: benchmarking-aggregate-dist
          path: packages/benchmarking/aggregate/dist
          if-no-files-found: error
          retention-days: 1

  run:
    needs: [records, testing]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Yarn 4.13.0
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate
      - name: Build cross-tree portal dependencies from source (§7.8)
        run: |
          (cd packages/evidence/protocol && yarn install --immutable && yarn build)
          (cd packages/evidence/execution-evidence-builder && yarn install --immutable && yarn build)
          (cd packages/evidence/repository && yarn install --immutable && yarn build)
          (cd packages/evidence/discovery && yarn install --immutable && yarn build)
          (cd packages/evidence/execution-recorder && yarn install --immutable && yarn build)
          (cd packages/task-execution/protocol && yarn install --immutable && yarn build)
          (cd packages/task-execution/backend && yarn install --immutable && yarn build)
          (cd packages/task-execution/profiles && yarn install --immutable && yarn build)
          (cd packages/task-execution/backend-local/supervisor && yarn install --immutable && yarn build)
          (cd packages/task-execution/backend-local/workspace && yarn install --immutable && yarn build)
          (cd packages/task-execution/backend-local/launchers && yarn install --immutable && yarn build)
          (cd packages/task-execution/backend-local/assembly && yarn install --immutable && yarn build)
          (cd packages/task-execution/testing && yarn install --immutable && yarn build)
          (cd packages/trust/core && yarn install --immutable && yarn build)
          (cd packages/trust/resolve && yarn install --immutable && yarn build)
          (cd packages/discovery/protocol && yarn install --immutable && yarn build)
          (cd packages/trust/testing && yarn install --immutable && yarn build)
          (cd packages/benchmarking/records && yarn install --immutable && yarn build)
          (cd packages/benchmarking/testing && yarn install --immutable && yarn build)
      - name: Verify Benchmarking Run
        working-directory: packages/benchmarking/run
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Upload Benchmarking Run distribution
        uses: actions/upload-artifact@v4
        with:
          name: benchmarking-run-dist
          path: packages/benchmarking/run/dist
          if-no-files-found: error
          retention-days: 1

  interop:
    needs: [records, testing]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Yarn 4.13.0
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate
      - name: Build cross-tree portal dependencies from source (§7.8)
        run: |
          (cd packages/task-execution/protocol && yarn install --immutable && yarn build)
          (cd packages/task-execution/profiles && yarn install --immutable && yarn build)
          (cd packages/trust/core && yarn install --immutable && yarn build)
          (cd packages/benchmarking/records && yarn install --immutable && yarn build)
          (cd packages/benchmarking/aggregate && yarn install --immutable && yarn build)
          (cd packages/benchmarking/testing && yarn install --immutable && yarn build)
      - name: Verify Benchmarking Interop
        working-directory: packages/benchmarking/interop
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Upload Benchmarking Interop distribution
        uses: actions/upload-artifact@v4
        with:
          name: benchmarking-interop-dist
          path: packages/benchmarking/interop/dist
          if-no-files-found: error
          retention-days: 1

  marketplace:
    needs: [records, testing, run]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Yarn 4.13.0
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate
      - name: Build cross-tree portal dependencies from source (§7.8)
        run: |
          (cd packages/task-execution/protocol && yarn install --immutable && yarn build)
          (cd packages/task-execution/backend && yarn install --immutable && yarn build)
          (cd packages/task-execution/profiles && yarn install --immutable && yarn build)
          (cd packages/trust/core && yarn install --immutable && yarn build)
          (cd packages/trust/resolve && yarn install --immutable && yarn build)
          (cd packages/discovery/protocol && yarn install --immutable && yarn build)
          (cd packages/discovery/serve && yarn install --immutable && yarn build)
          (cd packages/marketplace/binding && yarn install --immutable && yarn build)
          (cd packages/marketplace/projector && yarn install --immutable && yarn build)
          (cd packages/benchmarking/records && yarn install --immutable && yarn build)
          (cd packages/benchmarking/testing && yarn install --immutable && yarn build)
          (cd packages/benchmarking/run && yarn install --immutable && yarn build)
      - name: Verify Benchmarking Marketplace
        working-directory: packages/benchmarking/marketplace
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Upload Benchmarking Marketplace distribution
        uses: actions/upload-artifact@v4
        with:
          name: benchmarking-marketplace-dist
          path: packages/benchmarking/marketplace/dist
          if-no-files-found: error
          retention-days: 1

  local:
    needs: [records, testing, run]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Yarn 4.13.0
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate
      - name: Build cross-tree portal dependencies from source (§7.8)
        run: |
          (cd packages/task-execution/protocol && yarn install --immutable && yarn build)
          (cd packages/task-execution/backend && yarn install --immutable && yarn build)
          (cd packages/task-execution/profiles && yarn install --immutable && yarn build)
          (cd packages/trust/core && yarn install --immutable && yarn build)
          (cd packages/benchmarking/records && yarn install --immutable && yarn build)
          (cd packages/benchmarking/aggregate && yarn install --immutable && yarn build)
          (cd packages/benchmarking/testing && yarn install --immutable && yarn build)
          (cd packages/benchmarking/run && yarn install --immutable && yarn build)
      - name: Verify Benchmarking Local
        working-directory: packages/benchmarking/local
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Upload Benchmarking Local distribution
        uses: actions/upload-artifact@v4
        with:
          name: benchmarking-local-dist
          path: packages/benchmarking/local/dist
          if-no-files-found: error
          retention-days: 1

  testing:
    needs: [records, aggregate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Yarn 4.13.0
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate
      - name: Build cross-tree portal dependencies from source (§7.8)
        run: |
          (cd packages/task-execution/protocol && yarn install --immutable && yarn build)
          (cd packages/task-execution/profiles && yarn install --immutable && yarn build)
          (cd packages/trust/core && yarn install --immutable && yarn build)
          (cd packages/benchmarking/records && yarn install --immutable && yarn build)
          (cd packages/benchmarking/aggregate && yarn install --immutable && yarn build)
      - name: Verify Benchmarking Testing (mandatory M1-M3 conformance)
        working-directory: packages/benchmarking/testing
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Upload Benchmarking Testing distribution
        uses: actions/upload-artifact@v4
        with:
          name: benchmarking-testing-dist
          path: packages/benchmarking/testing/dist
          if-no-files-found: error
          retention-days: 1

  publication:
    needs: [records]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Yarn 4.13.0
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate
      - name: Build publication dependencies from source
        run: |
          (cd packages/task-execution/protocol && yarn install --immutable && yarn build)
          (cd packages/trust/core && yarn install --immutable && yarn build)
          (cd packages/discovery/protocol && yarn install --immutable && yarn build)
          (cd packages/discovery/serve && yarn install --immutable && yarn build)
          (cd packages/discovery/publication && yarn install --immutable && yarn build)
          (cd packages/benchmarking/records && yarn install --immutable && yarn build)
      - name: Verify Benchmarking Publication
        working-directory: packages/benchmarking/publication
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Upload Benchmarking Publication distribution
        uses: actions/upload-artifact@v4
        with:
          name: benchmarking-publication-dist
          path: packages/benchmarking/publication/dist
          if-no-files-found: error
          retention-days: 1

  verify:
    needs: [architecture, records, evidence, testing, aggregate, run, publication, interop, marketplace, local]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every Benchmarking CI stage to succeed
        env:
          ARCHITECTURE_RESULT: ${{ needs.architecture.result }}
          RECORDS_RESULT: ${{ needs.records.result }}
          EVIDENCE_RESULT: ${{ needs.evidence.result }}
          TESTING_RESULT: ${{ needs.testing.result }}
          AGGREGATE_RESULT: ${{ needs.aggregate.result }}
          RUN_RESULT: ${{ needs.run.result }}
          PUBLICATION_RESULT: ${{ needs.publication.result }}
          INTEROP_RESULT: ${{ needs.interop.result }}
          MARKETPLACE_RESULT: ${{ needs.marketplace.result }}
          LOCAL_RESULT: ${{ needs.local.result }}
        run: |
          for result in \
            "$ARCHITECTURE_RESULT" \
            "$RECORDS_RESULT" \
            "$EVIDENCE_RESULT" \
            "$TESTING_RESULT" \
            "$AGGREGATE_RESULT" \
            "$RUN_RESULT" \
            "$PUBLICATION_RESULT" \
            "$INTEROP_RESULT" \
            "$MARKETPLACE_RESULT" \
            "$LOCAL_RESULT"; do
            test "$result" = "success"
          done
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Yarn 4.13.0
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate
      - name: Restore all package distributions
        uses: actions/download-artifact@v4
        with:
          pattern: benchmarking-*-dist
          path: .benchmarking-dist
      - name: Place package distributions
        run: |
          mkdir -p packages/benchmarking/protocol/dist
          cp -R .benchmarking-dist/benchmarking-protocol-dist/. packages/benchmarking/protocol/dist/
          mkdir -p packages/benchmarking/evidence/dist
          cp -R .benchmarking-dist/benchmarking-evidence-dist/. packages/benchmarking/evidence/dist/
          mkdir -p packages/benchmarking/evaluation/dist
          cp -R .benchmarking-dist/benchmarking-evaluation-dist/. packages/benchmarking/evaluation/dist/
          mkdir -p packages/benchmarking/native-capture/dist
          cp -R .benchmarking-dist/benchmarking-native-capture-dist/. packages/benchmarking/native-capture/dist/
          mkdir -p packages/benchmarking/records/dist
          cp -R .benchmarking-dist/benchmarking-records-dist/. packages/benchmarking/records/dist/
          mkdir -p packages/benchmarking/testing/dist
          cp -R .benchmarking-dist/benchmarking-testing-dist/. packages/benchmarking/testing/dist/
          mkdir -p packages/benchmarking/aggregate/dist
          cp -R .benchmarking-dist/benchmarking-aggregate-dist/. packages/benchmarking/aggregate/dist/
          mkdir -p packages/benchmarking/run/dist
          cp -R .benchmarking-dist/benchmarking-run-dist/. packages/benchmarking/run/dist/
          mkdir -p packages/benchmarking/publication/dist
          cp -R .benchmarking-dist/benchmarking-publication-dist/. packages/benchmarking/publication/dist/
          mkdir -p packages/benchmarking/interop/dist
          cp -R .benchmarking-dist/benchmarking-interop-dist/. packages/benchmarking/interop/dist/
          mkdir -p packages/benchmarking/marketplace/dist
          cp -R .benchmarking-dist/benchmarking-marketplace-dist/. packages/benchmarking/marketplace/dist/
          mkdir -p packages/benchmarking/local/dist
          cp -R .benchmarking-dist/benchmarking-local-dist/. packages/benchmarking/local/dist/
      - name: Build cross-tree portal dependencies from source (§7.8)
        run: |
          (cd packages/task-execution/protocol && yarn install --immutable && yarn build)
          (cd packages/task-execution/profiles && yarn install --immutable && yarn build)
          (cd packages/task-execution/backend && yarn install --immutable && yarn build)
          (cd packages/trust/core && yarn install --immutable && yarn build)
          (cd packages/trust/resolve && yarn install --immutable && yarn build)
          (cd packages/discovery/protocol && yarn install --immutable && yarn build)
          (cd packages/discovery/serve && yarn install --immutable && yarn build)
          (cd packages/discovery/publication && yarn install --immutable && yarn build)
          (cd packages/marketplace/binding && yarn install --immutable && yarn build)
          (cd packages/marketplace/projector && yarn install --immutable && yarn build)
      - name: Compile packed public entrypoint consumers
        run: node .github/scripts/benchmarking-packed-types.test.mjs
