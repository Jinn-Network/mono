name: Publish

on:
  release:
    types: [published]

# Trusted publishing (OIDC): register this workflow on npmjs for @jinn-network/client
# (GitHub repo + workflow file name must match exactly).
permissions:
  contents: read
  id-token: write

defaults:
  run:
    working-directory: client

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm-publish
    env:
      JINN_BUILD_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # npm trusted publishing requires npm CLI >= 11.5.1 (bundled Node may be older).
      - run: npm install -g npm@11.5.1
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn build

      # Run tests against the built artifact — no rebuild after this point
      - run: yarn test

      # Tokenless publish via OIDC — do not set NODE_AUTH_TOKEN / NPM_TOKEN.
      - name: Publish to npm (OIDC trusted publishing)
        run: |
          unset NODE_AUTH_TOKEN
          npm publish --access public
