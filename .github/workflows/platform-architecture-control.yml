name: Platform Architecture Control

on:
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Pull requests from forks receive a restricted token. The reusable verifier's
# artifact attestations need id-token/attestations write, so fork runs can stop
# at that permission boundary and must be rerun by a maintainer in the trusted
# repository context. This workflow never uses pull_request_target.
permissions:
  contents: read

jobs:
  platform-architecture-control:
    name: platform-architecture-control
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate catalog and architecture ownership
        run: |
          mkdir -p .architecture-control
          node --test \
            .github/scripts/platform-catalog.test.mjs \
            .github/scripts/colophon-publish-manifest.test.mjs \
            .github/scripts/transition-manifest.test.mjs \
            .github/scripts/phase-d-transition-deletion.test.mjs \
            .github/scripts/observation-reader-gate-boundary.test.mjs \
            .github/scripts/architecture-control.test.mjs \
            .github/scripts/branch-protection-audit.test.mjs \
            .github/scripts/benchmark-product-source-boundaries.test.mjs \
            .github/scripts/architecture-control-workflow.test.mjs \
            .github/scripts/platform-verification-selection.test.mjs \
            .github/scripts/required-check-set.test.mjs
          node .github/scripts/architecture-control.mjs \
            --out .architecture-control/coverage.json
          node .github/scripts/generate-architecture.mjs --check
      - name: Upload deterministic ownership coverage
        uses: actions/upload-artifact@v4
        with:
          name: platform-architecture-control-coverage
          path: .architecture-control/coverage.json
          if-no-files-found: error
          retention-days: 30

  # `platform-verification.yml` fans into six domain lanes through `workflow_call`,
  # which ignores `paths:` filters, so every pull request paid for all six lanes.
  # Selection is gated here at the caller rather than per-lane inside the reusable
  # workflow: a skipped lane reaches `platform-verification-receipt.mjs` as
  # `skipped`, and that script requires every gate to be exact success before the
  # receipt is attested. Gating the whole call keeps the receipt's meaning intact —
  # whenever a receipt exists, every lane it names genuinely ran and passed.
  verification-selection:
    name: verification-selection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.select.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Select verification from the changed-package closure
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MG_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        # A merge group carries its own base/head pair, so the same changed-package
        # closure the pull_request lane already trusts applies to the speculative
        # merge commit (DR-2026-08-18-b D3). Without this a merge group bypassed
        # selection and paid the full battery (observed 11-43 min) for every entry,
        # however narrow. The selector itself is event-agnostic — it consumes a path
        # list on stdin — so only the diff endpoints differ between the two lanes.
        # The merge-group head is read as `GITHUB_SHA` rather than
        # `merge_group.head_sha` so the diff head is by construction the commit the
        # checkout above resolved — one source of truth for the head, not two that
        # can drift apart. With `max_entries_to_build: 2` the `merge_group.base_sha`
        # of a successor entry is the predecessor group's speculative head, so
        # selection for that entry is computed relative to the predecessor rather
        # than the branch tip — the same trade the pull_request lane already makes
        # against a merge base that a later push can move.
        #
        # Selection is fail-loud in both directions. An unresolved endpoint or a
        # broken `git diff` must red this job, never quietly resolve to "nothing
        # changed": `pipefail` keeps the pipeline's exit status from being masked by
        # the selector, and the emptiness guard closes the case an empty
        # `diff_base` opens, where git reads `"...${diff_head}"` as
        # `HEAD...${diff_head}` and legitimately reports an empty diff. A red here
        # leaves SELECTION_RESULT != success, which the terminal
        # `platform-verification` gate already refuses.
        run: |
          set -o pipefail
          case "${EVENT_NAME}" in
            pull_request)
              diff_base="${BASE_SHA}"
              diff_head="${HEAD_SHA}"
              ;;
            merge_group)
              diff_base="${MG_BASE_SHA}"
              diff_head="${GITHUB_SHA}"
              ;;
            *)
              echo 'non-PR, non-merge-group event verifies in full'
              echo 'run=true' >> "${GITHUB_OUTPUT}"
              exit 0
              ;;
          esac
          if [ -z "${diff_base}" ] || [ -z "${diff_head}" ]; then
            echo "::error::selection endpoints unresolved on ${EVENT_NAME}; refusing to unselect"
            exit 1
          fi
          selection="$(git diff --name-only "${diff_base}...${diff_head}" \
            | node .github/scripts/platform-verification-selection.mjs)"
          echo "${selection}"
          echo "run=$(jq -r '.run' <<<"${selection}")" >> "${GITHUB_OUTPUT}"

  platform-release-surface:
    name: platform-release-surface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate the profile root, publish path, and their workflow shapes
        run: |
          node --test \
            .github/scripts/build-profile-root.test.mjs \
            .github/scripts/sign-profile-manifest.test.mjs \
            .github/scripts/public-surface-assets.test.mjs \
            .github/scripts/platform-verification-receipt.test.mjs \
            .github/scripts/platform-verification-workflow.test.mjs \
            .github/scripts/stack-publish-workflow.test.mjs \
            .github/scripts/stack-publication-surface.test.mjs \
            .github/scripts/stack-trusted-publishers.test.mjs \
            .github/scripts/colophon-publish-manifest.test.mjs \
            .github/scripts/generate-architecture.test.mjs
      # The publication surface's other half: that the deploy bundle is actually servable,
      # and that the live-host gate passes over a real socket rather than an injected
      # fetch. Hermetic by construction -- an ephemeral loopback listener with a throwaway
      # in-memory certificate. No egress, no credentials, no host CLI. The first two files
      # are C3's own bundle-generator and gate suites, which shipped unwired.
      - name: Prove the deploy bundle is servable and the gate passes over a socket
        run: |
          node --test \
            .github/scripts/build-profile-host-bundle.test.mjs \
            .github/scripts/verify-live-profile-host.test.mjs \
            .github/scripts/serve-profile-host.test.mjs \
            .github/scripts/verify-local-profile-host.test.mjs

  platform-verification-reusable:
    name: platform-verification-reusable
    needs: verification-selection
    if: needs.verification-selection.outputs.run == 'true'
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/platform-verification.yml
    with:
      source_sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      lane: canary
    secrets:
      JINN_PROFILE_MANIFEST_SIGNING_KEY: ${{ secrets.JINN_PROFILE_MANIFEST_SIGNING_KEY }}
      JINN_PROFILE_MANIFEST_KEY_ID: ${{ secrets.JINN_PROFILE_MANIFEST_KEY_ID }}

  platform-verification:
    name: platform-verification
    needs:
      - verification-selection
      - platform-verification-reusable
    if: always()
    runs-on: ubuntu-latest
    steps:
      # When verification is selected the bar is unchanged: exact success. When it is
      # not selected the reusable call must be exactly `skipped` — a failed or
      # cancelled call still fails this gate, so unselection can never launder a red.
      - name: Require exact reusable-verification success unless unselected
        env:
          SELECTED: ${{ needs.verification-selection.outputs.run }}
          SELECTION_RESULT: ${{ needs.verification-selection.result }}
          VERIFICATION_RESULT: ${{ needs.platform-verification-reusable.result }}
        run: |
          test "${SELECTION_RESULT}" = success
          if [ "${SELECTED}" != true ]; then
            test "${VERIFICATION_RESULT}" = skipped
            echo 'no changed package reaches a verified lane; verification unselected'
            exit 0
          fi
          test "${VERIFICATION_RESULT}" = success
