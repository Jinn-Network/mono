name: Stack npm Publish

# The catalog-selected stack-published groups publish as receipt-bound coherent sets. Canary
# publication consumes only the exact tarballs and immutable receipts produced by
# the same run's reusable platform verification workflow.
on:
  push:
    branches: [integration/evidence-v1, next]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Published stack release tag to verify, for example stack-v0.1.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'push' && 'stack-npm-publish-canary' || format('stack-npm-publish-stable-{0}', github.event.release.tag_name || inputs.release_tag) }}
  cancel-in-progress: false

jobs:
  canary-verification:
    if: github.event_name == 'push'
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/platform-verification.yml
    with:
      source_sha: ${{ github.sha }}
      lane: canary
    secrets:
      JINN_PROFILE_MANIFEST_SIGNING_KEY: ${{ secrets.JINN_PROFILE_MANIFEST_SIGNING_KEY }}
      JINN_PROFILE_MANIFEST_KEY_ID: ${{ secrets.JINN_PROFILE_MANIFEST_KEY_ID }}

  canary-publish:
    name: stack-canary
    needs: canary-verification
    if: >-
      github.event_name == 'push' &&
      needs.canary-verification.result == 'success' &&
      vars.PLATFORM_CANARY_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: npm-publish
    strategy:
      fail-fast: false
      matrix:
        release_group:
          - sealed-platform-v1
          - implementations-v1
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Verify exact publication checkout
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install npm 11.19.0
        run: npm install -g npm@11.19.0
      - name: Download same-run prepublication artifacts
        uses: actions/download-artifact@v8
        with:
          name: platform-verification-artifacts
          path: .platform-verification
      - name: Download same-run verification receipt
        uses: actions/download-artifact@v8
        with:
          name: platform-verification-receipt
          path: .platform-verification-receipt
      - name: Verify provenance and publish receipt-bound canary
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          # npm has accepted a publish, returned success, and then taken about
          # ten minutes to expose the exact version publicly. Keep the retry
          # bounded while allowing a fifteen-minute finalization window.
          JINN_NPM_REGISTRY_RETRY_ATTEMPTS: 181
          # A fresh npm process signs a fresh envelope. Retry only the exact
          # transparency-log duplicate outcome, and cap it at three attempts.
          JINN_NPM_TLOG_CONFLICT_RETRY_ATTEMPTS: 3
        run: |
          node .github/scripts/publish-verified-platform.mjs \
            --verification-root .platform-verification \
            --verification-receipt ".platform-verification-receipt/${{ matrix.release_group }}/verification-receipt.json" \
            --source-sha "${SOURCE_SHA}" \
            --release-group ${{ matrix.release_group }} \
            --lane canary \
            --registry https://registry.npmjs.org/ \
            --repository "${GITHUB_REPOSITORY}" \
            --out ".platform-publication/${{ matrix.release_group }}/publication-receipt.json"
      - name: Attest final publication receipt
        uses: actions/attest@v4
        with:
          subject-path: .platform-publication/${{ matrix.release_group }}/publication-receipt.json
      - name: Upload final publication receipt
        uses: actions/upload-artifact@v4
        with:
          name: platform-publication-receipt-${{ matrix.release_group }}
          path: .platform-publication/${{ matrix.release_group }}/publication-receipt.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

  # The step between "CI attested and signed the surface" and "the host serves it".
  # Copy only: the deploy bundle is rebuilt from this run's attested roots with the
  # same generator the runbook's break-glass recipe names, and no document is
  # regenerated here -- the signature sidecars ride in the artifact, so the signing
  # key is not needed and is deliberately not available to this job.
  # The mirror decision logic lives in the tested helper
  # `.github/scripts/refresh-profile-host.mjs`; this YAML owns only auth + the push.
  canary-host-refresh:
    name: canary-host-refresh
    needs: canary-verification
    # `github.ref` is spelled out because this workflow also fires on
    # integration/evidence-v1, which must never deploy the public host. The repository
    # variable is the enablement switch and the target in one, so the two cannot drift
    # apart; until an operator sets it this job skips and `next` stays green. The
    # `secrets` context is unreadable in a job `if:`, so the token half of the
    # configuration is enforced by a guard step rather than by this gate.
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/next' &&
      needs.canary-verification.result == 'success' &&
      vars.JINN_PROFILE_HOST_REPOSITORY != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      SOURCE_SHA: ${{ github.sha }}
      HOST_REPOSITORY: ${{ vars.JINN_PROFILE_HOST_REPOSITORY }}
      WORKFLOW_PATH: .github/workflows/stack-npm-publish.yml
    steps:
      - name: Checkout mono at the published SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: mono
          persist-credentials: false
      - name: Verify exact refresh checkout
        run: test "$(git -C mono rev-parse HEAD)" = "${SOURCE_SHA}"
      # Before the host checkout, not before the push: the token is needed to *read* a
      # private host repository. A half-configured repository is loud, not silent.
      - name: Guard the host push credential
        env:
          JINN_PROFILE_HOST_PUSH_TOKEN: ${{ secrets.JINN_PROFILE_HOST_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${JINN_PROFILE_HOST_PUSH_TOKEN:-}" ]; then
            echo "::error::JINN_PROFILE_HOST_PUSH_TOKEN is not configured, but JINN_PROFILE_HOST_REPOSITORY names ${HOST_REPOSITORY}. Add a fine-grained token with contents: write on that repository only; see docs/runbooks/jinn-network-profile-hosting.md."
            exit 1
          fi
      # `persist-credentials: false` with an explicit `token:` uses the credential for the
      # fetch without writing it into .git/config, so the push below still goes through
      # its own GIT_ASKPASS rather than an ambient one.
      - name: Checkout the profile host
        uses: actions/checkout@v7
        with:
          repository: ${{ env.HOST_REPOSITORY }}
          ref: main
          path: host
          fetch-depth: 0
          token: ${{ secrets.JINN_PROFILE_HOST_PUSH_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify the host refresh logic
        run: node --test mono/.github/scripts/refresh-profile-host.test.mjs
      # The attested roots are same-run only (retention-days: 1) and are restored by name
      # from this run, never by run-id from another. Precedent: platform-verification.yml.
      - name: Download same-run profile roots
        uses: actions/download-artifact@v8
        with:
          name: platform-verification-artifacts
          path: mono/.platform-verification
      # Into fresh runner-temp space, never into the host checkout: the generator refuses
      # a non-empty --out, and that refusal is what guarantees a bundle is exactly the
      # attested set with nothing riding along. The mirror step below is what reconciles
      # that directory with the host tree, deletions included.
      - name: Build the deploy bundle from the attested roots
        working-directory: mono
        env:
          BUNDLE_DIR: ${{ runner.temp }}/profile-host-bundle
        run: |
          set -euo pipefail
          groups="$(node --input-type=module <<'NODE'
          import { loadPlatformCatalog, stackPublishedReleaseGroupIds } from './.github/scripts/platform-catalog.mjs';
          process.stdout.write(stackPublishedReleaseGroupIds(loadPlatformCatalog(process.cwd())).join('\n'));
          NODE
          )"
          root_args=()
          while IFS= read -r group; do
            [ -z "${group}" ] && continue
            root_args+=(--root ".platform-verification/${group}/profile-root")
          done <<< "${groups}"
          if [ "${#root_args[@]}" -eq 0 ]; then
            echo "::error::the catalog names no stack-published release group"
            exit 1
          fi
          node .github/scripts/build-profile-host-bundle.mjs "${root_args[@]}" --out "${BUNDLE_DIR}"
      - name: Set the host git identity
        run: |
          set -euo pipefail
          git -C host config user.name "github-actions[bot]"
          git -C host config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Mirror the bundle into the host checkout
        id: mirror
        env:
          BUNDLE_DIR: ${{ runner.temp }}/profile-host-bundle
          HOST_DIR: host
        run: |
          set -euo pipefail
          node mono/.github/scripts/refresh-profile-host.mjs
      # A plain fast-forward: neither a forced update nor a `+` refspec, so a hand-push
      # into the host repository between checkout and push is a loud red rather than a
      # silent overwrite. The shape assertions refuse the flag anywhere in this job, so
      # it is deliberately not named here either.
      - name: Push to the host default branch
        if: steps.mirror.outputs.changed == 'true'
        env:
          JINN_PROFILE_HOST_PUSH_TOKEN: ${{ secrets.JINN_PROFILE_HOST_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          ASKPASS="$(mktemp)"
          trap 'rm -f "${ASKPASS}"' EXIT
          cat > "${ASKPASS}" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "${JINN_PROFILE_HOST_PUSH_TOKEN}" ;;
          esac
          EOF
          chmod 700 "${ASKPASS}"
          GIT_ASKPASS="${ASKPASS}" GIT_TERMINAL_PROMPT=0 \
            git -C host push "https://github.com/${HOST_REPOSITORY}.git" \
              HEAD:refs/heads/main
          echo "::notice::published the profile host @ ${SOURCE_SHA} to ${HOST_REPOSITORY} (main)"

  resolve-stable-source:
    if: >-
      (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'stack-v')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.event.release.tag_name }}
    steps:
      - name: Require a stack semantic-version tag
        run: |
          if ! [[ "${RELEASE_TAG}" =~ ^stack-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Stable verification requires stack-v<semver>, got ${RELEASE_TAG}"
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install npm 11.19.0 for the read-only fixture baseline
        run: npm install -g npm@11.19.0
      - name: Resolve immutable stable verification source
        id: source
        run: |
          set -euo pipefail
          # pipefail-lint: allow -- `ls-remote` is asked for one exact tag ref, so the
          # pipeline carries at most two lines and never fills the pipe buffer.
          TAG_SHA="$(git ls-remote origin "refs/tags/${RELEASE_TAG}" | awk '{print $1}' | head -n1)"
          if [ -z "${TAG_SHA}" ]; then
            echo "::error::Release tag ${RELEASE_TAG} does not exist on origin"
            exit 1
          fi
          PEELED="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          RESOLVED="$(git rev-parse "${TAG_SHA}^{commit}")"
          CHECKED_OUT="$(git rev-parse HEAD)"
          if [ "${PEELED}" != "${RESOLVED}" ] || [ "${CHECKED_OUT}" != "${RESOLVED}" ]; then
            echo "::error::Release tag ${RELEASE_TAG}, origin, and checked-out HEAD do not peel to one commit"
            exit 1
          fi
          TAG_VERSION="${RELEASE_TAG#stack-v}"
          PLATFORM_VERSION="$(node --input-type=module <<'NODE'
          import { loadStackPublishedCatalogPackages } from './.github/scripts/platform-catalog.mjs';
          const versions = new Set(loadStackPublishedCatalogPackages(process.cwd())
            .map(({ manifest }) => manifest.version));
          if (versions.size !== 1) throw new Error(`stack-published package versions disagree: ${[...versions].join(', ')}`);
          process.stdout.write([...versions][0]);
          NODE
          )"
          if [ "${PLATFORM_VERSION}" != "${TAG_VERSION}" ]; then
            echo "::error::Release tag ${RELEASE_TAG} names ${TAG_VERSION}, but stack-published packages are ${PLATFORM_VERSION}"
            exit 1
          fi
          echo "TAG_VERSION=${TAG_VERSION}" >> "${GITHUB_ENV}"
          echo "source_sha=${CHECKED_OUT}" >> "${GITHUB_OUTPUT}"
      - name: Verify stable fixture immutability baseline
        run: >-
          node .github/scripts/fixture-immutability.mjs
          --registry-baseline
          --version "${TAG_VERSION}"

  stable-verification:
    needs: resolve-stable-source
    if: needs.resolve-stable-source.result == 'success'
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/platform-verification.yml
    with:
      source_sha: ${{ needs.resolve-stable-source.outputs.source_sha }}
      lane: stable
    secrets:
      JINN_PROFILE_MANIFEST_SIGNING_KEY: ${{ secrets.JINN_PROFILE_MANIFEST_SIGNING_KEY }}
      JINN_PROFILE_MANIFEST_KEY_ID: ${{ secrets.JINN_PROFILE_MANIFEST_KEY_ID }}

  # Building and attesting an artifact is not proof that the public host serves it.
  # This job proves the second half against the live origin and is the sole reason the
  # unconditional hosting blocker could be removed. It touches the network, so it holds
  # nothing but contents: read; attestation is a separate, network-free job.
  stable-live-host-verification:
    name: stable-live-host-verification
    needs:
      - resolve-stable-source
      - stable-verification
    if: >-
      (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'stack-v')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      PROFILE_HOST_ORIGIN: https://spec.jinn.network
      SOURCE_SHA: ${{ needs.resolve-stable-source.outputs.source_sha }}
      PUBLIC_KEY_URL: ${{ vars.JINN_PROFILE_MANIFEST_PUBLIC_KEY_URL }}
      PUBLIC_KEY_SHA256: ${{ vars.JINN_PROFILE_MANIFEST_PUBLIC_KEY_SHA256 }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-stable-source.outputs.source_sha }}
      - name: Verify exact verification checkout
        run: test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Download same-run profile root
        uses: actions/download-artifact@v8
        with:
          name: platform-verification-artifacts
          path: .platform-verification
      - name: Download same-run verification receipt
        uses: actions/download-artifact@v8
        with:
          name: platform-verification-receipt
          path: .platform-verification-receipt
      - name: Bind the checked-out catalog digest
        id: catalog
        run: |
          set -euo pipefail
          DIGEST="$(node --input-type=module <<'NODE'
          import { catalogSha256 } from './.github/scripts/build-prepublication-bundle.mjs';
          process.stdout.write(catalogSha256(process.cwd()));
          NODE
          )"
          echo "digest=${DIGEST}" >> "${GITHUB_OUTPUT}"
      - name: Verify the live profile host serves the attested artifact
        id: gate
        env:
          CATALOG_DIGEST: ${{ steps.catalog.outputs.digest }}
        run: |
          groups="$(node --input-type=module <<'NODE'
          import { loadPlatformCatalog, stackPublishedReleaseGroupIds } from './.github/scripts/platform-catalog.mjs';
          process.stdout.write(stackPublishedReleaseGroupIds(loadPlatformCatalog(process.cwd())).join('\n'));
          NODE
          )"
          mkdir -p .platform-live-host
          while IFS= read -r group; do
            [ -z "${group}" ] && continue
            mkdir -p ".platform-live-host/${group}"
            node .github/scripts/verify-live-profile-host.mjs \
              --root ".platform-verification/${group}/profile-root" \
              --receipt ".platform-verification-receipt/${group}/verification-receipt.json" \
              --source-sha "${SOURCE_SHA}" \
              --catalog-digest "${CATALOG_DIGEST}" \
              --release-group "${group}" \
              --lane stable \
              --origin "${PROFILE_HOST_ORIGIN}" \
              --public-key-url "${PUBLIC_KEY_URL}" \
              --expect-public-key-sha256 "${PUBLIC_KEY_SHA256}" \
              --out ".platform-live-host/${group}/live-host-receipt.json"
          done <<< "${groups}"
      # Ordering, made legible instead of enforced. The push-to-next refresh
      # (canary-host-refresh) is not a `needs:` of this gate on purpose: putting a
      # write-credential job into the stable gate's dependency chain would let a
      # skipped refresh skip the gate, and the gate's whole point is that a skipped
      # upstream job is a refusal. So the cause is named here rather than sequenced.
      # Scoped to the gate step: a bare `if: failure()` would report host drift after a
      # failed checkout, when the job never reached the network.
      - name: Explain a stale or lane-mismatched host
        if: failure() && steps.gate.outcome == 'failure'
        run: >-
          echo "::error::The live profile host does not match this run's attested
          artifact. Before reading this as host drift:
          the host refresh may not have run yet for this source SHA,
          and a host last refreshed by the push-to-next canary-host-refresh job serves
          lane \"canary\" bytes, which never byte-match a stable manifest. The host's own
          .jinn-profile-host-source names the source SHA and lane it was last refreshed
          from. See docs/runbooks/jinn-network-profile-hosting.md,
          'Automatic host refresh'."
      - name: Upload live host receipt
        uses: actions/upload-artifact@v4
        with:
          name: platform-live-host-receipt
          path: .platform-live-host
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

  stable-live-host-attestation:
    name: stable-live-host-attestation
    needs: stable-live-host-verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download live host receipt
        uses: actions/download-artifact@v8
        with:
          name: platform-live-host-receipt
          path: .platform-live-host-receipt
      - name: Attest live host receipt
        uses: actions/attest@v4
        with:
          subject-path: .platform-live-host-receipt/**/live-host-receipt.json

  # The single node any future stable publisher depends on. It runs on every stable
  # event and asserts exact success, so a skipped or failed upstream job is a refusal
  # rather than an absence.
  stable-publish-gate:
    name: stable-publish-gate
    needs:
      - stable-verification
      - stable-live-host-verification
      - stable-live-host-attestation
    if: >-
      always() &&
      ((github.event_name == 'release' && startsWith(github.event.release.tag_name, 'stack-v')) ||
      github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Require same-run verification and live host proof
        env:
          VERIFICATION_RESULT: ${{ needs.stable-verification.result }}
          LIVE_HOST_RESULT: ${{ needs.stable-live-host-verification.result }}
          ATTESTATION_RESULT: ${{ needs.stable-live-host-attestation.result }}
        run: |
          if [ "${VERIFICATION_RESULT}" != "success" ] \
            || [ "${LIVE_HOST_RESULT}" != "success" ] \
            || [ "${ATTESTATION_RESULT}" != "success" ]; then
            echo "::error::Stable release is gated: verification=${VERIFICATION_RESULT} live-host=${LIVE_HOST_RESULT} attestation=${ATTESTATION_RESULT}"
            exit 1
          fi
          echo "Stable verification and live profile host proof both succeeded for this run."
