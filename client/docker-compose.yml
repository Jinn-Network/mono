version: '3.8'

# Jinn Client - Docker Operator Environment
#
# QUICK START:
# 1. Create a .env file in this directory with your password:
#    echo "JINN_PASSWORD=your-secure-password" > .env
#
# 2. (REQUIRED ONCE) Authenticate Claude for Docker:
#    On your host machine (where you have a browser), run:
#      claude setup-token
#    This opens OAuth in the browser and gives you a long-lived sk-* token.
#    Add it to your .env file:
#      echo "CLAUDE_CODE_OAUTH_TOKEN=sk-ant-oat01-..." >> .env
#
# 3. Start the daemon in the background:
#    docker compose up -d

services:
  jinn-daemon:
    image: ghcr.io/jinn-network/client:latest
    container_name: jinn-daemon
    restart: unless-stopped
    env_file:
      - .env
    # Optional explicitly defined defaults if .env is missing them
    environment:
      - JINN_NETWORK=${JINN_NETWORK:-testnet}
      - JINN_POLL_INTERVAL_MS=${JINN_POLL_INTERVAL_MS:-5000}
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:-}
      # Candidate verification is delegated to the isolated DinD service.
      # Never replace this with a host /var/run/docker.sock mount.
      - DOCKER_HOST=tcp://jinn-verifier-docker:2375
    depends_on:
      jinn-verifier-docker:
        condition: service_healthy
    ports:
      - "7331:7331"
    volumes:
      # Persistent daemon state: database, keystore, and earning progress
      - jinn-data:/data
      # Persistent authentication state: stores Claude's OAuth token. The image
      # now runs as the non-root `node` user, so file-auth lives at /home/node/.claude.
      - jinn-claude-state:/home/node/.claude
    command: ["run"]

  # Security boundary for Autopilot exact-head mechanical verification.
  # This daemon is privileged only inside its own container and receives no
  # host paths or Docker socket. Candidate source is streamed with `docker cp`;
  # candidate checks run in a second quota-bounded container whose network is
  # disconnected before any candidate-controlled code executes.
  jinn-verifier-docker:
    image: docker:27.5.1-dind@sha256:aa3df78ecf320f5fafdce71c659f1629e96e9de0968305fe1de670e0ca9176ce
    container_name: jinn-verifier-docker
    restart: unless-stopped
    privileged: true
    environment:
      - DOCKER_TLS_CERTDIR=
    command:
      - --host=tcp://0.0.0.0:2375
      - --tls=false
    expose:
      - "2375"
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    volumes:
      - jinn-verifier-docker-data:/var/lib/docker

volumes:
  jinn-data:
    name: jinn-data-volume
  jinn-claude-state:
    name: jinn-claude-auth-volume
  jinn-verifier-docker-data:
    name: jinn-verifier-docker-data-volume
