name: Layer CI

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'packages/layer/**'
      - 'packages/core/**'
      - 'packages/plugin/**'
      - 'operator/**'
      - '.github/workflows/layer-ci.yml'
      - '.github/workflows/layer-npm-publish.yml'
      - '.github/scripts/layer-publish-workflow.test.mjs'
      - '.github/scripts/publish-layer-stable.mjs'
      - '.github/scripts/publish-layer-stable.test.mjs'
      - '.github/scripts/verify-layer-stable-version.mjs'
      - 'docs/runbooks/layer-npm-publishing.md'
  push:
    branches: [main, next]
    paths:
      - 'packages/layer/**'
      - 'packages/core/**'
      - 'packages/plugin/**'
      - 'operator/**'
      - '.github/workflows/layer-ci.yml'
      - '.github/workflows/layer-npm-publish.yml'
      - '.github/scripts/layer-publish-workflow.test.mjs'
      - '.github/scripts/publish-layer-stable.mjs'
      - '.github/scripts/publish-layer-stable.test.mjs'
      - '.github/scripts/verify-layer-stable-version.mjs'
      - 'docs/runbooks/layer-npm-publishing.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Layer, Core, Plugin, and client validation is CPU-only. Avoid optional CUDA
# downloads from both supported onnxruntime-node installer generations.
env:
  ONNXRUNTIME_NODE_INSTALL: skip
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

jobs:
  check:
    name: Typecheck, Test, Build & Pack Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --immutable
        working-directory: packages/plugin
      - run: yarn build
        working-directory: packages/plugin
      - run: yarn install --immutable
        working-directory: packages/core
      - run: yarn build
        working-directory: packages/core
      - run: yarn install --immutable
        working-directory: packages/layer
      - run: yarn typecheck
        working-directory: packages/layer
      - run: yarn test
        working-directory: packages/layer
      - run: yarn build
        working-directory: packages/layer
      - run: yarn pack:smoke
        working-directory: packages/layer
      - name: Test layer workflow contracts
        run: node --test .github/scripts/layer-publish-workflow.test.mjs
      - name: Test stable publisher
        run: node --test .github/scripts/publish-layer-stable.test.mjs

  client-compat:
    name: Client Compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --immutable
        working-directory: operator
      - run: yarn build:plugin
        working-directory: operator
      - run: yarn build:core
        working-directory: operator
      - run: yarn build:layer
        working-directory: operator
      - run: yarn typecheck
        working-directory: operator
      - name: Test extracted-boundary consumers
        working-directory: operator
        run: |
          yarn vitest run \
            test/architecture/golden-envelope.test.ts \
            test/bin/jinn-layer-composition.test.ts \
            test/captures/capture-ingest.integration.test.ts \
            test/conformance/execution-envelope-authenticator.test.ts \
            test/scripts/pack-workflows.test.ts \
            test/solver-types/swe-rebench-v2-verifier-facts.test.ts \
            test/solver-types/task-creator-mineable-store.test.ts
