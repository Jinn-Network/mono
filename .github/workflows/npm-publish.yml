name: npm Publish

# Two-train cadence: canary publishes on every push to `next` (the integration branch).
# `main` is advanced only by the promote-main workflow on release: published — it stays
# in lock-step with what's currently in npm @latest. See docs/engineering/handbook.md §Cadence.
on:
  push:
    branches: [next]
    paths: ['client/**']
  release:
    types: [published]

# Trusted publishing (OIDC): register this single workflow on npmjs for
# @jinn-network/client. npm allows one trusted publisher config per package.
permissions:
  # contents: write is required for the dual-tag step (jinn-mono-2cl.6) which creates
  # and pushes the v2026.MM.DD date tag alongside the v<semver> tag. id-token: write
  # remains for npm trusted publishing OIDC.
  contents: write
  id-token: write

defaults:
  run:
    working-directory: client

jobs:
  publish:
    name: Publish package
    if: github.event_name == 'push' || startsWith(github.event.release.tag_name, 'client-v') || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    # Stable publish reruns the CI-safe release gates. The live donation-consumption
    # and app-first testnet gates require a producer daemon, UI auth/handshake, and
    # local operator evidence; those stay in `yarn release:client --prepare` before
    # Captain publishes the GitHub Release.
    timeout-minutes: 90
    environment: npm-publish
    env:
      JINN_BUILD_COMMIT: ${{ github.sha }}
      # Use the high-quota Tenderly Base Sepolia gateway for CI e2e gates.
      # Without this, the e2e falls back to the public `https://sepolia.base.org`
      # which is heavily rate-limited and bites the `Base Sepolia fork
      # SolverNet creation + launch + lifecycle` phase. See #313 thread.
      #
      # Per issue #592 (AC5): this secret may be a comma-separated list of
      # RPC URLs (e.g. `https://tenderly.../<key>,https://base-sepolia.publicnode.com`).
      # The daemon's loadConfig() splits on commas and builds a viem fallback()
      # transport chain — primary is tried first, secondary on
      # error / 429 / quota exhaustion. Solves the T1.1 getTransactionReceipt
      # timeout class of CI flake without requiring a paid backup secret.
      BASE_SEPOLIA_RPC_URL: ${{ secrets.BASE_SEPOLIA_RPC_URL }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - run: npm install -g npm@11.5.1
      - run: corepack enable
      - run: yarn install --immutable
      # Keep the publish test environment aligned with CI. Some client unit
      # tests spawn a local Anvil fork and fail with `spawn anvil ENOENT`
      # unless Foundry is installed.
      - uses: foundry-rs/foundry-toolchain@v1

      - name: Resolve publish metadata
        id: meta
        shell: bash
        run: |
          PACKAGE_VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('package.json','utf8')).version)")
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-8)

          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            PUBLISH_VERSION="${PACKAGE_VERSION}-canary.${SHORT_SHA}"
            DIST_TAG="canary"
          else
            RELEASE_TAG="${{ github.event.release.tag_name }}"
            # Two accepted tag formats per the engineering handbook §Cadence:
            # - v<semver>    (new format, used by the Monday scaffold workflow — jinn-mono-2cl.2)
            # - client-v<semver>  (legacy format, kept for backwards-compatibility)
            # The companion v2026.MM.DD date tag (jinn-mono-2cl.6) is created in a separate
            # step after publish — it is NOT used as the npm-publish trigger.
            case "${RELEASE_TAG}" in
              client-v*)
                PUBLISH_VERSION="${RELEASE_TAG#client-v}"
                ;;
              v*)
                PUBLISH_VERSION="${RELEASE_TAG#v}"
                # Guard against `v<garbage>` tags slipping through the `startsWith(v)` filter
                # in the job-level `if:` (e.g. `vbeta`, `v-foo`). Require semver-shaped suffix.
                if ! [[ "${PUBLISH_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                  echo "::error::Release tag ${RELEASE_TAG} does not look like v<semver>; got version: ${PUBLISH_VERSION}"
                  exit 1
                fi
                ;;
              *)
                echo "::error::Stable client releases must use tags shaped like v<semver> or client-v<semver>"
                exit 1
                ;;
            esac

            if [ "${PUBLISH_VERSION}" != "${PACKAGE_VERSION}" ]; then
              echo "::error::Release tag version ${PUBLISH_VERSION} does not match client/package.json version ${PACKAGE_VERSION}"
              exit 1
            fi

            DIST_TAG="latest"
          fi

          echo "package_version=${PACKAGE_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "publish_version=${PUBLISH_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "dist_tag=${DIST_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Patch package version for canary publish
        if: github.event_name == 'push'
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '${{ steps.meta.outputs.publish_version }}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - run: yarn typecheck
      - run: yarn build
      - run: yarn test

      - name: Publish canary
        if: steps.meta.outputs.dist_tag == 'canary'
        run: |
          unset NODE_AUTH_TOKEN
          npm publish --access public --tag canary

      - name: Verify stable release evidence marker
        if: steps.meta.outputs.dist_tag == 'latest'
        env:
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          node <<'NODE'
          const body = process.env.RELEASE_BODY ?? '';
          // Fixed substrings — must match exactly.
          const requiredExact = [
            ['schema marker', '<!-- jinn-release-evidence:v1'],
            ['release tag', `release-tag=${process.env.RELEASE_TAG}`],
            ['release commit', `release-commit=${process.env.RELEASE_SHA}`],
            ['marker close', '-->'],
          ];
          // Gate entries — accept either `=passed` (clean) OR
          // `=skipped:#<issue-num>` (documented exception with audit trail).
          // The skipped form is intentionally explicit: it requires a paired
          // GitHub issue describing why the gate couldn't be satisfied for
          // this release. Captain owns each individual skip; the issue link
          // is the audit record. See #312 for the relaxation rationale.
          const gateEntries = [
            ['release client prepare', 'release-client-prepare'],
            ['donation consumption', 'donation-consumption'],
            ['app-first testnet acceptance', 'app-first-testnet-acceptance'],
          ];

          const missing = [];
          for (const [label, needle] of requiredExact) {
            if (!body.includes(needle)) missing.push(`${label}: ${needle}`);
          }
          for (const [label, key] of gateEntries) {
            const passedRe = new RegExp(`${key}=passed\\b`);
            const skippedRe = new RegExp(`${key}=skipped:#\\d+\\b`);
            if (!passedRe.test(body) && !skippedRe.test(body)) {
              missing.push(`${label}: ${key}=passed (or =skipped:#<issue-num>)`);
            }
          }

          if (missing.length > 0) {
            console.error('Stable publish requires a jinn-release-evidence:v1 marker in the GitHub Release body.');
            console.error('Missing required evidence entries:');
            for (const item of missing) console.error(`- ${item}`);
            process.exit(1);
          }

          // Surface any skips so they're visible in the workflow log even on success.
          for (const [label, key] of gateEntries) {
            const m = body.match(new RegExp(`${key}=(skipped:#\\d+)`));
            if (m) console.warn(`::warning::Gate '${label}' marked as ${m[1]} for this release.`);
          }
          NODE

      # CI-safe release gate (jinn-mono-2cl.7, per the engineering handbook §Cadence).
      # The package's `prepublishOnly` script stays cheap; this workflow reruns the
      # deterministic Anvil gate before stable npm publish. The live donation and
      # app-first acceptance gates are release-prep evidence, not GitHub Actions
      # steps, because they need an operator daemon and local credentials.
      - name: Install contracts dependencies for release gate
        if: steps.meta.outputs.dist_tag == 'latest'
        working-directory: contracts
        run: yarn install --immutable

      # T1.4 (SPA route smoke) runs Playwright against Chromium. The yarn install
      # above pulls @playwright/test (the JS package) but not the actual browser
      # binaries, which live under ~/.cache/ms-playwright/. Without this step
      # T1.4 fails with `browserType.launch: Executable doesn't exist` and the
      # Tier 1 gate blocks the stable publish. `--with-deps` pulls the system
      # libraries Chromium needs on ubuntu-latest.
      - name: Install Playwright Chromium for Tier 1 T1.4
        if: steps.meta.outputs.dist_tag == 'latest'
        run: yarn playwright install --with-deps chromium

      # Tier 1 — mechanical floor (per spec/2026-05-19 §3 of release-readiness design).
      # Replaces the legacy operator-gate that saturated the Tenderly RPC under
      # multi-bootstrap load (see jinn-mono-lrey). Tier 1 runs four scenarios
      # (T1.1-T1.4) in parallel against a single Anvil fork; per-scenario budgets
      # cap wall-clock; verdicts feed the release-evidence marker.
      - name: Release gate — Tier 1 mechanical floor
        if: steps.meta.outputs.dist_tag == 'latest'
        run: yarn release:tier-1 "${{ steps.meta.outputs.publish_version }}"

      # Upload tier-1-evidence so the Captain can inspect per-scenario logs on
      # CI failures without re-running locally. `if: always()` ensures the
      # artifact is captured even when the Tier 1 gate exits non-zero.
      - name: Upload Tier 1 evidence
        if: always() && steps.meta.outputs.dist_tag == 'latest'
        uses: actions/upload-artifact@v7
        with:
          name: tier-1-evidence-${{ github.event.release.tag_name || github.sha }}
          path: client/tier-1-evidence/
          if-no-files-found: warn
          retention-days: 14

      - name: Publish stable
        if: steps.meta.outputs.dist_tag == 'latest'
        run: |
          unset NODE_AUTH_TOKEN
          npm publish --access public

      # Dual-tag policy (jinn-mono-2cl.6, per the engineering handbook §Cadence): the published
      # release commit also receives a v2026.MM.DD date tag for human-readable build identification
      # alongside the v<semver> tag that triggered this publish.
      #
      # Scoped to `v*` tags only (the new format from the Monday scaffold workflow). Legacy
      # `client-v*` releases are manual/pre-cadence and do not get a date tag — the dual-tag
      # policy is intentionally part of the new cadence, not retrofitted.
      #
      # Idempotent: if the date tag already exists pointing at the same SHA, the step is a no-op.
      # If it exists at a different SHA (two named releases on the same calendar day), the step
      # errors and asks for manual reconciliation.
      - name: Create v2026.MM.DD date tag
        if: steps.meta.outputs.dist_tag == 'latest' && startsWith(github.event.release.tag_name, 'v')
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          PUBLISHED_AT: ${{ github.event.release.published_at }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          # Format the date from the release's published_at (ISO 8601 from GitHub).
          # Use leading-zero %Y.%m.%d so May 18 is v2026.05.18, not v2026.5.18.
          DATE_TAG="$(date -u -d "$PUBLISHED_AT" +"v%Y.%m.%d")"

          # actions/checkout@v6 does a shallow clone and may not have fetched the just-created
          # release tag into refs/tags/. Fetch it explicitly before resolving.
          git fetch --tags --depth=1 origin "${RELEASE_TAG}"

          # Resolve the SHA the release points at. The release event sets tag_name on the published
          # release, so the v<semver> tag was just created. We tag the same SHA with the date tag.
          # `^{commit}` peels annotated tags (gh release create creates lightweight tags by default,
          # but this is safe either way).
          SHA="$(git rev-parse "${RELEASE_TAG}^{commit}")"

          if git rev-parse --verify --quiet "refs/tags/${DATE_TAG}" >/dev/null; then
            EXISTING_SHA="$(git rev-parse "${DATE_TAG}^{commit}")"
            if [ "${EXISTING_SHA}" = "${SHA}" ]; then
              echo "::notice::date tag ${DATE_TAG} already exists at the same SHA (${SHA}); no-op"
              exit 0
            else
              echo "::error::date tag ${DATE_TAG} already exists but points at ${EXISTING_SHA}, not ${SHA}. Manual reconciliation required (likely two named releases on the same calendar day)."
              exit 1
            fi
          fi

          # Configure git identity for the tag push. Use github-actions[bot] so the tag is
          # attributed to CI, not a human.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag "${DATE_TAG}" "${SHA}"
          git push origin "${DATE_TAG}"
          echo "::notice::Created date tag ${DATE_TAG} pointing at ${SHA} (alongside ${RELEASE_TAG})"
