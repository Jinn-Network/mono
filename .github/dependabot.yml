# .github/dependabot.yml
#
# Allowlist-only: Dependabot scans the directories listed below. Anything
# not listed is silently un-scanned.
#
# Wave-shape policy (issue #769):
#   - Minor + patch updates are GROUPED into one weekly PR per ecosystem
#     so the routine drift is reviewable at a glance.
#   - Major bumps come as INDIVIDUAL PRs so each can be assessed on its
#     own merits.
#   - A short list of framework majors is `ignore`-d below — these are
#     known migrations tracked in #768 (and later follow-ups). The ignore
#     is per-package, not a blanket "no majors" rule: anything not in the
#     list still surfaces as a PR, which is how we hear about drift.
#   - Library residuals chai / @scure/bip39 / lucide-react from the
#     2026-05-27 wave closed via #1596 (majors landed; ignore lines removed).
#
# Adding a new live npm manifest? Add an entry below, copying the inline
# `ignore:` block verbatim (see the note at the first npm entry). To accept
# a major bump that's currently ignored, remove that dependency's line from
# the ignore block on EVERY npm entry AND close out the migration tracking
# issue for that package.
#
# The /operator, /packages/sdk and /packages/indexer-enrichment entries carry
# directory-specific holds after the shared block, and /packages/indexer sets
# a versioning-strategy of its own. Copy the shared block to a new entry, not
# those holds. Each hold names the condition that lifts it.

version: 2
updates:
  # GitHub Actions workflows. Majors come as individual PRs by design —
  # GHA actions are usually safe to bump and the wave is small.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      gha-minor-patch:
        update-types:
          - minor
          - patch

  # Live npm components — Jinn daemon + dashboard SPA.
  # The major-ignore list below is duplicated verbatim on every npm entry.
  # Dependabot does NOT support YAML aliases (dependabot/dependabot-core#1582);
  # a shared &anchor / *alias silently invalidates the whole config — which
  # disables grouping AND the ignore list — so keep these blocks in sync by hand.
  - package-ecosystem: npm
    directory: "/operator"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Framework majors — migrations tracked in #768
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jsdom"
        update-types: ["version-update:semver-major"]
      # @types/node is never bumped here: it moves with the Node band, in one
      # pull request (see "Toolchain bands" in architecture/README.md). No
      # update-types, because a major-only rule let minors inside the 24, 25
      # and 26 majors keep coming back.
      # Lift: none. The rule stays when the band moves; that pull request
      # changes the types by hand.
      - dependency-name: "@types/node"
      # Hardhat ecosystem — tracked in #768 (couple-migration)
      - dependency-name: "hardhat"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@nomicfoundation/*"
        update-types: ["version-update:semver-major"]
      # Library majors with non-trivial API surface — tracked in #768
      - dependency-name: "@hono/node-server"
        update-types: ["version-update:semver-major"]
      - dependency-name: "sonner"
        update-types: ["version-update:semver-major"]
      - dependency-name: "zod"
        update-types: ["version-update:semver-major"]
      - dependency-name: "better-sqlite3"
        update-types: ["version-update:semver-major"]
      # First-party workspace packages. Dependabot reads Yarn's
      # `version: 0.0.0-use.local` workspace-resolution marker out of the
      # lockfile as though it were an installed version, then offers the
      # published stub as an "upgrade" — which is really a downgrade
      # (0.1.0 -> 0.0.0). These resolve from the workspace, never from the
      # registry, so no Dependabot update to them is ever correct.
      - dependency-name: "@jinn-network/*"
      # Holds specific to /operator. They sit after the shared block and are
      # not copied to other entries. Each uses update-types, which Dependabot
      # does not apply to security updates, so no hold here blocks one. A
      # security update is only opened when Dependabot security updates are
      # enabled for the repository; with them off, a fix for a held package
      # shows as an alert and needs a hand bump. Each hold says what lifts it.
      #
      # zod is pinned to exactly 4.4.3 in 41 manifests, in
      # .github/scripts/plugin-tree-guard-common.mjs and in
      # .github/scripts/colophon-publish-manifest.test.mjs, so a version move
      # is one coordinated change, not a bump. The shared block holds majors;
      # this holds minor and patch (issue #4898).
      # Lift: remove these two lines when zod is no longer pinned to one exact
      # version across these manifests. The rule is relative to the current
      # version, so it keeps holding after a coordinated move.
      - dependency-name: "zod"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      # @slicekit/erc8128 0.4 drops the replay option that
      # operator/src/auth/erc8128.ts passes. On a 0.x version Dependabot counts
      # 0.3 to 0.4 as minor, so this holds minor and major; 0.3.x patches
      # still arrive.
      # Lift: remove when the signer is migrated to 0.4.
      - dependency-name: "@slicekit/erc8128"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # @lmoe/gliner-onnx is pinned to exactly 0.1.0 in packages/core, which
      # /operator links by portal. Any bump in /operator alone, patch included,
      # fails `yarn install --immutable` with a Link step conflict, so this
      # holds every update type.
      # Lift: remove when packages/core no longer pins it to one exact version.
      - dependency-name: "@lmoe/gliner-onnx"
        update-types: ["version-update:semver-patch", "version-update:semver-minor", "version-update:semver-major"]
      # better-sqlite3 13 needs Node 22, but this package declares engines
      # node >=20 and range ^12.10.0; `resolutions` already holds 13.0.1.
      # Dependabot measures from that resolved 13.0.1, so it files 13.x as a
      # patch or minor and rewrites the declared range to ^13, which the
      # shared major hold cannot match. This holds minor and patch.
      # Lift: remove when this package's engines floor moves to Node 22.
      - dependency-name: "better-sqlite3"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      # canonicalize 4 and 5 change canonical output for inputs Jinn hashes
      # (lone surrogates throw, sparse arrays and some edge values serialize
      # differently), and 5 needs Node 22. Moving it is a digest-sensitive
      # migration across 12 manifests.
      # Lift: remove when that migration is scheduled.
      - dependency-name: "canonicalize"
        update-types: ["version-update:semver-major"]

