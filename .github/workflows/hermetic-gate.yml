name: hermetic-gate

# The deterministic, zero-external-dependency release gate (spec §3.1).
#
# docs/superpowers/specs/2026-05-31-release-pipeline-two-gate-redesign.md:
#   "CI proves the code is correct. ... Deterministic, zero external
#    dependencies → it *cannot* flake for infra reasons → a red is always a
#    real code regression."
#
# It runs the real daemon code against REAL contracts (JinnRouterV3 +
# TaskCoordinator + activity checker + the real OLAS Mech Marketplace) on a
# pinned Anvil `--dump-state` snapshot (spec §4 — snapshot, not fork: a fork
# reintroduces the network flakiness we are removing, needs a secret in PR CI,
# and rots silently). The snapshot is a committed fixture; the only network
# access in the whole pipeline lives in the offline builder
# `contracts/scripts/build-anvil-snapshot.ts`.
#
# This gate needs NO secrets, so it is safe to run on PRs from forks. It posts a
# single `hermetic-gate` check-run bound to github.sha via the shared poster
# (operator/scripts/release/post-check-run-verdict.mjs, owned by step 3).
#
# NOTE: this workflow is intentionally NOT a required check yet. Marking it
# required is a separate, human-applied branch-protection step (see the spec's
# migration plan §13 step 1 + the enable script). Until then it runs and posts
# its verdict advisorily so the publish guard can begin reading it.

on:
  pull_request:
  merge_group:
  push:
    branches:
      - next
      - 'release/*'

# Serialize per-ref so a force-push supersedes an in-flight run rather than
# racing two verdicts onto overlapping SHAs — but only on the PR lane, matching
# the other required-context producers (repository-structure.yml,
# stack-fixture-immutability.yml). Off the PR lane every run's verdict is wanted:
# a merge-group entry that loses its gate to a cancellation gets a red context
# and is ejected, and a superseded push to `next` still leaves the SHA-bound
# verdict the publish guard reads.
concurrency:
  group: hermetic-gate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  checks: write
  statuses: write

jobs:
  hermetic-gate:
    name: Hermetic gate (deterministic, snapshot)
    runs-on: ubuntu-latest
    # A hung step must not burn the merge queue's check-response budget, and must
    # not hold a runner for the 360-minute default against the plan's concurrent-job
    # ceiling. Observed green runs land around 12 minutes; the ceiling is generous
    # enough that a slow-but-real run is never truncated. A timeout is a job
    # `failure`, so `hermetic-gate-verdict` still posts the red context.
    timeout-minutes: 60
    env:
      # The deterministic loop tests the *loop*, not the *agent* (spec §3.1):
      # the prediction-v1-baseline harness needs no API key, so this gate has
      # zero credential dependencies.
      JINN_E2E_HARNESS: prediction-v1-baseline
      # This gate is CPU-only. Both onnxruntime-node versions in the dependency
      # graph otherwise auto-download optional Linux CUDA libraries during
      # postinstall. The current installer reads ONNXRUNTIME_NODE_INSTALL;
      # the nested legacy installer reads ONNXRUNTIME_NODE_INSTALL_CUDA.
      # Their CPU binaries remain bundled in the npm packages.
      ONNXRUNTIME_NODE_INSTALL: skip
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      # This job produces no verdict and posts nothing — it only succeeds or fails.
      # The check-run's SHA binding lives in `hermetic-gate-verdict` below, which is
      # the single place the context is constructed and posted.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: corepack enable

      # Foundry provides `anvil` — the snapshot is loaded via `anvil --load-state`
      # (deterministic, local disk I/O, no live RPC on the gate path).
      #
      # PIN the anvil version: anvil's `--dump-state` JSON schema is NOT stable
      # across releases. The committed fixture was authored with this nightly;
      # newer anvil rejects it at load (`missing field 'address'`) and current
      # stable rejects it too (`SerializableTransactionType`), so an unpinned
      # toolchain exits code 2 before becoming ready and reddens the whole gate.
      # This tag must move IN LOCKSTEP with the fixture: to bump anvil, rebuild
      # the snapshot (docs/snapshots/base-v3-snapshot.md) under the new version
      # and update this pin in the same PR.
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly-1c7c4bebce1e075989780fd401bf6bffcb424746

      # Keep the client dependency tree cached for speed only. Hermeticity does
      # not depend on a warm cache: the job-level ONNX flags above prevent both
      # direct and packages/core installs from downloading optional CUDA assets.
      - name: Cache client node_modules
        uses: actions/cache@v6
        with:
          path: operator/node_modules
          key: ${{ runner.os }}-client-nodemodules-${{ hashFiles('operator/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-client-nodemodules-

      - name: Install client deps
        working-directory: operator
        run: yarn install --immutable

      - name: Smoke snapshot builder entrypoint
        working-directory: operator
        run: yarn smoke:build-anvil-snapshot

      # Build the indexer (Ponder codegen) so the hermetic snapshot indexer
      # round-trip (test/hermetic/indexer-roundtrip.test.ts, run via
      # `yarn test:hermetic`) can spawn a real indexer against the snapshot chain.
      - name: Build indexer local package dependencies
        run: |
          (cd packages/task-execution/protocol && yarn install --immutable && yarn build)
          (cd packages/trust/core && yarn install --immutable && yarn build)
          (cd packages/benchmarking/records && yarn install --immutable && yarn build)

      - name: Install indexer deps
        working-directory: packages/indexer
        run: yarn install --immutable

      - name: Indexer codegen
        working-directory: packages/indexer
        run: yarn codegen

      # FAIL LOUD if the committed snapshot fixture is absent. It is large and
      # human/heavy-step generated (spec §4) — never fabricated by CI. Without it
      # the whole gate is meaningless, so this is a hard stop with a precise
      # remediation pointer, NOT a skip.
      - name: Assert snapshot fixture present
        run: |
          STATE_DIR="operator/test/_support/fixtures/anvil-base-v3-state"
          # Hard fail if the dir is absent OR state.json is missing/empty. One OR
          # covers both "directory never created" and "directory exists but the
          # dumped state.json is missing or zero-length" (-s is false for both).
          if [ ! -d "$STATE_DIR" ] || [ ! -s "$STATE_DIR/state.json" ]; then
            echo "::error::Hermetic snapshot fixture missing/empty at $STATE_DIR/state.json"
            echo "Run \`cd operator && BASE_RPC_URL=... yarn tsx ../contracts/scripts/build-anvil-snapshot.ts\` and commit the fixture."
            echo "See docs/snapshots/base-v3-snapshot.md for the rollout order."
            exit 1
          fi
          echo "✓ snapshot fixture present at $STATE_DIR/state.json"

      # Compile the V3 contracts so the hermetic adversarial test can load the
      # full artifact ABIs (including the Router* error fragments) that drive the
      # snapshot's real bytecode into each adversarial state (spec §5).
      - name: Compile contracts
        working-directory: contracts
        run: |
          yarn install --immutable
          yarn compile

      # Run the hermetic suite. The test/hermetic/** tests load the snapshot
      # via spawnAnvilFromState (adversarial claim/delivery on real bytecode) and
      # exercise the deterministic RPC fallback chain (#592) with a mock
      # transport. The positional path scopes vitest to just this home (the same
      # filename-filter form `release:tier-1:T1.1` uses) so the gate's verdict
      # maps 1:1 to the hermetic surface. The daemon full-loop fixture owns the
      # solution leg through SolutionDeliveryClaimed; native evaluator verdict
      # settlement/activity coverage is tracked separately in issue #2666.
      # The dedicated hermetic config runs the suite SEQUENTIALLY
      # (fileParallelism:false) with a long timeout — its heavy files each spawn
      # Anvil (+ Ponder / a real daemon) and would contend/flake if run
      # concurrently. The snapshot/subprocess tests run ONLY here (excluded from
      # the default unit `yarn test`), so this is the one place they execute.
      - name: Run hermetic suite
        id: hermetic
        working-directory: operator
        run: yarn test:hermetic

      # App-flow determinism: mocked-daemon Playwright against the operator
      # console (Stage 6). Chromium only. The console imports the kit from
      # `dist/` (portal:), so build it before install — same as operator-console-ci.yml.
      - name: Build lifecycle-notifications
        working-directory: packages/lifecycle-notifications
        run: |
          yarn install --immutable
          yarn build
      - name: Install operator console
        working-directory: apps/operator-console
        run: |
          corepack prepare yarn@4.13.0 --activate
          yarn install --immutable
          yarn playwright install --with-deps chromium

      - name: App-flow determinism (Playwright, mocked daemon)
        id: appflow
        working-directory: operator
        run: yarn e2e:app-flow

      - name: Operator console unit tests
        working-directory: apps/operator-console
        run: yarn test

      - name: Upload app-flow traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: app-flow-traces
          path: apps/operator-console/test-results/
          retention-days: 7

      # This job deliberately ends here: its outcome IS the signal. Reaching the
      # end means the hermetic suite (including the snapshot indexer round-trip),
      # the app-flow journeys and the console unit tests all passed; a failure of
      # any of them short-circuits the job. `hermetic-gate-verdict` reads
      # `needs.hermetic-gate.result` and constructs the verdict locally — there is
      # no artifact hand-off, because an artifact carrying only literals plus a SHA
      # the reader already has adds a runner-to-runner failure mode to a gate whose
      # whole premise is that it cannot flake for infra reasons.

  hermetic-gate-verdict:
    # This workflow's required context is the API-posted check-run named
    # `hermetic-gate` (the verdict JSON's `context` field, posted below), NOT this
    # job's display name — keep that field in sync with the required-status-check
    # string on the `next` ruleset. The job exists so the context is reported even
    # when the ~40-minute gate job is cancelled or its runner dies: an unreported
    # required context hangs a queue entry until the check-response timeout ejects
    # it (DR-2026-08-18-b D3/D6).
    name: Hermetic gate verdict (check-run)
    needs: [hermetic-gate]
    # `always()` so failure, cancellation, and dead-runner outcomes all still post.
    # EXCEPT on fork PRs, where the GITHUB_TOKEN is read-only regardless of the
    # declared `checks: write` permission, so the POST would 403 and falsely redden
    # the job. Forks still get the test results in the job log. On push and
    # merge_group events `github.event.pull_request` is null, so the fork test
    # passes and the verdict posts.
    if: always() && github.event.pull_request.head.repo.fork != true
    runs-on: ubuntu-latest
    # Seconds of shell plus one API call. Without this the reporting job inherits
    # the 360-minute default, so a wedged runner would starve the very context it
    # exists to guarantee. The bound is far above any honest run (observed ~1 min),
    # with headroom for a slow monorepo checkout under runner contention — this
    # job's worst case must be "reports late", never "doesn't report".
    timeout-minutes: 10
    env:
      # The check-run binds to the commit under test. On pull_request, github.sha is
      # the ephemeral merge commit and the PR HEAD is what branch protection reasons
      # about; on push and merge_group, github.sha is the commit under test (for a
      # merge group, the speculative merge commit the queue will land).
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      HERMETIC_RESULT: ${{ needs.hermetic-gate.result }}
      EVENT_NAME: ${{ github.event_name }}
      MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
    steps:
      # THE ONE REMAINING PRE-POST ABORT RISK. The poster script lives in the repo,
      # so the checkout cannot be dropped; if it fails, the required context goes
      # unreported and the queue entry hangs to the check-response timeout. Every
      # other step that used to sit between the gate result and the POST — a
      # toolchain install, an artifact download, a bare SHA assertion — is gone, so
      # this is the whole of the remaining surface. `actions/setup-node` in
      # particular is deliberately absent: the poster imports only node:fs and
      # node:child_process and shells out to `gh`, and ubuntu-latest ships both.
      - uses: actions/checkout@v7

      # Build the verdict here, from `needs.hermetic-gate.result` alone. No artifact
      # round-trip: the success verdict is literals plus HEAD_SHA, both of which this
      # job already has, so transporting it runner-to-runner would only add a way for
      # a green gate to post a synthesized red.
      #
      # `set +e` (Actions' default shell runs with errexit on), and every branch
      # ends in a written file: this step must not be able to abort before the
      # POST below.
      - name: Build the hermetic-gate verdict
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/hermetic-verdict"
          VERDICT="$RUNNER_TEMP/hermetic-verdict/hermetic-verdict.json"

          # DR-2026-08-18-b D3 requires the merge-group SHA binding verified, not
          # assumed. Verifying it in a step of its own would put an abortable check
          # in front of the POST — the exact hang this job exists to prevent — so a
          # mismatch becomes a red VERDICT on the SHA this run is evaluating.
          BINDING_MISMATCH=no
          if [ "${EVENT_NAME}" = merge_group ] && [ "${HEAD_SHA}" != "${MERGE_GROUP_HEAD_SHA}" ]; then
            BINDING_MISMATCH=yes
          fi

          # failClass is the machine-read triage field
          # (.claude/skills/release-readiness/references/triage-taxonomy.md): a
          # `product-red` is BLOCKING-by-default and drives a debug hunt for a code
          # regression. Only an actual job `failure` earns it — the gate has zero
          # external dependencies, so a red IS the code. `cancelled` and `skipped`
          # mean the gate never produced a verdict at all; that is an infra outcome
          # and is classed `infra-blocked`. The CONCLUSION stays `failure` either
          # way: an unverified gate never clears, and `neutral` risks reading as a
          # pass to a required-context evaluator.
          if [ "${HERMETIC_RESULT}" = failure ]; then
            FAIL_CLASS=product-red
            FAIL_NOTES="The hermetic-gate job did not report green (result: ${HERMETIC_RESULT}); with zero external dependencies a red is a real code regression. See the job log."
          else
            FAIL_CLASS=infra-blocked
            FAIL_NOTES="The hermetic-gate job never produced a verdict (result: ${HERMETIC_RESULT}) — a cancelled or skipped gate is a CI-infrastructure outcome, NOT a proven code regression. The context is still red because an unverified gate never clears. Re-run the workflow. See the job log."
          fi

          if [ "${BINDING_MISMATCH}" = yes ]; then
            cat > "$VERDICT" <<EOF
          {
            "context": "hermetic-gate",
            "headSha": "${HEAD_SHA}",
            "conclusion": "failure",
            "scenarios": [
              { "id": "merge-group-sha-binding", "verdict": "fail", "failClass": "infra-blocked", "notes": "github.sha (${HEAD_SHA}) does not match github.event.merge_group.head_sha (${MERGE_GROUP_HEAD_SHA}); the verdict cannot be bound to the commit the queue is evaluating (DR-2026-08-18-b D3). The hermetic-gate job result was ${HERMETIC_RESULT}." }
            ],
            "summary": "Hermetic gate UNBOUND on ${HEAD_SHA} — the merge-group SHA binding does not hold, so no verdict on this commit can be trusted (infra-blocked)."
          }
          EOF
          elif [ "${HERMETIC_RESULT}" = success ]; then
            cat > "$VERDICT" <<EOF
          {
            "context": "hermetic-gate",
            "headSha": "${HEAD_SHA}",
            "conclusion": "success",
            "scenarios": [
              { "id": "hermetic-suite", "verdict": "pass", "failClass": null, "notes": "test/hermetic/** (adversarial claim/delivery and exact solution settlement on snapshot bytecode + deterministic RPC fallback + indexer round-trip (local Ponder vs snapshot chain)) green" },
              { "id": "app-flow-determinism", "verdict": "pass", "failClass": null, "notes": "mocked-daemon console journeys (claim-policy + posting-status) green" },
              { "id": "operator-console-unit", "verdict": "pass", "failClass": null, "notes": "apps/operator-console handshake + surface-state unit tests green" }
            ],
            "summary": "Hermetic gate green on ${HEAD_SHA} — deterministic loop + adversarial conditions on real snapshot bytecode + indexer round-trip + mocked-daemon app-flow journeys."
          }
          EOF
          else
            cat > "$VERDICT" <<EOF
          {
            "context": "hermetic-gate",
            "headSha": "${HEAD_SHA}",
            "conclusion": "failure",
            "scenarios": [
              { "id": "hermetic-gate", "verdict": "fail", "failClass": "${FAIL_CLASS}", "notes": "${FAIL_NOTES}" }
            ],
            "summary": "Hermetic gate FAILED on ${HEAD_SHA} — the hermetic-gate job result was ${HERMETIC_RESULT} (${FAIL_CLASS})."
          }
          EOF
          fi

          # Echo for the log only; `|| true` keeps the no-abort invariant literal.
          cat "$VERDICT" || true

      # Post the verdict as a check-run bound to HEAD_SHA via the shared poster
      # (owned by step 3). Exactly one post per workflow run — the gate job above
      # posts nothing.
      - name: Post hermetic-gate check-run
        working-directory: operator
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/post-check-run-verdict.mjs "$RUNNER_TEMP/hermetic-verdict/hermetic-verdict.json"
