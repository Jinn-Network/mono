name: Stack fixture immutability

# Golden fixtures are the compatibility contract (2026-07-30 marketplace-surfaces
# design §8.1). This gate is offline and binds from day one: an existing fixture id
# keeps its exact bytes forever, nothing is removed, and a correction arrives as a
# new fixture plus a dated erratum. The minor-bump consequence of an addition is
# enforced against the registry in the stable publish lane.
on:
  pull_request:
  push:
    branches: [integration/evidence-v1, next]

permissions:
  contents: read

jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Verify the fixture manifests are current
        run: node .github/scripts/fixture-manifest.mjs --check
      - name: Verify fixture immutability against the base
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          # DR-2026-08-04 authorizes one pre-publication fixture-manifest regeneration for
          # the identifier re-seal. The carve-out is NOT a default: it is applied only when
          # the head branch is a re-seal migration branch, and only ever with that one DR id.
          # Component C2 deletes this variable, the case below, and the script flag once the
          # re-seal waves have landed.
          HEAD_REF: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_REF}" ] || [ "${BASE_REF}" = "0000000000000000000000000000000000000000" ]; then
            echo "::notice::No base commit to compare against; skipping."
            exit 0
          fi
          RESEAL_FLAG=""
          case "${HEAD_REF}" in
            reseal/*)
              RESEAL_FLAG="--allow-reseal DR-2026-08-04"
              echo "::warning::DR-2026-08-04 re-seal carve-out active on ${HEAD_REF}: fixture digest changes are permitted on this branch; id removals are not."
              ;;
          esac
          node .github/scripts/fixture-immutability.mjs --base "${BASE_REF}" ${RESEAL_FLAG}
