specVersion: 1.0.0
schema:
  file: ./schema.graphql
description: |
  Jinn-specific subgraph: indexes ERC-8004 IdentityRegistry / ValidationRegistry /
  ReputationRegistry plus JinnRouter and synthesises Operator + Execution entities.
  See docs/superpowers/specs/2026-04-27-erc-8004-entity-model-design.md.
repository: https://github.com/Jinn-Network/mono
features:
  - nonFatalErrors
dataSources:
  - kind: ethereum/contract
    name: IdentityRegistry
    network: base-sepolia
    source:
      address: "0x8004A818BFB912233c491871b3d84c89A494BD9e"
      abi: IdentityRegistry
      startBlock: 22000000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/handlers/identity.ts
      entities:
        - Operator
        - Execution
        - MetadataEntry
        - URIUpdate
        - HarnessRollup
        - LanguageRollup
        - FreezeViolation
        - SigningKeyFrozenState
        - SolverNetManifestEvent
      abis:
        - name: IdentityRegistry
          file: ./abis/IdentityRegistry.json
      eventHandlers:
        - event: Registered(indexed uint256,string,indexed address)
          handler: handleRegistered
        - event: MetadataSet(indexed uint256,indexed string,string,bytes)
          handler: handleMetadataSet
        - event: URIUpdated(indexed uint256,string,indexed address)
          handler: handleURIUpdated
  # ValidationRegistry data source is GATED — not included in default deployment.
  # The canonical ERC-8004 upstream deployment list (github.com/erc-8004/erc-8004-contracts)
  # confirms Identity and Reputation Registry deployments but does NOT list Validation Registry
  # addresses (Validation is marked "under active update" upstream). Do not uncomment until
  # deployment is confirmed via eth_getCode + upstream artifact on each target chain.
  # The ValidationRegistry client TS code (client/src/discovery/registry.ts) and handlers
  # (src/handlers/validation.ts) are kept for when addresses are confirmed.
  #
  # - kind: ethereum/contract
  #   name: ValidationRegistry
  #   network: base-sepolia
  #   source:
  #     address: "0x8004Cb1BF31DAf7788923b405b754f57acEB4272"
  #     abi: ValidationRegistry
  #     startBlock: 22000000
  #   mapping:
  #     kind: ethereum/events
  #     apiVersion: 0.0.9
  #     language: wasm/assemblyscript
  #     file: ./src/handlers/validation.ts
  #     entities:
  #       - Validation
  #       - Operator
  #       - Execution
  #     abis:
  #       - name: ValidationRegistry
  #         file: ./abis/ValidationRegistry.json
  #     eventHandlers:
  #       - event: ValidationRequest(indexed address,indexed uint256,string,indexed bytes32)
  #         handler: handleValidationRequest
  #       - event: ValidationResponse(indexed address,indexed uint256,indexed bytes32,uint8,string,bytes32,string)
  #         handler: handleValidationResponse
  - kind: ethereum/contract
    name: ReputationRegistry
    network: base-sepolia
    source:
      address: "0x8004B663056A597Dffe9eCcC1965A193B7388713"
      abi: ReputationRegistry
      startBlock: 22000000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/handlers/reputation.ts
      entities:
        - Feedback
        - FeedbackResponse
        - Operator
        - Execution
      abis:
        - name: ReputationRegistry
          file: ./abis/ReputationRegistry.json
      eventHandlers:
        - event: NewFeedback(indexed uint256,indexed address,uint64,int128,uint8,indexed string,string,string,string,string,bytes32)
          handler: handleNewFeedback
        - event: FeedbackRevoked(indexed uint256,indexed address,indexed uint64)
          handler: handleFeedbackRevoked
        - event: ResponseAppended(indexed uint256,indexed address,uint64,indexed address,string,bytes32)
          handler: handleResponseAppended
  - kind: ethereum/contract
    name: JinnRouter
    network: base-sepolia
    source:
      address: "0x7c502a4288C4f4279edbb363d692f530200e22dC"
      abi: JinnRouter
      startBlock: 22000000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/handlers/router.ts
      entities:
        - RouterJob
        - Execution
        - Operator
      abis:
        - name: JinnRouter
          file: ./abis/JinnRouter.json
      eventHandlers:
        - event: RestorationJobCreated(indexed address,indexed bytes32)
          handler: handleRestorationJobCreated
        - event: EvaluationJobCreated(indexed address,indexed bytes32,indexed bytes32)
          handler: handleEvaluationJobCreated
        - event: DeliveryClaimed(indexed address,indexed bytes32,uint8)
          handler: handleDeliveryClaimed
  - kind: ethereum/contract
    name: TaskCoordinator
    network: base-sepolia
    source:
      address: "0x9ce736d3CB367cC5Db538B7962bdf416EbD7451B"
      abi: TaskCoordinator
      startBlock: 22000000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/handlers/task-coordinator.ts
      entities:
        - Task
        - TaskAttempt
        - Verdict
      abis:
        - name: TaskCoordinator
          file: ./abis/TaskCoordinator.json
      eventHandlers:
        - event: TaskCreated(indexed uint256,indexed address,indexed bytes32,bytes32,uint16,uint16,uint64,uint64,uint64,uint64)
          handler: handleTaskCreated
        - event: TaskClaimed(indexed uint256,indexed uint32,indexed address,uint64)
          handler: handleTaskClaimed
        - event: TaskAttemptRequestRegistered(indexed uint256,indexed uint32,indexed bytes32)
          handler: handleTaskAttemptRequestRegistered
        - event: TaskSubmitted(indexed uint256,indexed uint32,indexed address,bytes32,bytes32,uint256)
          handler: handleTaskSubmitted
        - event: EvaluationClaimed(indexed uint256,indexed uint32,indexed uint32,address,uint64)
          handler: handleEvaluationClaimed
        - event: VerdictRequestRegistered(indexed uint256,indexed uint32,indexed uint32,bytes32)
          handler: handleVerdictRequestRegistered
        - event: VerdictDelivered(indexed uint256,indexed uint32,indexed uint32,address,bytes32,uint8)
          handler: handleVerdictDelivered
        - event: AttemptFinalized(indexed uint256,indexed uint32,bool,uint16,uint16)
          handler: handleAttemptFinalized
        - event: TaskCreationCreditLocked(indexed uint256,indexed address,uint256)
          handler: handleTaskCreationCreditLocked
        - event: TaskAttemptExpired(indexed uint256,indexed uint32,indexed address)
          handler: handleTaskAttemptExpired
  - kind: ethereum/contract
    name: JinnRouterV3
    network: base-sepolia
    source:
      address: "0xdC9BCcEB7aca21Ad4Ca2Fc5B4d7aea6b4F6CedD9"
      abi: JinnRouterV3
      startBlock: 22000000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/handlers/jinn-router-v3.ts
      entities:
        - Task
        - TaskAttempt
        - Verdict
      abis:
        - name: JinnRouterV3
          file: ./abis/JinnRouterV3.json
      eventHandlers:
        - event: TaskCreated(indexed address,indexed uint256,indexed bytes32,bytes32,uint16,uint16,uint256,uint256)
          handler: handleRouterTaskCreated
        - event: TaskAttemptCreated(indexed uint256,indexed uint32,indexed bytes32,address,address,uint256)
          handler: handleTaskAttemptCreated
        - event: EvaluationAttemptCreated(indexed uint256,indexed uint32,indexed uint32,bytes32,address,address,uint256)
          handler: handleEvaluationAttemptCreated
        - event: SolutionDeliveryClaimed(indexed address,indexed bytes32,indexed uint256,uint32)
          handler: handleSolutionDeliveryClaimed
        - event: VerdictDeliveryClaimed(indexed address,indexed bytes32,indexed uint256,uint32,uint32,uint8)
          handler: handleVerdictDeliveryClaimed
        - event: TaskBudgetRefunded(indexed uint256,indexed address,uint256,uint256)
          handler: handleTaskBudgetRefunded
