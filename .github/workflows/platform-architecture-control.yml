name: Platform Architecture Control

on:
  pull_request:
  workflow_dispatch:

# Pull requests from forks receive a restricted token. The reusable verifier's
# artifact attestations need id-token/attestations write, so fork runs can stop
# at that permission boundary and must be rerun by a maintainer in the trusted
# repository context. This workflow never uses pull_request_target.
permissions:
  contents: read

jobs:
  platform-architecture-control:
    name: platform-architecture-control
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate catalog and architecture ownership
        run: |
          mkdir -p .architecture-control
          node --test \
            .github/scripts/platform-catalog.test.mjs \
            .github/scripts/transition-manifest.test.mjs \
            .github/scripts/phase-d-transition-deletion.test.mjs \
            .github/scripts/observation-reader-gate-boundary.test.mjs \
            .github/scripts/architecture-control.test.mjs \
            .github/scripts/branch-protection-audit.test.mjs \
            .github/scripts/architecture-control-workflow.test.mjs
          node .github/scripts/architecture-control.mjs \
            --out .architecture-control/coverage.json
          node .github/scripts/generate-architecture.mjs --check
      - name: Upload deterministic ownership coverage
        uses: actions/upload-artifact@v4
        with:
          name: platform-architecture-control-coverage
          path: .architecture-control/coverage.json
          if-no-files-found: error
          retention-days: 30

  platform-release-surface:
    name: platform-release-surface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate the profile root, publish path, and their workflow shapes
        run: |
          node --test \
            .github/scripts/build-profile-root.test.mjs \
            .github/scripts/sign-profile-manifest.test.mjs \
            .github/scripts/public-surface-assets.test.mjs \
            .github/scripts/platform-verification-receipt.test.mjs \
            .github/scripts/platform-verification-workflow.test.mjs \
            .github/scripts/stack-publish-workflow.test.mjs \
            .github/scripts/stack-publication-surface.test.mjs \
            .github/scripts/stack-trusted-publishers.test.mjs \
            .github/scripts/generate-architecture.test.mjs
      # The publication surface's other half: that the deploy bundle is actually servable,
      # and that the live-host gate passes over a real socket rather than an injected
      # fetch. Hermetic by construction -- an ephemeral loopback listener with a throwaway
      # in-memory certificate. No egress, no credentials, no host CLI. The first two files
      # are C3's own bundle-generator and gate suites, which shipped unwired.
      - name: Prove the deploy bundle is servable and the gate passes over a socket
        run: |
          node --test \
            .github/scripts/build-profile-host-bundle.test.mjs \
            .github/scripts/verify-live-profile-host.test.mjs \
            .github/scripts/serve-profile-host.test.mjs \
            .github/scripts/verify-local-profile-host.test.mjs

  platform-verification-reusable:
    name: platform-verification-reusable
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/platform-verification.yml
    with:
      source_sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      lane: canary
    secrets:
      JINN_MARKETPLACE_FORK_RPC_URL: ${{ secrets.JINN_MARKETPLACE_FORK_RPC_URL }}
      JINN_PROFILE_MANIFEST_SIGNING_KEY: ${{ secrets.JINN_PROFILE_MANIFEST_SIGNING_KEY }}
      JINN_PROFILE_MANIFEST_KEY_ID: ${{ secrets.JINN_PROFILE_MANIFEST_KEY_ID }}

  platform-verification:
    name: platform-verification
    needs: platform-verification-reusable
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require exact reusable-verification success
        env:
          VERIFICATION_RESULT: ${{ needs.platform-verification-reusable.result }}
        run: test "${VERIFICATION_RESULT}" = success
