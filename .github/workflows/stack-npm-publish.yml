name: Stack npm Publish

# The 45 platform packages publish as one coherent set in dependency-graph order.
# Branch-aware by design (#2293, plan decision D1): the packages live on
# integration/evidence-v1 today and land on next when integration merges. Both
# branches trigger; the existence guard makes the trigger a no-op wherever the
# package set is absent.
#
# Trusted publishing (OIDC): register this single workflow filename on npmjs for
# every package the registration artifact lists. Leave the optional npmjs
# Environment field blank. See docs/runbooks/stack-npm-publishing.md.
on:
  push:
    branches: [integration/evidence-v1, next]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Published stack release tag to recover, for example stack-v0.1.0'
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  checks: read

# Phase A publication remains fail-closed until the final workflow can verify
# the complete stack in the same run before npm is reachable.
env:
  PHASE_A_STACK_CONVERGENCE_VERIFIED: 'false'

concurrency:
  # Canary lane (push) is deliberately branch-agnostic: the whole 45-package
  # set republishes on every push regardless of which tree changed, so a push
  # to integration/evidence-v1 and a push to next must serialize, not race the
  # same per-package canary dist-tag against each other (a cross-branch race
  # spuriously trips verifyCoherentSet's dist-tag check with a benign,
  # already-superseded tag). The stable lane (release / workflow_dispatch)
  # gets its own group keyed by release tag, not the canary constant: GitHub
  # cancels at most one *pending* run per concurrency group, so a shared group
  # let an in-progress canary run's queued stable release get cancelled by the
  # next ordinary canary push -- the two lanes have no reason to serialize
  # with each other, since they publish different versions to different
  # dist-tags and verifyCoherentSet checks each independently.
  group: ${{ github.event_name == 'push' && 'stack-npm-publish-canary' || format('stack-npm-publish-stable-{0}', github.event.release.tag_name || inputs.release_tag) }}
  cancel-in-progress: false

jobs:
  publish:
    name: stack-canary
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'stack-v')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: npm-publish
    env:
      JINN_BUILD_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Verify exact publish commit
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ "${ACTUAL_SHA}" != "${JINN_BUILD_COMMIT}" ]; then
            echo "::error::Checked out ${ACTUAL_SHA}, expected publish commit ${JINN_BUILD_COMMIT}"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - run: npm install -g npm@11.16.0
      - run: corepack enable

      - name: Guard on an empty platform package set
        id: guard
        shell: bash
        run: |
          set +e
          node .github/scripts/publish-stack.mjs --mode canary --sha "${JINN_BUILD_COMMIT}" --dry-run
          status=$?
          set -e
          # Exit code 3 is publish-stack.mjs's dedicated signal for "zero platform
          # packages discovered on this ref" (EMPTY_PACKAGE_SET_EXIT_CODE) — the only
          # case this guard treats as absence. Every other non-zero exit (version skew,
          # a dependency cycle, an invalid manifest) is a genuine planning failure and
          # must fail this job, never be swallowed as "nothing to publish".
          if [ "${status}" -eq 0 ]; then
            echo "present=true" >> "${GITHUB_OUTPUT}"
          elif [ "${status}" -eq 3 ]; then
            echo "::notice::No platform package set on this ref; nothing to publish."
            echo "present=false" >> "${GITHUB_OUTPUT}"
          else
            echo "::error::publish-stack.mjs failed to plan (exit ${status}); see the log above"
            exit "${status}"
          fi

      - name: Verify the six platform tree CI workflows
        # Known limited reach, per plan D7 (accepted, not a defect to fix here):
        # (a) this step runs a minute or so into the job, while the six
        # push-triggered tree CIs on the same commit are typically still
        # in_progress -- a run with no *completed* conclusion at this sha is not
        # treated as a failure, so an eventually-red canary can still publish;
        # (b) all six tree workflows push-trigger on `next` only, so a base
        # branch like integration/evidence-v1 has no run at the sha at all and
        # the gate passes vacuously. Both conform to the stated contract ("no
        # run at that sha is not a failure"); the stable lane carries no
        # equivalent gate at all, also per plan. Tightening this to actually
        # bite needs a workflow_run-triggered publish lane or a bounded wait
        # for the six runs to conclude -- out of scope for this gate.
        if: steps.guard.outputs.present == 'true'
        uses: actions/github-script@v7
        env:
          PUBLISH_SHA: ${{ env.JINN_BUILD_COMMIT }}
        with:
          script: |
            // GitHub reports one check run per *job*, named after the job's display
            // `name:` (or the job id) -- the workflow's own display name (e.g.
            // "Evidence CI") lives on the check suite / workflow run, never on a
            // check run (see .github/workflows/main-base-guard.yml lines 8-12 for the
            // same convention documented for check-run matching). Gate on the
            // workflow *file* via listWorkflowRuns, one query per workflow, each
            // paginated -- a single un-paginated page can silently truncate on a
            // busy sha and fail open the same way a name-prefix filter does.
            const workflowFiles = [
              'evidence-ci.yml',
              'trust-ci.yml',
              'task-execution-ci.yml',
              'record-discovery-ci.yml',
              'marketplace-ci.yml',
              'benchmarking-ci.yml',
            ];
            const failed = [];
            for (const workflow_id of workflowFiles) {
              const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id,
                head_sha: process.env.PUBLISH_SHA,
                per_page: 100,
              });
              for (const run of runs) {
                if (run.status === 'completed' && run.conclusion !== 'success' && run.conclusion !== 'skipped' && run.conclusion !== 'neutral') {
                  failed.push(`${workflow_id} run ${run.id}: ${run.conclusion}`);
                }
              }
            }
            if (failed.length > 0) {
              core.setFailed(`Platform tree CI concluded failure at ${process.env.PUBLISH_SHA}: ${failed.join('; ')}`);
            } else {
              core.notice(`No platform tree CI failure at ${process.env.PUBLISH_SHA}`);
            }

      - name: Publish the platform package set
        if: steps.guard.outputs.present == 'true' && github.event_name == 'push' && env.PHASE_A_STACK_CONVERGENCE_VERIFIED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/publish-stack.mjs --mode canary --sha "${JINN_BUILD_COMMIT}"

      - name: Wait for the platform set on the registry
        if: steps.guard.outputs.present == 'true' && github.event_name == 'push' && env.PHASE_A_STACK_CONVERGENCE_VERIFIED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          SET_VERSION="$(node -e "console.log(JSON.parse(require('fs').readFileSync('packages/trust/core/package.json','utf8')).version)")"
          ACCEPTANCE_VERSION="${SET_VERSION}-canary.sha.${JINN_BUILD_COMMIT}"
          echo "ACCEPTANCE_VERSION=${ACCEPTANCE_VERSION}" >> "${GITHUB_ENV}"
          PROBE_PACKAGE="$(node -e "console.log(JSON.parse(require('fs').readFileSync('packages/task-execution/testing/package.json','utf8')).name)")"
          for _ in $(seq 1 60); do
            if npm view "${PROBE_PACKAGE}@${ACCEPTANCE_VERSION}" version >/dev/null 2>&1; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::${PROBE_PACKAGE}@${ACCEPTANCE_VERSION} never became visible on the registry"
          exit 1

      - name: Registry consumer acceptance
        if: steps.guard.outputs.present == 'true' && github.event_name == 'push' && env.PHASE_A_STACK_CONVERGENCE_VERIFIED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/stack-external-acceptance.mjs --version "${ACCEPTANCE_VERSION}"

  stack-stable:
    name: stack-stable
    if: (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'stack-v')) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: npm-stable-publish
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Verify the release tag resolves on origin to this checkout
        shell: bash
        run: |
          set -euo pipefail
          TAG_SHA="$(git ls-remote origin "refs/tags/${RELEASE_TAG}" | awk '{print $1}' | head -n1)"
          if [ -z "${TAG_SHA}" ]; then
            echo "::error::Release tag ${RELEASE_TAG} does not exist on origin"
            exit 1
          fi
          PEELED="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          RESOLVED="$(git rev-parse "${TAG_SHA}^{commit}")"
          if [ "${PEELED}" != "${RESOLVED}" ]; then
            echo "::error::Release tag ${RELEASE_TAG} points at ${RESOLVED}, not the checked-out ${PEELED}"
            exit 1
          fi
          echo "JINN_BUILD_COMMIT=${PEELED}" >> "${GITHUB_ENV}"

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - run: npm install -g npm@11.16.0
      - run: corepack enable

      - name: Verify fixture immutability against the published set
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/fixture-immutability.mjs --registry-baseline --version "${RELEASE_TAG#stack-v}"

      - name: Publish the stable platform set
        if: env.PHASE_A_STACK_CONVERGENCE_VERIFIED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/publish-stack.mjs --mode stable --release-tag "${RELEASE_TAG}" --sha "${JINN_BUILD_COMMIT}"

      - name: Wait for the platform set on the registry
        if: env.PHASE_A_STACK_CONVERGENCE_VERIFIED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ACCEPTANCE_VERSION="${RELEASE_TAG#stack-v}"
          echo "ACCEPTANCE_VERSION=${ACCEPTANCE_VERSION}" >> "${GITHUB_ENV}"
          PROBE_PACKAGE="$(node -e "console.log(JSON.parse(require('fs').readFileSync('packages/task-execution/testing/package.json','utf8')).name)")"
          for _ in $(seq 1 60); do
            if npm view "${PROBE_PACKAGE}@${ACCEPTANCE_VERSION}" version >/dev/null 2>&1; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::${PROBE_PACKAGE}@${ACCEPTANCE_VERSION} never became visible on the registry"
          exit 1

      - name: Registry consumer acceptance
        if: env.PHASE_A_STACK_CONVERGENCE_VERIFIED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/stack-external-acceptance.mjs --version "${ACCEPTANCE_VERSION}"

  registrations:
    name: Trusted-publisher registration list
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Guard on an empty platform package set
        id: guard
        shell: bash
        run: |
          set +e
          node .github/scripts/publish-stack.mjs --mode canary --sha "${GITHUB_SHA}" --dry-run
          status=$?
          set -e
          if [ "${status}" -eq 0 ]; then
            echo "present=true" >> "${GITHUB_OUTPUT}"
          elif [ "${status}" -eq 3 ]; then
            echo "::notice::No platform package set on this ref; nothing to register."
            echo "present=false" >> "${GITHUB_OUTPUT}"
          else
            echo "::error::publish-stack.mjs failed to plan (exit ${status}); see the log above"
            exit "${status}"
          fi
      - name: Verify the publication surface
        if: steps.guard.outputs.present == 'true'
        run: node --test .github/scripts/stack-publication-surface.test.mjs
      - name: Generate the registration list
        if: steps.guard.outputs.present == 'true'
        run: node .github/scripts/stack-trusted-publishers.mjs --out "${RUNNER_TEMP}/registrations"
      - uses: actions/upload-artifact@v4
        if: steps.guard.outputs.present == 'true'
        with:
          name: stack-trusted-publishers
          path: ${{ runner.temp }}/registrations
          if-no-files-found: error

  profile-root:
    name: Profile root artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Guard on an empty platform package set
        id: guard
        shell: bash
        run: |
          set +e
          node .github/scripts/publish-stack.mjs --mode canary --sha "${GITHUB_SHA}" --dry-run
          status=$?
          set -e
          if [ "${status}" -eq 0 ]; then
            echo "present=true" >> "${GITHUB_OUTPUT}"
          elif [ "${status}" -eq 3 ]; then
            echo "::notice::No platform package set on this ref; nothing to build a profile root from."
            echo "present=false" >> "${GITHUB_OUTPUT}"
          else
            echo "::error::publish-stack.mjs failed to plan (exit ${status}); see the log above"
            exit "${status}"
          fi
      - name: Build the static profile root
        if: steps.guard.outputs.present == 'true'
        run: node .github/scripts/build-profile-root.mjs --out "${RUNNER_TEMP}/profile-root" --commit "${GITHUB_SHA}"
      - name: Sign the profile manifest
        if: steps.guard.outputs.present == 'true'
        env:
          JINN_PROFILE_MANIFEST_SIGNING_KEY: ${{ secrets.JINN_PROFILE_MANIFEST_SIGNING_KEY }}
          JINN_PROFILE_MANIFEST_KEY_ID: ${{ vars.JINN_PROFILE_MANIFEST_KEY_ID }}
        run: node .github/scripts/sign-profile-manifest.mjs --root "${RUNNER_TEMP}/profile-root"
      - uses: actions/upload-artifact@v4
        if: steps.guard.outputs.present == 'true'
        with:
          name: jinn-profile-root
          path: ${{ runner.temp }}/profile-root
          if-no-files-found: error
