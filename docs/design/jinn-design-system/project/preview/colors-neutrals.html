<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../foundations.css">
<style>
  body { padding: 24px; margin: 0; }
  .row { display: flex; gap: 0; border: 1px solid var(--border); }
  .sw { flex: 1; aspect-ratio: 2/1; display: flex; flex-direction: column; justify-content: flex-end; padding: 12px; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; }
  .hex { font-size: 10px; opacity: 0.7; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background:#070d18; color:#f2f7fc;">blue-950<br><span class="hex">#070d18</span></div>
    <div class="sw" style="background:#0c1628; color:#f2f7fc;">blue-900<br><span class="hex">#0c1628</span></div>
    <div class="sw" style="background:#142340; color:#f2f7fc;">blue-800<br><span class="hex">#142340</span></div>
    <div class="sw" style="background:#1f3a66; color:#f2f7fc;">blue-700<br><span class="hex">#1f3a66</span></div>
    <div class="sw" style="background:#2f5598; color:#f2f7fc;">blue-600<br><span class="hex">#2f5598</span></div>
    <div class="sw" style="background:#4a7bc4; color:#f2f7fc;">blue-500<br><span class="hex">#4a7bc4</span></div>
    <div class="sw" style="background:#7aa7dc; color:#0c1628;">blue-400<br><span class="hex">#7aa7dc</span></div>
    <div class="sw" style="background:#a8c8ea; color:#0c1628;">blue-300<br><span class="hex">#a8c8ea</span></div>
    <div class="sw" style="background:#cbdef3; color:#0c1628;">blue-200<br><span class="hex">#cbdef3</span></div>
    <div class="sw" style="background:#e4eefa; color:#0c1628;">blue-100<br><span class="hex">#e4eefa</span></div>
    <div class="sw" style="background:#f2f7fc; color:#0c1628;">blue-50<br><span class="hex">#f2f7fc</span></div>
  </div>
</body>
</html>
