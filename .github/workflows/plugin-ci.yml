name: Plugin CI

on:
  pull_request:
    paths:
      - 'packages/plugin/**'
      - '.github/workflows/plugin-ci.yml'
  push:
    branches: [main]
    paths:
      - 'packages/plugin/**'
      - '.github/workflows/plugin-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: packages/plugin

jobs:
  check:
    name: Typecheck, Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Enable Corepack before the Yarn cache lookup
        # setup-node resolves the Yarn cache folder by shelling out to `yarn`.
        # Without Corepack that is the runner image's global Yarn 1, which
        # refuses every project pinned to `packageManager: yarn@4.13.0`.
        run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: packages/plugin/yarn.lock
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn build
      - run: yarn typecheck
      - run: yarn test

  client-compat:
    name: Client Typecheck & Extracted-Boundary Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: operator
    steps:
      - uses: actions/checkout@v7
      - name: Enable Corepack before the Yarn cache lookup
        # setup-node resolves the Yarn cache folder by shelling out to `yarn`.
        # Without Corepack that is the runner image's global Yarn 1, which
        # refuses every project pinned to `packageManager: yarn@4.13.0`.
        run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: operator/yarn.lock
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn build:plugin
      - run: yarn build:core
      - run: yarn build:layer
      - run: yarn typecheck
      - run: >-
          yarn vitest run
          test/architecture/golden-envelope.test.ts
          test/bin/jinn-layer-composition.test.ts
