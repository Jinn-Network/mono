name: Trust CI

on:
  pull_request:
  push:
    branches: [next]
    paths:
      - "packages/trust/**"
      - ".github/scripts/trust-*.test.mjs"
      - ".github/workflows/trust-ci.yml"
      - "docs/superpowers/specs/2026-07-27-trust-and-identity-layer-design.md"

permissions:
  contents: read

env:
  TRUST_ROOT: packages/trust

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify package inventory and dependency graph
        run: node --test .github/scripts/trust-package-inventory.test.mjs
      - name: Verify source boundaries and canaries
        run: node --test .github/scripts/trust-source-boundaries.test.mjs

  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Yarn 4.13.0
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate
      - name: Verify Trust Core
        working-directory: packages/trust/core
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Upload Trust Core distribution
        uses: actions/upload-artifact@v4
        with:
          name: trust-core-dist
          path: packages/trust/core/dist
          if-no-files-found: error
          retention-days: 1

  verify:
    needs: [architecture, foundation]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every Trust CI stage to succeed
        env:
          ARCHITECTURE_RESULT: ${{ needs.architecture.result }}
          FOUNDATION_RESULT: ${{ needs.foundation.result }}
        run: |
          for result in \
            "$ARCHITECTURE_RESULT" \
            "$FOUNDATION_RESULT"; do
            test "$result" = "success"
          done
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Yarn 4.13.0
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate
      - name: Restore all package distributions
        uses: actions/download-artifact@v4
        with:
          pattern: trust-*-dist
          path: .trust-dist
      - name: Place package distributions
        run: |
          for package in core; do
            mkdir -p "packages/trust/${package}/dist"
            cp -R ".trust-dist/trust-${package}-dist/." "packages/trust/${package}/dist/"
          done
      - name: Compile packed public entrypoint consumers
        run: node .github/scripts/trust-packed-types.test.mjs
