name: Docker

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

defaults:
  run:
    working-directory: client

jobs:
  build-and-push:
    name: Build & Push OCI Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract version metadata
        id: meta
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-8)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "sha=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: client
          file: client/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/client:${{ steps.meta.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/client:${{ steps.meta.outputs.sha }}
            ghcr.io/${{ github.repository_owner }}/client:latest
          build-args: |
            JINN_BUILD_COMMIT=${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
