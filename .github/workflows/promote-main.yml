# .github/workflows/promote-main.yml
#
# Two-train cadence promotion: fast-forwards `main` to the SHA of the just-published
# release tag. After this runs, `main` always reflects what's currently published to npm @latest.
# Hotfix sub-flow bypasses this workflow (hotfix PRs target main directly).
#
# The fast-forward of `main` to `next` HEAD auto-closes the standing release-review PR
# (base:main head:next, opened by release-notes-scaffold.yml — issue #307) as merged. The
# trailing audit-comment step below records the publish on that PR for the audit trail.
#
# Reference: docs/engineering/handbook.md §Cadence (two-train); jinn-mono-qlol; issue #307.

name: Promote main on release

on:
  release:
    types: [published]

permissions:
  contents: write
  pull-requests: write  # audit comment on the auto-closed release-review PR (issue #307)

jobs:
  promote:
    name: Fast-forward main to release tag
    runs-on: ubuntu-latest
    # Skip pre-release tags (e.g. -canary.*, -rc.*) — only v<semver> named cuts promote main.
    # The Monday scaffold creates v<semver> tags from `next` HEAD; this job advances main to that SHA.
    if: ${{ !github.event.release.prerelease && startsWith(github.event.release.tag_name, 'v') }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve release SHA
        id: sha
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          # Fetch the tag deeply (no --depth=1). A shallow tag fetch creates a
          # shallow graft at the tag commit; subsequent `git fetch origin next`
          # does NOT auto-unshallow that graft, so the line-75 ancestry check
          # (`git merge-base --is-ancestor main <tag>`) fails when walking
          # across the boundary. Tag fetches are cheap (no large objects); the
          # deep fetch pulls only the ancestry needed to resolve ancestry from
          # main to the tag commit. See #308.
          git fetch --tags origin "$RELEASE_TAG"
          SHA="$(git rev-parse "$RELEASE_TAG^{commit}")"
          echo "release_sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Skip if main already at release SHA
        id: skip_check
        env:
          RELEASE_SHA: ${{ steps.sha.outputs.release_sha }}
        run: |
          MAIN_SHA="$(git rev-parse HEAD)"
          if [ "$MAIN_SHA" = "$RELEASE_SHA" ]; then
            echo "::notice::main is already at $RELEASE_SHA — nothing to promote (hotfix path). Exiting cleanly."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify release SHA is reachable from next
        if: steps.skip_check.outputs.skip != 'true'
        env:
          RELEASE_SHA: ${{ steps.sha.outputs.release_sha }}
        run: |
          git fetch origin next
          if ! git merge-base --is-ancestor "$RELEASE_SHA" origin/next; then
            echo "::error::Release SHA $RELEASE_SHA is not reachable from origin/next. \
                  Refusing to promote main — release tag must be cut from next or main \
                  (hotfix path). Investigate the release event before retrying."
            exit 1
          fi

      - name: Verify fast-forward only
        if: steps.skip_check.outputs.skip != 'true'
        env:
          RELEASE_SHA: ${{ steps.sha.outputs.release_sha }}
        run: |
          # main must be an ancestor of the release commit; otherwise the promotion would
          # rewrite history. If this fails, a hotfix has landed on main since the release
          # was drafted — Captain must resolve manually.
          if ! git merge-base --is-ancestor HEAD "$RELEASE_SHA"; then
            echo "::error::main is not an ancestor of release SHA $RELEASE_SHA. \
                  Refusing non-fast-forward promotion. Captain: investigate (likely a \
                  hotfix landed on main between draft and publish)."
            exit 1
          fi

      - name: Capture release-review PR before it auto-closes (issue #307)
        id: review_pr
        if: steps.skip_check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Capture the open release-review PR's number BEFORE the fast-forward below
          # closes it. The release-review PR is the single open base:main head:next PR
          # opened by release-notes-scaffold.yml — GitHub permits at most one open PR per
          # base/head pair, so `--state open` is unambiguous (no number-sorting heuristic).
          # Capturing it here, while it is still open, makes the audit comment correct-by-
          # construction: it cannot mis-target a manual next->main PR or a stale closed one.
          # Best-effort: a missing PR (e.g. a manual cut that skipped the scaffold) is fine.
          PR="$(gh pr list --repo "${{ github.repository }}" \
            --base main --head next --state open \
            --json number --jq '.[0].number // empty' 2>/dev/null || true)"
          echo "number=$PR" >> "$GITHUB_OUTPUT"
          if [ -n "$PR" ]; then
            echo "::notice::release-review PR #$PR captured for post-promotion audit comment"
          else
            echo "::notice::no open release-review PR found to audit-comment (non-fatal)"
          fi

      - name: Fast-forward main
        if: steps.skip_check.outputs.skip != 'true'
        env:
          RELEASE_SHA: ${{ steps.sha.outputs.release_sha }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --ff-only "$RELEASE_SHA"
          git push origin main
          echo "::notice::main advanced to $RELEASE_SHA (release $RELEASE_TAG)"

      - name: Audit-comment the auto-closed release-review PR (issue #307)
        if: steps.skip_check.outputs.skip != 'true' && steps.review_pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_SHA: ${{ steps.sha.outputs.release_sha }}
          REVIEW_PR: ${{ steps.review_pr.outputs.number }}
        run: |
          # Audit trail only. The fast-forward above auto-closed the exact release-review PR
          # captured in the previous step (base:main head:next) as merged; this records
          # which release published it. Best-effort: a comment failure is non-fatal.
          gh pr comment "$REVIEW_PR" --repo "${{ github.repository }}" \
            --body "Release \`${RELEASE_TAG}\` published; \`main\` fast-forwarded to \`${RELEASE_SHA}\`. This release-review PR closed as merged by the promotion. (issue #307)" \
            || echo "::notice::could not comment on release-review PR #$REVIEW_PR (non-fatal)"
