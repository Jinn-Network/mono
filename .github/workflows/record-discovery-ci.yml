name: Record Discovery CI

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
  pull_request:
    paths:
      - "packages/discovery/**"
      - ".github/scripts/record-discovery-*.test.mjs"
      - ".github/workflows/record-discovery-ci.yml"
      - "docs/superpowers/specs/2026-07-27-record-discovery-protocol-design.md"
      - 'docs/superpowers/specs/2026-07-31-verified-environment-supply-design.md'
      - 'docs/superpowers/plans/2026-07-31-supply-c1-environment-record.md'
  push:
    branches: [next]
    paths:
      - "packages/discovery/**"
      - ".github/scripts/record-discovery-*.test.mjs"
      - ".github/workflows/record-discovery-ci.yml"
      - "docs/superpowers/specs/2026-07-27-record-discovery-protocol-design.md"
      - 'docs/superpowers/specs/2026-07-31-verified-environment-supply-design.md'
      - 'docs/superpowers/plans/2026-07-31-supply-c1-environment-record.md'

permissions:
  contents: read

env:
  DISCOVERY_ROOT: packages/discovery

# Consolidated per #2997 (pattern proven by the trust-ci pilot, PR #3001): the
# previous shape ran one runner job per package - 15 jobs chained through
# upload/download-artifact dist round-trips, rebuilding trust-core from source
# in ELEVEN separate jobs. Under the merge queue's free-plan 20-slot runner
# pool that fan-out was almost entirely queue-wait. The packages job below
# builds the same 14 packages with the same five commands each, in dependency
# order in ONE workspace: same coverage, one slot, no artifact round-trips,
# every cross-tree portal built exactly once (in the same section order the old
# verify job used).
#
# The per-job isolation this retires was a de-facto undeclared-dependency
# guard; that invariant is owned by record-discovery-source-boundaries.test.mjs
# in the architecture job.
jobs:
  architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify package inventory and dependency graph
        run: node --test .github/scripts/record-discovery-package-inventory.test.mjs
      - name: Verify source boundaries and canaries
        run: node --test .github/scripts/record-discovery-source-boundaries.test.mjs

  packages:
    name: Record Discovery packages
    runs-on: ubuntu-latest
    # A hung step must not hold a runner slot for the 360-minute default nor
    # burn the queue's 180-minute check-response budget.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
      # A freshly rolled runner image can regress the packed-consumer smoke:
      # node 22.23.2's bundled npm dies with "Cannot read properties of null
      # (reading 'edgesOut')" on yarn-packed tarballs (first seen on the
      # task-execution lane, PR #3010). evidence-ci and the old task-execution
      # foundation job always pinned both for exactly this reason.
      - name: Pin npm for packed-consumer smoke coverage
        run: npm install --global npm@11.19.0 --no-audit --no-fund
      - name: Enable Yarn 4.13.0
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate
      - name: Build cross-tree portal dependency from source (trust-core, §7.8)
        working-directory: packages/trust/core
        run: |
          yarn install --immutable
          yarn build
      - name: Verify Record Discovery Protocol
        working-directory: packages/discovery/protocol
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Verify Record Discovery Testing kit
        working-directory: packages/discovery/testing
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Verify Record Discovery Serve
        working-directory: packages/discovery/serve
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Verify Record Publication
        working-directory: packages/discovery/publication
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Verify Record Discovery Client
        working-directory: packages/discovery/client
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Verify Record Discovery Transport (HTTP)
        working-directory: packages/discovery/transport-http
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Build cross-tree portal dependency from source (evidence-protocol, §7.8)
        working-directory: packages/evidence/protocol
        run: |
          yarn install --immutable
          yarn build
      - name: Build cross-tree portal dependency from source (evidence-repository, §7.8)
        working-directory: packages/evidence/repository
        run: |
          yarn install --immutable
          yarn build
      - name: Build cross-tree portal dependency from source (evidence-discovery, §7.8)
        working-directory: packages/evidence/discovery
        run: |
          yarn install --immutable
          yarn build
      - name: Build cross-tree portal dependency from source (task-execution-protocol, §7.8)
        working-directory: packages/task-execution/protocol
        run: |
          yarn install --immutable
          yarn build
      - name: Build cross-tree portal dependency from source (task-execution-profiles, §7.8)
        working-directory: packages/task-execution/profiles
        run: |
          yarn install --immutable
          yarn build
      - name: Build cross-tree portal dependency from source (benchmarking-records, §7.8)
        working-directory: packages/benchmarking/records
        run: |
          yarn install --immutable
          yarn build
      - name: Build cross-tree portal dependency from source (environment-record, §7.8)
        working-directory: packages/environments/record
        run: |
          yarn install --immutable
          yarn build
      - name: Build cross-tree portal dependency from source (chain-environment-record, §7.8)
        working-directory: packages/environments/chain-record
        run: |
          yarn install --immutable
          yarn build
      - name: Build cross-tree portal dependency from source (information-world, §7.8)
        working-directory: packages/environments/information-world
        run: |
          yarn install --immutable
          yarn build
      - name: Verify Record Discovery Facts (Evidence)
        working-directory: packages/discovery/facts/evidence
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Verify Record Discovery Facts (Trust)
        working-directory: packages/discovery/facts/trust
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Verify Record Discovery Facts (Task Execution)
        working-directory: packages/discovery/facts/task-execution
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Verify Record Discovery Facts (Benchmarking)
        working-directory: packages/discovery/facts/benchmarking
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Verify Record Discovery Facts (Environments)
        working-directory: packages/discovery/facts/environments
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Verify Record Discovery Facts (Chain Environments)
        working-directory: packages/discovery/facts/chain-environments
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Verify Record Discovery Source (Evidence Journal)
        working-directory: packages/discovery/sources/evidence-journal
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Compile packed public entrypoint consumers
        run: node .github/scripts/record-discovery-packed-types.test.mjs
