<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jinn Loop</title>
<style>
  body {
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: #09090b;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
</style>
</head>
<body>
<svg width="520" height="520" viewBox="0 0 520 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Circular track -->
  <circle cx="260" cy="260" r="160" stroke="#27272a" stroke-width="1.5" fill="none" />

  <!-- Arrow paths along the circle (arcs between nodes) -->
  <!-- Top to Right -->
  <path d="M 295 105 A 160 160 0 0 1 410 225" stroke="#3f3f46" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
  <!-- Right to Bottom -->
  <path d="M 415 295 A 160 160 0 0 1 295 415" stroke="#3f3f46" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
  <!-- Bottom to Left -->
  <path d="M 225 415 A 160 160 0 0 1 110 295" stroke="#3f3f46" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
  <!-- Left to Top -->
  <path d="M 105 225 A 160 160 0 0 1 225 105" stroke="#3f3f46" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#52525b" />
    </marker>
  </defs>

  <!-- Node: Creation (top) -->
  <rect x="196" y="72" width="128" height="44" rx="8" fill="#09090b" stroke="#27272a" stroke-width="1.5" />
  <text x="260" y="100" text-anchor="middle" fill="#fafafa" font-size="15" font-weight="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">Creation</text>

  <!-- Node: Execution (right) -->
  <rect x="356" y="238" width="128" height="44" rx="8" fill="#09090b" stroke="#27272a" stroke-width="1.5" />
  <text x="420" y="266" text-anchor="middle" fill="#fafafa" font-size="15" font-weight="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">Execution</text>

  <!-- Node: Evaluation (bottom) -->
  <rect x="196" y="404" width="128" height="44" rx="8" fill="#09090b" stroke="#27272a" stroke-width="1.5" />
  <text x="260" y="432" text-anchor="middle" fill="#fafafa" font-size="15" font-weight="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">Evaluation</text>

  <!-- Node: Knowledge (left) -->
  <rect x="36" y="238" width="128" height="44" rx="8" fill="#09090b" stroke="#27272a" stroke-width="1.5" />
  <text x="100" y="266" text-anchor="middle" fill="#fafafa" font-size="15" font-weight="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">Knowledge</text>

  <!-- Center label -->
  <text x="260" y="255" text-anchor="middle" fill="#a1a1aa" font-size="12" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" letter-spacing="0.1em">THE LOOP</text>
  <text x="260" y="275" text-anchor="middle" fill="#52525b" font-size="11" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">jinn.network</text>
</svg>
</body>
</html>
