[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jinn-plugin"
version = "0.1.0"
description = "Jinn for Hermes — public corpus evidence, local capture and distillation, with contribution parked local-only in Stage 2."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pyyaml"]

[project.entry-points."hermes_agent.plugins"]
jinn = "jinn_plugin"

[tool.setuptools]
package-dir = {"jinn_plugin" = "."}
packages = ["jinn_plugin"]

[tool.setuptools.package-data]
jinn_plugin = ["plugin.yaml", "layer-runtime.json", "skin/*.yaml", "soul/*.md"]
