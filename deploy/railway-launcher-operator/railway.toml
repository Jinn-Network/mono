[build]
builder = "DOCKERFILE"
# Pinned to the per-harness overlay Dockerfile, NEVER the repo root (#846 — a
# root railway.toml hijacks jinn-indexer and every other monorepo service).
dockerfilePath = "deploy/railway-launcher-operator/Dockerfile"
# The overlay's BASE_TAG build arg defaults to `next` — the rolling tag the
# canary lane republishes on every push, so a default-args build always
# resolves. To pin one build instead, set a BASE_TAG service variable, or
# override here with an immutable per-commit tag of the
# ghcr.io/jinn-network/operator package, e.g.:
#   [build.args]
#   BASE_TAG = "canary-<short-sha>"
# No stable release has been published under this package name yet (#2811), so
# `latest` and `X.Y.Z` are 404s here and are not pinnable options today.

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
# Single replica is load-bearing: one wallet must run in one process, else the
# launcher and solver race on the agent-EOA nonce (#792). Do not scale up.
numReplicas = 1
