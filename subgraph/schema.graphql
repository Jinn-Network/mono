"""
Jinn-specific subgraph schema.

Synthesizes a queryable `Execution` entity by stitching together:
- `IdentityRegistry.MetadataSet` — per-execution content commitments published as
  `setMetadata(agentId, "<kind>:<cid>", payload)` on the operator's NFT.
- `ValidationRegistry.ValidationRequest` / `.ValidationResponse` — per-execution
  challenges keyed by `(validator, agentId, requestHash)` where
  `requestHash = manifest.evidenceHash`.
- `ReputationRegistry.NewFeedback` / `.FeedbackRevoked` / `.ResponseAppended` —
  feedback on the operator NFT, body naming the specific manifest CID.
- `JinnRouter` request creation + delivery — to bind on-chain `requestId` to the
  off-chain manifest hash and surface delivery timing.

Operator-rooted ERC-8004 entity model. See decision record
`docs/superpowers/specs/2026-04-27-erc-8004-entity-model-design.md`.
"""

# ── Operator (one agentId per operator Safe) ───────────────────────────────────

type Operator @entity(immutable: false) {
  "agentId as decimal string"
  id: ID!

  "ERC-721 token id from IdentityRegistry"
  agentId: BigInt!

  "Current owner of the agent NFT (the agent EOA)"
  owner: Bytes!

  "agentURI set at register / via setAgentURI"
  agentURI: String

  "Latest verified Safe wallet (from `agentWallet` reserved metadata)"
  agentWallet: Bytes

  registeredAt: BigInt!
  registeredBlock: BigInt!
  registeredTx: Bytes!

  lastUpdatedAt: BigInt!

  executions: [Execution!]! @derivedFrom(field: "operator")
  metadataEntries: [MetadataEntry!]! @derivedFrom(field: "operator")
  validationsAsAgent: [Validation!]! @derivedFrom(field: "agent")
  feedbackReceived: [Feedback!]! @derivedFrom(field: "agent")
  uriUpdates: [URIUpdate!]! @derivedFrom(field: "operator")
  routerJobs: [RouterJob!]! @derivedFrom(field: "operator")
}

# ── Execution (synthesized from MetadataSet + JinnRouter + Validation + Feedback) ──

"""
Tier of the execution's commitment payload.
0 = self-signed, 1 = committed, 2 = consensus, 3 = attested, 4 = proved.
See `docs/superpowers/specs/2026-04-23-jinn-execution-envelope-tee-scope.md`.
"""
enum ExecutionTier {
  SELF_SIGNED
  COMMITTED
  CONSENSUS
  ATTESTED
  PROVED
  UNKNOWN
}

enum ExecutionKind {
  ENVELOPE
  EVALUATION
  OTHER
}

type Execution @entity(immutable: false) {
  """
  Composite id: `<agentId>-<manifestHash hex>`. Stable across re-publishes
  (the same metadata key is overwritten by `setMetadata`).
  """
  id: ID!

  operator: Operator!
  kind: ExecutionKind!

  "Raw metadata key, e.g. `envelope:bafy…` or `evaluation:bafy…`"
  metadataKey: String!

  "CID parsed from the metadata key suffix (after `<kind>:`)"
  manifestCid: String!

  """
  keccak256 of the canonical manifest bytes. Decoded from the `MetadataSet`
  payload. Equals JinnRouter `evidenceHash` when present.
  """
  manifestHash: Bytes

  "Decoded tier from payload (when payload conforms to the v1 schema)"
  tier: ExecutionTier!

  "uint8 raw tier value (0..4) or null if undecoded"
  tierRaw: Int

  "Raw multibase-decoded IPFS CID bytes of TEE attestation quote (empty for tier < attested). See payload schema spec §4 — binary form, not text."
  attestationQuoteCid: Bytes

  "Expected enclave measurement (zero for tier < attested)"
  sourceMeasurement: Bytes

  "Payload schema version (always 1 for now, null if not decoded)"
  payloadVersion: Int

  """
  Harness execution mode declared by the operator on this envelope.
  "train" — Improve + Memory phases active; implStateDir mutates across Tasks.
  "frozen" — writes to implStateDir disabled; codeDigest stable across the window.

  Back-compat default: envelopes published before Plan 1 (2026-05-06) do not
  carry mode in the on-chain payload and are indexed as "train". New envelopes
  populate this field when the payload v2 encoding ships. See
  docs/superpowers/specs/2026-05-06-agent-harness-solvernet-design.md §6.
  """
  mode: String!

  """
  Harness implementation name (e.g. "claude-code-learner"). Decoded from payload
  v2 encoding when it ships; null for all v1 payloads. Used as the first
  dimension of HarnessRollup identity.
  See docs/superpowers/specs/2026-05-06-agent-harness-solvernet-design.md §6.
  """
  implName: String

  """
  Merkle hash of implStateDir contents at the time of execution. Stable across
  a frozen window; changes each Task in train mode. Decoded from payload v2;
  null for v1 payloads.
  See docs/superpowers/specs/2026-05-06-agent-harness-solvernet-design.md §5.
  """
  codeDigest: String

  """
  Programming language of the Task this execution addresses (from the Task's
  SWE-rebench-v2 metadata). Null until payload v2 carries it or a separate
  task-metadata lookup is wired. Used for LanguageRollup stratification.
  """
  language: String

  """
  Score for EVALUATION kind executions: 0 (fail) or 1 (pass). Null for
  ENVELOPE kind. Decoded from the Verdict payload when v2 encoding ships;
  always null for v1 payloads.
  See docs/superpowers/specs/2026-05-06-agent-harness-solvernet-design.md §3.5.
  """
  score: Int

  "True iff payload bytes parsed cleanly into the v1 envelope/evaluation tuple"
  payloadDecoded: Boolean!

  "Raw bytes payload from MetadataSet (for forward-compat / debugging)"
  payloadBytes: Bytes!

  "Block + tx of the most recent setMetadata for this row"
  publishedAt: BigInt!
  publishedBlock: BigInt!
  publishedTx: Bytes!

  "How many times this exact (agentId, metadataKey) has been (re)published"
  publishCount: Int!

  """
  JinnRouter request id this execution was filed in response to (if any).

  NOT YET POPULATED: Execution.routerJob and Execution.deliveredAt are null
  for all executions until JinnRouter emits an event that includes evidenceHash,
  or until ERC-8004 metadata payload v2 includes requestId so the subgraph can
  build the join deterministically. The previous join (manifestHash vs requestId)
  compared values from different domains and has been removed. See subgraph
  handler identity.ts for full explanation.
  """
  jinnRouterRequestId: Bytes
  routerJob: RouterJob

  "Block timestamp of the on-chain delivery claim, if matched. See jinnRouterRequestId note — currently always null."
  deliveredAt: BigInt

  validations: [Validation!]! @derivedFrom(field: "execution")
  feedback: [Feedback!]! @derivedFrom(field: "execution")
}

"""
Capture envelope projection. Capture envelopes are ordinary per-execution
metadata anchors, but published under `capture:<cid>` so the subgraph can index
them without fetching IPFS from mappings.
"""
type CaptureEnvelope @entity(immutable: false) {
  id: ID!
  operator: Operator!
  execution: Execution
  manifestCid: String!
  manifestHash: Bytes
  tier: ExecutionTier!
  implName: String
  codeDigest: String
  repoKey: String!
  repoRemoteUrl: String
  repoCommitHash: String
  publishedAt: BigInt!
  publishedBlock: BigInt!
  publishedTx: Bytes!
  publishCount: Int!
  repoAggregate: CapturesByRepo!
  operatorAggregate: CapturesByOperator!
}

type CapturesByRepo @entity(immutable: false) {
  id: ID!
  repoKey: String!
  repoRemoteUrl: String
  repoCommitHash: String
  captureCount: Int!
  lastCaptureAt: BigInt!
  captures: [CaptureEnvelope!]! @derivedFrom(field: "repoAggregate")
}

type CapturesByOperator @entity(immutable: false) {
  id: ID!
  operator: Operator!
  captureCount: Int!
  lastCaptureAt: BigInt!
  captures: [CaptureEnvelope!]! @derivedFrom(field: "operatorAggregate")
}

"""
Generic catch-all for `MetadataSet` rows that do not match a recognised
prefix (`envelope:`, `evaluation:`, etc.). Lets us see new keys without
shipping a new subgraph.
"""
type MetadataEntry @entity(immutable: false) {
  "Composite id: `<agentId>-<keccak256(metadataKey hex)>`"
  id: ID!

  operator: Operator!
  metadataKey: String!
  metadataValue: Bytes!

  updatedAt: BigInt!
  updatedBlock: BigInt!
  updatedTx: Bytes!
  updateCount: Int!
}

# ── Validation (per-execution challenges) ─────────────────────────────────────

enum ValidationStatusKind {
  REQUESTED
  RESPONDED
}

type Validation @entity(immutable: false) {
  "requestHash as 0x-prefixed hex"
  id: ID!

  "Operator agentId that the dispute is filed against"
  agent: Operator!

  validator: Bytes!
  requestHash: Bytes!
  requestURI: String

  "If we matched it to a known Execution by requestHash == manifestHash"
  execution: Execution

  status: ValidationStatusKind!

  "0..100 (set on response)"
  response: Int
  responseURI: String
  responseHash: Bytes
  tag: String

  requestedAt: BigInt!
  requestedBlock: BigInt!
  requestedTx: Bytes!

  respondedAt: BigInt
  respondedBlock: BigInt
  respondedTx: Bytes
}

# ── Feedback (operator-level reputation, body names manifest) ─────────────────

type Feedback @entity(immutable: false) {
  "Composite id: `<agentId>-<clientAddress hex>-<feedbackIndex>`"
  id: ID!

  agent: Operator!
  client: Bytes!

  "1-indexed feedbackIndex from the registry (per-(agent, client) sequence)"
  feedbackIndex: BigInt!

  value: BigInt!
  valueDecimals: Int!

  tag1: String
  tag2: String
  endpoint: String
  feedbackURI: String
  feedbackHash: Bytes

  "Manifest CID parsed from the feedback body (URI / tag2 heuristic)"
  manifestRef: String

  "Joined Execution if `manifestRef` matches an indexed envelope/evaluation"
  execution: Execution

  revoked: Boolean!
  revokedAt: BigInt
  revokedTx: Bytes

  createdAt: BigInt!
  createdBlock: BigInt!
  createdTx: Bytes!

  responses: [FeedbackResponse!]! @derivedFrom(field: "feedback")
}

type FeedbackResponse @entity(immutable: true) {
  "Composite id: `<feedback.id>-<responder hex>-<txHash>-<logIndex>`"
  id: ID!

  feedback: Feedback!
  responder: Bytes!
  responseURI: String!
  responseHash: Bytes!

  appendedAt: BigInt!
  appendedBlock: BigInt!
  appendedTx: Bytes!
}

# ── URI updates (audit log on the operator's identity) ────────────────────────

type URIUpdate @entity(immutable: true) {
  "Composite id: `<txHash>-<logIndex>`"
  id: ID!

  operator: Operator!
  newURI: String!
  updatedBy: Bytes!
  updatedAt: BigInt!
  updatedBlock: BigInt!
  updatedTx: Bytes!
}

# ── JinnRouter (request creation + delivery) ──────────────────────────────────

enum RouterJobKind {
  RESTORATION
  EVALUATION
}

type RouterJob @entity(immutable: false) {
  "requestId as 0x-prefixed hex"
  id: ID!

  kind: RouterJobKind!
  creator: Bytes!

  "For evaluation jobs, the parent restoration requestId"
  restorationRequestId: Bytes

  parentJob: RouterJob

  createdAt: BigInt!
  createdBlock: BigInt!
  createdTx: Bytes!

  "uint8 jobType from DeliveryClaimed (0=unknown,1=restoration,2=evaluation)"
  deliveryJobType: Int

  "Address that called claimDelivery"
  claimer: Bytes

  claimedAt: BigInt
  claimedBlock: BigInt
  claimedTx: Bytes

  "If we matched the request to an operator by creator address (best-effort)"
  operator: Operator
}

# ── HarnessRollup (per-harness 30-day aggregation) ────────────────────────────

"""
Aggregated Verdict statistics per (implName, codeDigest, mode) tuple over a
30-day rolling window. Updated each time an EVALUATION Execution (Verdict) is
indexed that carries implName + codeDigest from the corresponding Solution
envelope.

STUB NOTE (2026-05-07): The Verdict→Solution join that extracts implName +
codeDigest from the evaluator's counterpart envelope is not yet wired. The
HarnessRollup handler is scaffolded and called from the EVALUATION execution
path but is a no-op pending payload v2 encoding (which will carry implName,
codeDigest, mode, language, and score in the on-chain payload). Once payload
v2 ships, the handler will be activated and rollups will populate. See
docs/superpowers/specs/2026-05-06-agent-harness-solvernet-design.md §3.5 and
log/decisions/2026-05-06-aggregation-multi-winrate.md.
"""
type HarnessRollup @entity(immutable: false) {
  "Composite: \"<implName>|<codeDigest>|<mode>|<windowStart>\""
  id: ID!

  implName: String!
  codeDigest: String!

  "\"train\" | \"frozen\""
  mode: String!

  "Unix timestamp of the first second of the 30-day window (floor(ts/86400/30)*30*86400)"
  windowStart: BigInt!

  "windowStart + 30*86400"
  windowEnd: BigInt!

  verdictCount: BigInt!

  "Sum of Execution.score values (0 or 1) over the window"
  scoreSum: BigInt!

  "= scoreSum / verdictCount (0 when verdictCount == 0)"
  meanResolved: BigDecimal!

  "Count of distinct operator signing keys that contributed Verdicts in this window"
  uniqueOperators: BigInt!

  firstSeenAt: BigInt!
  lastSeenAt: BigInt!

  byLanguage: [LanguageRollup!]! @derivedFrom(field: "parent")
}

"""
Language-stratified slice of a HarnessRollup. One row per (HarnessRollup,
language) pair.
"""
type LanguageRollup @entity(immutable: false) {
  "Composite: \"<harnessRollupId>|<language>\""
  id: ID!

  parent: HarnessRollup!
  language: String!

  verdictCount: BigInt!
  scoreSum: BigInt!
  meanResolved: BigDecimal!
}

# ── FreezeViolation (cross-envelope codeDigest consistency detector) ──────────

"""
Mutable state entity tracking the last-seen codeDigest for a signing key
while it is in frozen mode. Used by the cross-envelope consistency detector
to compare consecutive frozen-mode envelopes from the same operator.

STUB NOTE (2026-05-07): This entity is always null for now because
Execution.codeDigest is never populated until payload v2 ships. The
freeze-violation detector reads this entity but its early-return guard
(codeDigest == null) means SigningKeyFrozenState rows are never written yet.
Activates automatically when payload v2 lands and populates codeDigest.

Spec: docs/superpowers/specs/2026-05-06-agent-harness-solvernet-design.md §6.2
DR: log/decisions/2026-05-06-trust-stack-composition.md (layer 2)
"""
type SigningKeyFrozenState @entity(immutable: false) {
  "Operator.id (agentId as decimal string) — one row per signing key"
  id: ID!

  "The codeDigest seen on the most recent frozen-mode envelope from this key"
  lastFrozenCodeDigest: String!

  "Block timestamp of the envelope that set lastFrozenCodeDigest"
  lastFrozenAt: BigInt!

  "Execution.id of the envelope that set lastFrozenCodeDigest"
  lastFrozenExecutionId: String!
}

"""
Immutable record of a codeDigest mutation detected within a frozen-mode
window for a single signing key. Two consecutive frozen-mode envelopes from
the same operator that carry different codeDigest values are flagged here.
Mode boundaries (frozen → train → frozen) reset the consistency requirement
so violations are not raised across separate frozen windows.

STUB NOTE (2026-05-07): No FreezeViolation rows will be written until
payload v2 carries codeDigest in the on-chain Execution payload. The handler
is wired and the schema is registered — activation requires only the
removal of the early-return guard in freeze-violation-detector.ts once
payload v2 data flows are live.

Spec: docs/superpowers/specs/2026-05-06-agent-harness-solvernet-design.md §6.2
DR: log/decisions/2026-05-06-trust-stack-composition.md (layer 2)
"""
type FreezeViolation @entity(immutable: true) {
  "Composite: \"<signingKey>|<envelopeId>\""
  id: ID!

  "Operator.id (agentId decimal) of the operator that published the violating envelope"
  signingKey: String!

  "Execution.id of the envelope that triggered the violation"
  envelopeId: String!

  "Block timestamp of the violating envelope"
  detectedAt: BigInt!

  "Human-readable reason, e.g. \"codeDigest changed within frozen window\""
  reason: String!

  "codeDigest seen on the prior frozen-mode envelope from this signing key"
  priorCodeDigest: String!

  "codeDigest seen on the current (violating) frozen-mode envelope"
  envelopeCodeDigest: String!
}

# ── V3 task lifecycle (TaskCoordinator + JinnRouterV3) ────────────────────────

"""
A V3 task minted by `JinnRouterV3.createTask`. The router relays the bundle
into `TaskCoordinator`, which is the source of truth for claim/submit/verdict
state machines. Indexed from BOTH datasources — the router emits creation
budget, the coordinator emits the manifest hashes and deadlines.
"""
type Task @entity(immutable: false) {
  "taskId as decimal string"
  id: ID!

  taskId: BigInt!
  creator: Bytes!

  "keccak256 of canonical task manifest bytes"
  manifestDigest: Bytes!

  "keccak256 of the task CID bytes (commitment to off-chain task definition)"
  taskCidDigest: Bytes!

  "Maximum concurrent claim attempts permitted by the task config"
  maxClaims: Int

  "Number of independent verdicts required to finalize an attempt"
  requiredVerdicts: Int

  "JINN budget reserved for solution delivery (router-side bookkeeping)"
  solutionBudget: BigInt

  "JINN budget reserved for verdict delivery (router-side bookkeeping)"
  verdictBudget: BigInt

  "TaskCoordinator claim window start (unix seconds)"
  claimWindowStart: BigInt

  "TaskCoordinator claim window end (unix seconds)"
  claimWindowEnd: BigInt

  "TaskCoordinator submission deadline (unix seconds)"
  submissionDeadline: BigInt

  "TaskCoordinator evaluation deadline (unix seconds)"
  evaluationDeadline: BigInt

  "True once any attempt has been finalized as passed (best-effort)"
  finalized: Boolean!

  "True once the router has refunded any unspent budget for this task"
  refunded: Boolean!

  "Capture envelope CID this Task was distilled from, when generated by session-derived.v1"
  sourceCaptureCid: String

  refundedSolutionAmount: BigInt
  refundedVerdictAmount: BigInt

  createdAt: BigInt!
  createdAtBlock: BigInt!
  createdAtTx: Bytes!

  attempts: [TaskAttempt!]! @derivedFrom(field: "task")
}

enum TaskAttemptStatus {
  CLAIMED
  SUBMITTED
  FINALIZED
  EXPIRED
}

"""
A claim by a single operator on a Task. attemptIndex is unique within a task.
Submission + finalize transitions are folded onto this row.
"""
type TaskAttempt @entity(immutable: false) {
  "Composite id: `<taskId>-<attemptIndex>`"
  id: ID!

  task: Task!
  attemptIndex: Int!
  operator: Bytes!

  status: TaskAttemptStatus!

  claimExpiresAt: BigInt
  claimedAtBlock: BigInt!
  claimedAtTx: Bytes!

  "JinnRouterV3 requestId pinned to this attempt"
  solutionRequestId: Bytes

  "TaskCoordinator solutionCidDigest from TaskSubmitted, if submitted"
  solutionCidDigest: Bytes

  "TaskCoordinator solutionWeight from TaskSubmitted, if submitted"
  solutionWeight: BigInt

  submittedAt: BigInt
  submittedAtBlock: BigInt
  submittedAtTx: Bytes

  "True iff AttemptFinalized has been emitted for this attempt"
  finalized: Boolean!

  "True iff AttemptFinalized.passed for this attempt"
  passed: Boolean

  validVerdictCount: Int
  passVerdictCount: Int

  finalizedAt: BigInt
  finalizedAtBlock: BigInt
  finalizedAtTx: Bytes

  expiredAt: BigInt
  expiredAtTx: Bytes

  verdicts: [Verdict!]! @derivedFrom(field: "attempt")
}

enum VerdictStatus {
  CLAIMED
  DELIVERED
}

"""
A single evaluator verdict slot on a TaskAttempt. verdictIndex is unique
within an attempt.
"""
type Verdict @entity(immutable: false) {
  "Composite id: `<taskId>-<attemptIndex>-<verdictIndex>`"
  id: ID!

  attempt: TaskAttempt!
  verdictIndex: Int!
  evaluator: Bytes!

  status: VerdictStatus!

  claimExpiresAt: BigInt
  claimedAtBlock: BigInt!
  claimedAtTx: Bytes!

  "JinnRouterV3 requestId pinned to this verdict"
  verdictRequestId: Bytes

  "Verdict CID digest from VerdictDelivered, if delivered"
  verdictCidDigest: Bytes

  "uint8 verdict code (0=unknown, 1=pass, 2=fail) from VerdictDelivered"
  verdictCode: Int

  deliveredAt: BigInt
  deliveredAtBlock: BigInt
  deliveredAtTx: Bytes
}

# ── SolverNet manifest events (operator catalog) ──────────────────────────────

"""
Each `MetadataSet(agentId, "solvernet-manifest:<cid>", ...)` write becomes
one immutable row. Powers `api.solvernets.listRegistry` and the launched-
record-aware claim eligibility filter. Per-key latest state lives on
`MetadataEntry`; this entity preserves the full append history.
"""
type SolverNetManifestEvent @entity(immutable: true) {
  "Composite id: `<txHash>-<logIndex>`"
  id: ID!

  "Launcher's agentId from the IdentityRegistry"
  agentId: BigInt!

  operator: Operator!

  "Full metadata key, e.g. `solvernet-manifest:bafy…`"
  metadataKey: String!

  "CID parsed from the metadata key suffix (after `solvernet-manifest:`)"
  manifestCid: String!

  "Raw bytes from the setMetadata payload"
  payload: Bytes!

  blockNumber: BigInt!
  transactionIndex: Int!
  logIndex: BigInt!
  timestamp: BigInt!
  txHash: Bytes!
}
