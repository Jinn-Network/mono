name: Stack fixture immutability

# Golden fixtures are the compatibility contract (2026-07-30 marketplace-surfaces
# design §8.1). This gate is offline and binds from day one: an existing fixture id
# keeps its exact bytes forever, nothing is removed, and a correction arrives as a
# new fixture plus a dated erratum. The minor-bump consequence of an addition is
# enforced against the registry in the stable publish lane.
on:
  pull_request:
  merge_group:
  push:
    branches: [next]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    # Push-lane dedup probe (#2996): a queue landing is the byte-identical
    # commit its merge_group build verified, so a completed successful
    # `stack-fixture-gate` check-run on this exact SHA proves the fixture jobs
    # already executed against this tree. Probing the GATE name is sound HERE
    # because this workflow has no merge-group selection: the gate only reports
    # success after every worker ran (if selection is ever added to the
    # merge_group lane, switch this probe to the worker names - see
    # hermetic-gate.yml). This job is IDENTITY-ONLY: every event other than a
    # push to next selects the full run, and it must never grow a diff arm -
    # this required context carries no path filtering.
    name: stack-fixture-changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
    outputs:
      run: ${{ steps.select.outputs.run }}
    steps:
      - name: Probe for a same-SHA merge-group verdict
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" != push ]; then
            echo 'run=true' >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [ "${GITHUB_REF:-}" = 'refs/heads/next' ] && [ "${GITHUB_RUN_ATTEMPT:-1}" = '1' ]; then
            verified="$(gh api -X GET "repos/${GITHUB_REPOSITORY:-}/commits/${GITHUB_SHA:-}/check-runs" \
              -f check_name='stack-fixture-gate' -f status=completed -f per_page=100 \
              --jq '[.check_runs[] | select(.conclusion == "success")] | length' \
              2>/dev/null || echo 0)"
            case "${verified}" in
              *[!0-9]*|'') verified=0 ;;
            esac
            if [ "${verified}" -gt 0 ]; then
              echo "::notice::stack-fixture-gate already passed on this SHA in its merge_group build; deduplicating the push-lane run (#2996)"
              echo 'run=false' >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            echo "::notice::no completed successful stack-fixture-gate check-run found on this SHA; running in full"
          fi
          echo 'run=true' >> "${GITHUB_OUTPUT}"

  fixtures:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Verify the fixture manifests are current
        run: |
          node .github/scripts/fixture-manifest.mjs --check
          node --test .github/scripts/fixture-manifest.test.mjs
      - name: Verify fixture immutability against the base
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_REF}" ] || [ "${BASE_REF}" = "0000000000000000000000000000000000000000" ]; then
            echo "::notice::No base commit to compare against; skipping."
            exit 0
          fi
          # Prove the base is actually in this checkout before comparing against it.
          # fixture-immutability.mjs treats a failed `git show <ref>:<path>` as "no
          # baseline for this package" and returns null, so an unreachable BASE_REF
          # does not error — it silently yields "holds across 0 packages" and exits 0.
          # A vacuous green on an immutability gate is worse than a red, so fail loud.
          if ! git cat-file -e "${BASE_REF}^{commit}" 2>/dev/null; then
            echo "::error::Base commit ${BASE_REF} is not present in this checkout; the immutability comparison would be vacuous."
            exit 1
          fi
          node .github/scripts/fixture-immutability.mjs --base "${BASE_REF}"
          node --test .github/scripts/fixture-immutability.test.mjs
  stack-fixture-gate:
    # The check-run name GitHub reports is this job's display `name:` below, and that
    # string is the required-status-check context registered on the `next` ruleset
    # (DR-2026-08-18-b D3) — keep them in sync.
    name: stack-fixture-gate
    needs: [changes, fixtures]
    if: always()
    runs-on: ubuntu-latest
    # The bound keeps a wedged runner from holding the required context open for
    # the 360-minute default.
    timeout-minutes: 5
    steps:
      - name: Require exact fixture-gate success unless dedup unselected it
        env:
          SELECTED: ${{ needs.changes.outputs.run }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          FIXTURES_RESULT: ${{ needs.fixtures.result }}
        run: |
          set -euo pipefail
          test "${CHANGES_RESULT}" = success
          # Empty must never be read as "unselected": a broken probe step would
          # otherwise turn into a green gate over a skipped worker.
          case "${SELECTED}" in
            true|false) ;;
            *)
              echo "::error::unparseable selection output: '${SELECTED}'"
              exit 1
              ;;
          esac
          expected=success
          if [ "${SELECTED}" != true ]; then
            expected=skipped
          fi
          test "${FIXTURES_RESULT}" = "${expected}"
