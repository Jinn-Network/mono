name: Environments CI

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
  pull_request:
    paths:
      - "packages/environments/**"
      - ".github/scripts/environments-*.test.mjs"
      - ".github/workflows/environments-ci.yml"
      - "docs/superpowers/specs/2026-07-31-verified-environment-supply-design.md"
      - "docs/superpowers/plans/2026-07-31-supply-c1-environment-record.md"
      - "docs/superpowers/plans/2026-07-31-supply-c2-environment-verification.md"
      - "docs/superpowers/plans/2026-07-31-chain-ce1-chain-record.md"
      - "docs/superpowers/plans/2026-07-31-chain-ce3-chain-verification.md"
      - "docs/superpowers/plans/2026-07-31-chain-ce4-chain-extraction.md"
      - "docs/superpowers/plans/2026-07-31-chain-ce6-information-world.md"
      - "docs/superpowers/specs/2026-07-31-chain-environment-family-design.md"
  push:
    branches: [next]
    paths:
      - "packages/environments/**"
      - ".github/scripts/environments-*.test.mjs"
      - ".github/workflows/environments-ci.yml"
      - "docs/superpowers/specs/2026-07-31-verified-environment-supply-design.md"
      - "docs/superpowers/plans/2026-07-31-supply-c1-environment-record.md"
      - "docs/superpowers/plans/2026-07-31-supply-c2-environment-verification.md"
      - "docs/superpowers/plans/2026-07-31-chain-ce1-chain-record.md"
      - "docs/superpowers/plans/2026-07-31-chain-ce3-chain-verification.md"
      - "docs/superpowers/plans/2026-07-31-chain-ce4-chain-extraction.md"
      - "docs/superpowers/plans/2026-07-31-chain-ce6-information-world.md"
      - "docs/superpowers/specs/2026-07-31-chain-environment-family-design.md"

permissions:
  contents: read

env:
  ENVIRONMENTS_ROOT: packages/environments

# Consolidated per #2997 (pattern proven by the trust-ci pilot, PR #3001): the
# previous shape ran one runner job per package, each rebuilding its test-only
# oracles from source (trust-core three times, evidence-protocol three times).
# The packages job below builds the same seven packages with the same commands,
# in dependency order in ONE workspace: same coverage (including the
# network-denied closed-profile proof), one slot, every oracle built once.
#
# The per-job isolation this retires was a de-facto undeclared-dependency
# guard; that invariant is owned by environments-source-boundaries.test.mjs in
# the architecture job.
jobs:
  architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Enable Yarn 4.13.0
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate
      - name: Install the information-world AST policy compiler
        working-directory: packages/environments/information-world
        run: yarn install --immutable
      - name: Verify package inventory and dependency graph
        run: node --test .github/scripts/environments-package-inventory.test.mjs
      - name: Verify source boundaries and canaries
        run: node --test .github/scripts/environments-source-boundaries.test.mjs

  packages:
    name: Environments packages
    runs-on: ubuntu-latest
    # A hung step must not hold a runner slot for the 360-minute default nor
    # burn the queue's 180-minute check-response budget.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Enable Yarn 4.13.0
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate
      - name: Build cross-tree portal dependency from source (trust-core, §7.8)
        working-directory: packages/trust/core
        run: |
          yarn install --immutable
          yarn build
      - name: Build cross-tree portal dependency from source (trust-testing, §7.8)
        working-directory: packages/trust/testing
        run: |
          yarn install --immutable
          yarn build
      - name: Build cross-tree portal dependency from source (evidence-protocol, §7.8)
        working-directory: packages/evidence/protocol
        run: |
          yarn install --immutable
          yarn build
      - name: Verify Environment Record
        working-directory: packages/environments/record
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Verify Environment Verification
        working-directory: packages/environments/verification
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Verify Chain Environment Record
        working-directory: packages/environments/chain-record
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Verify Chain Environment Verification
        working-directory: packages/environments/chain-verification
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Verify Chain State Extraction
        working-directory: packages/environments/chain-extraction
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Verify Information World
        working-directory: packages/environments/information-world
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Prove the closed execution profile under a network-denied runtime
        working-directory: packages/environments/information-world
        run: yarn check:network-denied
      - name: Compile packed public entrypoint consumers
        run: node .github/scripts/environments-packed-types.test.mjs
