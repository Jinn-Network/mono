name: Core CI

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'packages/core/**'
      - '.github/workflows/core-ci.yml'
      # Transitive `portal:` closure of the workspaces above (#3573). Each is built
      # from source into this lane, so a change confined to one of them changes what
      # this lane verifies. Enforced by .github/scripts/portal-path-filters.test.mjs.
      - 'packages/plugin/**'
  push:
    branches: [main]
    paths:
      - 'packages/core/**'
      - '.github/workflows/core-ci.yml'
      # Transitive `portal:` closure of the workspaces above (#3573). Each is built
      # from source into this lane, so a change confined to one of them changes what
      # this lane verifies. Enforced by .github/scripts/portal-path-filters.test.mjs.
      - 'packages/plugin/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: packages/core

jobs:
  check:
    name: Typecheck, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout without credentials
        working-directory: ${{ github.workspace }}
        env:
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git -c protocol.version=2 fetch --no-tags --depth=1 origin "${REF}"
          git checkout --detach FETCH_HEAD
      - name: Enable Corepack before the Yarn cache lookup
        # setup-node resolves the Yarn cache folder by shelling out to `yarn`.
        # Without Corepack that is the runner image's global Yarn 1, which
        # refuses every project pinned to `packageManager: yarn@4.13.0`.
        run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: |
            packages/plugin/yarn.lock
            packages/core/yarn.lock
      - run: corepack enable
      - run: yarn --cwd ../plugin install --immutable
      - run: yarn --cwd ../plugin build
      - run: yarn install --immutable
      - run: yarn build
      - run: yarn typecheck
      - run: yarn test

  client-compat:
    name: Client Typecheck & Extracted-Boundary Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: operator
    steps:
      - name: Checkout without credentials
        working-directory: ${{ github.workspace }}
        env:
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git -c protocol.version=2 fetch --no-tags --depth=1 origin "${REF}"
          git checkout --detach FETCH_HEAD
      - name: Enable Corepack before the Yarn cache lookup
        # setup-node resolves the Yarn cache folder by shelling out to `yarn`.
        # Without Corepack that is the runner image's global Yarn 1, which
        # refuses every project pinned to `packageManager: yarn@4.13.0`.
        run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: operator/yarn.lock
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn build:plugin
      - run: yarn build:core
      - run: yarn build:layer
      - run: yarn typecheck
      - run: >-
          yarn vitest run
          test/architecture/golden-envelope.test.ts
          test/bin/jinn-layer-composition.test.ts
