name: Evidence Discovery CI

on:
  pull_request:
    paths:
      - "packages/evidence-protocol/**"
      - "packages/evidence-repository/**"
      - "packages/evidence-catalog/**"
      - "packages/evidence-indexer/**"
      - ".github/workflows/evidence-discovery-ci.yml"
  push:
    branches: [next]
    paths:
      - "packages/evidence-protocol/**"
      - "packages/evidence-repository/**"
      - "packages/evidence-catalog/**"
      - "packages/evidence-indexer/**"
      - ".github/workflows/evidence-discovery-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Yarn 4.13.0
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate

      - name: Verify Evidence Protocol dependency
        working-directory: packages/evidence-protocol
        run: |
          yarn install --immutable
          yarn check:profile
          yarn typecheck
          yarn test
          yarn build

      - name: Verify Evidence Repository dependency
        working-directory: packages/evidence-repository
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build

      - name: Verify Evidence Catalog
        working-directory: packages/evidence-catalog
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke

      - name: Verify Evidence Indexer
        working-directory: packages/evidence-indexer
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
