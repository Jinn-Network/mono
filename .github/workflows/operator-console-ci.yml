name: Operator console CI

on:
  pull_request:
    paths:
      - "apps/operator-console/**"
      - ".github/workflows/operator-console-ci.yml"
      - "docs/design/jinn-design-system/project/colors_and_type.css"
      - "docs/design/jinn-design-system/project/foundations.css"
  push:
    branches: [next]
    paths:
      - "apps/operator-console/**"
      - ".github/workflows/operator-console-ci.yml"
      - "docs/design/jinn-design-system/project/colors_and_type.css"
      - "docs/design/jinn-design-system/project/foundations.css"

permissions:
  contents: read

jobs:
  console:
    name: Build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/operator-console
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Enable Yarn 4.13.0
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate
      - run: yarn install --immutable
      - run: yarn test
      - run: yarn typecheck
      - run: yarn build
