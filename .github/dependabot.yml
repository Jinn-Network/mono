  # First-party packages
  - package-ecosystem: npm
    directory: "/packages/indexer"
    schedule:
      interval: weekly
    # packages/indexer-enrichment links this package by portal, so its
    # lockfile records the ranges that this package.json declares under
    # `dependencies`. Dependabot never refreshes that lockfile, so a range
    # edited here makes `yarn install --immutable` fail there with YN0028
    # (issue #5041). lockfile-only moves this lockfile and leaves
    # package.json alone, so an update that needs a new range, such as Ponder
    # 0.17 to 0.18 (issue #5042), is skipped and made by hand together with
    # the enrichment lockfile. It also applies to security updates: one whose
    # fix fits the declared range is opened (when Dependabot security updates
    # are enabled for the repository); one that needs a new range shows as an
    # alert and needs the same hand change.
