name: native-e2e-rig

# Scheduled/manual advisory wiring for `yarn e2e:daemon-harness:native`, covering
# the one-swap M7 native fleet rig (umbrella #2461, DR-2026-08-05) plus the
# G-archive separate-process consumer. Native mode must follow the Base Sepolia
# (chain ID 84532) policy.
#
# WHY SCHEDULED + manual, NOT a PR-blocking gate (the flake-honesty rule,
# memory: dont-over-validate-flaky-nongating-tests / CLAUDE.md workflow rules):
# both rigs are infra-dependent and CANNOT be made deterministic in PR CI —
#   - the native rig forks LIVE Base Sepolia over the network (a public RPC) and
#     spawns Anvil; a network blip or RPC rate-limit is not a code regression;
#   - the archive rig spawns a second OS process and a TCP listener.
# Wiring either onto a blocking gate would put a flake on the merge path.
# Deterministic blocking coverage is split across CI: `yarn test:hermetic` in
# hermetic-gate.yml covers the snapshot/subprocess loops, while `yarn test` in
# ci.yml runs `test/daemon/native-fleet-e2e-fixtures.test.ts`, the mock-anchored
# fixture identity/trust boot leg. This workflow proves the on-chain,
# finality-gated legs a live fork can provide, as advisory evidence only.
#
# Operator-run, non-CI live-fork cutover evidence and the required deploy-PR
# record are defined in docs/runbooks/cutover-one-swap-drain.md. This workflow is
# supplemental and does not replace those runs. The LIVE G-loop/G-archive gate
# on real Base Sepolia with two funded operators remains DEPLOY-TIME per that
# runbook; this rig proves as much as an Anvil fork can (see its leg table).

on:
  workflow_dispatch: {}
  schedule:
    # Weekly, Monday 06:00 UTC — well before the Monday named-cut cadence.
    - cron: '0 6 * * 1'

concurrency:
  group: native-e2e-rig-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native-fleet-rig:
    name: Native fleet rig (fork Base Sepolia 84532) + G-archive separate process
    runs-on: ubuntu-latest
    env:
      # CPU-only runner: keep both onnxruntime installers from pulling CUDA assets.
      ONNXRUNTIME_NODE_INSTALL: skip
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      # The native rig forks this RPC. A repo/org secret overrides the public default
      # (higher rate limits); absent, the rig falls back to the public endpoint and
      # SKIPS CLEANLY if it is unreachable — a runner without outbound RPC never fails.
      JINN_E2E_SEPOLIA_RPC: ${{ secrets.BASE_SEPOLIA_RPC_URL || 'https://base-sepolia.publicnode.com' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: corepack enable

      # Foundry provides `anvil`. The native rig uses `anvil --fork-url` (live fork),
      # not the committed `--dump-state` snapshot, so no version pin is required here.
      - uses: foundry-rs/foundry-toolchain@v1

      - name: Install client deps
        working-directory: operator
        run: yarn install --immutable

      # Advisory: a network/anvil flake here must not read as a code failure. The
      # rig itself exits 0 when no Base Sepolia RPC is reachable (clean skip).
      - name: Native fleet G-loop rig (boot legs on a Base Sepolia fork)
        working-directory: operator
        run: yarn e2e:daemon-harness:native

      - name: G-archive separate-process consumer
        working-directory: operator
        run: yarn e2e:archive-second-daemon:separate-process
