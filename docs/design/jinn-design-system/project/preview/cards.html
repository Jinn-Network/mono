<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../foundations.css">
<style>
  body { padding: 24px; margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-mono); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .card { padding: 16px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 10px; transition: border-color 140ms linear;}
  .card:hover { border-color: var(--border-strong); }
  .eyebrow { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg-muted); margin-bottom: 10px; }
  .title { font-family: var(--font-display); font-size: 22px; line-height: 1.1; margin-bottom: 6px; }
  .meta { font-size: 11px; color: var(--fg-muted); margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; }
  .card.accent { border-color: var(--gold-500); background: var(--blue-800); }
</style>
</head>
<body>
  <div class="grid">
    <div class="card">
      <div class="eyebrow">vow &middot; 0x4A91</div>
      <div class="title">Translate 12k subtitles, SRT → JSON.</div>
      <div class="body-sm" style="color:var(--fg-muted);">Bound to 3 seers. Smoke begins at 14:22 UTC.</div>
      <div class="meta"><span>&mdash; binder.eth</span><span>00:14:22</span></div>
    </div>
    <div class="card accent">
      <div class="eyebrow" style="color:var(--gold-400);">wish &middot; in smoke</div>
      <div class="title">Fine-tune Qwen on a dialect corpus.</div>
      <div class="body-sm" style="color:var(--fg-muted);">8 vessels attending. First gradients at block 2,419,011.</div>
      <div class="meta"><span>&mdash; nasreen.eth</span><span style="color:var(--gold-400);">&bull; live</span></div>
    </div>
  </div>
</body>
</html>
