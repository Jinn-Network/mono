name: Task Execution CI

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
  pull_request:
    paths:
      - "packages/task-execution/**"
      - ".github/scripts/task-execution-*.test.mjs"
      - ".github/workflows/task-execution-ci.yml"
      - "docs/superpowers/specs/2026-07-27-task-execution-protocol-and-stack-design.md"
  push:
    branches: [next]
    paths:
      - "packages/task-execution/**"
      - ".github/scripts/task-execution-*.test.mjs"
      - ".github/workflows/task-execution-ci.yml"
      - "docs/superpowers/specs/2026-07-27-task-execution-protocol-and-stack-design.md"
  workflow_dispatch:
    inputs:
      scope:
        description: "Which Task Execution slice to run"
        required: true
        default: evaluation-harness
        type: choice
        options:
          - evaluation-harness
          - full

permissions:
  contents: read

env:
  TASK_EXECUTION_ROOT: packages/task-execution

# Consolidated per #2997 (pattern proven by the trust-ci pilot, PR #3001): the
# previous shape ran 12 runner jobs chained through artifact dist round-trips
# (which also stripped the native custody binary's executable bit, forcing
# chmod + rebuild steps per consumer job). The packages job below builds the
# same eleven packages with their VERBATIM per-package command sets in
# dependency order in ONE workspace: the native binary built by the assembly
# step persists in place, and the six evidence contract portals are built once.
#
# The per-job isolation this retires was a de-facto undeclared-dependency
# guard; that invariant is owned by task-execution-source-boundaries.test.mjs
# in the architecture job.
jobs:
  architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify package inventory and dependency graph
        run: node --test .github/scripts/task-execution-package-inventory.test.mjs
      - name: Verify source boundaries and canaries
        run: node --test .github/scripts/task-execution-source-boundaries.test.mjs
      - name: Verify packed-types staging matches CI verify
        run: node --test .github/scripts/task-execution-ci-workflow.test.mjs

  packages:
    name: Task Execution packages
    runs-on: ubuntu-latest
    # A hung step must not hold a runner slot for the 360-minute default nor
    # burn the queue's 180-minute check-response budget.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
      # The bundled npm of a freshly rolled runner image can regress the
      # packed-consumer smoke (observed: node 22.23.2's npm dying with
      # "Cannot read properties of null (reading 'edgesOut')" on yarn-packed
      # tarballs). The old foundation job pinned both for exactly this reason.
      - name: Pin npm for packed-consumer smoke coverage
        run: npm install --global npm@11.19.0 --no-audit --no-fund
      - name: Enable Yarn 4.13.0
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate
      - name: Build cross-tree portal dependency from source (evidence-protocol, §7.8)
        working-directory: packages/evidence/protocol
        run: |
          yarn install --immutable
          yarn build
      - name: Build cross-tree portal dependency from source (evidence-repository, §7.8)
        working-directory: packages/evidence/repository
        run: |
          yarn install --immutable
          yarn build
      - name: Build cross-tree portal dependency from source (evidence-discovery, §7.8)
        working-directory: packages/evidence/discovery
        run: |
          yarn install --immutable
          yarn build
      - name: Build cross-tree portal dependency from source (execution-evidence-builder, §7.8)
        working-directory: packages/evidence/execution-evidence-builder
        run: |
          yarn install --immutable
          yarn build
      - name: Build cross-tree portal dependency from source (execution-recorder, §7.8)
        working-directory: packages/evidence/execution-recorder
        run: |
          yarn install --immutable
          yarn build
      - name: Build cross-tree portal dependency from source (attestation-issuer, §7.8)
        working-directory: packages/evidence/attestation-issuer
        run: |
          yarn install --immutable
          yarn build
      - name: Verify Task Execution Protocol
        working-directory: packages/task-execution/protocol
        run: |
          yarn install --immutable
          yarn check:schemas
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Verify Task Execution Backend
        working-directory: packages/task-execution/backend
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Verify Task Execution Profiles
        working-directory: packages/task-execution/profiles
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn check:documents
          yarn pack:smoke
      - name: Verify Task Execution Supervisor
        working-directory: packages/task-execution/backend-local/supervisor
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Verify Task Execution Workspace
        working-directory: packages/task-execution/backend-local/workspace
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Verify Task Execution Launchers
        working-directory: packages/task-execution/backend-local/launchers
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Build Task Execution Backend Local assembly from source (testing imports it at typecheck)
        working-directory: packages/task-execution/backend-local/assembly
        run: |
          yarn install --immutable
          yarn build
      - name: Verify Task Execution Testing kit (including the ./backend-local conformance kit slice)
        working-directory: packages/task-execution/testing
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
      - name: Run Task Execution Testing kit pack:smoke
        working-directory: packages/task-execution/testing
        run: yarn pack:smoke
      - name: Verify Task Execution Backend Local (assembly)
        working-directory: packages/task-execution/backend-local/assembly
        env:
          # Pin the production binary so Vitest dependency optimization cannot lose dist/native.
          JINN_NATIVE_CUSTODY_BINARY: ${{ github.workspace }}/packages/task-execution/backend-local/supervisor/dist/native/jinn-attempt-shim
        run: |
          (cd ../supervisor && node scripts/build-native.mjs)
          test -x "$JINN_NATIVE_CUSTODY_BINARY"
          "$JINN_NATIVE_CUSTODY_BINARY" --probe
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Rebuild and probe the native custody binary
        env:
          JINN_NATIVE_CUSTODY_BINARY: ${{ github.workspace }}/packages/task-execution/backend-local/supervisor/dist/native/jinn-attempt-shim
        run: |
          # Artifact transfer does not preserve the executable bit, so rebuild on this runner.
          (cd packages/task-execution/backend-local/supervisor && node scripts/build-native.mjs)
          test -x "$JINN_NATIVE_CUSTODY_BINARY"
          "$JINN_NATIVE_CUSTODY_BINARY" --probe
      - name: Verify Task Execution Evaluation Harness
        working-directory: packages/task-execution/evaluation-harness
        env:
          JINN_NATIVE_CUSTODY_BINARY: ${{ github.workspace }}/packages/task-execution/backend-local/supervisor/dist/native/jinn-attempt-shim
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Verify Task Execution Evaluator Adapters
        working-directory: packages/task-execution/evaluator-adapters
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Verify Task Execution OCI Grader
        working-directory: packages/task-execution/oci-grader
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Compile packed public entrypoint consumers
        run: node .github/scripts/task-execution-packed-types.test.mjs
