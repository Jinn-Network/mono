name: Repository structure

on:
  pull_request:
  push:
    branches: [main, next]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gitlinks:
    name: Gitlink metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --test .github/scripts/repository-gitlinks.test.mjs
      - name: Docs key guard
        run: node --test .github/scripts/docs-key-guard.test.mjs
  evidence-architecture:
    name: Evidence package architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: |
          node --test \
            .github/scripts/evidence-package-inventory.test.mjs \
            .github/scripts/evidence-source-boundaries.test.mjs
