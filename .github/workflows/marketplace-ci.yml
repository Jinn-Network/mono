name: Marketplace CI

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
  pull_request:
    paths:
      - "packages/marketplace/**"
      - "contracts/**"
      - ".github/scripts/marketplace-*.test.mjs"
      - ".github/scripts/custody-boundaries.test.mjs"
      - ".github/workflows/marketplace-ci.yml"
      - "docs/superpowers/specs/2026-07-28-marketplace-binding-design.md"
  push:
    branches: [next]
    paths:
      - "packages/marketplace/**"
      - "contracts/**"
      - ".github/scripts/marketplace-*.test.mjs"
      - ".github/scripts/custody-boundaries.test.mjs"
      - ".github/workflows/marketplace-ci.yml"
      - "docs/superpowers/specs/2026-07-28-marketplace-binding-design.md"

permissions:
  contents: read

env:
  MARKETPLACE_ROOT: packages/marketplace

# Consolidated per #2997 (pattern proven by the trust-ci pilot, PR #3001): the
# previous shape ran one runner job per package, rebuilding the shared §7.8
# portal set (up to nineteen packages) in up to five separate jobs. The
# packages job below builds the same five packages with the same commands in
# dependency order in ONE workspace, every portal built once. The
# snapshot-backed Anvil kit stays a SEPARATE bounded job on purpose: it is the
# lane's known flake surface (#2440/#2457), and a flake there must eject only
# itself, not force a re-run of the whole consolidated lane.
#
# The per-job isolation this retires was a de-facto undeclared-dependency
# guard; that invariant is owned by marketplace-source-boundaries.test.mjs in
# the architecture job.
jobs:
  architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify package inventory and dependency graph
        run: node --test .github/scripts/marketplace-package-inventory.test.mjs
      - name: Verify source boundaries and canaries
        run: node --test .github/scripts/marketplace-source-boundaries.test.mjs
      - name: Verify marketplace PR Anvil hermeticity
        run: node --test .github/scripts/marketplace-hermetic-anvil.test.mjs
      - name: Custody boundaries (tripwire, marketplace-surfaces design §4.1)
        run: node --test .github/scripts/custody-boundaries.test.mjs

  packages:
    name: Marketplace packages
    runs-on: ubuntu-latest
    # A hung step must not hold a runner slot for the 360-minute default nor
    # burn the queue's 180-minute check-response budget.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Pin npm for packed-consumer smoke coverage
        run: npm install --global npm@11.19.0 --no-audit --no-fund
      - name: Enable Yarn 4.13.0
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate
      - name: Generate TaskCoordinator artifact from tracked contracts source
        run: |
          (cd contracts && yarn install --immutable && yarn compile)
      - name: Build cross-tree portal dependency from source (evidence-protocol, §7.8)
        working-directory: packages/evidence/protocol
        run: |
          yarn install --immutable
          yarn build
      - name: Build cross-tree portal dependency from source (evidence-repository, §7.8)
        working-directory: packages/evidence/repository
        run: |
          yarn install --immutable
          yarn build
      - name: Build cross-tree portal dependency from source (evidence-discovery, §7.8)
        working-directory: packages/evidence/discovery
        run: |
          yarn install --immutable
          yarn build
      - name: Build cross-tree portal dependency from source (execution-evidence-builder, §7.8)
        working-directory: packages/evidence/execution-evidence-builder
        run: |
          yarn install --immutable
          yarn build
      - name: Build cross-tree portal dependency from source (execution-recorder, §7.8)
        working-directory: packages/evidence/execution-recorder
        run: |
          yarn install --immutable
          yarn build
      - name: Build cross-tree portal dependency from source (task-execution-protocol, §7.8)
        working-directory: packages/task-execution/protocol
        run: |
          yarn install --immutable
          yarn build
      - name: Build cross-tree portal dependency from source (task-execution-backend, §7.8)
        working-directory: packages/task-execution/backend
        run: |
          yarn install --immutable
          yarn build
      - name: Build cross-tree portal dependency from source (task-execution-profiles, §7.8)
        working-directory: packages/task-execution/profiles
        run: |
          yarn install --immutable
          yarn build
      - name: Build cross-tree portal dependency from source (backend-local-supervisor, §7.8)
        working-directory: packages/task-execution/backend-local/supervisor
        run: |
          yarn install --immutable
          yarn build
      - name: Build cross-tree portal dependency from source (backend-local-workspace, §7.8)
        working-directory: packages/task-execution/backend-local/workspace
        run: |
          yarn install --immutable
          yarn build
      - name: Build cross-tree portal dependency from source (backend-local-launchers, §7.8)
        working-directory: packages/task-execution/backend-local/launchers
        run: |
          yarn install --immutable
          yarn build
      - name: Build cross-tree portal dependency from source (backend-local-assembly, §7.8)
        working-directory: packages/task-execution/backend-local/assembly
        run: |
          yarn install --immutable
          yarn build
      - name: Build cross-tree portal dependency from source (task-execution-testing, §7.8)
        working-directory: packages/task-execution/testing
        run: |
          yarn install --immutable
          yarn build
      - name: Build cross-tree portal dependency from source (trust-core, §7.8)
        working-directory: packages/trust/core
        run: |
          yarn install --immutable
          yarn build
      - name: Build cross-tree portal dependency from source (trust-resolve, §7.8)
        working-directory: packages/trust/resolve
        run: |
          yarn install --immutable
          yarn build
      - name: Build cross-tree portal dependency from source (record-discovery-protocol, §7.8)
        working-directory: packages/discovery/protocol
        run: |
          yarn install --immutable
          yarn build
      - name: Build cross-tree portal dependency from source (record-discovery-serve, §7.8)
        working-directory: packages/discovery/serve
        run: |
          yarn install --immutable
          yarn build
      - name: Build cross-tree portal dependency from source (record-discovery-testing, §7.8)
        working-directory: packages/discovery/testing
        run: |
          yarn install --immutable
          yarn build
      - name: Build cross-tree portal dependency from source (trust-testing, §7.8)
        working-directory: packages/trust/testing
        run: |
          yarn install --immutable
          yarn build
      - name: Verify Marketplace Binding
        working-directory: packages/marketplace/binding
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Verify Marketplace Projector
        working-directory: packages/marketplace/projector
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Verify Marketplace Pipeline
        working-directory: packages/marketplace/pipeline
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Install Marketplace Testing toolchain (venue-base's kit tests import its source)
        working-directory: packages/marketplace/testing
        run: yarn install --immutable
      - name: Verify Marketplace Venue Base
        working-directory: packages/marketplace/venue-base
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Verify Marketplace Testing kit
        working-directory: packages/marketplace/testing
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Compile packed public entrypoint consumers
        run: node .github/scripts/marketplace-packed-types.test.mjs

  anvil-fork:
    # The snapshot-backed conformance and venue kits stay their own bounded job:
    # this is the lane's known flake surface, and folding it into the packages
    # job would burn a queue entry's single free re-enqueue on repeating the
    # whole lane. Self-sufficient by design - it builds its own portal set and
    # the three marketplace packages it exercises, with no artifact round-trips.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JINN_MARKETPLACE_ANVIL_STATE_PATH: ${{ github.workspace }}/operator/test/_support/fixtures/anvil-base-v3-state/state.json
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Enable Yarn 4.13.0
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate
      - name: Install Foundry (Anvil)
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly-1c7c4bebce1e075989780fd401bf6bffcb424746
      - name: Build Hardhat contract artifacts used by the snapshot fixture
        working-directory: contracts
        run: |
          yarn install --immutable
          yarn compile
      - name: Build cross-tree portal dependencies from source (§7.8)
        run: |
          (cd packages/evidence/protocol && yarn install --immutable && yarn build)
          (cd packages/evidence/repository && yarn install --immutable && yarn build)
          (cd packages/evidence/discovery && yarn install --immutable && yarn build)
          (cd packages/evidence/execution-evidence-builder && yarn install --immutable && yarn build)
          (cd packages/evidence/execution-recorder && yarn install --immutable && yarn build)
          (cd packages/task-execution/protocol && yarn install --immutable && yarn build)
          (cd packages/task-execution/backend && yarn install --immutable && yarn build)
          (cd packages/task-execution/profiles && yarn install --immutable && yarn build)
          (cd packages/task-execution/backend-local/supervisor && yarn install --immutable && yarn build)
          (cd packages/task-execution/backend-local/workspace && yarn install --immutable && yarn build)
          (cd packages/task-execution/backend-local/launchers && yarn install --immutable && yarn build)
          (cd packages/task-execution/backend-local/assembly && yarn install --immutable && yarn build)
          (cd packages/task-execution/testing && yarn install --immutable && yarn build)
          (cd packages/trust/core && yarn install --immutable && yarn build)
          (cd packages/trust/resolve && yarn install --immutable && yarn build)
          (cd packages/discovery/protocol && yarn install --immutable && yarn build)
          (cd packages/discovery/serve && yarn install --immutable && yarn build)
          (cd packages/discovery/testing && yarn install --immutable && yarn build)
          (cd packages/trust/testing && yarn install --immutable && yarn build)
      - name: Build the marketplace packages the kits exercise
        run: |
          (cd packages/marketplace/binding && yarn install --immutable && yarn build)
          (cd packages/marketplace/projector && yarn install --immutable && yarn build)
          (cd packages/marketplace/venue-base && yarn install --immutable && yarn build)
      - name: Install Marketplace Testing toolchain
        working-directory: packages/marketplace/testing
        run: yarn install --immutable
      - name: Run snapshot-backed marketplace conformance (§13 / M2.5)
        working-directory: packages/marketplace/testing
        run: yarn vitest run src/backend-conformance.test.ts src/escrow-lifecycle.test.ts
      - name: Run the snapshot-backed Anvil venue kit (§6.6)
        working-directory: packages/marketplace/testing
        run: yarn vitest run src/venue-conformance.test.ts src/venue-fork.test.ts
