<!-- @dsCard group="Colors" viewport="700x160" name="Verdict states" subtitle="Six outcomes, not two — the palette can say “we don't know”" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Verdicts</title><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}.c{padding:20px 24px}.c{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}</style></head><body>
<div class="c"><div style="border:1px solid var(--rule);background:var(--verdict-met-bg)"><div style="padding:8px 10px 9px"><div style="font:var(--type-label);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--verdict-met)">Met</div><div style="font:var(--type-data);font-size:11px;color:var(--text-muted);margin-top:4px">requirement satisfied</div></div></div><div style="border:1px solid var(--rule);background:var(--verdict-unmet-bg)"><div style="padding:8px 10px 9px"><div style="font:var(--type-label);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--verdict-unmet)">Unmet</div><div style="font:var(--type-data);font-size:11px;color:var(--text-muted);margin-top:4px">requirement not satisfied</div></div></div><div style="border:1px solid var(--rule);background:var(--verdict-conflicted-bg)"><div style="padding:8px 10px 9px"><div style="font:var(--type-label);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--verdict-conflicted)">Conflicted</div><div style="font:var(--type-data);font-size:11px;color:var(--text-muted);margin-top:4px">evaluators disagreed; retained</div></div></div><div style="border:1px solid var(--rule);background:var(--verdict-attested-bg)"><div style="padding:8px 10px 9px"><div style="font:var(--type-label);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--verdict-attested)">Attested</div><div style="font:var(--type-data);font-size:11px;color:var(--text-muted);margin-top:4px">asserted by a named party</div></div></div><div style="border:1px solid var(--rule);background:var(--verdict-incomplete-bg)"><div style="padding:8px 10px 9px"><div style="font:var(--type-label);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--verdict-incomplete)">Incomplete</div><div style="font:var(--type-data);font-size:11px;color:var(--text-muted);margin-top:4px">expected, not returned</div></div></div><div style="border:1px solid var(--rule);background:var(--verdict-unverifiable-bg)"><div style="padding:8px 10px 9px"><div style="font:var(--type-label);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--verdict-unverifiable)">Unverifiable</div><div style="font:var(--type-data);font-size:11px;color:var(--text-muted);margin-top:4px">no evidence path exists</div></div></div></div></body></html>
