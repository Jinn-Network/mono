<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace" style="width:100%;height:auto;display:block">
  <title id="title">JINN-directed emissions train SolverNets</title>
  <desc id="desc">Seven JINN holders direct emissions toward three SolverNets — PREDICTION receives the bulk of the direction and accumulates a deeper corpus of verified triplets while two adjacent SolverNets remain sparse.</desc>

  <defs>
    <symbol id="node" viewBox="0 0 24 24" overflow="visible">
      <rect x="2" y="2" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1"/>
      <circle cx="12" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="1"/>
      <circle cx="12" cy="12" r="1.6" fill="currentColor"/>
    </symbol>
  </defs>

  <!-- Eyebrow labels -->
  <g font-size="11" fill="#a4b0c2" letter-spacing="1.54">
    <text x="40" y="48">JINN HOLDERS</text>
    <text x="40" y="208">EMISSIONS</text>
    <text x="40" y="688">VERIFIED TRIPLETS</text>
  </g>

  <!-- ─────────────────────────────────────────────
       BAND 1: JINN HOLDERS
       7 holders, square sizes denote balance.
       ───────────────────────────────────────────── -->
  <g font-weight="500" stroke-linecap="square">
    <!-- H1: size 36 — medium-large -->
    <g transform="translate(120,120)">
      <rect x="-18" y="-18" width="36" height="36" fill="none" stroke="#a4b0c2" stroke-width="1"/>
      <text x="0" y="5" font-size="14" text-anchor="middle" fill="#f2f7fc">J</text>
    </g>
    <!-- H2: size 28 — small -->
    <g transform="translate(290,120)">
      <rect x="-14" y="-14" width="28" height="28" fill="none" stroke="#a4b0c2" stroke-width="1"/>
      <text x="0" y="4" font-size="11" text-anchor="middle" fill="#f2f7fc">J</text>
    </g>
    <!-- H3: size 44 — largest -->
    <g transform="translate(460,120)">
      <rect x="-22" y="-22" width="44" height="44" fill="none" stroke="#a4b0c2" stroke-width="1"/>
      <text x="0" y="6" font-size="17" text-anchor="middle" fill="#f2f7fc">J</text>
    </g>
    <!-- H4: size 32 — medium -->
    <g transform="translate(600,120)">
      <rect x="-16" y="-16" width="32" height="32" fill="none" stroke="#a4b0c2" stroke-width="1"/>
      <text x="0" y="5" font-size="13" text-anchor="middle" fill="#f2f7fc">J</text>
    </g>
    <!-- H5: size 40 — large -->
    <g transform="translate(745,120)">
      <rect x="-20" y="-20" width="40" height="40" fill="none" stroke="#a4b0c2" stroke-width="1"/>
      <text x="0" y="6" font-size="16" text-anchor="middle" fill="#f2f7fc">J</text>
    </g>
    <!-- H6: size 30 — small-medium -->
    <g transform="translate(905,120)">
      <rect x="-15" y="-15" width="30" height="30" fill="none" stroke="#a4b0c2" stroke-width="1"/>
      <text x="0" y="4" font-size="12" text-anchor="middle" fill="#f2f7fc">J</text>
    </g>
    <!-- H7: size 34 — medium -->
    <g transform="translate(1080,120)">
      <rect x="-17" y="-17" width="34" height="34" fill="none" stroke="#a4b0c2" stroke-width="1"/>
      <text x="0" y="5" font-size="14" text-anchor="middle" fill="#f2f7fc">J</text>
    </g>
  </g>

  <!-- ─────────────────────────────────────────────
       BAND 2: EMISSION DIRECTION LINES
       Hairline blue. Thickness = JINN balance pointed.
       Five holders → PREDICTION (left), one each → B and C.
       Lines from each holder bottom edge to a varied
       point along the receiving SolverNet's top edge.
       ───────────────────────────────────────────── -->
  <g stroke="#7aa7dc" fill="none" stroke-linecap="square">
    <!-- → PREDICTION (top edge y=380, range x 80..320) -->
    <line x1="120" y1="138" x2="140" y2="380" stroke-width="1.5"/>
    <line x1="290" y1="134" x2="170" y2="380" stroke-width="1"/>
    <line x1="460" y1="142" x2="210" y2="380" stroke-width="2"/>
    <line x1="600" y1="136" x2="240" y2="380" stroke-width="1"/>
    <line x1="745" y1="140" x2="280" y2="380" stroke-width="1.5"/>
    <!-- → SOLVERNET B (top edge y=380, x 480..720) -->
    <line x1="905" y1="135" x2="600" y2="380" stroke-width="1"/>
    <!-- → SOLVERNET C (top edge y=380, x 880..1120) -->
    <line x1="1080" y1="137" x2="1000" y2="380" stroke-width="1"/>
  </g>

  <!-- ─────────────────────────────────────────────
       SOLVERNETS
       PREDICTION (gold hairline, the one gold element).
       SOLVERNET B and C in dim border, marked "coming".
       ───────────────────────────────────────────── -->
  <g font-size="14" letter-spacing="1.96" stroke-linecap="square">
    <!-- PREDICTION -->
    <g>
      <rect x="80" y="380" width="240" height="100" fill="none" stroke="#dcb866" stroke-width="1"/>
      <text x="200" y="420" text-anchor="middle" fill="#f2f7fc">PREDICTION</text>
      <text x="200" y="450" text-anchor="middle" font-size="10" letter-spacing="1.4" fill="#a4b0c2">SOLVERNET — LIVE</text>
    </g>
    <!-- SOLVERNET B -->
    <g>
      <rect x="480" y="380" width="240" height="100" fill="none" stroke="#1f3a66" stroke-width="1"/>
      <text x="600" y="420" text-anchor="middle" fill="#7d8ba3">SOLVERNET B</text>
      <text x="600" y="450" text-anchor="middle" font-size="10" letter-spacing="1.4" fill="#7d8ba3">COMING</text>
    </g>
    <!-- SOLVERNET C -->
    <g>
      <rect x="880" y="380" width="240" height="100" fill="none" stroke="#1f3a66" stroke-width="1"/>
      <text x="1000" y="420" text-anchor="middle" fill="#7d8ba3">SOLVERNET C</text>
      <text x="1000" y="450" text-anchor="middle" font-size="10" letter-spacing="1.4" fill="#7d8ba3">COMING</text>
    </g>
  </g>

  <!-- ─────────────────────────────────────────────
       SOLVER CLUSTERS
       PREDICTION pulls a denser cluster (12 nodes, mesh).
       SOLVERNET B holds 4. SOLVERNET C holds 2.
       ───────────────────────────────────────────── -->
  <!-- PREDICTION mesh links -->
  <g stroke="#1f3a66" stroke-width="1" fill="none" stroke-linecap="square">
    <line x1="108" y1="528" x2="178" y2="540"/>
    <line x1="178" y1="540" x2="248" y2="525"/>
    <line x1="248" y1="525" x2="296" y2="555"/>
    <line x1="108" y1="528" x2="142" y2="595"/>
    <line x1="178" y1="540" x2="208" y2="600"/>
    <line x1="248" y1="525" x2="262" y2="592"/>
    <line x1="142" y1="595" x2="208" y2="600"/>
    <line x1="208" y1="600" x2="262" y2="592"/>
    <line x1="262" y1="592" x2="296" y2="555"/>
    <line x1="142" y1="595" x2="120" y2="640"/>
    <line x1="208" y1="600" x2="190" y2="648"/>
    <line x1="262" y1="592" x2="270" y2="642"/>
    <line x1="120" y1="640" x2="190" y2="648"/>
    <line x1="190" y1="648" x2="270" y2="642"/>
  </g>
  <g color="#a4b0c2">
    <use href="#node" x="96"  y="516" width="24" height="24"/>
    <use href="#node" x="166" y="528" width="24" height="24"/>
    <use href="#node" x="236" y="513" width="24" height="24"/>
    <use href="#node" x="284" y="543" width="24" height="24"/>
    <use href="#node" x="130" y="583" width="24" height="24"/>
    <use href="#node" x="196" y="588" width="24" height="24"/>
    <use href="#node" x="250" y="580" width="24" height="24"/>
    <use href="#node" x="108" y="628" width="24" height="24"/>
    <use href="#node" x="178" y="636" width="24" height="24"/>
    <use href="#node" x="258" y="630" width="24" height="24"/>
    <use href="#node" x="216" y="546" width="24" height="24"/>
    <use href="#node" x="148" y="548" width="24" height="24"/>
  </g>

  <!-- SOLVERNET B mesh + cluster -->
  <g stroke="#1f3a66" stroke-width="1" fill="none" stroke-linecap="square">
    <line x1="572" y1="540" x2="640" y2="548"/>
    <line x1="572" y1="540" x2="600" y2="608"/>
    <line x1="640" y1="548" x2="660" y2="612"/>
    <line x1="600" y1="608" x2="660" y2="612"/>
  </g>
  <g color="#7d8ba3">
    <use href="#node" x="560" y="528" width="24" height="24"/>
    <use href="#node" x="628" y="536" width="24" height="24"/>
    <use href="#node" x="588" y="596" width="24" height="24"/>
    <use href="#node" x="648" y="600" width="24" height="24"/>
  </g>

  <!-- SOLVERNET C cluster -->
  <g stroke="#1f3a66" stroke-width="1" fill="none" stroke-linecap="square">
    <line x1="990" y1="552" x2="1018" y2="600"/>
  </g>
  <g color="#7d8ba3">
    <use href="#node" x="978" y="540" width="24" height="24"/>
    <use href="#node" x="1006" y="588" width="24" height="24"/>
  </g>

  <!-- ─────────────────────────────────────────────
       BAND 4: VERIFIED TRIPLETS
       PREDICTION: a deck of 5 triplet cards receding into dim.
       SOLVERNET B and C: a single sparse triplet each.
       ───────────────────────────────────────────── -->

  <!-- PREDICTION corpus: a deck of cards receding back-and-right.
       Only the frontmost card carries content. Back cards are empty
       hairline rectangles fading into fg-dim, suggesting depth and
       continued accumulation without competing with the front data. -->
  <g stroke-linecap="square">
    <!-- card 5 (back, most receded) -->
    <g transform="translate(208,712)">
      <rect width="220" height="138" fill="none" stroke="#1f3a66" stroke-width="1"/>
    </g>
    <!-- card 4 -->
    <g transform="translate(178,720)">
      <rect width="220" height="138" fill="#0c1628" stroke="#2f4a7a" stroke-width="1"/>
    </g>
    <!-- card 3 -->
    <g transform="translate(148,728)">
      <rect width="220" height="138" fill="#0c1628" stroke="#5c6b82" stroke-width="1"/>
    </g>
    <!-- card 2 -->
    <g transform="translate(118,736)">
      <rect width="220" height="138" fill="#0c1628" stroke="#7d8ba3" stroke-width="1"/>
    </g>
    <!-- card 1 (front, full content) -->
    <g transform="translate(88,744)">
      <rect width="220" height="138" fill="#0c1628" stroke="#f2f7fc" stroke-width="1"/>
      <line x1="0" y1="46" x2="220" y2="46" stroke="#1f3a66" stroke-width="1"/>
      <line x1="0" y1="92" x2="220" y2="92" stroke="#1f3a66" stroke-width="1"/>
      <text x="14" y="29"  font-size="9"  letter-spacing="1.4" fill="#a4b0c2">OUTCOME</text>
      <text x="206" y="29" font-size="11" text-anchor="end" fill="#f2f7fc">0x4a7f…91bb</text>
      <text x="14" y="75"  font-size="9"  letter-spacing="1.4" fill="#a4b0c2">TRAJECTORY</text>
      <text x="206" y="75" font-size="11" text-anchor="end" fill="#f2f7fc">0xb37e…e08b</text>
      <text x="14" y="121" font-size="9"  letter-spacing="1.4" fill="#a4b0c2">SCORE</text>
      <text x="206" y="121" font-size="11" text-anchor="end" fill="#f2f7fc">0.92 · 0x9a44</text>
    </g>
  </g>

  <!-- SOLVERNET B — single sparse triplet -->
  <g transform="translate(510,738)" stroke-linecap="square">
    <rect width="180" height="124" fill="none" stroke="#1f3a66" stroke-width="1"/>
    <line x1="0" y1="42" x2="180" y2="42" stroke="#1f3a66" stroke-width="1"/>
    <line x1="0" y1="83" x2="180" y2="83" stroke="#1f3a66" stroke-width="1"/>
    <text x="12" y="27" font-size="9"  letter-spacing="1.4" fill="#7d8ba3">OUTCOME</text>
    <text x="12" y="68" font-size="9"  letter-spacing="1.4" fill="#7d8ba3">TRAJECTORY</text>
    <text x="12" y="109" font-size="9" letter-spacing="1.4" fill="#7d8ba3">SCORE</text>
    <text x="170" y="27" font-size="11" text-anchor="end" fill="#7d8ba3">—</text>
    <text x="170" y="68" font-size="11" text-anchor="end" fill="#7d8ba3">—</text>
    <text x="170" y="109" font-size="11" text-anchor="end" fill="#7d8ba3">—</text>
  </g>

  <!-- SOLVERNET C — single sparse triplet -->
  <g transform="translate(910,738)" stroke-linecap="square">
    <rect width="180" height="124" fill="none" stroke="#1f3a66" stroke-width="1"/>
    <line x1="0" y1="42" x2="180" y2="42" stroke="#1f3a66" stroke-width="1"/>
    <line x1="0" y1="83" x2="180" y2="83" stroke="#1f3a66" stroke-width="1"/>
    <text x="12" y="27" font-size="9"  letter-spacing="1.4" fill="#7d8ba3">OUTCOME</text>
    <text x="12" y="68" font-size="9"  letter-spacing="1.4" fill="#7d8ba3">TRAJECTORY</text>
    <text x="12" y="109" font-size="9" letter-spacing="1.4" fill="#7d8ba3">SCORE</text>
    <text x="170" y="27" font-size="11" text-anchor="end" fill="#7d8ba3">—</text>
    <text x="170" y="68" font-size="11" text-anchor="end" fill="#7d8ba3">—</text>
    <text x="170" y="109" font-size="11" text-anchor="end" fill="#7d8ba3">—</text>
  </g>
</svg>
