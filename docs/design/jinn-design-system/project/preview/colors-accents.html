<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../foundations.css">
<style>
  body { padding: 24px; margin: 0; }
  .row { display: flex; gap: 0; border: 1px solid var(--border); }
  .sw { flex: 1; aspect-ratio: 2/1; display: flex; flex-direction: column; justify-content: flex-end; padding: 12px; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; }
  .hex { font-size: 10px; opacity: 0.7; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background:#a88438; color:#f2f7fc;">gold-600<br><span class="hex">#a88438 &middot; deep</span></div>
    <div class="sw" style="background:#c9a048; color:#0c1628;">gold-500<br><span class="hex">#c9a048 &middot; canonical</span></div>
    <div class="sw" style="background:#dcb866; color:#0c1628;">gold-400<br><span class="hex">#dcb866 &middot; lamplight</span></div>
    <div class="sw" style="background:#ead08e; color:#0c1628;">gold-300<br><span class="hex">#ead08e &middot; hover</span></div>
    <div class="sw" style="background:#5c6b82; color:#f2f7fc;">slate-500<br><span class="hex">#5c6b82</span></div>
    <div class="sw" style="background:#7d8ba3; color:#0c1628;">slate-400<br><span class="hex">#7d8ba3</span></div>
    <div class="sw" style="background:#a4b0c2; color:#0c1628;">slate-300<br><span class="hex">#a4b0c2</span></div>
  </div>
</body>
</html>
