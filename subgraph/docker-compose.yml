version: "3.8"

services:
  ipfs:
    image: ipfs/kubo:latest
    ports:
      - "5001:5001"   # API
      - "8080:8080"   # Gateway
    volumes:
      - ipfs_data:/data/ipfs
    healthcheck:
      test: ["CMD", "ipfs", "id"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:13-alpine
    environment:
      POSTGRES_USER: graph-node
      POSTGRES_PASSWORD: let-me-in
      POSTGRES_DB: graph-node
      PGDATA: /var/lib/postgresql/data
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graph-node"]
      interval: 10s
      timeout: 5s
      retries: 5

  graph-node:
    image: graphprotocol/graph-node:latest
    depends_on:
      ipfs:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"   # GraphQL HTTP
      - "8001:8001"   # GraphQL WebSocket
      - "8020:8020"   # Admin JSON-RPC
      - "8030:8030"   # Indexing status
      - "8040:8040"   # Metrics (Prometheus)
    environment:
      postgres_host: postgres
      postgres_user: graph-node
      postgres_pass: let-me-in
      postgres_db: graph-node
      ipfs: "ipfs:5001"
      ethereum: "base-sepolia:${BASE_SEPOLIA_RPC_URL:-https://sepolia.base.org}"
      GRAPH_LOG: info

volumes:
  ipfs_data:
  postgres_data:
