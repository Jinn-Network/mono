name: Indexer CI

on:
  pull_request:
    branches: [main, next]
    paths:
      - '.github/workflows/indexer-ci.yml'
      - 'packages/indexer/**'
  push:
    branches: [main, next]
    paths:
      - '.github/workflows/indexer-ci.yml'
      - 'packages/indexer/**'

permissions:
  contents: read

jobs:
  indexer:
    name: Indexer Package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/indexer
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - run: corepack enable

      # The indexer depends on @jinn-network/sdk via `portal:../sdk`, whose
      # exports map points at compiled dist/*.js. dist/ is gitignored, so the
      # SDK must be built before any indexer step resolves it.
      - name: Build @jinn-network/sdk
        working-directory: packages/sdk
        run: |
          yarn install --immutable
          yarn build

      - run: yarn install --immutable
      - run: yarn codegen
      - run: yarn typecheck
      - run: yarn test
      - run: yarn build

  explorer:
    name: Explorer
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/indexer/explorer
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn typecheck
      - run: yarn test
      - run: yarn build

  docker:
    name: Indexer Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Build context is packages/ (not packages/indexer/) so the Dockerfile can
      # COPY and build @jinn-network/sdk, the indexer's `portal:../sdk` sibling.
      - name: Build indexer image
        working-directory: packages
        run: |
          docker build \
            --build-arg JINN_INDEXER_COMMIT=${{ github.sha }} \
            -f indexer/deploy/Dockerfile \
            -t jinn-indexer:ci \
            .
