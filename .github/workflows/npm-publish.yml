name: npm Publish

# Two-train cadence: canary publishes on every push to `next` (the integration branch).
# `main` is advanced only by the promote-main workflow on release: published — it stays
# in lock-step with what's currently in npm @latest. See docs/engineering/handbook.md §Cadence.
on:
  workflow_run:
    workflows: [SDK npm Publish]
    types: [completed]
    branches: [next]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Published release tag to recover, for example v0.1.9'
        required: true
        type: string
      release_sha:
        description: 'Exact release commit SHA whose two-gate evidence must be verified'
        required: true
        type: string

# Trusted publishing (OIDC): register this single workflow on npmjs for
# @jinn-network/client. npm allows one trusted publisher config per package.
permissions:
  # contents: write is required for the dual-tag step (jinn-mono-2cl.6) which creates
  # and pushes the v2026.MM.DD date tag alongside the v<semver> tag. id-token: write
  # remains for npm trusted publishing OIDC.
  contents: write
  id-token: write
  # checks: read lets the "Verify two-gate check-runs" guard query the
  # hermetic-gate / environment-suite check-runs bound to the release SHA
  # (spec §7, #923). An explicit permissions block defaults every unlisted
  # scope to none, so this must be named for github.rest.checks.listForRef.
  checks: read

defaults:
  run:
    working-directory: client

jobs:
  publish:
    name: Publish package
    if: (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success') || github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'client-v') || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    # Stable publish reruns the CI-safe release gates. The live olas-rails-smoke
    # execute mode and app-first testnet gates require local operator config and
    # funding; those stay in `yarn release:client --prepare` before Captain
    # publishes the GitHub Release.
    timeout-minutes: 90
    environment: npm-publish
    env:
      JINN_BUILD_COMMIT: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.event_name == 'workflow_dispatch' && inputs.release_sha || github.sha }}
      ONNXRUNTIME_NODE_INSTALL: skip
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      # Use the high-quota Tenderly Base Sepolia gateway for CI e2e gates.
      # Without this, the e2e falls back to the public `https://sepolia.base.org`
      # which is heavily rate-limited and bites the `Base Sepolia fork
      # SolverNet creation + launch + lifecycle` phase. See #313 thread.
      #
      # Per issue #592 (AC5): this secret may be a comma-separated list of
      # RPC URLs (e.g. `https://tenderly.../<key>,https://base-sepolia.publicnode.com`).
      # The daemon's loadConfig() splits on commas and builds a viem fallback()
      # transport chain — primary is tried first, secondary on
      # error / 429 / quota exhaustion. Solves the T1.1 getTransactionReceipt
      # timeout class of CI flake without requiring a paid backup secret.
      BASE_SEPOLIA_RPC_URL: ${{ secrets.BASE_SEPOLIA_RPC_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Always resolve the immutable event commit. In a manual recovery the
          # operator-supplied release_sha is the immutable publish input.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.event_name == 'workflow_dispatch' && inputs.release_sha || github.sha }}

      - name: Verify exact publish commit
        shell: bash
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ "${ACTUAL_SHA}" != "${JINN_BUILD_COMMIT}" ]; then
            echo "::error::Checked out ${ACTUAL_SHA}, expected publish commit ${JINN_BUILD_COMMIT}"
            exit 1
          fi
          echo "::notice::Publish source pinned to ${JINN_BUILD_COMMIT}"

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Trusted publishing requires npm >=11.5.1. Pin a newer CLI so recovery
      # dispatches pick up npm registry/provenance fixes without changing the
      # release candidate payload.
      - run: npm install -g npm@11.16.0
      - run: corepack enable
      - run: yarn install --immutable
      # Keep the publish test environment aligned with CI. Some client unit
      # tests spawn a local Anvil fork and fail with `spawn anvil ENOENT`
      # unless Foundry is installed.
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly-1c7c4bebce1e075989780fd401bf6bffcb424746

      - name: Resolve publish metadata
        id: meta
        shell: bash
        env:
          MANUAL_RELEASE_TAG: ${{ inputs.release_tag }}
          MANUAL_RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          PACKAGE_VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('package.json','utf8')).version)")
          SDK_PACKAGE_VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('../packages/sdk/package.json','utf8')).version)")
          if [ "${GITHUB_EVENT_NAME}" = "workflow_run" ]; then
            PUBLISH_VERSION="${PACKAGE_VERSION}-canary.sha.${JINN_BUILD_COMMIT}"
            DIST_TAG="canary"
            SDK_SPEC="@jinn-network/sdk@${SDK_PACKAGE_VERSION}-canary.sha.${JINN_BUILD_COMMIT}"
          else
            RELEASE_TAG="${MANUAL_RELEASE_TAG:-${{ github.event.release.tag_name }}}"
            if [ -z "${RELEASE_TAG}" ]; then
              echo "::error::Stable publish requires a release tag"
              exit 1
            fi
            if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
              if [ -z "${MANUAL_RELEASE_SHA}" ]; then
                echo "::error::Manual stable publish requires release_sha"
                exit 1
              fi
              ACTUAL_SHA="$(git rev-parse HEAD)"
              if [ "${ACTUAL_SHA}" != "${MANUAL_RELEASE_SHA}" ]; then
                echo "::error::Checked out ${ACTUAL_SHA}, expected manual release_sha ${MANUAL_RELEASE_SHA}"
                exit 1
              fi
              TAG_SHA="$(git ls-remote origin "refs/tags/${RELEASE_TAG}" | awk '{print $1}')"
              if [ -z "${TAG_SHA}" ]; then
                echo "::error::Release tag ${RELEASE_TAG} does not exist on origin"
                exit 1
              fi
              if [ "${TAG_SHA}" != "${MANUAL_RELEASE_SHA}" ]; then
                echo "::error::Release tag ${RELEASE_TAG} points at ${TAG_SHA}, not manual release_sha ${MANUAL_RELEASE_SHA}"
                exit 1
              fi
            fi
            # Two accepted tag formats per the engineering handbook §Cadence:
            # - v<semver>    (new format, used by the Monday scaffold workflow — jinn-mono-2cl.2)
            # - client-v<semver>  (legacy format, kept for backwards-compatibility)
            # The companion v2026.MM.DD date tag (jinn-mono-2cl.6) is created in a separate
            # step after publish — it is NOT used as the npm-publish trigger.
            case "${RELEASE_TAG}" in
              client-v*)
                PUBLISH_VERSION="${RELEASE_TAG#client-v}"
                ;;
              v*)
                PUBLISH_VERSION="${RELEASE_TAG#v}"
                # Guard against `v<garbage>` tags slipping through the `startsWith(v)` filter
                # in the job-level `if:` (e.g. `vbeta`, `v-foo`). Require semver-shaped suffix.
                if ! [[ "${PUBLISH_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                  echo "::error::Release tag ${RELEASE_TAG} does not look like v<semver>; got version: ${PUBLISH_VERSION}"
                  exit 1
                fi
                ;;
              *)
                echo "::error::Stable client releases must use tags shaped like v<semver> or client-v<semver>"
                exit 1
                ;;
            esac

            if [ "${PUBLISH_VERSION}" != "${PACKAGE_VERSION}" ]; then
              echo "::error::Release tag version ${PUBLISH_VERSION} does not match client/package.json version ${PACKAGE_VERSION}"
              exit 1
            fi

            DIST_TAG="latest"
          fi

          {
            echo "package_version=${PACKAGE_VERSION}"
            echo "publish_version=${PUBLISH_VERSION}"
            echo "dist_tag=${DIST_TAG}"
            echo "release_tag=${RELEASE_TAG:-}"
            echo "sdk_version=${SDK_PACKAGE_VERSION}"
            echo "sdk_spec=${SDK_SPEC:-@jinn-network/sdk@${SDK_PACKAGE_VERSION}}"
          } >> "${GITHUB_OUTPUT}"

      - name: Require published SDK
        if: steps.meta.outputs.dist_tag == 'latest'
        run: |
          EXPECTED_SDK="${{ steps.meta.outputs.sdk_version }}"
          SDK_VERSION="$(npm view "@jinn-network/sdk@${EXPECTED_SDK}" version)"
          if [ "${SDK_VERSION}" != "${EXPECTED_SDK}" ]; then
            echo "::error::Stable client release requires @jinn-network/sdk@${EXPECTED_SDK}"
            exit 1
          fi

      - name: Validate SDK canary gitHead
        if: steps.meta.outputs.dist_tag == 'canary'
        shell: bash
        env:
          SDK_SPEC: ${{ steps.meta.outputs.sdk_spec }}
        run: |
          SDK_HEAD="$(npm view "${SDK_SPEC}" gitHead)"
          if [ "${SDK_HEAD}" != "${JINN_BUILD_COMMIT}" ]; then
            echo "::error::${SDK_SPEC} gitHead ${SDK_HEAD} does not match ${JINN_BUILD_COMMIT}"
            exit 1
          fi

      - name: Resolve bundled dependency publications
        id: bundled
        shell: bash
        env:
          DIST_TAG: ${{ steps.meta.outputs.dist_tag }}
        run: |
          set -euo pipefail
          CORE_VERSION="$(node -p "require('../packages/core/package.json').version")"
          PLUGIN_VERSION="$(node -p "require('../packages/plugin/package.json').version")"
          CORE_SPEC="@jinn-network/core@${CORE_VERSION}"
          PLUGIN_SPEC="@jinn-network/plugin@${PLUGIN_VERSION}"
          PUBLISHED_CORE="$(npm view "${CORE_SPEC}" version 2>/dev/null || true)"
          PUBLISHED_PLUGIN="$(npm view "${PLUGIN_SPEC}" version 2>/dev/null || true)"

          if [ "${PUBLISHED_CORE}" = "${CORE_VERSION}" ] && [ "${PUBLISHED_PLUGIN}" = "${PLUGIN_VERSION}" ]; then
            echo "::notice::Using published stable bundled dependencies ${CORE_SPEC} and ${PLUGIN_SPEC}"
          elif [ "${DIST_TAG}" = "latest" ]; then
            echo "::error::Stable client publication requires ${CORE_SPEC} and ${PLUGIN_SPEC} to exist on npm"
            exit 1
          else
            SHORT_SHA="${JINN_BUILD_COMMIT:0:8}"
            CORE_SPEC="@jinn-network/core@${CORE_VERSION}-canary.${SHORT_SHA}"
            PLUGIN_SPEC="@jinn-network/plugin@${PLUGIN_VERSION}-canary.${SHORT_SHA}"
            CORE_HEAD=""
            PLUGIN_HEAD=""
            for _ in $(seq 1 120); do
              CORE_HEAD="$(npm view "${CORE_SPEC}" gitHead 2>/dev/null || true)"
              PLUGIN_HEAD="$(npm view "${PLUGIN_SPEC}" gitHead 2>/dev/null || true)"
              if [ "${CORE_HEAD}" = "${JINN_BUILD_COMMIT}" ] && [ "${PLUGIN_HEAD}" = "${JINN_BUILD_COMMIT}" ]; then
                break
              fi
              sleep 5
            done
            if [ "${CORE_HEAD}" != "${JINN_BUILD_COMMIT}" ] || [ "${PLUGIN_HEAD}" != "${JINN_BUILD_COMMIT}" ]; then
              echo "::error::Bundled dependency canaries did not resolve to ${JINN_BUILD_COMMIT}: ${CORE_SPEC}=${CORE_HEAD:-<missing>}, ${PLUGIN_SPEC}=${PLUGIN_HEAD:-<missing>}"
              exit 1
            fi
            echo "::notice::Using exact-SHA bundled dependency canaries ${CORE_SPEC} and ${PLUGIN_SPEC}"
          fi

          {
            echo "core_version=${CORE_SPEC##*@}"
            echo "plugin_version=${PLUGIN_SPEC##*@}"
          } >> "${GITHUB_OUTPUT}"

      - name: Check immutable client package
        id: existing
        shell: bash
        env:
          PACKAGE_SPEC: '@jinn-network/client@${{ steps.meta.outputs.publish_version }}'
        run: |
          VIEW_ERROR="${RUNNER_TEMP}/client-canary-view.stderr"
          if npm view "${PACKAGE_SPEC}" version >/dev/null 2>"${VIEW_ERROR}"; then
            EXISTING_HEAD="$(npm view "${PACKAGE_SPEC}" gitHead)"
            if [ "${EXISTING_HEAD}" != "${JINN_BUILD_COMMIT}" ]; then
              echo "::error::${PACKAGE_SPEC} exists with gitHead ${EXISTING_HEAD}, expected ${JINN_BUILD_COMMIT}"
              exit 1
            fi
            echo "published=true" >> "${GITHUB_OUTPUT}"
            echo "::notice::${PACKAGE_SPEC} already exists at the expected immutable commit"
          elif grep -Eq 'E404|404 Not Found' "${VIEW_ERROR}"; then
            echo "published=false" >> "${GITHUB_OUTPUT}"
          else
            cat "${VIEW_ERROR}" >&2
            echo "::error::Could not determine whether ${PACKAGE_SPEC} already exists"
            exit 1
          fi

      - run: yarn typecheck
      - run: yarn test

      - name: Patch package version for canary publish
        if: steps.meta.outputs.dist_tag == 'canary'
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '${{ steps.meta.outputs.publish_version }}';
            pkg.dependencies['@jinn-network/core'] = '${{ steps.bundled.outputs.core_version }}';
            pkg.dependencies['@jinn-network/plugin'] = '${{ steps.bundled.outputs.plugin_version }}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            const corePath = '../packages/core/package.json';
            const core = JSON.parse(fs.readFileSync(corePath, 'utf8'));
            core.version = '${{ steps.bundled.outputs.core_version }}';
            fs.writeFileSync(corePath, JSON.stringify(core, null, 2) + '\n');
            const pluginPath = '../packages/plugin/package.json';
            const plugin = JSON.parse(fs.readFileSync(pluginPath, 'utf8'));
            plugin.version = '${{ steps.bundled.outputs.plugin_version }}';
            fs.writeFileSync(pluginPath, JSON.stringify(plugin, null, 2) + '\n');
            const sdkPath = '../packages/sdk/package.json';
            const sdk = JSON.parse(fs.readFileSync(sdkPath, 'utf8'));
            sdk.version = sdk.version + '-canary.sha.' + process.env.JINN_BUILD_COMMIT;
            fs.writeFileSync(sdkPath, JSON.stringify(sdk, null, 2) + '\n');
          "

      - run: yarn build
      - name: Verify build-dependent client layouts
        run: yarn vitest run test/cli/commands/create.test.ts test/harnesses/impls/learner/plugin-path.test.ts
      - run: yarn pack:smoke

      - name: Publish canary
        if: steps.meta.outputs.dist_tag == 'canary' && steps.existing.outputs.published != 'true'
        run: |
          unset NODE_AUTH_TOKEN
          npm publish --access public --tag canary

      - name: Validate client canary gitHead
        if: steps.meta.outputs.dist_tag == 'canary'
        shell: bash
        env:
          PACKAGE_SPEC: '@jinn-network/client@${{ steps.meta.outputs.publish_version }}'
        run: |
          for _ in $(seq 1 30); do
            PUBLISHED_HEAD="$(npm view "${PACKAGE_SPEC}" gitHead 2>/dev/null || true)"
            if [ "${PUBLISHED_HEAD}" = "${JINN_BUILD_COMMIT}" ]; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::${PACKAGE_SPEC} gitHead did not resolve to ${JINN_BUILD_COMMIT}"
          exit 1

      - name: Wait for client canary tarball
        if: steps.meta.outputs.dist_tag == 'canary'
        shell: bash
        env:
          CLIENT_SPEC: '@jinn-network/client@${{ steps.meta.outputs.publish_version }}'
        run: |
          PROBE_DIR="${RUNNER_TEMP}/client-canary-probe"
          mkdir -p "${PROBE_DIR}"
          for _ in $(seq 1 30); do
            if npm pack --silent --pack-destination "${PROBE_DIR}" "${CLIENT_SPEC}" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::${CLIENT_SPEC} tarball did not become available"
          exit 1

      - name: Registry consumer acceptance (canary)
        if: steps.meta.outputs.dist_tag == 'canary'
        shell: bash
        env:
          SDK_SPEC: ${{ steps.meta.outputs.sdk_spec }}
          CLIENT_SPEC: '@jinn-network/client@${{ steps.meta.outputs.publish_version }}'
        run: node scripts/external-consumer-acceptance.mjs --registry --sdk-spec "${SDK_SPEC}" --client-spec "${CLIENT_SPEC}"

      # Two-gate publish guard — verify, don't re-run (spec
      # docs/superpowers/specs/2026-05-31-release-pipeline-two-gate-redesign.md §7; #923).
      #
      # The release SHA already carries its evidence as two SHA-bound check-runs:
      #   - hermetic-gate      (deterministic CI gate, produced per-PR/push)
      #   - environment-suite  (real-testnet gate, produced by environment-suite.yml)
      # This step executes NO tests — it queries the check-runs on github.sha and
      # refuses publish unless the required verdicts are success-for-this-SHA. It
      # REPLACES the hand-typed jinn-release-evidence:v1 marker parse and the Tier-1
      # re-run that used to live here. A check-run on a different head_sha is stale
      # and does not count (a rebase changes the SHA, so a stale verdict is
      # automatically invalidated — §7).
      #
      # Steady state: BOTH gates are required, verified (never re-run). Each gate
      # has a transitional waiver (repo variable) so this guard can land BEFORE its
      # producers are fully provisioned, without bricking the cut — set the waiver
      # while a gate is being wired, then UNSET it the moment that gate is live:
      #   - JINN_HERMETIC_GATE_WAIVED == 'true'  → waive hermetic-gate. Use only
      #     until the committed Anvil snapshot fixture lands and hermetic-gate is
      #     observed green on a release SHA (spec §4; rollout note in
      #     docs/snapshots/base-v3-snapshot.md). hermetic-gate is deterministic and
      #     should be un-waived as soon as the fixture is committed.
      #   - JINN_ENVIRONMENT_SUITE_WAIVED == 'true'  → waive environment-suite.
      #     Use only until the step-4 testnet-gate secrets + warm operator are
      #     provisioned (spec §9/§11).
      # Each waiver emits a loud ::warning:: so the relaxed gate is visible in the
      # publish log; waiving BOTH emits an extra warning (publishing with no
      # two-gate evidence — valid only during the very first transition).
      - name: Verify two-gate check-runs
        if: steps.meta.outputs.dist_tag == 'latest'
        uses: actions/github-script@v9
        env:
          RELEASE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.release_sha || github.sha }}
          HERMETIC_GATE_WAIVED: ${{ vars.JINN_HERMETIC_GATE_WAIVED }}
          ENVIRONMENT_SUITE_WAIVED: ${{ vars.JINN_ENVIRONMENT_SUITE_WAIVED }}
        with:
          script: |
            const sha = process.env.RELEASE_SHA || context.sha;
            const hermeticWaived = process.env.HERMETIC_GATE_WAIVED === 'true';
            const envSuiteWaived = process.env.ENVIRONMENT_SUITE_WAIVED === 'true';

            // Build the required-context list; each gate is transitionally waivable.
            const required = [];
            if (!hermeticWaived) {
              required.push('hermetic-gate');
            } else {
              core.warning(
                'hermetic-gate is WAIVED (JINN_HERMETIC_GATE_WAIVED=true) — transitional, ' +
                  'until the committed Anvil snapshot fixture lands and hermetic-gate is ' +
                  'observed green on a release SHA (spec §4). It is deterministic; unset ' +
                  'the repo variable to re-arm as soon as the fixture is committed.',
              );
            }
            if (!envSuiteWaived) {
              required.push('environment-suite');
            } else {
              core.warning(
                'environment-suite is WAIVED (JINN_ENVIRONMENT_SUITE_WAIVED=true) — ' +
                  'transitional until the testnet-gate secrets + warm operator land ' +
                  '(spec §9/§11). Unset the repo variable to re-arm the full two-gate guard.',
              );
            }
            if (required.length === 0) {
              core.warning(
                'BOTH gates are waived — publishing with NO two-gate evidence on this SHA. ' +
                  'This is valid only during the initial transition; re-arm at least ' +
                  'hermetic-gate as soon as the snapshot fixture is committed.',
              );
            }

            // List ALL check-runs for the release SHA (paginated). A check-run is
            // only evidence for THIS publish if its head_sha matches github.sha —
            // GitHub scopes check-runs to a SHA, so this is implicitly true here,
            // but we keep the contexts list bound to context.sha to be explicit
            // about what "stale" means: a run on any other SHA is invisible to us.
            const runs = await github.paginate(github.rest.checks.listForRef, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: sha,
              per_page: 100,
            });

            // For each required context, find its most recent completed run.
            const failures = [];
            for (const name of required) {
              // Sort by completed_at so the most recently *completed* verdict wins
              // (a still-running re-run has completed_at=null → sorts last, and the
              // status!=='completed' guard below rejects it anyway).
              const matching = runs
                .filter((r) => r.name === name)
                .sort((a, b) => new Date(b.completed_at || 0) - new Date(a.completed_at || 0));
              if (matching.length === 0) {
                failures.push(`missing verdict: no '${name}' check-run found on release SHA ${sha}`);
                continue;
              }
              const latest = matching[0];
              if (latest.status !== 'completed') {
                failures.push(
                  `incomplete verdict: '${name}' is status=${latest.status} (not completed) on ${sha}`,
                );
                continue;
              }
              if (latest.conclusion !== 'success') {
                failures.push(
                  `non-success verdict: '${name}' concluded ${latest.conclusion} on ${sha}`,
                );
              }
            }

            if (failures.length > 0) {
              core.setFailed(
                'Stable publish refused — the two-gate check-runs are not green for the release SHA ' +
                  `${sha}:\n` +
                  failures.map((f) => `  - ${f}`).join('\n') +
                  '\n\nRe-run the missing/stale gate against this exact SHA, or fix the ' +
                  'product regression, before publishing @latest.',
              );
              return;
            }

            const waivedNote = [
              hermeticWaived ? 'hermetic-gate waived' : null,
              envSuiteWaived ? 'environment-suite waived' : null,
            ].filter(Boolean).join(', ');
            core.info(
              `Two-gate guard passed for ${sha}: ` +
                (required.length ? required.map((r) => `${r}=success`).join(', ') : 'no gates required') +
                (waivedNote ? ` (${waivedNote})` : ''),
            );

      - name: Recheck immutable stable client package
        id: stable_existing
        if: steps.meta.outputs.dist_tag == 'latest'
        shell: bash
        env:
          PACKAGE_SPEC: '@jinn-network/client@${{ steps.meta.outputs.publish_version }}'
        run: |
          VIEW_ERROR="${RUNNER_TEMP}/client-stable-view.stderr"
          if npm view "${PACKAGE_SPEC}" version >/dev/null 2>"${VIEW_ERROR}"; then
            EXISTING_HEAD="$(npm view "${PACKAGE_SPEC}" gitHead)"
            if [ "${EXISTING_HEAD}" != "${JINN_BUILD_COMMIT}" ]; then
              echo "::error::${PACKAGE_SPEC} exists with gitHead ${EXISTING_HEAD}, expected ${JINN_BUILD_COMMIT}"
              exit 1
            fi
            echo "published=true" >> "${GITHUB_OUTPUT}"
            echo "::notice::${PACKAGE_SPEC} already exists at the expected immutable commit"
          elif grep -Eq 'E404|404 Not Found' "${VIEW_ERROR}"; then
            echo "published=false" >> "${GITHUB_OUTPUT}"
          else
            cat "${VIEW_ERROR}" >&2
            echo "::error::Could not determine whether ${PACKAGE_SPEC} already exists"
            exit 1
          fi

      - name: Publish stable
        if: steps.meta.outputs.dist_tag == 'latest' && steps.stable_existing.outputs.published != 'true'
        run: |
          unset NODE_AUTH_TOKEN
          npm publish --access public

      - name: Validate stable client gitHead
        if: steps.meta.outputs.dist_tag == 'latest'
        shell: bash
        env:
          PACKAGE_SPEC: '@jinn-network/client@${{ steps.meta.outputs.publish_version }}'
        run: |
          for _ in $(seq 1 30); do
            PUBLISHED_HEAD="$(npm view "${PACKAGE_SPEC}" gitHead 2>/dev/null || true)"
            if [ "${PUBLISHED_HEAD}" = "${JINN_BUILD_COMMIT}" ]; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::${PACKAGE_SPEC} gitHead did not resolve to ${JINN_BUILD_COMMIT}"
          exit 1

      - name: Wait for stable client tarball
        if: steps.meta.outputs.dist_tag == 'latest'
        shell: bash
        env:
          CLIENT_SPEC: '@jinn-network/client@${{ steps.meta.outputs.publish_version }}'
        run: |
          PROBE_DIR="${RUNNER_TEMP}/client-stable-probe"
          mkdir -p "${PROBE_DIR}"
          for _ in $(seq 1 30); do
            if npm pack --silent --pack-destination "${PROBE_DIR}" "${CLIENT_SPEC}" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::${CLIENT_SPEC} tarball did not become available"
          exit 1

      - name: Registry consumer acceptance (stable)
        if: steps.meta.outputs.dist_tag == 'latest'
        shell: bash
        env:
          SDK_SPEC: '@jinn-network/sdk@${{ steps.meta.outputs.sdk_version }}'
          CLIENT_SPEC: '@jinn-network/client@${{ steps.meta.outputs.publish_version }}'
        run: node scripts/external-consumer-acceptance.mjs --registry --sdk-spec "${SDK_SPEC}" --client-spec "${CLIENT_SPEC}"

      # Dual-tag policy (jinn-mono-2cl.6, per the engineering handbook §Cadence): the published
      # release commit also receives a v2026.MM.DD date tag for human-readable build identification
      # alongside the v<semver> tag that triggered this publish.
      #
      # Scoped to `v*` tags only (the new format from the Monday scaffold workflow). Legacy
      # `client-v*` releases are manual/pre-cadence and do not get a date tag — the dual-tag
      # policy is intentionally part of the new cadence, not retrofitted.
      #
      # Idempotent: if the date tag already exists pointing at the same SHA, the step is a no-op.
      # If it exists at a different SHA (two named releases on the same calendar day), the step
      # errors and asks for manual reconciliation.
      - name: Create v2026.MM.DD date tag
        if: steps.meta.outputs.dist_tag == 'latest' && startsWith(steps.meta.outputs.release_tag, 'v')
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          PUBLISHED_AT: ${{ github.event.release.published_at }}
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
        run: |
          if [ -z "$PUBLISHED_AT" ]; then
            PUBLISHED_AT="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          fi

          # Format the date from the release's published_at (ISO 8601 from GitHub).
          # Use leading-zero %Y.%m.%d so May 18 is v2026.05.18, not v2026.5.18.
          DATE_TAG="$(date -u -d "$PUBLISHED_AT" +"v%Y.%m.%d")"

          # actions/checkout@v7 does a shallow clone and may not have fetched the just-created
          # release tag into refs/tags/. Fetch it explicitly before resolving.
          git fetch --tags --depth=1 origin "${RELEASE_TAG}"

          # Resolve the SHA the release points at. The release event sets tag_name on the published
          # release, so the v<semver> tag was just created. We tag the same SHA with the date tag.
          # `^{commit}` peels annotated tags (gh release create creates lightweight tags by default,
          # but this is safe either way).
          SHA="$(git rev-parse "${RELEASE_TAG}^{commit}")"

          if git rev-parse --verify --quiet "refs/tags/${DATE_TAG}" >/dev/null; then
            EXISTING_SHA="$(git rev-parse "${DATE_TAG}^{commit}")"
            if [ "${EXISTING_SHA}" = "${SHA}" ]; then
              echo "::notice::date tag ${DATE_TAG} already exists at the same SHA (${SHA}); no-op"
              exit 0
            else
              echo "::error::date tag ${DATE_TAG} already exists but points at ${EXISTING_SHA}, not ${SHA}. Manual reconciliation required (likely two named releases on the same calendar day)."
              exit 1
            fi
          fi

          # Configure git identity for the tag push. Use github-actions[bot] so the tag is
          # attributed to CI, not a human.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag "${DATE_TAG}" "${SHA}"
          git push origin "${DATE_TAG}"
          echo "::notice::Created date tag ${DATE_TAG} pointing at ${SHA} (alongside ${RELEASE_TAG})"
