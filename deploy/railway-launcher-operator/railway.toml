[build]
builder = "DOCKERFILE"
# Pinned to the per-harness overlay Dockerfile, NEVER the repo root (#846 — a
# root railway.toml hijacks jinn-indexer and every other monorepo service).
dockerfilePath = "deploy/railway-launcher-operator/Dockerfile"
# The overlay's BASE_TAG build arg defaults to `latest`. Pin it to a published
# base release that includes the container-native changes (#988) by setting a
# BASE_TAG service variable, or override here, e.g.:
#   [build.args]
#   BASE_TAG = "0.1.4"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
# Single replica is load-bearing: one wallet must run in one process, else the
# launcher and solver race on the agent-EOA nonce (#792). Do not scale up.
numReplicas = 1
