<!-- @dsCard group="Evidence" viewport="700x160" name="Evidence texture" subtitle="Fill encodes how a result was obtained — redundant with colour" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Texture</title><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}.c{padding:20px 24px}.c{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.s{height:54px;border:1px solid var(--rule);position:relative;overflow:hidden}.s::after{content:"";position:absolute;inset:0;opacity:var(--texture-opacity)}.n{font:var(--type-label);letter-spacing:var(--tracking-caps);text-transform:uppercase;margin-top:7px;color:var(--text-secondary)}.d{font:var(--type-data);font-size:11px;color:var(--text-faint)}</style></head><body>
<div class="c"><div><div class="s" style="background:var(--moss-100);color:var(--moss-600)"></div><div class="n">Observed</div><div class="d">solid — platform ran it</div></div><div><div class="s" style="background:var(--indigo-100);color:var(--indigo-600)"><div style="position:absolute;inset:0;background:var(--texture-attested);opacity:var(--texture-opacity)"></div></div><div class="n">Attested</div><div class="d">45° hatch — party asserts</div></div><div><div class="s" style="background:var(--ochre-100);color:var(--ochre-600)"><div style="position:absolute;inset:0;background:var(--texture-conflicted);opacity:var(--texture-opacity)"></div></div><div class="n">Conflicted</div><div class="d">vertical — evaluators split</div></div><div><div class="s" style="background:var(--ink-50);color:var(--ink-500)"><div style="position:absolute;inset:0;background:var(--texture-missing);background-size:var(--texture-missing-size);opacity:.5"></div></div><div class="n">Missing</div><div class="d">dot screen — not returned</div></div></div></body></html>
