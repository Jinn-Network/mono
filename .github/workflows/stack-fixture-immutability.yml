name: Stack fixture immutability

# Golden fixtures are the compatibility contract (2026-07-30 marketplace-surfaces
# design §8.1). This gate is offline and binds from day one: an existing fixture id
# keeps its exact bytes forever, nothing is removed, and a correction arrives as a
# new fixture plus a dated erratum. The minor-bump consequence of an addition is
# enforced against the registry in the stable publish lane.
on:
  pull_request:
  merge_group:
  push:
    branches: [next]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Verify the fixture manifests are current
        run: node .github/scripts/fixture-manifest.mjs --check
      - name: Verify fixture immutability against the base
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_REF}" ] || [ "${BASE_REF}" = "0000000000000000000000000000000000000000" ]; then
            echo "::notice::No base commit to compare against; skipping."
            exit 0
          fi
          node .github/scripts/fixture-immutability.mjs --base "${BASE_REF}"
  stack-fixture-gate:
    # The check-run name GitHub reports is this job's display `name:` below, and that
    # string is the required-status-check context registered on the `next` ruleset
    # (DR-2026-08-18-b D3) — keep them in sync.
    name: stack-fixture-gate
    needs: [fixtures]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require exact fixture-gate success
        env:
          FIXTURES_RESULT: ${{ needs.fixtures.result }}
        run: test "${FIXTURES_RESULT}" = success
