name: Evidence CI

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
  pull_request:
    paths:
      - "packages/evidence/**"
      - ".github/scripts/evidence-*.test.mjs"
      - ".github/workflows/evidence-ci.yml"
      - "docs/superpowers/specs/2026-07-23-jinn-execution-evidence-protocol-design.md"
      - "docs/superpowers/specs/2026-07-24-jinn-attestation-issuer-design.md"
      - "docs/superpowers/specs/2026-07-26-evidence-retrieval-design.md"
      - "docs/superpowers/plans/2026-07-27-evidence-retrieval.md"
      - "docs/superpowers/specs/2026-07-26-evidence-contribution-design.md"
      - "docs/superpowers/plans/2026-07-27-evidence-contribution.md"
      - "docs/superpowers/specs/2026-07-30-plugin-stack-reconciliation-design.md"
      - "docs/superpowers/plans/2026-07-30-plugin-c1-trajectory-record.md"
      - "docs/superpowers/plans/2026-07-30-plugin-c2-trace-decode.md"
  push:
    branches: [next]
    paths:
      - "packages/evidence/**"
      - ".github/scripts/evidence-*.test.mjs"
      - ".github/workflows/evidence-ci.yml"
      - "docs/superpowers/specs/2026-07-23-jinn-execution-evidence-protocol-design.md"
      - "docs/superpowers/specs/2026-07-24-jinn-attestation-issuer-design.md"
      - "docs/superpowers/specs/2026-07-26-evidence-retrieval-design.md"
      - "docs/superpowers/plans/2026-07-27-evidence-retrieval.md"
      - "docs/superpowers/specs/2026-07-26-evidence-contribution-design.md"
      - "docs/superpowers/plans/2026-07-27-evidence-contribution.md"
      - "docs/superpowers/specs/2026-07-30-plugin-stack-reconciliation-design.md"
      - "docs/superpowers/plans/2026-07-30-plugin-c1-trajectory-record.md"
      - "docs/superpowers/plans/2026-07-30-plugin-c2-trace-decode.md"

permissions:
  contents: read

env:
  EVIDENCE_ROOT: packages/evidence

# Consolidated per #2997 (pattern proven by the trust-ci pilot, PR #3001): the
# previous shape ran 17 runner jobs (11 + a 6-leg components matrix) chained
# through artifact dist round-trips. The packages job below builds the fifteen
# pure-node packages with their VERBATIM per-package command sets in dependency
# order in ONE workspace. The two infrastructure-backed components
# (repository-oci needs a Distribution registry + ORAS; repository-ipfs needs
# the Kubo compatibility suite) keep their own fail-fast:false matrix job so an
# infrastructure flake ejects only itself, never the whole lane. The packages
# job still BUILDS those two (install + build, no infra tests) so the
# packed-types tail can pack every package from in-workspace dists.
#
# The per-job isolation this retires was a de-facto undeclared-dependency
# guard; that invariant is owned by evidence-source-boundaries.test.mjs (wired
# in repository-structure.yml) and the inventory/boundary checks below.
jobs:
  architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
      - name: Verify Evidence CI toolchain pins
        run: node --test .github/scripts/evidence-ci-workflow.test.mjs
      - name: Verify package inventory and dependency graph
        run: node --test .github/scripts/evidence-package-inventory.test.mjs
      - name: Verify source boundaries and canaries
        run: node --test .github/scripts/evidence-source-boundaries.test.mjs

  packages:
    name: Evidence packages
    runs-on: ubuntu-latest
    # A hung step must not hold a runner slot for the 360-minute default nor
    # burn the queue's 180-minute check-response budget.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
      - name: Install npm 11.19.0 for pack-smoke
        run: |
          npm install -g npm@11.19.0
          echo "$(npm prefix -g)/bin" >> "$GITHUB_PATH"
          hash -r || true
          test "$(npm --version)" = "11.19.0"
          command -v npm
          npm --version
      - name: Enable Yarn 4.13.0
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate
      - name: Verify Evidence Protocol
        working-directory: packages/evidence/protocol
        run: |
          yarn install --immutable
          yarn check:profile
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Verify Execution Evidence Builder
        working-directory: packages/evidence/execution-evidence-builder
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Verify Evidence Repository
        working-directory: packages/evidence/repository
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Build cross-tree portal dependency from source (trust-core, §7.8)
        working-directory: packages/trust/core
        run: |
          yarn install --immutable
          yarn build
      - name: Build cross-tree portal dependency from source (record-discovery-protocol, §7.8)
        working-directory: packages/discovery/protocol
        run: |
          yarn install --immutable
          yarn build
      - name: Build cross-tree portal dependency from source (record-discovery-serve, §7.8)
        working-directory: packages/discovery/serve
        run: |
          yarn install --immutable
          yarn build
      - name: Build cross-tree portal dependency from source (record-discovery-publication, §7.8)
        working-directory: packages/discovery/publication
        run: |
          yarn install --immutable
          yarn build
      - name: Verify Evidence Discovery
        working-directory: packages/evidence/discovery
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Verify Execution Recorder
        working-directory: packages/evidence/execution-recorder
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Verify Attestation Issuer
        working-directory: packages/evidence/attestation-issuer
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Verify Evidence Publication
        working-directory: packages/evidence/publication
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Build the infrastructure-backed components for packed-types (verified in the components job)
        run: |
          (cd packages/evidence/repository-oci && yarn install --immutable && yarn build)
          (cd packages/evidence/repository-ipfs && yarn install --immutable && yarn build)
      - name: Verify complete Derivation package
        working-directory: packages/evidence/derivation
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Verify Execution Recorder Bridge
        working-directory: packages/evidence/execution-recorder-bridge
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Verify Evidence Retrieval
        working-directory: packages/evidence/retrieval
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Verify Evidence Trace
        working-directory: packages/evidence/trace
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn check:fixtures
          yarn check:schemas
          yarn pack:smoke
      - name: Verify Evidence Trace Decode
        working-directory: packages/evidence/trace-decode
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn check:fixtures
          yarn pack:smoke
      - name: Verify Evidence Offer
        working-directory: packages/evidence/offer
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn check:fixtures
          yarn pack:smoke
      - name: Verify Evidence Contribution
        working-directory: packages/evidence/contribution
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Verify SQLite Evidence Catalog
        working-directory: packages/evidence/catalog-sqlite
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Build cross-tree portal dependency from source (record-discovery-source-evidence-journal, §7.8)
        working-directory: packages/discovery/sources/evidence-journal
        run: |
          yarn install --immutable
          yarn build
      - name: Verify Local Evidence Runtime
        working-directory: packages/evidence/local-runtime
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test
          yarn build
          yarn pack:smoke
      - name: Compile packed public entrypoint consumers
        run: node .github/scripts/evidence-packed-types.test.mjs

  components:
    name: component (${{ matrix.component }})
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component:
          - repository-oci
          - repository-ipfs
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
      - name: Enable Yarn 4.13.0
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate
      - name: Install npm 11.19.0 for pack-smoke
        run: |
          npm install -g npm@11.19.0
          echo "$(npm prefix -g)/bin" >> "$GITHUB_PATH"
          hash -r || true
          test "$(npm --version)" = "11.19.0"
          command -v npm
          npm --version
      - name: Build in-domain dependencies from source (protocol, repository, builder)
        run: |
          (cd packages/evidence/protocol && yarn install --immutable && yarn build)
          (cd packages/evidence/repository && yarn install --immutable && yarn build)
          (cd packages/evidence/execution-evidence-builder && yarn install --immutable && yarn build)
      - name: Install ORAS 1.3.2
        if: matrix.component == 'repository-oci'
        uses: oras-project/setup-oras@v2
        with:
          version: 1.3.2
      - name: Start Distribution registry
        if: matrix.component == 'repository-oci'
        run: |
          for attempt in $(seq 1 3); do
            if docker pull registry:3.0.0; then
              break
            fi
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            sleep "$((attempt * 5))"
          done
          docker run --detach --name jinn-evidence-registry \
            --publish 5000:5000 registry:3.0.0
      - name: Install immutable dependencies
        working-directory: packages/evidence/${{ matrix.component }}
        run: yarn install --immutable
      - name: Check profile and schema drift
        if: matrix.component == 'repository-oci' || matrix.component == 'repository-ipfs'
        working-directory: packages/evidence/${{ matrix.component }}
        run: yarn check:profile
      - name: Typecheck
        working-directory: packages/evidence/${{ matrix.component }}
        run: yarn typecheck
      - name: Test
        working-directory: packages/evidence/${{ matrix.component }}
        run: yarn test
      - name: Test Kubo compatibility and Repository contract
        if: matrix.component == 'repository-ipfs'
        working-directory: packages/evidence/repository-ipfs
        run: yarn test:kubo
      - name: Build
        working-directory: packages/evidence/${{ matrix.component }}
        run: yarn build
      - name: Smoke-test packed distribution
        working-directory: packages/evidence/${{ matrix.component }}
        run: yarn pack:smoke
      - name: Wait for Distribution registry
        if: matrix.component == 'repository-oci'
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:5000/v2/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Distribution registry was not ready after ${attempt} attempts."
          exit 1
      - name: Test ORAS registry round trip
        if: matrix.component == 'repository-oci'
        working-directory: packages/evidence/repository-oci
        env:
          JINN_OCI_REGISTRY_TEST: "1"
          JINN_OCI_TEST_REPOSITORY: localhost:5000/jinn/evidence
          ORAS_PATH: oras
        run: yarn test:registry
      - name: Upload component distribution
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.component }}-dist
          path: packages/evidence/${{ matrix.component }}/dist
          if-no-files-found: error
          retention-days: 1

