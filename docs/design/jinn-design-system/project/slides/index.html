<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Jinn — Technical Talk</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../foundations.css">
<style>
  html, body { background: #000; }
  deck-stage section { display: flex; }
</style>
</head>
<body>
<deck-stage>
  <div id="slide-title"></div>
  <div id="slide-section"></div>
  <div id="slide-content"></div>
  <div id="slide-quote"></div>
  <div id="slide-data"></div>
  <div id="slide-close"></div>
</deck-stage>

<script src="deck-stage.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="Slides.jsx"></script>
<script type="text/babel">
  const mounts = [
    { id: 'slide-title',   comp: <TitleSlide/> },
    { id: 'slide-section', comp: <SectionSlide/> },
    { id: 'slide-content', comp: <ContentSlide/> },
    { id: 'slide-quote',   comp: <QuoteSlide/> },
    { id: 'slide-data',    comp: <DataSlide/> },
    { id: 'slide-close',   comp: <ClosingSlide/> },
  ];
  mounts.forEach(m => ReactDOM.createRoot(document.getElementById(m.id)).render(m.comp));
</script>
</body>
</html>
